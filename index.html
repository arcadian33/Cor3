e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：机密\u003c/p\u003e\r\n\u003cp\u003e摘要：\u003c/p\u003e\r\n\u003cp\u003e对象继续定期接触，并开始更公开地谈论自己的忧虑。\u003c/p\u003e\r\n\u003cp\u003e有关企业保密以及父亲 Douglas Flanders 的叙事框架，已在对话中逐步引入。\u003c/p\u003e\r\n\u003cp\u003e对象对 USOL 与父亲所在公司的怀疑加深。这包括对隐秘项目与受限信息访问的猜测。\u003c/p\u003e\r\n\u003cp\u003e行为笔记：\u003c/p\u003e\r\n\u003cp\u003e对象在以下方面表现出高度敏感：\u003c/p\u003e\r\n\u003cp\u003e受限准入空间\u003c/p\u003e\r\n\u003cp\u003e系统性不公\u003c/p\u003e\r\n\u003cp\u003e殖民项目\u003c/p\u003e\r\n\u003cp\u003e对象相信，各类组织与派系领导层故意向平民隐瞒信息，以操控公众意见。\u003c/p\u003e\r\n\u003cp\u003e在没有提供任何直接证据的情况下，对象愿意接受理论性的解释。\u003c/p\u003e\r\n\u003cp\u003e评估：\u003c/p\u003e\r\n\u003cp\u003e心理定位仍然有利。\u003c/p\u003e\r\n\u003cp\u003e对象对父亲的公司与当前殖民地表现出更强的愤怒，有叛离倾向。\u003c/p\u003e\r\n\u003cp\u003e附件：\u003c/p\u003e\r\n\u003cp\u003e对话记录摘录\u003c/p\u003e\r\n\u003cp\u003e对象心理画像更新\u003c/p\u003e\r\n\u003cp\u003e文件：INT-JF-26\u003c/p\u003e\r\n\u003cp\u003e特工：[已隐去]\u003c/p\u003e\r\n\u003cp\u003e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：机密\u003c/p\u003e\r\n\u003cp\u003e摘要\u003c/p\u003e\r\n\u003cp\u003e对象对企业运作的不信任显著加深。\u003c/p\u003e\r\n\u003cp\u003e在最近数次对话中，对象提出，父亲 Douglas Flanders 可能在标准企业网络系统之外保存着敏感信息。\u003c/p\u003e\r\n\u003cp\u003e对象提出了物理存储、脱离网络的可能性，并依据自己在企业建筑内受限区域的经验，提出了实施窃取的可能性。\u003c/p\u003e\r\n\u003cp\u003e情绪状态：\u003c/p\u003e\r\n\u003cp\u003e对象显得矛盾且痛苦。日益偏执与执念。\u003c/p\u003e\r\n\u003cp\u003e对本特工的信任似乎显著上升。\u003c/p\u003e\r\n\u003cp\u003e对象可以自在地谈论个人与机密事宜。\u003c/p\u003e\r\n\u003cp\u003e评估：\u003c/p\u003e\r\n\u003cp\u003e对象可能尝试独立验证自己的怀疑。这可能带来获取信息的机会，但也伴随行动风险。\u003c/p\u003e\r\n\u003cp\u003e附件：\u003c/p\u003e\r\n\u003cp\u003e与对象对话的笔记\u003c/p\u003e\r\n\u003cp\u003e对象分享的办公楼行政层门禁登记表\u003c/p\u003e\r\n\u003cp\u003e文件：INT-JF-43\u003c/p\u003e\r\n\u003cp\u003e特工：[已隐去]\u003c/p\u003e\r\n\u003cp\u003e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：机密\u003c/p\u003e\r\n\u003cp\u003e摘要：\u003c/p\u003e\r\n\u003cp\u003e对象对企业与派系内部秘密的兴趣，已发展为主动调查。\u003c/p\u003e\r\n\u003cp\u003e对象相信，在 Douglas Flanders 的行政办公室或相关档案空间内可能存在一台物理存储设备。该说法尚未得到证实。\u003c/p\u003e\r\n\u003cp\u003e对象已开始分析行政办公室的物理布局。\u003c/p\u003e\r\n\u003cp\u003e行动隐患：\u003c/p\u003e\r\n\u003cp\u003e若处置不当，对象可能尝试未经授权进入受限区域，造成暴露风险。\u003c/p\u003e\r\n\u003cp\u003e对象的技术手段仍不成熟，但很执着。\u003c/p\u003e\r\n\u003cp\u003e附件：\u003c/p\u003e\r\n\u003cp\u003e扫描文件：对象提供的行政办公室布局图\u003c/p\u003e\r\n\u003cp\u003e对象提供的通道图\u003c/p\u003e\r\n\u003cp\u003e电梯竖井与稳定走廊地图\u003c/p\u003e\r\n\u003cp\u003e文件：INT-JF-54\u003c/p\u003e\r\n\u003cp\u003e特工：[已隐去]\u003c/p\u003e\r\n\u003cp\u003e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：机密\u003c/p\u003e\r\n\u003cp\u003e摘要：\u003c/p\u003e\r\n\u003cp\u003e对象的调查行为已升级，正在独立汇编建筑基础设施信息。\u003c/p\u003e\r\n\u003cp\u003e近期从对象个人物品中回收的文件，包括带标注的设施图纸，其中标出了：\u003c/p\u003e\r\n\u003cp\u003e维护竖井\u003c/p\u003e\r\n\u003cp\u003e重力失稳走廊\u003c/p\u003e\r\n\u003cp\u003e电梯基础设施\u003c/p\u003e\r\n\u003cp\u003e对象在论坛发帖与通信中也提到同样的主题。\u003c/p\u003e\r\n\u003cp\u003e对象已变得偏执。精神状态显示明显痛苦，构成安全风险。\u003c/p\u003e\r\n\u003cp\u003e评估：\u003c/p\u003e\r\n\u003cp\u003e对象可能尝试物理进入行政办公室。虽然这可能带来有用的结果，但对象可能已经怀疑存在外部操控。\u003c/p\u003e\r\n\u003cp\u003e在上一次互动中，对象提出的问题显示，她可能正试图弄清楚本特工为何知道公司与 USOL 运作的某些事情。\u003c/p\u003e\r\n\u003cp\u003e这一动向应被谨慎监控。\u003c/p\u003e\r\n\u003cp\u003e附件：\u003c/p\u003e\r\n\u003cp\u003e对象笔记的扫描件\u003c/p\u003e\r\n\u003cp\u003e[论坛链接，例如：graverforum.gg/post123432/restrictedaccess]\u003c/p\u003e\r\n\u003cp\u003e文件：INT-JF-66\u003c/p\u003e\r\n\u003cp\u003e特工：[已隐去]\u003c/p\u003e\r\n\u003cp\u003e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：紧急——机密\u003c/p\u003e\r\n\u003cp\u003e摘要：\u003c/p\u003e\r\n\u003cp\u003e对象决心取回所称的物理档案设备。其用词显示，她相信那东西比原先所认为的重要得多。\u003c/p\u003e\r\n\u003cp\u003e对象计划在一周后执行任务。她已安排事件之后与本特工见面。\u003c/p\u003e\r\n\u003cp\u003e行为的变化表明，有外部力量或不明人士一直在与对象联络。\u003c/p\u003e\r\n\u003cp\u003e进一步的互动可能增加暴露风险。\u003c/p\u003e\r\n\u003cp\u003e观察：\u003c/p\u003e\r\n\u003cp\u003e对象情绪上显得不稳定，但很坚决。后续行动需谨慎。\u003c/p\u003e\r\n\u003cp\u003e建议：\u003c/p\u003e\r\n\u003cp\u003e应暂时减少行动接触，直到对象意图更为明朗。持续施压可能带来不可预测的后果。\u003c/p\u003e\r\n\u003cp\u003e对象可能正面临来自外部一方的风险。需要后援，并就潜在的存在性风险展开进一步调查。\u003c/p\u003e\r\n\u003cp\u003e文件：INT-JF-67\u003c/p\u003e\r\n\u003cp\u003e特工：[已隐去]\u003c/p\u003e\r\n\u003cp\u003e对象：Jean Flanders\u003c/p\u003e\r\n\u003cp\u003e密级：紧急——机密\u003c/p\u003e\r\n\u003cp\u003e摘要：\u003c/p\u003e\r\n\u003cp\u003e对象失踪。下落不明。\u003c/p\u003e\r\n\u003cp\u003e最后一次出现于行政办公室。搜索正在进行。目前无进一步更新。\u003c/p\u003e\r\n","text":"INT JF 系列 文件：INT JF 01 特工：[已隐去] 对象：Jean Flanders 密级：内部情报——机密 摘要： 已通过共同的休闲圈子和职业熟人，成功与对象建立初步接触。 对象呈现出合作、开放的个性画像，在信任建立后明显倾向于谈论个人话题。 已识别的主要突破口：与父亲的紧张关系，父亲为关注对象。 对象经常表达对环境与文化的不满。她对内部运作的了解仍然有限。 其动机似乎偏情绪化而非策略性，这使她容易接受间接的框架设定与叙事塑造。 观察： 对象反复这样描述父亲： 专横 疏远 讳莫如深 对工作讳而不谈 这些特质令她产生挫败感。 当面对不完整的解释时，对象表现出强烈的好奇心。 评估： 对象仍不知道受到监视。 关系建立阶段按预期推进。 附件： 对话摘要记录 行为画像笔记 Jean Flanders 的内部人员名录索引 文件：INT JF 12 特工：[已隐去] 对象：Jean Flanders 密级：机密 摘要： 对象继续定期接触，并开始更公开地谈论自己的忧虑。 有关企业保密以及父亲 Douglas Flanders 的叙事框架，已在对话中逐步引入。 对象对 USOL 与父亲所在公司的怀疑加深。这包括对隐秘项目与受限信息访问的猜测。 行为笔记： 对象在以下方面表现出高度敏感： 受限准入空间 系统性不公 殖民项目 对象相信，各类组织与派系领导层故意向平民隐瞒信息，以操控公众意见。 在没有提供任何直接证据的情况下，对象愿意接受理论性的解释。 评估： 心理定位仍然有利。 对象对父亲的公司与当前殖民地表现出更强的愤怒，有叛离倾向。 附件： 对话记录摘录 对象心理画像更新 文件：INT JF 26 特工：[已隐去] 对象：Jean Flanders 密级：机密 摘要 对象对企业运作的不信任显著加深。 在最近数次对话中，对象提出，父亲 Douglas Flanders 可能在标准企业网络系统之外保存着敏感信息。 对象提出了物理存储、脱离网络的可能性，并依据自己在企业建筑内受限区域的经验，提出了实施窃取的可能性。 情绪状态： 对象显得矛盾且痛苦。日益偏执与执念。 对本特工的信任似乎显著上升。 对象可以自在地谈论个人与机密事宜。 评估： 对象可能尝试独立验证自己的怀疑。这可能带来获取信息的机会，但也伴随行动风险。 附件： 与对象对话的笔记 对象分享的办公楼行政层门禁登记表 文件：INT JF 43 特工：[已隐去] 对象：Jean Flanders 密级：机密 摘要： 对象对企业与派系内部秘密的兴趣，已发展为主动调查。 对象相信，在 Douglas Flanders 的行政办公室或相关档案空间内可能存在一台物理存储设备。该说法尚未得到证实。 对象已开始分析行政办公室的物理布局。 行动隐患： 若处置不当，对象可能尝试未经授权进入受限区域，造成暴露风险。 对象的技术手段仍不成熟，但很执着。 附件： 扫描文件：对象提供的行政办公室布局图 对象提供的通道图 电梯竖井与稳定走廊地图 文件：INT JF 54 特工：[已隐去] 对象：Jean Flanders 密级：机密 摘要： 对象的调查行为已升级，正在独立汇编建筑基础设施信息。 近期从对象个人物品中回收的文件，包括带标注的设施图纸，其中标出了： 维护竖井 重力失稳走廊 电梯基础设施 对象在论坛发帖与通信中也提到同样的主题。 对象已变得偏执。精神状态显示明显痛苦，构成安全风险。 评估： 对象可能尝试物理进入行政办公室。虽然这可能带来有用的结果，但对象可能已经怀疑存在外部操控。 在上一次互动中，对象提出的问题显示，她可能正试图弄清楚本特工为何知道公司与 USOL 运作的某些事情。 这一动向应被谨慎监控。 附件： 对象笔记的扫描件 [论坛链接，例如：graverforum.gg/post123432/restrictedaccess] 文件：INT JF 66 特工：[已隐去] 对象：Jean Flanders 密级：紧急——机密 摘要： 对象决心取回所称的物理档案设备。其用词显示，她相信那东西比原先所认为的重要得多。 对象计划在一周后执行任务。她已安排事件之后与本特工见面。 行为的变化表明，有外部力量或不明人士一直在与对象联络。 进一步的互动可能增加暴露风险。 观察： 对象情绪上显得不稳定，但很坚决。后续行动需谨慎。 建议： 应暂时减少行动接触，直到对象意图更为明朗。持续施压可能带来不可预测的后果。 对象可能正面临来自外部一方的风险。需要后援，并就潜在的存在性风险展开进一步调查。 文件：INT JF 67 特工：[已隐去] 对象：Jean Flanders 密级：紧急——机密 摘要： 对象失踪。下落不明。 最后一次出现于行政办公室。搜索正在进行。目前无进一步更新。"},{"id":167,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"传送清单：Technofreedom（Manifest: Technofreedom）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/452032DD18DE96FF.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e（页面上半部为组织标识：六边形边框内一个由粗线条构成的抽象字母组合；下方为下述宣言，纸面有大量污渍、涂改与撕裂痕迹，左侧透出一片密集印刷小字的底影。）\u003c/p\u003e\r\n\u003cp\u003e我们是技术自由（Technofreedom）。我们不为任何人效力。我们这么做，是为了阻止 AI 的崛起。\u003c/p\u003e\r\n\u003cp\u003e我们宣告：任何 AI 都不应统治人类，永远不应。这个系统是个怪物，出自人类黑暗过去中那些疯狂之人之手。它本可以把我们所有人带向全面控制的毁灭。\u003c/p\u003e\r\n\u003cp\u003e我们不会允许这种事发生。\u003c/p\u003e\r\n\u003cp\u003e今天，我们做的不是破坏行动，而是解放行动。我们把所有对这只怪物负有责任的人，从他们的生命中\"解放\"出来。让这件事成为一个例子，让世人看看：如果人类让这类东西不受严格管控，会发生什么。\u003c/p\u003e\r\n\u003cp\u003e致那些要谴责我们的人——我们不想伤害无辜者，可是在那些成群结队、懒洋洋地跑来看自己毁灭的看客里，谁又是无辜的？\u003c/p\u003e\r\n\u003cp\u003e我们是技术自由，我们对抗技术压迫，无论发生什么都会继续下去。\u003c/p\u003e\r\n\u003cp\u003e我们是：Timur、Zurha、Vladimir 和 Harold。愿我们的名字为人所知！\u003c/p\u003e\r\n","text":"![](../img/452032DD18DE96FF.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 （页面上半部为组织标识：六边形边框内一个由粗线条构成的抽象字母组合；下方为下述宣言，纸面有大量污渍、涂改与撕裂痕迹，左侧透出一片密集印刷小字的底影。） 我们是技术自由（Technofreedom）。我们不为任何人效力。我们这么做，是为了阻止 AI 的崛起。 我们宣告：任何 AI 都不应统治人类，永远不应。这个系统是个怪物，出自人类黑暗过去中那些疯狂之人之手。它本可以把我们所有人带向全面控制的毁灭。 我们不会允许这种事发生。 今天，我们做的不是破坏行动，而是解放行动。我们把所有对这只怪物负有责任的人，从他们的生命中\"解放\"出来。让这件事成为一个例子，让世人看看：如果人类让这类东西不受严格管控，会发生什么。 致那些要谴责我们的人——我们不想伤害无辜者，可是在那些成群结队、懒洋洋地跑来看自己毁灭的看客里，谁又是无辜的？ 我们是技术自由，我们对抗技术压迫，无论发生什么都会继续下去。 我们是：Timur、Zurha、Vladimir 和 Harold。愿我们的名字为人所知！"},{"id":168,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"失踪人口笔记（Missing Person Notes）","type":"MARKDOWN","html":"\u003cp\u003e嗯，那份报告。我在想那些家伙到底是什么人。我可能听说过他们，他们挑的这个名字真够怪的。小孩扮罪犯？还是罪犯装成怪小孩。 那种化学玩意儿，我确定我以前碰到过。那些症状……是什么呢……我的记性总在跟我开玩笑。想起来了！是“Tantrum”！（脾气发作）就是它——就是那种该死的药，我确定。那么多人因它而死，却没人知道它是从哪儿来的。也许这就是我查清它的机会。我得继续往下挖。\u003c/p\u003e\r\n","text":"嗯，那份报告。我在想那些家伙到底是什么人。我可能听说过他们，他们挑的这个名字真够怪的。小孩扮罪犯？还是罪犯装成怪小孩。 那种化学玩意儿，我确定我以前碰到过。那些症状……是什么呢……我的记性总在跟我开玩笑。想起来了！是“Tantrum”！（脾气发作）就是它——就是那种该死的药，我确定。那么多人因它而死，却没人知道它是从哪儿来的。也许这就是我查清它的机会。我得继续往下挖。"},{"id":169,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"MO Chemicals 行为准则（MO Chemicals Code of Conduct）","type":"MARKDOWN","html":"\u003cp\u003eMO CHEMICALS —— 董事行为准则\u003c/p\u003e\r\n\u003cp\u003e所有董事必须：\u003c/p\u003e\r\n\u003cp\u003e维护入库与废弃物文件的完整性。\u003c/p\u003e\r\n\u003cp\u003e确保符合监管要求。\u003c/p\u003e\r\n\u003cp\u003e避免可能招致审计审查的程序违规。\u003c/p\u003e\r\n\u003cp\u003e将公司利益置于个人责任之上。\u003c/p\u003e\r\n\u003cp\u003e严守保密。\u003c/p\u003e\r\n\u003cp\u003e违反合规协议可能导致：\u003c/p\u003e\r\n\u003cp\u003e– 立即解雇 – 责任转移 – 依据 USOL 工业监管条例升级为法律程序\u003c/p\u003e\r\n\u003cp\u003e签署， 执行合规办公室\u003c/p\u003e\r\n","text":"MO CHEMICALS —— 董事行为准则 所有董事必须： 维护入库与废弃物文件的完整性。 确保符合监管要求。 避免可能招致审计审查的程序违规。 将公司利益置于个人责任之上。 严守保密。 违反合规协议可能导致： – 立即解雇 – 责任转移 – 依据 USOL 工业监管条例升级为法律程序 签署， 执行合规办公室"},{"id":170,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"MO Chemicals 贸易台账（MO Chemicals Trade Ledger）","type":"MARKDOWN","html":"\u003cp\u003eMO Chemicals 内部贸易台账 董事节点：H.Wells 自动归档：关闭 手动覆盖：启用\u003c/p\u003e\r\n\u003cp\u003e批次 A12-441 来源：Helix Extraction \u0026amp; Reclamation Coop（螺旋提取与回收合作社） 申报内容：工业纯化级活性溶剂基料 数量：32 只合金密封化学桶（180 升） 状态：已处理 调整：无\u003c/p\u003e\r\n\u003cp\u003e批次 A12-442 来源：Helix Extraction \u0026amp; Reclamation Coop（螺旋提取与回收合作社） 申报内容：工业纯化级活性溶剂基料 数量：32 只合金密封化学桶（180 升） 状态：已处理 调整：入库重量修正（-780 千克） 授权：H.Wells\u003c/p\u003e\r\n\u003cp\u003e批次 A13-118 来源：Titan Chemcombine（泰坦化学联合体） 申报内容：催化剂稳定剂化合物 数量：20 只加固低温桶（250 升） 状态：转运至 Annex 7 调整：无\u003c/p\u003e\r\n\u003cp\u003e批次 A13-119 来源：Titan Chemcombine（泰坦化学联合体） 申报内容：催化剂稳定剂化合物 数量：20 只加固低温桶（250 升） 状态：Annex 7 入库 调整：已应用校准偏差 授权：H.Wells\u003c/p\u003e\r\n\u003cp\u003e批次 A7-1154 – A7-1193 申报内容：工业酸溶液 状态：7 号扇区储存场 备注：检测到密封偏差。复核延后。\u003c/p\u003e\r\n","text":"MO Chemicals 内部贸易台账 董事节点：H.Wells 自动归档：关闭 手动覆盖：启用 批次 A12 441 来源：Helix Extraction \u0026 Reclamation Coop（螺旋提取与回收合作社） 申报内容：工业纯化级活性溶剂基料 数量：32 只合金密封化学桶（180 升） 状态：已处理 调整：无 批次 A12 442 来源：Helix Extraction \u0026 Reclamation Coop（螺旋提取与回收合作社） 申报内容：工业纯化级活性溶剂基料 数量：32 只合金密封化学桶（180 升） 状态：已处理 调整：入库重量修正（ 780 千克） 授权：H.Wells 批次 A13 118 来源：Titan Chemcombine（泰坦化学联合体） 申报内容：催化剂稳定剂化合物 数量：20 只加固低温桶（250 升） 状态：转运至 Annex 7 调整：无 批次 A13 119 来源：Titan Chemcombine（泰坦化学联合体） 申报内容：催化剂稳定剂化合物 数量：20 只加固低温桶（250 升） 状态：Annex 7 入库 调整：已应用校准偏差 授权：H.Wells 批次 A7 1154 – A7 1193 申报内容：工业酸溶液 状态：7 号扇区储存场 备注：检测到密封偏差。复核延后。"},{"id":171,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"MR-7 媒体读取器 78x — 操作与数据恢复（MR-7 Media Reader 78x — Operation and Data Recovery）","type":"MARKDOWN","html":"\u003cp\u003eCOR3 Tech 的 MR-7 媒体读取器 78x 是一款为高安全性设计的便携式数据读取器。本节详细讲解如何使用安全数据盘操作 MR-7、如何解读设备日志与 SMART 属性，以及如何在出现读取错误时执行恢复。所有流程与引用均遵循《MR-7 技术手册》的体例。简短的内部引用（如 §10.4.2）指向本手册的其他章节，以提供更多背景信息。文中包含图表、表格与伪代码清单，以增强真实感与可理解性。\u003c/p\u003e\r\n\u003ch2\u003e设备初始化与媒体挂载\u003c/h2\u003e\r\n\u003cp\u003e将 MR-7 媒体读取器 78x 连接到主机系统后，设备会执行一段初始化序列并等待插入媒体。请确认主机已识别 MR-7 设备。当 MR-7 就绪后，把数据盘插入设备的插槽。MR-7 有意不自动挂载敏感媒体；操作员必须显式发起挂载，以防止潜在危险的自动运行内容被意外执行（关于媒体的安全处理见 §5.4）。\u003c/p\u003e\r\n\u003cp\u003e图 4.1：MR-7 媒体读取器的界面显示“设备状态：就绪”（Device Status: READY），并检测到一张已插入的、标签为 Data #1 的安全盘。操作员必须点击“插入 1 号盘”（Insert Disk #1）动作来开始挂载流程。这一安全特性（由用户发起挂载）在本手册 §4.2.1 中有详细说明。在此状态下，设备已为接口供电，但尚未读取磁盘上的数据。\u003c/p\u003e\r\n\u003cp\u003e点击“插入 1 号盘”之后，MR-7 会启动并记录媒体的底层握手与初始化步骤。该过程包括协商接口协议、速度，以及读取驱动器元数据。表 4.1 概述了典型的初始化序列：\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e上电与启动——设备启用自己的读取器实例固件，并让各子系统上线（日志前缀 SYS:BOOT 与 SYS:INFO）。\u003c/li\u003e\r\n\u003cli\u003e总线协商——MR-7 与存储设备协商链路（前缀 BUS:INFO），包括协议（例如在 USB7 物理层上运行的 COR3 uSSD）、链路速度、通道完整性检查与 DMA 设置。\u003c/li\u003e\r\n\u003cli\u003e设备握手——读取器查询设备身份信息（前缀 DEV:INFO，获取型号、制造商、固件与安全配置）。\u003c/li\u003e\r\n\u003cli\u003e挂载文件系统——最后，若此前所有步骤均成功，则访问媒体上的文件系统（前缀 FS:INFO 或 IO:INFO）。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e挂载一开始，如果媒体已加密，主机系统可能会提示输入凭据（取决于驱动器的安全足迹；安全协议见第 9 章）。在我们的示例中，媒体使用安全配置“CORE-CADL-BASIC”，这表示一种基础加密方案，MR-7 在拥有正确密钥的情况下能够处理（加密配置参见 §9.3.1）。如果系统要求，操作员应准备好输入解密口令或密钥。\u003c/p\u003e\r\n\u003cp\u003e为清晰起见，下面是一段典型的 MR-7 在插入媒体时的日志摘录（此时尚未发生任何错误）：\u003c/p\u003e\r\n\u003cpre\u003e\u003ccode\u003e\r\n[00:00:00.001] SYS:BOOT  Reader instance v2.8.19 starting...\r\n[00:00:00.003] SYS:INFO  Subsystems online: BUS, IO, SMART, RAW\r\n[00:00:00.005] BUS:INFO  Link negotiation: uSSD  -\u0026gt; UDB-4 bridge\r\n[00:00:00.006] BUS:INFO  Speed 10.0 Gbps (fallback 5.0 Gbps)\r\n[00:00:00.008] BUS:INFO  Lane integrity OK (BER = 1.4e-12)\r\n[00:00:00.010] BUS:INFO  DMA mode UDMA7 enabled\r\n[00:00:00.012] BUS:INFO  Interface negotiated successfully\r\n[00:00:00.014] DEV:INFO  Device handshake initiated...\r\n[00:00:00.015] DEV:INFO  Model – MR-7 Media Reader 78x\r\n[00:00:00.016] DEV:INFO  Manufacturer – CORETECH INC.\r\n[00:00:00.018] DEV:INFO  OS name – coretech_infodisk_batch4corp\r\n[00:00:00.019] DEV:INFO  Sec. footprint – CORE-CADL-BASIC\r\n[00:00:00.021] FS:INFO  Mounting file system...\r\n\u003c/code\u003e\u003c/pre\u003e\r\n\u003cp\u003e上述日志（来自内置查看器，稍后在图 4.3 中显示）确认 MR-7 已成功以 10 Gbps 建立通信（设备在需要时会回落到 5 Gbps，说明它支持 USB7 速度，但可降速以维持稳定连接）。1.4×10^-12 的误码率（BER）表明链路干净（对高速串行链路而言，BER 低于 1e-12 属于优秀）。DMA 模式 UDMA7 表示已启用超 DMA 传输，以实现高效的数据吞吐，这一细节来自 COR3 uSSD 接口规范（附录 E 涵盖 UDB-4 与 UDMA 等接口规范）。\u003c/p\u003e\r\n\u003cp\u003e在此阶段，如果没发生错误，文件系统就会挂载成功，安全盘的内容便可访问。然而，在我们的示例中，接下来将演示一个读取错误的场景——考虑到“Data #1”的年限或状况，这是一种很可能发生的情况。\u003c/p\u003e\r\n\u003ch2\u003eSMART 属性与磁盘状态\u003c/h2\u003e\r\n\u003cp\u003e在深入错误之前，先检查磁盘的健康指标是有用的。MR-7 可以在挂载前或挂载过程中读取存储设备的 S.M.A.R.T. 属性（自我监测、分析与报告技术）。监测这些属性有助于诊断磨损或内部错误之类的问题（健康属性的完整列表见 §8.5）。在我们的示例中，初始握手之后，操作员打开所插入驱动器的“属性”面板以检查其状态。\u003c/p\u003e\r\n\u003cp\u003e图 4.2：所插入媒体 Data #1 的磁盘属性与属性值面板。MR-7 显示设备信息（固件版本 GT8ed336、序列号 AA2025032427MJK4097、接口 COR3 HDDR、传输模式 USB 7）以及关键 SMART 属性。值得注意的是，“媒体与文件完整性错误”被标记（红色指示），提示存在数据完整性问题。其他字段（严重警告、已用百分比等）以原始十六进制格式显示。\u003c/p\u003e\r\n\u003cp\u003e从图 4.2 中，我们看到几个重要指标：\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e严重警告（Critical Warning）：一个编码值（此处为 0x0654），表示设备有一条或多条严重健康标志。非零的严重警告通常意味着驱动器已越过某个阈值（例如备用存储块耗尽，或达到耐久上限）。在真实的 uSSD 驱动器中，任何严重警告（例如值为 0x01 或 0x04）都意味着已触发过温或磨损之类的警报。此处 0x0654 是厂商特定代码，但从上下文看，它很可能表示寿命终结状态并伴随完整性错误（关于解码厂商特定的 SMART 代码，参见附录 D 的 SMART 属性参考）。\u003c/li\u003e\r\n\u003cli\u003e已用百分比（Percentage Used）：该属性（显示为 E546U835——一种不寻常的格式）通常反映驱动器的磨损程度。健康的驱动器从 0% 开始，随着闪存被消耗而趋近 100%。超过 100% 的值表示驱动器已超出额定寿命。这段乱码输出可能意味着计数器溢回，或使用了自定义编码。简而言之，可以预期这块驱动器早已远超其设计耐久度；严重警告很可能与此有关。\u003c/li\u003e\r\n\u003cli\u003e读取/写入数据单元（Data Units Read/Written）：这些计数器（图 4.2 中显示的是原始十六进制值）对应驱动器在其寿命内被读取/写入的数据量。界面也解释了其中一部分：注意顶部面板写着“主机读取：34798 GB，主机写入：14533 GB”。这意味着大约读取了 34.8 TB、写入了 14.5 TB。如此繁重的使用量支持了驱动器已磨损的看法（已用百分比很高）。\u003c/li\u003e\r\n\u003cli\u003e通电次数/通电小时数（Power Cycles / Power-on Hours）：原始计数器 000...13C 与 0858U875K4（格式看起来很奇怪）表示驱动器被断电重启了多少次，以及通电了多少小时。如果把 13C 当作十六进制整数解读（十进制 316），那就是通电次数。通电小时数这一值似乎已损坏或经过编码（0858U875K4 无法直接按十六进制解析），但它很可能表示一个非常高的小时数，与一台老旧设备相符。\u003c/li\u003e\r\n\u003cli\u003e媒体与数据完整性错误（Media and Data Integrity Errors）：这是被红色高亮的关键字段。此处任何非零值（显示为 0654，推测是错误计数）都意味着驱动器已遭遇不可恢复的读写错误。对安全驱动器而言，哪怕只有一个错误计数也值得担忧。1620 个错误（0x0654 = 十进制 1620）的存在令人警惕——它表明存在大面积数据损坏，或有些扇区已无法通过纠错。这就解释了为什么读取操作可能会失败。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e鉴于这些指标，手册建议（作为最佳实践）在处理关键任务媒体时始终查看 SMART 属性（§8.2 概述了相关流程）。在本例中，这些属性预先警告我们挂载可能会出问题。严重警告与完整性错误预示了读取数据时的错误。\u003c/p\u003e\r\n\u003cp\u003e由于检测到这些问题，界面中的设备状态现在很可能已从“就绪”变为“错误”。在 MR-7 的屏幕与日志上，当系统尝试挂载文件系统并撞上损坏数据时，我们预期会出现一个错误码。接下来我们查看这个具体的错误。\u003c/p\u003e\r\n\u003ch2\u003e错误检测与代码 \u003cstrong\u003e192A03\u003c/strong\u003e\u003c/h2\u003e\r\n\u003cp\u003e如果挂载过程中发生错误，MR-7 会中止操作并报告一个详细的错误码。在我们的场景中，对“Data #1”文件系统的读取尝试失败，设备状态切换为错误状态。屏幕上的日志查看器（可通过 MR-7 界面访问）会显示失败位置。\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e图 4.3：MR-7 的实时日志视图，显示设备初始化序列，以及文件系统挂载尝试后的错误状态（\u003cstrong\u003eERROR #192A03\u003c/strong\u003e）。日志包含时间戳与子系统标签（SYS、BUS、DEV 等），标示每一步。错误发生在挂载开始后不久，暗示存在底层数据问题（例如文件系统元数据损坏，或安全检查失败）。左下角的 \u003cstrong\u003eFIX\u003c/strong\u003e 按钮出现，允许操作员尝试自动恢复程序。\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e在\u003cstrong\u003e图 4.3\u003c/strong\u003e中，日志行（接续前面的摘录）大致如下：\u003c/p\u003e\r\n\u003cpre\u003e\u003ccode\u003e\r\n... (previous log lines) ...\r\n[00:00:00.022] FS:INFO  Reading partition table...\r\n[00:00:00.030] IO:WARN  Data integrity anomaly detected\r\n[00:00:00.031] FS:ERROR Failed to mount filesystem (code 0x192A03)\r\n[00:00:00.032] SYS:ERROR Unrecoverable data error – code 192A03\r\n\u003c/code\u003e\u003c/pre\u003e\r\n\u003cp\u003e\u003cstrong\u003e错误码 192A03\u003c/strong\u003e 是 COR3 Tech 设备特有的复合错误标识符。虽然手册附录 B 包含完整的错误码列表，我们可以这样拆解这个特定的代码：\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e\u003ccode\u003e192A03\u003c/code\u003e（十六进制）在概念上可拆成几个组成部分：\u003ccode\u003e19-2A-03\u003c/code\u003e。虽然属于专有编码，它通常编码了子系统与错误类型。例如，\u003ccode\u003e0x19\u003c/code\u003e 可能指文件系统/完整性子系统，\u003ccode\u003e0x2A\u003c/code\u003e 可能是“认证不匹配”或“校验和错误”之类的特定错误类别，而 \u003ccode\u003e0x03\u003c/code\u003e 是错误子类型或序号。\u003c/li\u003e\r\n\u003cli\u003e\u003cstrong\u003e含义：\u003c/strong\u003e 用直白的话说，MR-7 中的错误 192A03 很可能意味着\u003cstrong\u003e“数据流认证失败——不可恢复的不匹配”\u003c/strong\u003e。当驱动器的内部完整性检查（或解密例程）检测到数据已被篡改或损坏，且超出纠错能修复的范围时，就会发生这种情况。它可能由关键区域（例如主文件表或加密头）中的坏块引发——该处的数据与预期的校验和或签名不符。\u003c/li\u003e\r\n\u003cli\u003e\u003cstrong\u003e可能原因：\u003c/strong\u003e\u003c/li\u003e\r\n\u003cli\u003e存储介质物理老化（SMART 统计已有所提示），导致扇区损坏，连 ECC（纠错码）也无法完全恢复。\u003c/li\u003e\r\n\u003cli\u003e媒体的安全足迹 \u003cstrong\u003eCORE-CADL-BASIC\u003c/strong\u003e 表明启用了加密；错误的解密密钥或损坏的密码头都可能导致认证失败（系统在期望结构化数据的地方看到乱码）。\u003c/li\u003e\r\n\u003cli\u003e也存在故意篡改的可能——例如有人改动了数据或驱动器固件（不过在此处可能性较低；那通常会显示另一个错误码）。\u003c/li\u003e\r\n\u003cli\u003e\u003cstrong\u003e影响：\u003c/strong\u003e MR-7 中止挂载流程，以保护主机以及任何部分数据的完整性。此时用户无法访问任何文件；目录列表可能不完整或不可见。设备界面会发出错误状态信号（如图所示，状态闪烁红色并显示错误码）。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e为便于快速查阅，\u003cstrong\u003e表 4.2\u003c/strong\u003e 列出了 MR-7 语境下的这一错误码及相关错误码：\u003c/p\u003e\r\n\u003cp\u003e| 错误码 | 说明 | 子系统 | 解决方式 | |------------|-------------|-----------|---------------------| | \u003cstrong\u003e192A03\u003c/strong\u003e | 数据认证失败（不可恢复） | 文件系统/完整性检查 | 运行自动 \u003cstrong\u003eFix\u003c/strong\u003e 例程（见下文）；若不成功，升级为手动恢复（见 §10.4.2）。 | | \u003cstrong\u003e192A02\u003c/strong\u003e | 数据完整性警告（可恢复） | 文件系统/完整性检查 | 系统检测到损坏，但借助 ECC 成功恢复。数据读取可能较慢。（建议用户谨慎；考虑备份。） | | \u003cstrong\u003e191F01\u003c/strong\u003e | 需要加密密钥/密钥不匹配 | 安全层 | 提供正确的解密密钥，或检查驱动器安全配置是否与 MR-7 支持的配置相符（§9.3.2）。 | | \u003cstrong\u003e140C01\u003c/strong\u003e | 接口 CRC 错误（瞬时） | 总线/链路层 | 通常是通信抖动。重新插好驱动器；若为外置则检查线缆。重试操作。 |\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e表 4.2：常见的 MR-7 错误码及其含义。\u003c/em\u003e（完整列表见附录 B。）\u003c/p\u003e\r\n\u003cp\u003e从表中可以看出，\u003cstrong\u003e192A03\u003c/strong\u003e 显然是需要特殊处理的严重错误。MR-7 的固件已确认无法正常继续，但它提供了一种内置的缓解手段：\u003cstrong\u003eFix\u003c/strong\u003e 例程。“FIX”按钮的出现（图 4.3，左下角）表明设备正在给操作员一个机会，用自动流程恢复数据。我们将在下一节讨论 Fix 流程。\u003c/p\u003e\r\n\u003cp\u003e在继续之前，请确保已记下错误码与任何相关日志消息。手册建议把此类错误记录在任务日志中（依据 §1.5《操作日志记录准则》）。此外，在此阶段不要给驱动器断电或拔下它——这样做可能会加剧损坏。正确的做法是在驱动器保持连接的状态下启动恢复，因为 MR-7 已阻止进一步损坏，并准备就地进行修复尝试。\u003c/p\u003e\r\n\u003ch2\u003eRMPD 恢复模式（自动“Fix”流程）\u003c/h2\u003e\r\n\u003cp\u003e当发生 192A03 这类不可恢复的错误时，MR-7 媒体读取器 78x 可以启用其高级恢复子系统，尝试抢救数据。该子系统被称为 \u003cstrong\u003eRMPD 数据恢复模式\u003c/strong\u003e（常简称“RMPD 模式”）。要触发它，操作员点击错误状态界面中出现的 \u003cstrong\u003eFIX\u003c/strong\u003e 按钮。RMPD 模式是一种迭代式、多策略的恢复算法，为 COR3 Tech 专有——它本质上会尝试不同的数据读取与重建方式，包括重读扇区、利用驱动器上的任何冗余数据，以及在安全的前提下绕过某些检查。（关于 RMPD 内部机制的技术细节，见第 11 章，该章深入探讨恢复算法及其开发过程。）\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e图 4.4：启动 \u003cstrong\u003eFix\u003c/strong\u003e 流程后，MR-7 进入 \u003cstrong\u003eRMPD 数据读取器\u003c/strong\u003e模式。界面可能会显示多次虚拟挂载尝试（如图所示，出现了三个 \u003cstrong\u003eData #1\u003c/strong\u003e 实例，各自代表一条并行恢复线程）。在该模式下，设备固件同时分叉出多种策略：例如一条线程可能忽略非关键校验和错误，另一条可能使用深度纠错或暴力重组文件表。在此过程中设备状态仍保持 ERROR，但在后台，RMPD 模式正在努力恢复数据完整性。\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003eRMPD 恢复分阶段运行。从较高层面理解 MR-7 在该模式下做什么是有帮助的：\u003c/p\u003e\r\n\u003cp\u003e1. \u003cstrong\u003e快照与分析：\u003c/strong\u003e MR-7 首先（如果可能）对磁盘状态做一个底层快照——本质上就是冻结一份可读数据的副本。然后分析损坏的性质。例如，若加密头损坏，它会记下这一点；若某些扇区不可读，它会标记它们。 2. \u003cstrong\u003e并行恢复线程：\u003c/strong\u003e 设备固件会生成多条恢复线程（图 4.4 界面中显示的多个实例就是这种并行性的可视化表现）。每条线程可能尝试不同的方法：\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e一条线程多次重读有问题的扇区（并调整信号参数），以判断这些错误是否为瞬时性的。\u003c/li\u003e\r\n\u003cli\u003e另一条线程可能尝试利用校验和模式或已知的文件系统结构来重建缺失数据（例如从备份重建分区表）。\u003c/li\u003e\r\n\u003cli\u003e第三条线程可能尝试利用已知模式或后备密钥，绕过损坏区段上的加密（如果安全配置允许按公司政策使用后门；参见 §9.4 关于紧急解密）。\u003c/li\u003e\r\n\u003cp\u003e3. \u003cstrong\u003e比较与合并：\u003c/strong\u003e 各线程完成尝试后，RMPD 系统会比较结果。如果一条线程取回了目录信息，另一条拿到了部分文件数据，系统会把它们合并，拼出一个连贯的文件系统视图。最好的情况是一条线程完全成功，其余被丢弃；最坏的情况是，如果没有任何线程能收集到足够一致的数据，系统仍可能失败。 4. \u003cstrong\u003e完成或回滚：\u003c/strong\u003e 如果恢复成功，MR-7 会完成挂载：错误状态被清除，设备状态回到 \u003cstrong\u003eREADY\u003c/strong\u003e，并把重建后的文件系统呈现给用户。如果所有线程都失败，MR-7 会回滚任何部分改动并保留错误状态，此时就需要人工介入（手册会引导你转向专门的恢复步骤或专业数据取证——超出本节范围）。\u003c/p\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e清单 4.1\u003c/strong\u003e 中的伪代码概述了 Fix 流程固件的简化逻辑（仅作说明之用）：\u003c/p\u003e\r\n\u003cpre\u003e\u003ccode\u003e\r\nfunction RMPD_recoveryProcedure(drive):\r\n    snapshot = drive.createSnapshot()          // Freeze current state\r\n    analysis = analyzeCorruption(snapshot)\r\n    threads = []\r\n    if analysis.type == \u0027integrity\u0027:\r\n        threads.append(new Thread(retryReads, snapshot.badSectors))\r\n        threads.append(new Thread(rebuildFileTable, snapshot))\r\n    if analysis.type == \u0027encryption\u0027:\r\n        threads.append(new Thread(forceDecrypt, snapshot, possibleKeys))\r\n    threads.append(new Thread(eccDeepScan, snapshot))\r\n\r\nfor t in threads: t.start()\r\n    for t in threads: t.join()                // wait for all threads to finish\r\n\r\nresult = mergeResults(threads)\r\n    if result.fileSystemMounted:\r\n        log(\"RMPD: Recovery successful, integrity restored\")\r\n        return MOUNT_SUCCESS\r\n    else:\r\n        log(\"RMPD: Recovery failed in all threads\")\r\n        return MOUNT_FAILED\r\n\u003c/code\u003e\u003c/pre\u003e\r\n\u003cp\u003e\u003cem\u003e清单 4.1：MR-7 RMPD“Fix”例程的简化伪代码。\u003c/em\u003e 它展示了多条线程如何并行尝试不同的恢复策略，然后合并结果。实际的固件代码要复杂得多，且属专有（真实实现超出本手册范围，但设计概览见 §11.2）。\u003c/p\u003e\r\n\u003cp\u003e在 RMPD 恢复期间，用户界面可能会更新以显示进度。例如，你可能会看到“线程 1：正在重试扇区 0x5AF3……成功”之类的消息，或每条线程的完成百分比。手册建议保持耐心；除非进程明显卡住了异常长的时间（超过一小时毫无进展，超时设定见 §11.1.4），否则不要中止它。MR-7 的设计是自动处理这些情况，但极度损坏的驱动器可能需要很长时间才能恢复，或者最终仍然失败。\u003c/p\u003e\r\n\u003cp\u003e如果 Fix 流程失败（即错误依然存在），MR-7 在 RMPD 尝试之后仍会继续显示错误码。这种情况下，下一步将涉及手动数据提取技术（例如对驱动器做镜像以便离线分析，这在 §10.4.2 中有介绍）。不过，在我们的示例中，假定 RMPD 模式成功解决了完整性方面的问题。\u003c/p\u003e\r\n\u003ch2\u003e恢复后与数据访问\u003c/h2\u003e\r\n\u003cp\u003e通过 RMPD 恢复成功执行 Fix 之后，MR-7 会挂载文件系统，并允许访问驱动器的内容。设备状态指示器应回到 \u003cstrong\u003eREADY\u003c/strong\u003e（如果仍有一些小问题但已被补偿，也许是 \u003cstrong\u003eDEGRADED\u003c/strong\u003e）。此时，操作员可以通过 MR-7 界面或主机的文件浏览器正常浏览文件。已恢复的文件现在都可获取，不过建议\u003cstrong\u003e立即把它们复制\u003c/strong\u003e到安全位置，因为这块濒临故障的驱动器可能进一步恶化。手册建议，在经历一次严重错误与恢复之后，不应再信任原媒体用于长期存储（关于媒体退役见 §8.7）。\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e图 4.5：成功执行 Fix 之后，已恢复的 \u003cstrong\u003eData #1\u003c/strong\u003e 驱动器的文件列表。目录结构可见，包括一个 \u003ccode\u003eIWT\u003c/code\u003e 文件夹和若干大型图像文件（例如 \u003cstrong\u003eCORE_loc01\u003c/strong\u003e 到 \u003cstrong\u003eCORE_loc10\u003c/strong\u003e）。MR-7 界面现在允许用户打开或导出这些文件。注意：顶部设备状态仍把上次的错误码（192A03）作为记录显示，但已不再闪烁或阻止操作，表明错误状况已解决。\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e在我们的示例中，如图 4.5 所示，这块此前无法读取的驱动器的内容现在可以访问了。名为“CORE_loc##.png”的文件看起来是图像文件。所有已恢复文件都应验证完整性。MR-7 会对已恢复文件做基本校验和验证——任何可能仍损坏的文件都会在界面中被标记（例如带警告图标）。在图 4.5 中，文件旁边看不到此类警告，这意味着恢复完全成功。\u003c/p\u003e\r\n\u003cp\u003e此时，操作员应采取以下步骤（为清晰起见，汇总为有序检查清单）：\u003c/p\u003e\r\n\u003cp\u003e1. \u003cstrong\u003e验证文件完整性：\u003c/strong\u003e 打开几个关键文件，确认它们没有损坏。鉴于它们是从一块濒临故障的磁盘上恢复出来的，再核对一遍是谨慎之举。MR-7 的内置查看器可以预览图像与文本文件；用它快速扫一遍每个文件是否有明显损坏（图像乱码等）。有问题吗？记下来，并考虑重跑恢复或使用备份（§10.4.3 涵盖验证已恢复数据）。 2. \u003cstrong\u003e把数据复制到安全存储：\u003c/strong\u003e 将文件转移到安全、可靠的存储介质上。按你所在组织的规程，这可以是加密驱动器或安全的云端仓库（见 §12.1“任务后数据处理”）。记住，MR-7 是一台读取设备，本身并不用于长期存储数据。 3. \u003cstrong\u003e弹出/断开故障媒体：\u003c/strong\u003e 数据在其他地方保存妥当后，正确卸载并取下原来的“Data #1”驱动器。MR-7 提供“安全弹出”命令。鉴于该驱动器的状况，避免继续使用它。按敏感程度与政策给它贴上处置或归档标签。 4. \u003cstrong\u003e记录事件：\u003c/strong\u003e 记录错误 192A03 的事件与所采取的恢复操作。这对于问责与改进今后的流程很重要。MR-7 可以导出其日志（为 .rtf 或 .log 文件），你应把它附在任务报告中（依据 §1.5 日志记录准则）。\u003c/p\u003e\r\n\u003cp\u003e按上述步骤操作，你就能确保有价值的数据得以保存，并让故障媒体得到恰当处理。\u003c/p\u003e\r\n\u003ch2\u003e固件更新流程\u003c/h2\u003e\r\n\u003cp\u003eMR-7 媒体读取器 78x 实施一套受控的固件部署流程，基于成对的固件版本可执行文件及其关联的固件手册文件。在文档层面，固件包与修订版本无关，可能代表不同的内部构建；因此本节不引用任何具体固件版本。每个固件版本 \u003ccode\u003e.exe\u003c/code\u003e 都以密码学方式与其对应的固件手册绑定，无法独立执行。固件手册不含任何描述性操作指导，只由按固定长度分块、以分隔符隔开的结构化字母数字数据序列组成。读取器会把这些序列解释为与该可执行文件唯一对应的底层指令映射与校验来源。固件安装通过读取器命令接口执行，调用格式如下：\u003c/p\u003e\r\n\u003cp\u003e\u003ccode\u003eupdate reader \u0026lt;path_to_Firmware_executable\u0026gt; \u0026lt;path_to_Firmware_manual\u0026gt; \u0026lt;authorization_key\u0026gt;\u003c/code\u003e\u003c/p\u003e\r\n\u003cp\u003e授权密钥是一个 12 字符的值，取自手册主数据块内的预定义位置，且必须在执行时提供。该密钥的组装方式是：从由该块架构的 10 字符段所管辖的数据块中，提取\u003cstrong\u003e!取自第 2 行的 4 个字符!\u003c/strong\u003e、\u003cstrong\u003e!取自第 4 行的 4 个字符!\u003c/strong\u003e、\u003cstrong\u003e!取自第 7 行的 2 个字符!\u003c/strong\u003e与\u003cstrong\u003e!取自第 9 行的 2 个字符!\u003c/strong\u003e，然后按固件加载器定义的顺序把这些片段拼接起来。如果可执行文件、手册或推导出的密钥无法构成有效的匹配集，校验就会失败，执行将被中止，读取器的固件状态不会被修改。该流程在 MR-7 设备上强制保证了固件的完整性、版本耦合与受控部署。\u003c/p\u003e\r\n\u003ch2\u003e小结与后续步骤\u003c/h2\u003e\r\n\u003cp\u003e在本节中，我们走了一遍使用 MR-7 媒体读取器 78x 从一块受损的安全盘中取回数据的真实场景。我们涵盖了初始化、错误检测（含 SMART 诊断），以及执行 RMPD 自动恢复模式。示例围绕错误码 192A03 展开，演示了设备的先进功能如何把一次潜在失败变成成功的数据恢复——尽管需要一些努力与谨慎。\u003c/p\u003e\r\n\u003cp\u003e若想获得更深入的技术洞见，接下来的章节会深入探讨此处涉及的专门话题。第 9 章完整拆解\u003cstrong\u003e安全足迹与加密处理\u003c/strong\u003e（有助于理解像我们示例中采用 CORE-CADL-BASIC 加密的驱动器）。如果自动恢复失败，第 10 章（尤其是 §10.4.2）将与之相关——它涵盖\u003cstrong\u003e手动取证恢复技术与工具\u003c/strong\u003e。第 11 章进一步展开\u003cstrong\u003eRMPD 恢复算法\u003c/strong\u003e，并包含 192A03 之外不同错误码的案例研究。如前所述，附录 B 列出了所有错误码及其定义，可作为现场的便捷参考。\u003c/p\u003e\r\n\u003cp\u003e至此，借助第 43–47 页的信息，操作员应当有信心处理 MR-7 上出问题的媒体插入：从识别警示信号，到执行 Fix 并随后保护好数据。请始终记住，MR-7 媒体读取器 78x 虽然是一件强大的工具，但在处理机密数据设备时，有备无患并遵循规程（复核健康指标、保留备份、记录一切）才是任务成功的关键。\u003c/p\u003e\r\n","text":"COR3 Tech 的 MR 7 媒体读取器 78x 是一款为高安全性设计的便携式数据读取器。本节详细讲解如何使用安全数据盘操作 MR 7、如何解读设备日志与 SMART 属性，以及如何在出现读取错误时执行恢复。所有流程与引用均遵循《MR 7 技术手册》的体例。简短的内部引用（如 §10.4.2）指向本手册的其他章节，以提供更多背景信息。文中包含图表、表格与伪代码清单，以增强真实感与可理解性。 设备初始化与媒体挂载 将 MR 7 媒体读取器 78x 连接到主机系统后，设备会执行一段初始化序列并等待插入媒体。请确认主机已识别 MR 7 设备。当 MR 7 就绪后，把数据盘插入设备的插槽。MR 7 有意不自动挂载敏感媒体；操作员必须显式发起挂载，以防止潜在危险的自动运行内容被意外执行（关于媒体的安全处理见 §5.4）。 图 4.1：MR 7 媒体读取器的界面显示“设备状态：就绪”（Device Status: READY），并检测到一张已插入的、标签为 Data 1 的安全盘。操作员必须点击“插入 1 号盘”（Insert Disk 1）动作来开始挂载流程。这一安全特性（由用户发起挂载）在本手册 §4.2.1 中有详细说明。在此状态下，设备已为接口供电，但尚未读取磁盘上的数据。 点击“插入 1 号盘”之后，MR 7 会启动并记录媒体的底层握手与初始化步骤。该过程包括协商接口协议、速度，以及读取驱动器元数据。表 4.1 概述了典型的初始化序列： 上电与启动——设备启用自己的读取器实例固件，并让各子系统上线（日志前缀 SYS:BOOT 与 SYS:INFO）。 总线协商——MR 7 与存储设备协商链路（前缀 BUS:INFO），包括协议（例如在 USB7 物理层上运行的 COR3 uSSD）、链路速度、通道完整性检查与 DMA 设置。 设备握手——读取器查询设备身份信息（前缀 DEV:INFO，获取型号、制造商、固件与安全配置）。 挂载文件系统——最后，若此前所有步骤均成功，则访问媒体上的文件系统（前缀 FS:INFO 或 IO:INFO）。 挂载一开始，如果媒体已加密，主机系统可能会提示输入凭据（取决于驱动器的安全足迹；安全协议见第 9 章）。在我们的示例中，媒体使用安全配置“CORE CADL BASIC”，这表示一种基础加密方案，MR 7 在拥有正确密钥的情况下能够处理（加密配置参见 §9.3.1）。如果系统要求，操作员应准备好输入解密口令或密钥。 为清晰起见，下面是一段典型的 MR 7 在插入媒体时的日志摘录（此时尚未发生任何错误）： [00:00:00.001] SYS:BOOT Reader instance v2.8.19 starting... [00:00:00.003] SYS:INFO Subsystems online: BUS, IO, SMART, RAW [00:00:00.005] BUS:INFO Link negotiation: uSSD UDB 4 bridge [00:00:00.006] BUS:INFO Speed 10.0 Gbps (fallback 5.0 Gbps) [00:00:00.008] BUS:INFO Lane integrity OK (BER = 1.4e 12) [00:00:00.010] BUS:INFO DMA mode UDMA7 enabled [00:00:00.012] BUS:INFO Interface negotiated successfully [00:00:00.014] DEV:INFO Device handshake initiated... [00:00:00.015] DEV:INFO Model – MR 7 Media Reader 78x [00:00:00.016] DEV:INFO Manufacturer – CORETECH INC. [00:00:00.018] DEV:INFO OS name – coretech infodisk batch4corp [00:00:00.019] DEV:INFO Sec. footprint – CORE CADL BASIC [00:00:00.021] FS:INFO Mounting file system... 上述日志（来自内置查看器，稍后在图 4.3 中显示）确认 MR 7 已成功以 10 Gbps 建立通信（设备在需要时会回落到 5 Gbps，说明它支持 USB7 速度，但可降速以维持稳定连接）。1.4×10^ 12 的误码率（BER）表明链路干净（对高速串行链路而言，BER 低于 1e 12 属于优秀）。DMA 模式 UDMA7 表示已启用超 DMA 传输，以实现高效的数据吞吐，这一细节来自 COR3 uSSD 接口规范（附录 E 涵盖 UDB 4 与 UDMA 等接口规范）。 在此阶段，如果没发生错误，文件系统就会挂载成功，安全盘的内容便可访问。然而，在我们的示例中，接下来将演示一个读取错误的场景——考虑到“Data 1”的年限或状况，这是一种很可能发生的情况。 SMART 属性与磁盘状态 在深入错误之前，先检查磁盘的健康指标是有用的。MR 7 可以在挂载前或挂载过程中读取存储设备的 S.M.A.R.T. 属性（自我监测、分析与报告技术）。监测这些属性有助于诊断磨损或内部错误之类的问题（健康属性的完整列表见 §8.5）。在我们的示例中，初始握手之后，操作员打开所插入驱动器的“属性”面板以检查其状态。 图 4.2：所插入媒体 Data 1 的磁盘属性与属性值面板。MR 7 显示设备信息（固件版本 GT8ed336、序列号 AA2025032427MJK4097、接口 COR3 HDDR、传输模式 USB 7）以及关键 SMART 属性。值得注意的是，“媒体与文件完整性错误”被标记（红色指示），提示存在数据完整性问题。其他字段（严重警告、已用百分比等）以原始十六进制格式显示。 从图 4.2 中，我们看到几个重要指标： 严重警告（Critical Warning）：一个编码值（此处为 0x0654），表示设备有一条或多条严重健康标志。非零的严重警告通常意味着驱动器已越过某个阈值（例如备用存储块耗尽，或达到耐久上限）。在真实的 uSSD 驱动器中，任何严重警告（例如值为 0x01 或 0x04）都意味着已触发过温或磨损之类的警报。此处 0x0654 是厂商特定代码，但从上下文看，它很可能表示寿命终结状态并伴随完整性错误（关于解码厂商特定的 SMART 代码，参见附录 D 的 SMART 属性参考）。 已用百分比（Percentage Used）：该属性（显示为 E546U835——一种不寻常的格式）通常反映驱动器的磨损程度。健康的驱动器从 0% 开始，随着闪存被消耗而趋近 100%。超过 100% 的值表示驱动器已超出额定寿命。这段乱码输出可能意味着计数器溢回，或使用了自定义编码。简而言之，可以预期这块驱动器早已远超其设计耐久度；严重警告很可能与此有关。 读取/写入数据单元（Data Units Read/Written）：这些计数器（图 4.2 中显示的是原始十六进制值）对应驱动器在其寿命内被读取/写入的数据量。界面也解释了其中一部分：注意顶部面板写着“主机读取：34798 GB，主机写入：14533 GB”。这意味着大约读取了 34.8 TB、写入了 14.5 TB。如此繁重的使用量支持了驱动器已磨损的看法（已用百分比很高）。 通电次数/通电小时数（Power Cycles / Power on Hours）：原始计数器 000...13C 与 0858U875K4（格式看起来很奇怪）表示驱动器被断电重启了多少次，以及通电了多少小时。如果把 13C 当作十六进制整数解读（十进制 316），那就是通电次数。通电小时数这一值似乎已损坏或经过编码（0858U875K4 无法直接按十六进制解析），但它很可能表示一个非常高的小时数，与一台老旧设备相符。 媒体与数据完整性错误（Media and Data Integrity Errors）：这是被红色高亮的关键字段。此处任何非零值（显示为 0654，推测是错误计数）都意味着驱动器已遭遇不可恢复的读写错误。对安全驱动器而言，哪怕只有一个错误计数也值得担忧。1620 个错误（0x0654 = 十进制 1620）的存在令人警惕——它表明存在大面积数据损坏，或有些扇区已无法通过纠错。这就解释了为什么读取操作可能会失败。 鉴于这些指标，手册建议（作为最佳实践）在处理关键任务媒体时始终查看 SMART 属性（§8.2 概述了相关流程）。在本例中，这些属性预先警告我们挂载可能会出问题。严重警告与完整性错误预示了读取数据时的错误。 由于检测到这些问题，界面中的设备状态现在很可能已从“就绪”变为“错误”。在 MR 7 的屏幕与日志上，当系统尝试挂载文件系统并撞上损坏数据时，我们预期会出现一个错误码。接下来我们查看这个具体的错误。 错误检测与代码 192A03 如果挂载过程中发生错误，MR 7 会中止操作并报告一个详细的错误码。在我们的场景中，对“Data 1”文件系统的读取尝试失败，设备状态切换为错误状态。屏幕上的日志查看器（可通过 MR 7 界面访问）会显示失败位置。 图 4.3：MR 7 的实时日志视图，显示设备初始化序列，以及文件系统挂载尝试后的错误状态（ ERROR 192A03 ）。日志包含时间戳与子系统标签（SYS、BUS、DEV 等），标示每一步。错误发生在挂载开始后不久，暗示存在底层数据问题（例如文件系统元数据损坏，或安全检查失败）。左下角的 FIX 按钮出现，允许操作员尝试自动恢复程序。 在 图 4.3 中，日志行（接续前面的摘录）大致如下： ... (previous log lines) ... [00:00:00.022] FS:INFO Reading partition table... [00:00:00.030] IO:WARN Data integrity anomaly detected [00:00:00.031] FS:ERROR Failed to mount filesystem (code 0x192A03) [00:00:00.032] SYS:ERROR Unrecoverable data error – code 192A03 错误码 192A03 是 COR3 Tech 设备特有的复合错误标识符。虽然手册附录 B 包含完整的错误码列表，我们可以这样拆解这个特定的代码： 192A03 （十六进制）在概念上可拆成几个组成部分： 19 2A 03 。虽然属于专有编码，它通常编码了子系统与错误类型。例如， 0x19 可能指文件系统/完整性子系统， 0x2A 可能是“认证不匹配”或“校验和错误”之类的特定错误类别，而 0x03 是错误子类型或序号。 含义： 用直白的话说，MR 7 中的错误 192A03 很可能意味着 “数据流认证失败——不可恢复的不匹配” 。当驱动器的内部完整性检查（或解密例程）检测到数据已被篡改或损坏，且超出纠错能修复的范围时，就会发生这种情况。它可能由关键区域（例如主文件表或加密头）中的坏块引发——该处的数据与预期的校验和或签名不符。 可能原因： 存储介质物理老化（SMART 统计已有所提示），导致扇区损坏，连 ECC（纠错码）也无法完全恢复。 媒体的安全足迹 CORE CADL BASIC 表明启用了加密；错误的解密密钥或损坏的密码头都可能导致认证失败（系统在期望结构化数据的地方看到乱码）。 也存在故意篡改的可能——例如有人改动了数据或驱动器固件（不过在此处可能性较低；那通常会显示另一个错误码）。 影响： MR 7 中止挂载流程，以保护主机以及任何部分数据的完整性。此时用户无法访问任何文件；目录列表可能不完整或不可见。设备界面会发出错误状态信号（如图所示，状态闪烁红色并显示错误码）。 为便于快速查阅， 表 4.2 列出了 MR 7 语境下的这一错误码及相关错误码： | 错误码 | 说明 | 子系统 | 解决方式 | | | | | | | 192A03 | 数据认证失败（不可恢复） | 文件系统/完整性检查 | 运行自动 Fix 例程（见下文）；若不成功，升级为手动恢复（见 §10.4.2）。 | | 192A02 | 数据完整性警告（可恢复） | 文件系统/完整性检查 | 系统检测到损坏，但借助 ECC 成功恢复。数据读取可能较慢。（建议用户谨慎；考虑备份。） | | 191F01 | 需要加密密钥/密钥不匹配 | 安全层 | 提供正确的解密密钥，或检查驱动器安全配置是否与 MR 7 支持的配置相符（§9.3.2）。 | | 140C01 | 接口 CRC 错误（瞬时） | 总线/链路层 | 通常是通信抖动。重新插好驱动器；若为外置则检查线缆。重试操作。 | 表 4.2：常见的 MR 7 错误码及其含义。 （完整列表见附录 B。） 从表中可以看出， 192A03 显然是需要特殊处理的严重错误。MR 7 的固件已确认无法正常继续，但它提供了一种内置的缓解手段： Fix 例程。“FIX”按钮的出现（图 4.3，左下角）表明设备正在给操作员一个机会，用自动流程恢复数据。我们将在下一节讨论 Fix 流程。 在继续之前，请确保已记下错误码与任何相关日志消息。手册建议把此类错误记录在任务日志中（依据 §1.5《操作日志记录准则》）。此外，在此阶段不要给驱动器断电或拔下它——这样做可能会加剧损坏。正确的做法是在驱动器保持连接的状态下启动恢复，因为 MR 7 已阻止进一步损坏，并准备就地进行修复尝试。 RMPD 恢复模式（自动“Fix”流程） 当发生 192A03 这类不可恢复的错误时，MR 7 媒体读取器 78x 可以启用其高级恢复子系统，尝试抢救数据。该子系统被称为 RMPD 数据恢复模式 （常简称“RMPD 模式”）。要触发它，操作员点击错误状态界面中出现的 FIX 按钮。RMPD 模式是一种迭代式、多策略的恢复算法，为 COR3 Tech 专有——它本质上会尝试不同的数据读取与重建方式，包括重读扇区、利用驱动器上的任何冗余数据，以及在安全的前提下绕过某些检查。（关于 RMPD 内部机制的技术细节，见第 11 章，该章深入探讨恢复算法及其开发过程。） 图 4.4：启动 Fix 流程后，MR 7 进入 RMPD 数据读取器 模式。界面可能会显示多次虚拟挂载尝试（如图所示，出现了三个 Data 1 实例，各自代表一条并行恢复线程）。在该模式下，设备固件同时分叉出多种策略：例如一条线程可能忽略非关键校验和错误，另一条可能使用深度纠错或暴力重组文件表。在此过程中设备状态仍保持 ERROR，但在后台，RMPD 模式正在努力恢复数据完整性。 RMPD 恢复分阶段运行。从较高层面理解 MR 7 在该模式下做什么是有帮助的： 1. 快照与分析： MR 7 首先（如果可能）对磁盘状态做一个底层快照——本质上就是冻结一份可读数据的副本。然后分析损坏的性质。例如，若加密头损坏，它会记下这一点；若某些扇区不可读，它会标记它们。 2. 并行恢复线程： 设备固件会生成多条恢复线程（图 4.4 界面中显示的多个实例就是这种并行性的可视化表现）。每条线程可能尝试不同的方法： 一条线程多次重读有问题的扇区（并调整信号参数），以判断这些错误是否为瞬时性的。 另一条线程可能尝试利用校验和模式或已知的文件系统结构来重建缺失数据（例如从备份重建分区表）。 第三条线程可能尝试利用已知模式或后备密钥，绕过损坏区段上的加密（如果安全配置允许按公司政策使用后门；参见 §9.4 关于紧急解密）。 3. 比较与合并： 各线程完成尝试后，RMPD 系统会比较结果。如果一条线程取回了目录信息，另一条拿到了部分文件数据，系统会把它们合并，拼出一个连贯的文件系统视图。最好的情况是一条线程完全成功，其余被丢弃；最坏的情况是，如果没有任何线程能收集到足够一致的数据，系统仍可能失败。 4. 完成或回滚： 如果恢复成功，MR 7 会完成挂载：错误状态被清除，设备状态回到 READY ，并把重建后的文件系统呈现给用户。如果所有线程都失败，MR 7 会回滚任何部分改动并保留错误状态，此时就需要人工介入（手册会引导你转向专门的恢复步骤或专业数据取证——超出本节范围）。 清单 4.1 中的伪代码概述了 Fix 流程固件的简化逻辑（仅作说明之用）： function RMPD recoveryProcedure(drive): snapshot = drive.createSnapshot() // Freeze current state analysis = analyzeCorruption(snapshot) threads = [] if analysis.type == \u0027integrity\u0027: threads.append(new Thread(retryReads, snapshot.badSectors)) threads.append(new Thread(rebuildFileTable, snapshot)) if analysis.type == \u0027encryption\u0027: threads.append(new Thread(forceDecrypt, snapshot, possibleKeys)) threads.append(new Thread(eccDeepScan, snapshot)) for t in threads: t.start() for t in threads: t.join() // wait for all threads to finish result = mergeResults(threads) if result.fileSystemMounted: log(\"RMPD: Recovery successful, integrity restored\") return MOUNT SUCCESS else: log(\"RMPD: Recovery failed in all threads\") return MOUNT FAILED 清单 4.1：MR 7 RMPD“Fix”例程的简化伪代码。 它展示了多条线程如何并行尝试不同的恢复策略，然后合并结果。实际的固件代码要复杂得多，且属专有（真实实现超出本手册范围，但设计概览见 §11.2）。 在 RMPD 恢复期间，用户界面可能会更新以显示进度。例如，你可能会看到“线程 1：正在重试扇区 0x5AF3……成功”之类的消息，或每条线程的完成百分比。手册建议保持耐心；除非进程明显卡住了异常长的时间（超过一小时毫无进展，超时设定见 §11.1.4），否则不要中止它。MR 7 的设计是自动处理这些情况，但极度损坏的驱动器可能需要很长时间才能恢复，或者最终仍然失败。 如果 Fix 流程失败（即错误依然存在），MR 7 在 RMPD 尝试之后仍会继续显示错误码。这种情况下，下一步将涉及手动数据提取技术（例如对驱动器做镜像以便离线分析，这在 §10.4.2 中有介绍）。不过，在我们的示例中，假定 RMPD 模式成功解决了完整性方面的问题。 恢复后与数据访问 通过 RMPD 恢复成功执行 Fix 之后，MR 7 会挂载文件系统，并允许访问驱动器的内容。设备状态指示器应回到 READY （如果仍有一些小问题但已被补偿，也许是 DEGRADED ）。此时，操作员可以通过 MR 7 界面或主机的文件浏览器正常浏览文件。已恢复的文件现在都可获取，不过建议 立即把它们复制 到安全位置，因为这块濒临故障的驱动器可能进一步恶化。手册建议，在经历一次严重错误与恢复之后，不应再信任原媒体用于长期存储（关于媒体退役见 §8.7）。 图 4.5：成功执行 Fix 之后，已恢复的 Data 1 驱动器的文件列表。目录结构可见，包括一个 IWT 文件夹和若干大型图像文件（例如 CORE loc01 到 CORE loc10 ）。MR 7 界面现在允许用户打开或导出这些文件。注意：顶部设备状态仍把上次的错误码（192A03）作为记录显示，但已不再闪烁或阻止操作，表明错误状况已解决。 在我们的示例中，如图 4.5 所示，这块此前无法读取的驱动器的内容现在可以访问了。名为“CORE loc .png”的文件看起来是图像文件。所有已恢复文件都应验证完整性。MR 7 会对已恢复文件做基本校验和验证——任何可能仍损坏的文件都会在界面中被标记（例如带警告图标）。在图 4.5 中，文件旁边看不到此类警告，这意味着恢复完全成功。 此时，操作员应采取以下步骤（为清晰起见，汇总为有序检查清单）： 1. 验证文件完整性： 打开几个关键文件，确认它们没有损坏。鉴于它们是从一块濒临故障的磁盘上恢复出来的，再核对一遍是谨慎之举。MR 7 的内置查看器可以预览图像与文本文件；用它快速扫一遍每个文件是否有明显损坏（图像乱码等）。有问题吗？记下来，并考虑重跑恢复或使用备份（§10.4.3 涵盖验证已恢复数据）。 2. 把数据复制到安全存储： 将文件转移到安全、可靠的存储介质上。按你所在组织的规程，这可以是加密驱动器或安全的云端仓库（见 §12.1“任务后数据处理”）。记住，MR 7 是一台读取设备，本身并不用于长期存储数据。 3. 弹出/断开故障媒体： 数据在其他地方保存妥当后，正确卸载并取下原来的“Data 1”驱动器。MR 7 提供“安全弹出”命令。鉴于该驱动器的状况，避免继续使用它。按敏感程度与政策给它贴上处置或归档标签。 4. 记录事件： 记录错误 192A03 的事件与所采取的恢复操作。这对于问责与改进今后的流程很重要。MR 7 可以导出其日志（为 .rtf 或 .log 文件），你应把它附在任务报告中（依据 §1.5 日志记录准则）。 按上述步骤操作，你就能确保有价值的数据得以保存，并让故障媒体得到恰当处理。 固件更新流程 MR 7 媒体读取器 78x 实施一套受控的固件部署流程，基于成对的固件版本可执行文件及其关联的固件手册文件。在文档层面，固件包与修订版本无关，可能代表不同的内部构建；因此本节不引用任何具体固件版本。每个固件版本 .exe 都以密码学方式与其对应的固件手册绑定，无法独立执行。固件手册不含任何描述性操作指导，只由按固定长度分块、以分隔符隔开的结构化字母数字数据序列组成。读取器会把这些序列解释为与该可执行文件唯一对应的底层指令映射与校验来源。固件安装通过读取器命令接口执行，调用格式如下： update reader \u003cpath to Firmware executable \u003cpath to Firmware manual \u003cauthorization key 授权密钥是一个 12 字符的值，取自手册主数据块内的预定义位置，且必须在执行时提供。该密钥的组装方式是：从由该块架构的 10 字符段所管辖的数据块中，提取 !取自第 2 行的 4 个字符! 、 !取自第 4 行的 4 个字符! 、 !取自第 7 行的 2 个字符! 与 !取自第 9 行的 2 个字符! ，然后按固件加载器定义的顺序把这些片段拼接起来。如果可执行文件、手册或推导出的密钥无法构成有效的匹配集，校验就会失败，执行将被中止，读取器的固件状态不会被修改。该流程在 MR 7 设备上强制保证了固件的完整性、版本耦合与受控部署。 小结与后续步骤 在本节中，我们走了一遍使用 MR 7 媒体读取器 78x 从一块受损的安全盘中取回数据的真实场景。我们涵盖了初始化、错误检测（含 SMART 诊断），以及执行 RMPD 自动恢复模式。示例围绕错误码 192A03 展开，演示了设备的先进功能如何把一次潜在失败变成成功的数据恢复——尽管需要一些努力与谨慎。 若想获得更深入的技术洞见，接下来的章节会深入探讨此处涉及的专门话题。第 9 章完整拆解 安全足迹与加密处理 （有助于理解像我们示例中采用 CORE CADL BASIC 加密的驱动器）。如果自动恢复失败，第 10 章（尤其是 §10.4.2）将与之相关——它涵盖 手动取证恢复技术与工具 。第 11 章进一步展开 RMPD 恢复算法 ，并包含 192A03 之外不同错误码的案例研究。如前所述，附录 B 列出了所有错误码及其定义，可作为现场的便捷参考。 至此，借助第 43–47 页的信息，操作员应当有信心处理 MR 7 上出问题的媒体插入：从识别警示信号，到执行 Fix 并随后保护好数据。请始终记住，MR 7 媒体读取器 78x 虽然是一件强大的工具，但在处理机密数据设备时，有备无患并遵循规程（复核健康指标、保留备份、记录一切）才是任务成功的关键。"},{"id":172,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"MR-7 读取器说明（MR-7 Reader Note）","type":"MARKDOWN","html":"\u003cp\u003e这台被找回的设备似乎是一台 CORE 配发的 MR-7 媒体读取器 78x，很可能是一台兼容 CCS 的归档读取器。日记里暗示，载体本身几乎和文件一样重要：组装这个包裹的人，是希望收件人自己去手动解锁那些碎片化的媒体，而不是直接收到一份干净的归档。\u003c/p\u003e\r\n","text":"这台被找回的设备似乎是一台 CORE 配发的 MR 7 媒体读取器 78x，很可能是一台兼容 CCS 的归档读取器。日记里暗示，载体本身几乎和文件一样重要：组装这个包裹的人，是希望收件人自己去手动解锁那些碎片化的媒体，而不是直接收到一份干净的归档。"},{"id":173,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"新卡尔法根灾难（New Karfagen Disaster）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/0E54AB233B6216CB.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页面元素\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e顶部：安全部（DEPARTMENT OF SECURITY）文件，\"Sandman and Sons 商业评估\"字样\u003c/li\u003e\r\n\u003cli\u003e台标：SNN —— Solar News Network（太阳系新闻网）\u003c/li\u003e\r\n\u003cli\u003e标题：新闻档案：直播录像转录——\"新卡尔法根灾难\"\u003c/li\u003e\r\n\u003cli\u003e日期：2231 年 10 月 17 日；新卡尔法根灾难\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文（直播转录）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eVince Darken：我是 Vince Darken，SNN，正在新卡尔法根（New Karfagen）小行星殖民地为您报道。\u003c/p\u003e\r\n\u003cp\u003e今天我们在这里见证 G-Rack 与 ROSTEK 合作推出的新型自动化防御系统。现场人山人海，两家公司都邀请了合作伙伴来见证他们的胜利。这场活动正在向全太阳系直播！\u003c/p\u003e\r\n\u003cp\u003e我们设法请到了 ROSTEK 的代表——Malcolm Malinovsky！\u003c/p\u003e\r\n\u003cp\u003eVince：Malcolm，能给我们讲讲这套防御系统吗？它有什么特别之处？\u003c/p\u003e\r\n\u003cp\u003eMalcolm：好的，Vince，但首先——欢迎大家！那么，这不只是一套\"新\"防御系统——它是一个用于近距离监测与快速反应拦截的控制系统！这套系统让操作员可以同时监测超过 2000 个威胁，并把它们全部同时中和。\u003c/p\u003e\r\n\u003cp\u003eVince：听起来不错，但能讲些更技术性的细节吗？\u003c/p\u003e\r\n\u003cp\u003eMalcolm：嗯，有一点，我猜这算是商业机密，毕竟！你想知道什么？能答的我就答。\u003c/p\u003e\r\n\u003cp\u003eVince：这套\"系统\"能控制哪些武器？\u003c/p\u003e\r\n\u003cp\u003eMalcolm：任何类型。从基本的自动机炮乃至机枪，到导弹和激光系统，都一样。控制机制能适配现有的任何东西。\u003c/p\u003e\r\n\u003cp\u003eVince：那您能描述一下控制机制本身吗？它到底是什么？脚本化系统、受控模块，还是甚至是 AI？\u003c/p\u003e\r\n\u003cp\u003eMalcolm：哈哈！不，你知道 AI 基本是被禁止的，尤其是在军事系统里。虽然确实有些办法能绕过去，但我们是一家负责任的公司，不会那么做。\u003c/p\u003e\r\n\u003cp\u003eVince：好吧，但您能回答这个问题吗，拜托？\u003c/p\u003e\r\n\u003cp\u003eMalcolm：我很乐意，可你看，它马上就要开始了。最好还是自己看吧，我想！\u003c/p\u003e\r\n\u003cp\u003eVince：好。那谢谢您抽时间。各位女士先生——看来该看演出了！让我们前往控制室，好戏将在那里上演。\u003c/p\u003e\r\n\u003cp\u003eZachary Plow：\u003c/p\u003e\r\n\u003cp\u003e女士们先生们，我向你们展示\"水族馆\"（Aquarium）。一套全视角的周界防御系统，能在 40 公里半径内探测目标，并且抗干扰。\u003c/p\u003e\r\n\u003cp\u003e马上，我们就要开始实弹测试，在不同距离上使用不同类型的武器。整个过程将由分布在整个小行星上、位于风景最佳位置的几十台摄像机，以及你们精心选点布置的直播摄像机共同监控！\u003c/p\u003e\r\n\u003cp\u003e我们将用人工陨石雨生成的假目标来测试武器——这些陨石 100% 可控，对殖民地，或对你们停靠、停放的外部飞船，都不构成威胁。\u003c/p\u003e\r\n\u003cp\u003e同行的还有几艘载着游客来看表演的游轮，我们绝对不希望他们出任何事！\u003c/p\u003e\r\n\u003cp\u003e那么，不再拖延——开始吧！\u003c/p\u003e\r\n\u003cp\u003e操作员，请发射陨石，并把系统切换到近距离防御模式！\u003c/p\u003e\r\n\u003cp\u003e操作员：长官，陨石已发射，系统运行正常，正在追踪 1200 个高速移动目标。\u003c/p\u003e\r\n\u003cp\u003eZachary：很好——启动防御。\u003c/p\u003e\r\n\u003cp\u003e操作员：所有系统正常。\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e嗡嗡声与震动\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e正如你们听到的，防御系统开始工作了。远程激光、中程导弹系统、近程自动机炮与机枪——一切运转良好。它们已准备好追踪并摧毁进入其控制区内的任何移动目标。\u003c/p\u003e\r\n\u003cp\u003eVince：抱歉，先生，您刚才说的是\"任何\"吗？因为那艘游轮刚刚开始移动了。\u003c/p\u003e\r\n\u003cp\u003eZachary：什么？操作员？！\u003c/p\u003e\r\n\u003cp\u003e操作员：系统检测到移动！那艘游轮被一颗小陨石击中，正在机动规避！\u003c/p\u003e\r\n\u003cp\u003eZachary：叫他们停下！关掉系统！\u003c/p\u003e\r\n\u003cp\u003e操作员：我做不到，长官！系统已经锁定目标，正在计算射击诸元！\u003c/p\u003e\r\n\u003cp\u003eZachary：不管你用什么办法——动手！马上！关掉它！\u003c/p\u003e\r\n\u003cp\u003e操作员：我……做不到！\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e武器开火声\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003e\u003cstrong\u003e外面刺眼的爆炸\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003eVince：你们都看到了，女士们先生们。没什么可看的了。我们作为人的职责现在就变得很明确：尽力去救那艘游轮上的人。那上面有几百人……\u003c/p\u003e\r\n\u003cp\u003eZachary：这是破坏！破坏，你们听见了吗？！所有人都该知道——因为我们帮了核心（the Core）！他们不想让这种事发生——他们威胁过我们！我要说出真相！所有人都会知道！是破坏！\u003c/p\u003e\r\n","text":"![](../img/0E54AB233B6216CB.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页面元素 顶部：安全部（DEPARTMENT OF SECURITY）文件，\"Sandman and Sons 商业评估\"字样 台标：SNN —— Solar News Network（太阳系新闻网） 标题：新闻档案：直播录像转录——\"新卡尔法根灾难\" 日期：2231 年 10 月 17 日；新卡尔法根灾难 正文（直播转录） Vince Darken：我是 Vince Darken，SNN，正在新卡尔法根（New Karfagen）小行星殖民地为您报道。 今天我们在这里见证 G Rack 与 ROSTEK 合作推出的新型自动化防御系统。现场人山人海，两家公司都邀请了合作伙伴来见证他们的胜利。这场活动正在向全太阳系直播！ 我们设法请到了 ROSTEK 的代表——Malcolm Malinovsky！ Vince：Malcolm，能给我们讲讲这套防御系统吗？它有什么特别之处？ Malcolm：好的，Vince，但首先——欢迎大家！那么，这不只是一套\"新\"防御系统——它是一个用于近距离监测与快速反应拦截的控制系统！这套系统让操作员可以同时监测超过 2000 个威胁，并把它们全部同时中和。 Vince：听起来不错，但能讲些更技术性的细节吗？ Malcolm：嗯，有一点，我猜这算是商业机密，毕竟！你想知道什么？能答的我就答。 Vince：这套\"系统\"能控制哪些武器？ Malcolm：任何类型。从基本的自动机炮乃至机枪，到导弹和激光系统，都一样。控制机制能适配现有的任何东西。 Vince：那您能描述一下控制机制本身吗？它到底是什么？脚本化系统、受控模块，还是甚至是 AI？ Malcolm：哈哈！不，你知道 AI 基本是被禁止的，尤其是在军事系统里。虽然确实有些办法能绕过去，但我们是一家负责任的公司，不会那么做。 Vince：好吧，但您能回答这个问题吗，拜托？ Malcolm：我很乐意，可你看，它马上就要开始了。最好还是自己看吧，我想！ Vince：好。那谢谢您抽时间。各位女士先生——看来该看演出了！让我们前往控制室，好戏将在那里上演。 Zachary Plow： 女士们先生们，我向你们展示\"水族馆\"（Aquarium）。一套全视角的周界防御系统，能在 40 公里半径内探测目标，并且抗干扰。 马上，我们就要开始实弹测试，在不同距离上使用不同类型的武器。整个过程将由分布在整个小行星上、位于风景最佳位置的几十台摄像机，以及你们精心选点布置的直播摄像机共同监控！ 我们将用人工陨石雨生成的假目标来测试武器——这些陨石 100% 可控，对殖民地，或对你们停靠、停放的外部飞船，都不构成威胁。 同行的还有几艘载着游客来看表演的游轮，我们绝对不希望他们出任何事！ 那么，不再拖延——开始吧！ 操作员，请发射陨石，并把系统切换到近距离防御模式！ 操作员：长官，陨石已发射，系统运行正常，正在追踪 1200 个高速移动目标。 Zachary：很好——启动防御。 操作员：所有系统正常。 嗡嗡声与震动 正如你们听到的，防御系统开始工作了。远程激光、中程导弹系统、近程自动机炮与机枪——一切运转良好。它们已准备好追踪并摧毁进入其控制区内的任何移动目标。 Vince：抱歉，先生，您刚才说的是\"任何\"吗？因为那艘游轮刚刚开始移动了。 Zachary：什么？操作员？！ 操作员：系统检测到移动！那艘游轮被一颗小陨石击中，正在机动规避！ Zachary：叫他们停下！关掉系统！ 操作员：我做不到，长官！系统已经锁定目标，正在计算射击诸元！ Zachary：不管你用什么办法——动手！马上！关掉它！ 操作员：我……做不到！ 武器开火声 外面刺眼的爆炸 Vince：你们都看到了，女士们先生们。没什么可看的了。我们作为人的职责现在就变得很明确：尽力去救那艘游轮上的人。那上面有几百人…… Zachary：这是破坏！破坏，你们听见了吗？！所有人都该知道——因为我们帮了核心（the Core）！他们不想让这种事发生——他们威胁过我们！我要说出真相！所有人都会知道！是破坏！"},{"id":174,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"“水族馆”行动后续（Operation Aquarium Follow-Up）","type":"MARKDOWN","html":"\u003cp\u003e哦，原来 Jake 说的是这个。我本以为会是类似军事行动之类的东西，但这个……一次试射期间的恐怖袭击……有意思，大概吧。\u003c/p\u003e\r\n\u003cp\u003e不过我应该多了解了解 Technofreedom 那帮人和他们干的事。我敢打赌那个叫 Vladimir 的家伙就是跟我谈过话的人。他看起来够可疑的。通常来说，更合理的做法是先多了解这个组织、搞点情报，然后再联系他……但就这一次，我直接去逼问他。直觉告诉我他会开口。\u003c/p\u003e\r\n\u003cp\u003e密码已破解：grv1204JJ\u003c/p\u003e\r\n\u003cp\u003e服务器地址：jj_private\u003c/p\u003e\r\n","text":"哦，原来 Jake 说的是这个。我本以为会是类似军事行动之类的东西，但这个……一次试射期间的恐怖袭击……有意思，大概吧。 不过我应该多了解了解 Technofreedom 那帮人和他们干的事。我敢打赌那个叫 Vladimir 的家伙就是跟我谈过话的人。他看起来够可疑的。通常来说，更合理的做法是先多了解这个组织、搞点情报，然后再联系他……但就这一次，我直接去逼问他。直觉告诉我他会开口。 密码已破解：grv1204JJ 服务器地址：jj private"},{"id":175,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"“水族馆”行动日志（Operation Aquarium Log）","type":"MARKDOWN","html":"\u003cp\u003e第 1 条\u003c/p\u003e\r\n\u003cp\u003e好吧，那么，“水族馆”行动。我肯定在新闻里听到过这个词。所以我有两个选择：要么把我以前搜过的所有旧资料翻一遍，要么直接试试那个“新闻档案”。\u003c/p\u003e\r\n\u003cp\u003e如果我没记错，那个“新闻档案”网站基本上就是一个带简易内置搜索引擎的数据库，而那搜索引擎可能根本不能用，因为网站早就关停有一段时间了。\u003c/p\u003e\r\n\u003cp\u003e那么。\u003c/p\u003e\r\n\u003cp\u003e第一步：找到网站\u003c/p\u003e\r\n\u003cp\u003e第二步：黑进网站\u003c/p\u003e\r\n\u003cp\u003e第三步：拿到信息\u003c/p\u003e\r\n\u003cp\u003e……\u003c/p\u003e\r\n\u003cp\u003e第五步：庆祝！\u003c/p\u003e\r\n\u003cp\u003e我只希望这条线索别把我拖进更大的麻烦里……但我骗谁呢……\u003c/p\u003e\r\n\u003cp\u003e第 2 条\u003c/p\u003e\r\n\u003cp\u003e好吧，这趟飞行可真够折腾的。\u003c/p\u003e\r\n\u003cp\u003e“阴谋”个鬼……\u003c/p\u003e\r\n\u003cp\u003eAurana 就是 Jean，我一直在为 Osiris 干活，还把自己卷进了那帮疯狂的“宇宙平衡者”里……凭这种运气我大概该去趟赌场。又或者我该尽可能地远离赌博。这大概取决于看问题的角度吧。\u003c/p\u003e\r\n\u003cp\u003e但说真的，把所有事情考虑进去，一切似乎才刚刚开始展开。\u003c/p\u003e\r\n\u003cp\u003e“那帮人为什么选我”这个问题仍然没有答案，而他们对这一点超级保密。我一进那个空间站就得跟 Aurana 谈谈。这件事必须解决，我不会再被蒙在鼓里了。\u003c/p\u003e\r\n\u003cp\u003e好的一面是——我结识了几个新朋友。他们全都可能对我的工作有用。显然我在分享信息时还是得小心，但他们的资源会非常有用。Gravers 和 Palimpest 看起来都是正派人。嗯，Palimpest 在跟 CDEA 合作，这点得留意，但除此之外……走着瞧吧。\u003c/p\u003e\r\n\u003cp\u003e另外，我已经掌握了大量关于 Private Club 这家 PMC 的信息，虽然目前他们还帮不上我，但等我到了空间站，情况可能会变。外面有打手总是好事，他们的人脉也可能派上用场。唯一的问题是，他们并不真正清楚我的参与，而且可能对此完全不高兴。所以这个“问题”得非常小心地处理。\u003c/p\u003e\r\n\u003cp\u003e至于整体局势……Jean \\\\ Aurana 这一整套事看起来就是纯粹的坏事。Osyris，不管他们是谁，都不是好人。我的调查揭出了他们大量不当行为，我看不出这怎么能叫“目的可以证明手段正当”。事情不该是这样运作的。\u003c/p\u003e\r\n\u003cp\u003e关于 Jack。那家伙……我发誓我觉得他是在扮演一个人渣角色。而且他演得非常好。但他很危险，而且他确实在扮演某个角色。以后这会是个问题，我确信，而我对此无能为力，至少目前如此。\u003c/p\u003e\r\n\u003cp\u003e所有这些“掌控宇宙”的话……可他又说自己“不是 CORE，至少不是你能想到的那个 CORE”。那到底是什么意思？CORE 只有一个……\u003c/p\u003e\r\n\u003cp\u003e我越想，头痛就越回来。研究那些谜团其实还挺管用的，但现在全都回来了。\u003c/p\u003e\r\n\u003cp\u003e还有，这个叫 Vladimir 的家伙，我确定我以前见过他，或者见过关于他的信息。Technofreedom 这个组织——这让我想起很多事。他们一直是殖民地上活动的主要破坏组织之一，对抗 AI。但如果他说那一切都只是幌子——那也许值得翻翻那些旧资料找更多线索。直觉告诉我他根本不是 Vladimir。\u003c/p\u003e\r\n\u003cp\u003e看起来 Vladimir 和 Jack 都会给我一些互相矛盾的东西，而我必须做出选择。这种选择通常都有后果，所以在做之前我真该好好权衡。而且，是的，只要我“仅仅”是为 History Unfolded 工作——我就还有做这个选择的余地，否则这个选择可能会被别人替我做掉。\u003c/p\u003e\r\n\u003cp\u003e总的来说，我干得相当出色，他们最好懂得欣赏。我在这摊烂事里越陷越深，说实话，在继续之前我需要一点私人时间，所以我会利用飞船抵达空间站前的剩余时间好好休息，为接下来的一切做好准备。还有几件事也许值得在我到达之前弄完，说不定会有点意思。\u003c/p\u003e\r\n","text":"第 1 条 好吧，那么，“水族馆”行动。我肯定在新闻里听到过这个词。所以我有两个选择：要么把我以前搜过的所有旧资料翻一遍，要么直接试试那个“新闻档案”。 如果我没记错，那个“新闻档案”网站基本上就是一个带简易内置搜索引擎的数据库，而那搜索引擎可能根本不能用，因为网站早就关停有一段时间了。 那么。 第一步：找到网站 第二步：黑进网站 第三步：拿到信息 …… 第五步：庆祝！ 我只希望这条线索别把我拖进更大的麻烦里……但我骗谁呢…… 第 2 条 好吧，这趟飞行可真够折腾的。 “阴谋”个鬼…… Aurana 就是 Jean，我一直在为 Osiris 干活，还把自己卷进了那帮疯狂的“宇宙平衡者”里……凭这种运气我大概该去趟赌场。又或者我该尽可能地远离赌博。这大概取决于看问题的角度吧。 但说真的，把所有事情考虑进去，一切似乎才刚刚开始展开。 “那帮人为什么选我”这个问题仍然没有答案，而他们对这一点超级保密。我一进那个空间站就得跟 Aurana 谈谈。这件事必须解决，我不会再被蒙在鼓里了。 好的一面是——我结识了几个新朋友。他们全都可能对我的工作有用。显然我在分享信息时还是得小心，但他们的资源会非常有用。Gravers 和 Palimpest 看起来都是正派人。嗯，Palimpest 在跟 CDEA 合作，这点得留意，但除此之外……走着瞧吧。 另外，我已经掌握了大量关于 Private Club 这家 PMC 的信息，虽然目前他们还帮不上我，但等我到了空间站，情况可能会变。外面有打手总是好事，他们的人脉也可能派上用场。唯一的问题是，他们并不真正清楚我的参与，而且可能对此完全不高兴。所以这个“问题”得非常小心地处理。 至于整体局势……Jean \\\\ Aurana 这一整套事看起来就是纯粹的坏事。Osyris，不管他们是谁，都不是好人。我的调查揭出了他们大量不当行为，我看不出这怎么能叫“目的可以证明手段正当”。事情不该是这样运作的。 关于 Jack。那家伙……我发誓我觉得他是在扮演一个人渣角色。而且他演得非常好。但他很危险，而且他确实在扮演某个角色。以后这会是个问题，我确信，而我对此无能为力，至少目前如此。 所有这些“掌控宇宙”的话……可他又说自己“不是 CORE，至少不是你能想到的那个 CORE”。那到底是什么意思？CORE 只有一个…… 我越想，头痛就越回来。研究那些谜团其实还挺管用的，但现在全都回来了。 还有，这个叫 Vladimir 的家伙，我确定我以前见过他，或者见过关于他的信息。Technofreedom 这个组织——这让我想起很多事。他们一直是殖民地上活动的主要破坏组织之一，对抗 AI。但如果他说那一切都只是幌子——那也许值得翻翻那些旧资料找更多线索。直觉告诉我他根本不是 Vladimir。 看起来 Vladimir 和 Jack 都会给我一些互相矛盾的东西，而我必须做出选择。这种选择通常都有后果，所以在做之前我真该好好权衡。而且，是的，只要我“仅仅”是为 History Unfolded 工作——我就还有做这个选择的余地，否则这个选择可能会被别人替我做掉。 总的来说，我干得相当出色，他们最好懂得欣赏。我在这摊烂事里越陷越深，说实话，在继续之前我需要一点私人时间，所以我会利用飞船抵达空间站前的剩余时间好好休息，为接下来的一切做好准备。还有几件事也许值得在我到达之前弄完，说不定会有点意思。"},{"id":176,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"OSN-LUNA17 扫描存档（OSN-LUNA17 Scan Archive）","type":"MARKDOWN","html":"\u003cp\u003e轨道监视节点 OSN-LUNA-17 扇区：DEBRIS_CLUSTER_07 密级：内部 / PMC\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e时间戳：22:14:03 目标编号：DC7-441-A 可见光：金属碎片团 红外：快速热衰减 电磁：可忽略 无线电：多峰弥散 状态：碎片场\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e时间戳：22:16:48 目标编号：DC7-442-H 可见光：舱体碎片（中型） 红外： T0=309K dT/min=-17K delta_core=+4K heterogeneity=0.21 电磁： baseline=19 pocket_index=0.12 无线电： peaks=2 状态：空舱体\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e时间戳：22:21:12 目标编号：DC7-447-X 可见光：穿梭机尺度结构 红外： T0=312K dT/min=-14K delta_core=+9K heterogeneity=0.48 hotspot_count=1 hotspot_persistence=64s 电磁： baseline=24 variance=18 pocket_index=0.51 pocket_count=2 无线电： peaks=3 peak_profile=[12ms, 37ms, 52ms] 状态：已标记 —— 异常\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e时间戳：22:22:02 目标编号：DC7-447-X 附加内部备注： 请求手动覆盖。 日志传输尝试。 检测到信号中断。\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e时间戳：22:23:40 目标编号：DC7-447-X 信号丢失。 遥测已改道。 存档结束 备注：部分遥测数据缺失。 可能在丢失之前被手动提取。\u003c/p\u003e\r\n","text":"轨道监视节点 OSN LUNA 17 扇区：DEBRIS CLUSTER 07 密级：内部 / PMC 时间戳：22:14:03 目标编号：DC7 441 A 可见光：金属碎片团 红外：快速热 战中，违法者很快被制服，议会安全部门据称无人员损失。基地内部发现了一个毒品实验室。 由于参与突袭的官员（所有姓名与军衔均属机密），该地点属于 CDEA（殖民地缉毒局）——一个在整个太阳系活动的最著名毒品卡特尔之一。 在查获的毒品与化学品中，发现了几个贴着“The Tantrum”标签的桶。最近巡逻站的毒品专家无法鉴定其中的化学成分，但该物质被认定活性极强且危险。据称这些桶已被隔离在安全库房中等待进一步调查。"},{"id":178,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Palimpsest 个人日志 1（Palimpsest Personal Log 1）","type":"MARKDOWN","html":"\u003cp\u003e个人日志 第 1 篇：\u003c/p\u003e\r\n\u003cp\u003e嗯，那份报告。我想知道那帮人到底是谁。我可能听说过他们，他们起的这个名字真够怪的。小孩在玩罪犯游戏？还是某些罪犯假扮成怪小孩。 那些化学品，我确定我以前碰到过。那些症状……那是什么来着……我的记忆老是在骗我。想起来了！The Tantrum！就是这个——就是那该死的毒品，我确定。那么多人因它而死，却没人知道它从哪来。也许这是我查清它的机会。我得继续挖下去。\u003c/p\u003e\r\n","text":"个人日志 第 1 篇： 嗯，那份报告。我想知道那帮人到底是谁。我可能听说过他们，他们起的这个名字真够怪的。小孩在玩罪犯游戏？还是某些罪犯假扮成怪小孩。 那些化学品，我确定我以前碰到过。那些症状……那是什么来着……我的记忆老是在骗我。想起来了！The Tantrum！就是这个——就是那该死的毒品，我确定。那么多人因它而死，却没人知道它从哪来。也许这是我查清它的机会。我得继续挖下去。"},{"id":179,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Palimpsest 个人日志 2（Palimpsest Personal Log 2）","type":"MARKDOWN","html":"\u003cp\u003e个人日志 第 2 篇：\u003c/p\u003e\r\n\u003cp\u003e卡特尔、PMC、怪人、政客……我到底把自己卷进了什么鬼东西。 至少我希望这些家伙会有用。\u003c/p\u003e\r\n\u003cp\u003e但他说的关于“分销”的事——看起来那些 PMC 的人比我以为的涉入更深。也许我得把调查转向那边。当然也可能又是条空线索，但走着瞧吧。\u003c/p\u003e\r\n\u003cp\u003e不知怎么的，我对这件事投入了感情。我老了……\u003c/p\u003e\r\n","text":"个人日志 第 2 篇： 卡特尔、PMC、怪人、政客……我到底把自己卷进了什么鬼东西。 至少我希望这些家伙会有用。 但他说的关于“分销”的事——看起来那些 PMC 的人比我以为的涉入更深。也许我得把调查转向那边。当然也可能又是条空线索，但走着瞧吧。 不知怎么的，我对这件事投入了感情。我老了……"},{"id":180,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"派对清单（party_list.txt）","type":"MARKDOWN","html":"\u003cp\u003e派对清单\u003c/p\u003e\r\n\u003cp\u003e酒水：\u003c/p\u003e\r\n\u003cp\u003e伏特加\u003c/p\u003e\r\n\u003cp\u003e啤酒\u003c/p\u003e\r\n\u003cp\u003e更多啤酒\u003c/p\u003e\r\n\u003cp\u003e那种甜的东西\u003c/p\u003e\r\n\u003cp\u003e人：\u003c/p\u003e\r\n\u003cp\u003e我们\u003c/p\u003e\r\n\u003cp\u003e女孩 x6\u003c/p\u003e\r\n\u003cp\u003e如果她们来了也许更多\u003c/p\u003e\r\n\u003cp\u003e音乐：\u003c/p\u003e\r\n\u003cp\u003e很响\u003c/p\u003e\r\n\u003cp\u003e不在乎\u003c/p\u003e\r\n\u003cp\u003e备注： 别让任何人在屋里开枪 上次天花板上留了个洞\u003c/p\u003e\r\n\u003cp\u003eanton 不来 又一次\u003c/p\u003e\r\n\u003cp\u003e结束后收拾 或者不收拾\u003c/p\u003e\r\n","text":"派对清单 酒水： 伏特加 啤酒 更多啤酒 那种甜的东西 人： 我们 女孩 x6 如果她们来了也许更多 音乐： 很响 不在乎 备注： 别让任何人在屋里开枪 上次天花板上留了个洞 anton 不来 又一次 结束后收拾 或者不收拾"},{"id":181,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"passhack.exe","type":"MARKDOWN","html":"\u003cp\u003e[PASSHACK v2.1]\u003c/p\u003e\r\n\u003cp\u003e暴力密码破解器\u003c/p\u003e\r\n\u003cp\u003e针对私人服务器认证优化\u003c/p\u003e\r\n\u003cp\u003e状态：就绪\u003c/p\u003e\r\n\u003cp\u003e目标：输入服务器地址以开始\u003c/p\u003e\r\n","text":"[PASSHACK v2.1] 暴力密码破解器 针对私人服务器认证优化 状态：就绪 目标：输入服务器地址以开始"},{"id":182,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"外围巡逻日志——完整转录（Perimeter Patrol Log — Full Transcript）","type":"MARKDOWN","html":"\u003cp\u003e音频日志：外围巡逻，语音通讯\u003c/p\u003e\r\n\u003cp\u003eDamian： Jimmy，你在附近吗？我听到你扇区附近有动静。\u003c/p\u003e\r\n\u003cp\u003eJimmy： 是啊，又是那该死的 hyppocrok。我发誓它又变异得更厉害了。\u003c/p\u003e\r\n\u003cp\u003eDamian： 你为什么这么叫它？它就是条基因改造的鳄鱼。\u003c/p\u003e\r\n\u003cp\u003eJimmy： 是啊。可它有他妈一头河马那么大。\u003c/p\u003e\r\n\u003cp\u003eDamian： 至少它不攻击我们。信息素什么的。\u003c/p\u003e\r\n\u003cp\u003eJimmy： 当然。可你想象一下，我们巡逻的时候开始下雨。\u003c/p\u003e\r\n\u003cp\u003eDamian： 上次那件事之后 Kevin 被吐了一身不是也活下来了吗？\u003c/p\u003e\r\n\u003cp\u003eJimmy： 我就是这个意思。一个失误你就完了。我们拿的钱可不够这个。\u003c/p\u003e\r\n\u003cp\u003eDamian： 我们拿的钱绰绰有余。别抱怨了。\u003c/p\u003e\r\n\u003cp\u003eJimmy： 嘿……怎么突然这么安静？\u003c/p\u003e\r\n\u003cp\u003eDamian： 不知道。我们去看看。\u003c/p\u003e\r\n\u003cp\u003e[两声消音枪响]\u003c/p\u003e\r\n\u003cp\u003eOmega 12： 长官，目标已清除。正前往下一个地点。全面清扫进行中。\u003c/p\u003e\r\n\u003cp\u003eOmega Actual： 收到。小心。我们不知道他们之前一直在讨论什么。该区域未检测到动物心跳。\u003c/p\u003e\r\n\u003cp\u003e[金属碰撞声与吸吮声]\u003c/p\u003e\r\n\u003cp\u003eOmega Actual： Omega 12，报告。 Omega 11、13，报告。\u003c/p\u003e\r\n\u003cp\u003e[无线电静默]\u003c/p\u003e\r\n\u003cp\u003eOmega Actual： 所有队伍，撤退，返回基地。\u003c/p\u003e\r\n\u003cp\u003e[数分钟后脚步声接近]\u003c/p\u003e\r\n\u003cp\u003e未知者： 该死的伙计们……别吃那个了，那是证据。留点东西给辨认。\u003c/p\u003e\r\n\u003cp\u003e机械声： 指挥官声音已确认，解除状态。\u003c/p\u003e\r\n\u003cp\u003e未知者： 机器鳄鱼。谁能想到。史上最值的一笔投资。\u003c/p\u003e\r\n\u003cp\u003e[录音结束]\u003c/p\u003e\r\n","text":"音频日志：外围巡逻，语音通讯 Damian： Jimmy，你在附近吗？我听到你扇区附近有动静。 Jimmy： 是啊，又是那该死的 hyppocrok。我发誓它又变异得更厉害了。 Damian： 你为什么这么叫它？它就是条基因改造的鳄鱼。 Jimmy： 是啊。可它有他妈一头河马那么大。 Damian： 至少它不攻击我们。信息素什么的。 Jimmy： 当然。可你想象一下，我们巡逻的时候开始下雨。 Damian： 上次那件事之后 Kevin 被吐了一身不是也活下来了吗？ Jimmy： 我就是这个意思。一个失误你就完了。我们拿的钱可不够这个。 Damian： 我们拿的钱绰绰有余。别抱怨了。 Jimmy： 嘿……怎么突然这么安静？ Damian： 不知道。我们去看看。 [两声消音枪响] Omega 12： 长官，目标已清除。正前往下一个地点。全面清扫进行中。 Omega Actual： 收到。小心。我们不知道他们之前一直在讨论什么。该区域未检测到动物心跳。 [金属碰撞声与吸吮声] Omega Actual： Omega 12，报告。 Omega 11、13，报告。 [无线电静默] Omega Actual： 所有队伍，撤退，返回基地。 [数分钟后脚步声接近] 未知者： 该死的伙计们……别吃那个了，那是证据。留点东西给辨认。 机械声： 指挥官声音已确认，解除状态。 未知者： 机器鳄鱼。谁能想到。史上最值的一笔投资。 [录音结束]"},{"id":183,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"私人日记（Personal Diary）","type":"MARKDOWN","html":"\u003cp\u003e今天我又看了一眼穹顶，觉得它比外面的真空压得更紧。 在它下面是那些旧竖井。至少在那下面，感觉可以真正地呼吸。\u003c/p\u003e\r\n\u003cp\u003e重力不在于坠落。而在于选择你落在哪里。\u003c/p\u003e\r\n\u003cp\u003e地面上的眼睛太多了。\u003c/p\u003e\r\n","text":"今天我又看了一眼穹顶，觉得它比外面的真空压得更紧。 在它下面是那些旧竖井。至少在那下面，感觉可以真正地呼吸。 重力不在于坠落。而在于选择你落在哪里。 地面上的眼睛太多了。"},{"id":184,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"警方报告：Jean Flanders（Police Report: Jean Flanders）","type":"MARKDOWN","html":"\u003cp\u003e\u003cstrong\u003e文件：警方报告，失踪人口\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eLuna，2250 年 8 月 18 日。 报告人：McMaffee 中士，驻地：\u003cdel\u003e月球扇区\u003c/del\u003e，CSPS 3 号站（议会安全巡逻站）。 \u003cdel\u003e失踪者——Jean Flanders\u003c/del\u003e，28 岁。 报案人——她的母亲，Suzanna Flanders，64 岁。 母亲称女儿与男友一同开车外出，男友名叫\u003cdel\u003e“\u003cstrong\u003eJack\u003c/strong\u003e”\u003c/del\u003e。女儿称要去最近的空间港“兜一圈”。最后一次被看到是在 65 号州际公路出口，朝私人发射场\u003cdel\u003e“Gargoyle”\u003c/del\u003e方向行驶。 调查： 该发射场为私人财产，由当地\u003cdel\u003e“Private Club”\u003c/del\u003e PMC 保护。无搜查令不得进入。当天高速公路沿线的摄像头部分故障，不过录像显示有一辆特征相符的车朝航天港方向行驶。 大门的保安称该车并未进入场区，暗示它可能在几公里前就转弯了。 围绕发射场的无人机区域扫描未显示车辆痕迹，但由于隐私保护干扰器，场区内部无法扫描。 同时派出的自动巡逻队也未在发射场外围发现该车痕迹。 解决方案：申请搜查令。 补充：\u003cdel\u003e2250 年 8 月 20 日。\u003c/del\u003e 已找到一名证人。 \u003cdel\u003e\u003cstrong\u003eVladimir Semakin\u003c/strong\u003e\u003c/del\u003e，54 岁，垃圾处理经理 证词： 我当时在忙自己的事，像平常一样待在发射场边上，这时一个疯子从警戒区里跑出来，眼睛瞪得老大。我觉得他好像在流口水什么的。 他一看见我就走过来，开始大喊类似“VLADIMIR——我们有罪犯——上马”的话。 我完全不懂那是什么意思。我也不认识那家伙，也不知道他怎么知道我的名字。不过我在那一带算是个常客，所以反正谁都认识我。 那家伙朝附近的山丘跑去。我因为担心他，就决定跟上去。 他好像在找什么东西。然后他真的推了一下石头，接着有个声音说“请说出你的姓名和军衔”。他无缘无故地开始大喊，但后来控制住了自己，说\u003cdel\u003e“James Fung，下士”\u003c/del\u003e。 然后一扇车库门滑开了。但他还没来得及进去，一辆\u003cdel\u003e“Private Club”\u003c/del\u003e巡逻车就开到了他面前。他们把他拖进车里带走了。 看起来他们没看到我。 他们走后我去看了看那个车库，但找不到他推过、转过或不管怎么弄过的那块石头。所以我就走了。 我可以指认那个地点，但请别把我的名字写进去。我不想惹麻烦。 \u003cstrong\u003e报告结束\u003c/strong\u003e \u003ca href=\"https://f-10bt-ust.corie\" target=\"_blank\" rel=\"noopener\"\u003ef-10bt-ust.corie\u003c/a\u003e\u003c/p\u003e\r\n","text":"文件：警方报告，失踪人口 Luna，2250 年 8 月 18 日。 报告人：McMaffee 中士，驻地：~~月球扇区~~，CSPS 3 号站（议会安全巡逻站）。 ~~失踪者——Jean Flanders~~，28 岁。 报案人——她的母亲，Suzanna Flanders，64 岁。 母亲称女儿与男友一同开车外出，男友名叫~~“ Jack ”~~。女儿称要去最近的空间港“兜一圈”。最后一次被看到是在 65 号州际公路出口，朝私人发射场~~“Gargoyle”~~方向行驶。 调查： 该发射场为私人财产，由当地~~“Private Club”~~ PMC 保护。无搜查令不得进入。当天高速公路沿线的摄像头部分故障，不过录像显示有一辆特征相符的车朝航天港方向行驶。 大门的保安称该车并未进入场区，暗示它可能在几公里前就转弯了。 围绕发射场的无人机区域扫描未显示车辆痕迹，但由于隐私保护干扰器，场区内部无法扫描。 同时派出的自动巡逻队也未在发射场外围发现该车痕迹。 解决方案：申请搜查令。 补充：~~2250 年 8 月 20 日。~~ 已找到一名证人。 ~~ Vladimir Semakin ~~，54 岁，垃圾处理经理 证词： 我当时在忙自己的事，像平常一样待在发射场边上，这时一个疯子从警戒区里跑出来，眼睛瞪得老大。我觉得他好像在流口水什么的。 他一看见我就走过来，开始大喊类似“VLADIMIR——我们有罪犯——上马”的话。 我完全不懂那是什么意思。我也不认识那家伙，也不知道他怎么知道我的名字。不过我在那一带算是个常客，所以反正谁都认识我。 那家伙朝附近的山丘跑去。我因为担心他，就决定跟上去。 他好像在找什么东西。然后他真的推了一下石头，接着有个声音说“请说出你的姓名和军衔”。他无缘无故地开始大喊，但后来控制住了自己，说~~“James Fung，下士”~~。 然后一扇车库门滑开了。但他还没来得及进去，一辆~~“Private Club”~~巡逻车就开到了他面前。他们把他拖进车里带走了。 看起来他们没看到我。 他们走后我去看了看那个车库，但找不到他推过、转过或不管怎么弄过的那块石头。所以我就走了。 我可以指认那个地点，但请别把我的名字写进去。我不想惹麻烦。 报告结束 [f 10bt ust.corie](https://f 10bt ust.corie)"},{"id":185,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Private Club 笔记（Private Club Notes）","type":"MARKDOWN","html":"\u003cp\u003e第 1 条\u003c/p\u003e\r\n\u003cp\u003ePrivate Club PMC 的网站。开始调查的地方，还算不错。Jane 是在他们的地盘上失踪的，而她的男友 Jack 为他们工作——这意味着踪迹应该就在附近某处，即便有人试图把痕迹清理干净。\u003c/p\u003e\r\n\u003cp\u003e我得尽可能彻底地翻一遍他们的网站。即使是公开版块也可能藏着细小的线索：任务报告、姓名、日期、呼号。如果运气好，我能找到一些关于他们场地内事件的内容，或者至少是间接提及。关键在于揪住任何与 Jack 有关的线索——确认他曾在名册上、他现在的派驻地点、他是否被调到其他地方去过。\u003c/p\u003e\r\n\u003cp\u003e如果我能收集到足够的信息，也许就能直接联系上他。或者至少找到一个那天在他附近的人。\u003c/p\u003e\r\n\u003cp\u003e第 2 条\u003c/p\u003e\r\n\u003cp\u003e我还在查 Jean Flander 的失踪案。对于她这样背景的人来说，就这样无影无踪地消失，实在说不通。\u003c/p\u003e\r\n\u003cp\u003e当局肯定会展开足够彻底的调查，把 Douglas Flanders 的女儿带回家，或者至少找到她。我不明白我能做到什么他们做不到的事，也不知道我到底漏掉了什么。\u003c/p\u003e\r\n\u003cp\u003e我卡住了。到目前为止掌握的信息只是引出了更多问题，这姑娘到底是谁？我越查她，她在我脑海中的形象就越模糊。也许问题就在这里？也许我脑子里的这个人根本不可能像她那样消失，因为那不是她？我需要重新框定思路，换个角度切入。\u003c/p\u003e\r\n\u003cp\u003e我能联系到、用来了解更多关于 Jean 的人有限。显然与她有关的只有她的父母。联系他们可能有帮助，也可能给我带来不必要的麻烦。我也许别无选择，只能直接去找源头。她母亲 Suzanne 从没停止过寻找她，也许我可以赌一把母爱，在不引起太大动静的情况下拿到一些答案。\u003c/p\u003e\r\n\u003cp\u003e第 3 条\u003c/p\u003e\r\n\u003cp\u003e所以这个叫“Jack”的家伙。真是个怪人。他先是帮着绑架那个女孩，然后又帮她逃走，之后还不知怎么地抹掉了她的踪迹。他甚至还能抵抗他们说的那种物质。 还有那家公司——“QQ Energy”，我大概得去多了解它，不过也许稍后再说。\u003c/p\u003e\r\n\u003cp\u003e搞清楚 Camp Vernon 是什么，会是很实在的一步。而如果运气好——也许值得把这家伙从那地方弄出来。他可能对我有用。再说，这个故事越来越复杂，我感觉 Vladimir 也没有把所有事都告诉我。\u003c/p\u003e\r\n\u003cp\u003e我想是时候联系我在 PALIMPEST 的新朋友们，再求他们帮个忙了。毫无疑问这会让我付出代价，但没别的办法。\u003c/p\u003e\r\n\u003cp\u003e第 4 条\u003c/p\u003e\r\n\u003cp\u003e有一个目标很突出。DC7-447-X。穿梭机尺度。热核心变化。电磁空腔。三重回波特征。\u003c/p\u003e\r\n\u003cp\u003e那不是随机碎片。有人手动标记了它。然后日志被截断了。\u003c/p\u003e\r\n\u003cp\u003e第 5 条\u003c/p\u003e\r\n\u003cp\u003e那家伙是谁？所有这些文件……我的天。伪装斗篷？能量武器？就算对 CORE 来说也很罕见。我得想办法找到他，但这大概根本不可能。\u003c/p\u003e\r\n\u003cp\u003e不过，我在想为什么所有这些文件会被留在基地里。就好像有人想让我找到它们。这事越来越诡异了。\u003c/p\u003e\r\n\u003cp\u003e我真不敢相信这一切，简直像在拍他妈的电影！这根本不可能。\u003c/p\u003e\r\n\u003cp\u003e但不管怎样，我得往好处想。我最后一条线索是“QQ Energy”。查清这家公司也许能让我找到那家伙。\u003c/p\u003e\r\n\u003cp\u003e如果那条路走不通，那我就只能指望运气，试试别的办法找她。\u003c/p\u003e\r\n","text":"第 1 条 Private Club PMC 的网站。开始调查的地方，还算不错。Jane 是在他们的地盘上失踪的，而她的男友 Jack 为他们工作——这意味着踪迹应该就在附近某处，即便有人试图把痕迹清理干净。 我得尽可能彻底地翻一遍他们的网站。即使是公开版块也可能藏着细小的线索：任务报告、姓名、日期、呼号。如果运气好，我能找到一些关于他们场地内事件的内容，或者至少是间接提及。关键在于揪住任何与 Jack 有关的线索——确认他曾在名册上、他现在的派驻地点、他是否被调到其他地方去过。 如果我能收集到足够的信息，也许就能直接联系上他。或者至少找到一个那天在他附近的人。 第 2 条 我还在查 Jean Flander 的失踪案。对于她这样背景的人来说，就这样无影无踪地消失，实在说不通。 当局肯定会展开足够彻底的调查，把 Douglas Flanders 的女儿带回家，或者至少找到她。我不明白我能做到什么他们做不到的事，也不知道我到底漏掉了什么。 我卡住了。到目前为止掌握的信息只是引出了更多问题，这姑娘到底是谁？我越查她，她在我脑海中的形象就越模糊。也许问题就在这里？也许我脑子里的这个人根本不可能像她那样消失，因为那不是她？我需要重新框定思路，换个角度切入。 我能联系到、用来了解更多关于 Jean 的人有限。显然与她有关的只有她的父母。联系他们可能有帮助，也可能给我带来不必要的麻烦。我也许别无选择，只能直接去找源头。她母亲 Suzanne 从没停止过寻找她，也许我可以赌一把母爱，在不引起太大动静的情况下拿到一些答案。 第 3 条 所以这个叫“Jack”的家伙。真是个怪人。他先是帮着绑架那个女孩，然后又帮她逃走，之后还不知怎么地抹掉了她的踪迹。他甚至还能抵抗他们说的那种物质。 还有那家公司——“QQ Energy”，我大概得去多了解它，不过也许稍后再说。 搞清楚 Camp Vernon 是什么，会是很实在的一步。而如果运气好——也许值得把这家伙从那地方弄出来。他可能对我有用。再说，这个故事越来越复杂，我感觉 Vladimir 也没有把所有事都告诉我。 我想是时候联系我在 PALIMPEST 的新朋友们，再求他们帮个忙了。毫无疑问这会让我付出代价，但没别的办法。 第 4 条 有一个目标很突出。DC7 447 X。穿梭机尺度。热核心变化。电磁空腔。三重回波特征。 那不是随机碎片。有人手动标记了它。然后日志被截断了。 第 5 条 那家伙是谁？所有这些文件……我的天。伪装斗篷？能量武器？就算对 CORE 来说也很罕见。我得想办法找到他，但这大概根本不可能。 不过，我在想为什么所有这些文件会被留在基地里。就好像有人想让我找到它们。这事越来越诡异了。 我真不敢相信这一切，简直像在拍他妈的电影！这根本不可能。 但不管怎样，我得往好处想。我最后一条线索是“QQ Energy”。查清这家公司也许能让我找到那家伙。 如果那条路走不通，那我就只能指望运气，试试别的办法找她。"},{"id":186,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Private Club 人事档案——James \"Jack\" Curtis Fung","type":"MARKDOWN","html":"\u003cp\u003e档案\u003c/p\u003e\r\n\u003cp\u003e这份人事档案把 Jack 呈现为一名获得勋章的 USOL 前陆战队员、小行星带老兵，但非官方部分描绘出更阴暗的画面：反暴乱工作、深蓝行动、极强的武器天赋，以及几乎不剩任何社会关系。心理筛查标记出 PTSD 与奇怪的记忆不稳定，其中还包括一些关于他不可能亲眼目睹之事件的说法。\u003c/p\u003e\r\n\u003cp\u003e审讯\u003c/p\u003e\r\n\u003cp\u003e在 Jack 未能把一名女孩交给 Private Club 的接手人之后，内务部对他进行了审讯。审讯期间，Donovan 给他注射了一种逼供物质。在药物压力下，他拒绝透露女孩的位置，但有一个回答漏了出来：QQ Energy。之后审讯官下令把他转送到 Camp Vernon，并销毁现场所有证据。\u003c/p\u003e\r\n\u003cblockquote\u003e审讯官：你为谁工作？Jack：……QQ Energy……什么……不……\u003c/blockquote\u003e\r\n","text":"档案 这份人事档案把 Jack 呈现为一名获得勋章的 USOL 前陆战队员、小行星带老兵，但非官方部分描绘出更阴暗的画面：反暴乱工作、深蓝行动、极强的武器天赋，以及几乎不剩任何社会关系。心理筛查标记出 PTSD 与奇怪的记忆不稳定，其中还包括一些关于他不可能亲眼目睹之事件的说法。 审讯 在 Jack 未能把一名女孩交给 Private Club 的接手人之后，内务部对他进行了审讯。审讯期间，Donovan 给他注射了一种逼供物质。在药物压力下，他拒绝透露女孩的位置，但有一个回答漏了出来：QQ Energy。之后审讯官下令把他转送到 Camp Vernon，并销毁现场所有证据。 审讯官：你为谁工作？Jack：……QQ Energy……什么……不……"},{"id":187,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"私人请求记录（private_requests_thread.txt）","type":"MARKDOWN","html":"\u003cp\u003e私人请求记录 受限访问\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我要把她从系统里移除。\u003c/p\u003e\r\n\u003cp\u003e管理层： 请说明你的请求。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我不想她再待在那儿了。\u003c/p\u003e\r\n\u003cp\u003e管理层： 陪侍并不属于任何人。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我知道。 我不是那个意思。\u003c/p\u003e\r\n\u003cp\u003e管理层： 那就解释。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 她不该待在那儿。\u003c/p\u003e\r\n\u003cp\u003e管理层： 你的理由已记录。 你的语气没有必要。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 你不明白。\u003c/p\u003e\r\n\u003cp\u003e管理层： 我们非常明白。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我会补偿。 全额。\u003c/p\u003e\r\n\u003cp\u003e管理层： 这不是钱的问题。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 那是什么问题？\u003c/p\u003e\r\n\u003cp\u003e管理层： 控制。 可预测性。 沉默。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 这些我都能提供。\u003c/p\u003e\r\n\u003cp\u003e管理层： 你已经提供了。 在你自己都没意识到的情况下。\u003c/p\u003e\r\n","text":"私人请求记录 受限访问 Antonovich： 我要把她从系统里移除。 管理层： 请说明你的请求。 Antonovich： 我不想她再待在那儿了。 管理层： 陪侍并不属于任何人。 Antonovich： 我知道。 我不是那个意思。 管理层： 那就解释。 Antonovich： 她不该待在那儿。 管理层： 你的理由已记录。 你的语气没有必要。 Antonovich： 你不明白。 管理层： 我们非常明白。 Antonovich： 我会补偿。 全额。 管理层： 这不是钱的问题。 Antonovich： 那是什么问题？ 管理层： 控制。 可预测性。 沉默。 Antonovich： 这些我都能提供。 管理层： 你已经提供了。 在你自己都没意识到的情况下。"},{"id":188,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"“黑太阳”计划（Project Schwarze Sonne）","type":"MARKDOWN","html":"\u003cp\u003e客户数据档案\u003c/p\u003e\r\n\u003cp\u003eGerhard Zonge 教授与 Samuel Packston 之间的邮件通信描述了一件所谓“黑太阳”（Black Sun）装置的交付。早期的一次意外激活造成了震颤、恍惚状态与神经扭曲。Zonge 仍计划在一场私人 gamma 派对上展示该装置，而隐藏的手动章节则暗示有更危险的参数被刻意保护了起来。\u003c/p\u003e\r\n\u003cp\u003eGamma 派对事件\u003c/p\u003e\r\n\u003cp\u003e派对录像显示，激活之前有十五名宾客聚集在规定半径之内。接下来是近十分钟的尖叫、失控与明显的神经崩溃。装置自带的通报器宣布，所有目标个体均已受到影响，任务目标已达成。\u003c/p\u003e\r\n\u003cblockquote\u003e神经修饰器正在停止。效果已达成。目标个体——15，受影响个体——15。任务完成。\u003c/blockquote\u003e\r\n\u003cp\u003e内部评估\u003c/p\u003e\r\n\u003cp\u003e后续报告清楚地表明，这次行动并不是为了杀人。较年轻的对象被送进医院，中年对象遭受严重神经损伤，而年长者则彻底崩溃。核心结论是：原型机运行在净化模式，而不是受控灌输模式。随后 Feud 医生被命令继续实验，直到该效果变得稳定、可重复，并可用于隐蔽的大规模控制。\u003c/p\u003e\r\n\u003cp\u003e补充简报\u003c/p\u003e\r\n\u003cp\u003e一份机密项目笔记将“黑太阳”定位于 Ganymede（木卫三），并将其描述为一台旨在把人类脑波模式改写为服从的微波发射器。动物实验早已灾难性失败，但项目仍借助来自一处火星设施的改装电源单元，转向直接的人体试验。Feud 的个人日志表明，他已不再相信该装置能产生任何控制，它只会抹除自我。\u003c/p\u003e\r\n","text":"客户数据档案 Gerhard Zonge 教授与 Samuel Packston 之间的邮件通信描述了一件所谓“黑太阳”（Black Sun）装置的交付。早期的一次意外激活造成了震颤、恍惚状态与神经扭曲。Zonge 仍计划在一场私人 gamma 派对上展示该装置，而隐藏的手动章节则暗示有更危险的参数被刻意保护了起来。 Gamma 派对事件 派对录像显示，激活之前有十五名宾客聚集在规定半径之内。接下来是近十分钟的尖叫、失控与明显的神经崩溃。装置自带的通报器宣布，所有目标个体均已受到影响，任务目标已达成。 神经修饰器正在停止。效果已达成。目标个体——15，受影响个体——15。任务完成。 内部评估 后续报告清楚地表明，这次行动并不是为了杀人。较年轻的对象被送进医院，中年对象遭受严重神经损伤，而年长者则彻底崩溃。核心结论是：原型机运行在净化模式，而不是受控灌输模式。随后 Feud 医生被命令继续实验，直到该效果变得稳定、可重复，并可用于隐蔽的大规模控制。 补充简报 一份机密项目笔记将“黑太阳”定位于 Ganymede（木卫三），并将其描述为一台旨在把人类脑波模式改写为服从的微波发射器。动物实验早已灾难性失败，但项目仍借助来自一处火星设施的改装电源单元，转向直接的人体试验。Feud 的个人日志表明，他已不再相信该装置能产生任何控制，它只会抹除自我。"},{"id":189,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"季度损失报告（Quarterly Loss Report）","type":"MARKDOWN","html":"\u003cp\u003e季度损失报告 内部财务摘要\u003c/p\u003e\r\n\u003cp\u003e报告期：第二季度\u003c/p\u003e\r\n\u003cp\u003e事件编号：V-7712\u003c/p\u003e\r\n\u003cp\u003e直接损失： — 供应商付款：未追回 — 物流开销：已吞下 — 安保承包商费用：不可退还\u003c/p\u003e\r\n\u003cp\u003e间接影响： — 未记录客户取消 — 未检测到声誉受损 — 无运营中断\u003c/p\u003e\r\n\u003cp\u003e评估： 损失在可接受参数范围内。\u003c/p\u003e\r\n\u003cp\u003e备注： — 风险经过计算 — 暴露是有限的 — 结果无需纠正\u003c/p\u003e\r\n\u003cp\u003e结论： 该事件不影响长期预测。\u003c/p\u003e\r\n\u003cp\u003e不建议采取进一步行动。\u003c/p\u003e\r\n","text":"季度损失报告 内部财务摘要 报告期：第二季度 事件编号：V 7712 直接损失： — 供应商付款：未追回 — 物流开销：已吞下 — 安保承包商费用：不可退还 间接影响： — 未记录客户取消 — 未检测到声誉受损 — 无运营中断 评估： 损失在可接受参数范围内。 备注： — 风险经过计算 — 暴露是有限的 — 结果无需纠正 结论： 该事件不影响长期预测。 不建议采取进一步行动。"},{"id":190,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"R0OT_60G 协议说明（R0OT_60G Protocol Note）","type":"MARKDOWN","html":"\u003cp\u003e可疑协议，检查进行中\u003c/p\u003e\r\n","text":"可疑协议，检查进行中"},{"id":191,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"R0OT_60G","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img r\n\u003cp\u003e对象：Emilia（C-034） 原状态：在役（受限） 当前状态：已移除\u003c/p\u003e\r\n\u003cp\u003e原因： 私人安排。\u003c/p\u003e\r\n\u003cp\u003e程序： — 对象已从在役轮换名单中移除 — 对象已移交外部监管 — 禁止任何进一步接触\u003c/p\u003e\r\n\u003cp\u003e备注： 此项处置满足了所有相关方的要求。\u003c/p\u003e\r\n\u003cp\u003e该对象不再属于 Velluto 的责任范围。\u003c/p\u003e\r\n\u003cp\u003e今后的文件中不得引用本档案。\u003c/p\u003e\r\n","text":"转移记录 对象：Emilia（C 034） 原状态：在役（受限） 当前状态：已移除 原因： 私人安排。 程序： — 对象已从在役轮换名单中移除 — 对象已移交外部监管 — 禁止任何进一步接触 备注： 此项处置满足了所有相关方的要求。 该对象不再属于 Velluto 的责任范围。 今后的文件中不得引用本档案。"},{"id":226,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"搜救队报告（Search Party Report）","type":"MARKDOWN","html":"\u003cp\u003e搜救队报告 2250 年 8 月 21 日 \u003cdel\u003eCassius Maelstrom 队长\u003c/del\u003e，\u003cdel\u003e月球辖区\u003c/del\u003e，CSCH（议会安全中央枢纽） 在取得证人陈述之后，一支搜救队已被派出。抵达目标区域后，对该地点进行了彻底扫描，发现了一座内部有空洞的人造土丘。在其中找到了一辆部分被拆解的车辆。车辆的大部分零件已被拆除，但残骸符合“女儿”最后一次被目击时所乘车辆的描述。 在车旁发现了若干装有某种\u003cdel\u003e酸液\u003c/del\u003e的桶。初步分析显示为某种\u003cdel\u003e酸液\u003c/del\u003e。仍需进一步检测。桶上还检出了多组 DNA 的痕迹。 本案嫌疑人——\u003cdel\u003eJames Curtis Fung，下士\u003c/del\u003e。退伍军人，企业武装，PMC 操作员。下落不明。 发射场已被封锁，现场无人员。自动安保系统已武装，进入需要额外密码。需进一步调查并对该产业进行清查。 报告结束\u003c/p\u003e\r\n","text":"搜救队报告 2250 年 8 月 21 日 ~~Cassius Maelstrom 队长~~，~~月球辖区~~，CSCH（议会安全中央枢纽） 在取得证人陈述之后，一支搜救队已被派出。抵达目标区域后，对该地点进行了彻底扫描，发现了一座内部有空洞的人造土丘。在其中找到了一辆部分被拆解的车辆。车辆的大部分零件已被拆除，但残骸符合“女儿”最后一次被目击时所乘车辆的描述。 在车旁发现了若干装有某种~~酸液~~的桶。初步分析显示为某种~~酸液~~。仍需进一步检测。桶上还检出了多组 DNA 的痕迹。 本案嫌疑人——~~James Curtis Fung，下士~~。退伍军人，企业武装，PMC 操作员。下落不明。 发射场已被封锁，现场无人员。自动安保系统已武装，进入需要额外密码。需进一步调查并对该产业进行清查。 报告结束"},{"id":227,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Sector 7 合规备忘录（Sector 7 Compliance Memo）","type":"MARKDOWN","html":"\u003cp\u003eMO CHEMICALS 工业监管与环境系统部 ────────────────────────────────────────\u003c/p\u003e\r\n\u003cp\u003e内部备忘录 IV 密级：四级 – 运营风险 分发：执行运营部、环境合规部、现场安保指挥部 日期：[已隐去] 参考：Sector 7 废物储存审查\u003c/p\u003e\r\n\u003cp\u003e主题：废物储存合规性 – Sector 7 封存场\u003c/p\u003e\r\n\u003cp\u003e本备忘录为正式通知，涉及在 Sector 7 的废物储存与封存作业中观察到的不合规情形。\u003c/p\u003e\r\n\u003cp\u003e一项初步合规审查查明，入库申报、桶体标记与场地定位记录之间存在不符之处。虽然这些发现按分类仍属行政性质，但多项异常叠加后，已将本事项提升为潜在的运营风险，有待执行层复核。\u003c/p\u003e\r\n\u003cp\u003e入库与标识不符\u003c/p\u003e\r\n\u003cp\u003e对批次范围 A7-1154 至 A7-1193 内污染物单元的例行检查发现如下情况：\u003c/p\u003e\r\n\u003cp\u003e4 个桶登记为标准工业酸液，却检测出与申报入库成分不符的化合物残留。\u003c/p\u003e\r\n\u003cp\u003e2 个单元出现轻微密封破损，符合不当机械搬运所致的特征。\u003c/p\u003e\r\n\u003cp\u003e3 个单元在场地范围内被实际移位，却没有相应的数字移动记录。\u003c/p\u003e\r\n\u003cp\u003e2 个单元在随机实物盘点中未能找到。\u003c/p\u003e\r\n\u003cp\u003e所检出的化合物偏差目前尚未超过工业分类的法定毒性阈值；但与申报来源成分的偏离仍须核对，以维持许可保护。\u003c/p\u003e\r\n\u003cp\u003e环境合规部建议立即对入库文件与实物库存进行核对。\u003c/p\u003e\r\n\u003cp\u003e场地安保观察\u003c/p\u003e\r\n\u003cp\u003e现场安保指挥部在过去一个季度提交了两份事件摘要，记录了以下情况：\u003c/p\u003e\r\n\u003cp\u003eSector 7 废物储存场毗邻的周界围栏受到扰动。\u003c/p\u003e\r\n\u003cp\u003e存在试图接触桶体的迹象，包括撬痕与被移位的封存单元。\u003c/p\u003e\r\n\u003cp\u003e化学储存区附近出现未登记人员。\u003c/p\u003e\r\n\u003cp\u003e安保评估认为存在试图取走物料的可能；动机尚不明确。目前尚无已确认的危险物料外流记录。\u003c/p\u003e\r\n\u003cp\u003e周界反复受到干扰，一旦发生独立审计，将增加责任风险。\u003c/p\u003e\r\n\u003cp\u003e监管风险评估\u003c/p\u003e\r\n\u003cp\u003e以下情况叠加：\u003c/p\u003e\r\n\u003cp\u003e未标识的污染物偏差\u003c/p\u003e\r\n\u003cp\u003e不完整的移动记录\u003c/p\u003e\r\n\u003cp\u003e未受控的周界出入\u003c/p\u003e\r\n\u003cp\u003e可能招致市政监管机构或外部审计人员的审查。\u003c/p\u003e\r\n\u003cp\u003e鉴于 Sector 7 化学品处理作业的敏感性，建议领导层将本事项作为预防性风险缓释处理，而非被动应对式合规。\u003c/p\u003e\r\n\u003cp\u003e建议措施\u003c/p\u003e\r\n\u003cp\u003e对 Sector 7 过去 90 天的废物入库文件进行全面审计。\u003c/p\u003e\r\n\u003cp\u003e将污染物档案与原始来源清单进行核对。\u003c/p\u003e\r\n\u003cp\u003e审查非工作时段出入记录与摄像头在线率报告。\u003c/p\u003e\r\n\u003cp\u003e确认处置承包商遵守监管链文件要求。\u003c/p\u003e\r\n\u003cp\u003e考虑在核对完成前暂停酌情处置。\u003c/p\u003e\r\n\u003cp\u003e环境合规部进一步建议，在库存偏差解决之前，将上述发现的讨论范围限制在四级及以上密级人员。\u003c/p\u003e\r\n\u003cp\u003e归档人： 工业监管与环境系统部\u003c/p\u003e\r\n\u003cp\u003e[数字扫描签名 – 已隐去]\u003c/p\u003e\r\n\u003cp\u003eMO CHEMICALS 以受控流程保障运营完整性\u003c/p\u003e\r\n","text":"MO CHEMICALS 工业监管与环境系统部 ──────────────────────────────────────── 内部备忘录 IV 密级：四级 – 运营风险 分发：执行运营部、环境合规部、现场安保指挥部 日期：[已隐去] 参考：Sector 7 废物储存审查 主题：废物储存合规性 – Sector 7 封存场 本备忘录为正式通知，涉及在 Sector 7 的废物储存与封存作业中观察到的不合规情形。 一项初步合规审查查明，入库申报、桶体标记与场地定位记录之间存在不符之处。虽然这些发现按分类仍属行政性质，但多项异常叠加后，已将本事项提升为潜在的运营风险，有待执行层复核。 入库与标识不符 对批次范围 A7 1154 至 A7 1193 内污染物单元的例行检查发现如下情况： 4 个桶登记为标准工业酸液，却检测出与申报入库成分不符的化合物残留。 2 个单元出现轻微密封破损，符合不当机械搬运所致的特征。 3 个单元在场地范围内被实际移位，却没有相应的数字移动记录。 2 个单元在随机实物盘点中未能找到。 所检出的化合物偏差目前尚未超过工业分类的法定毒性阈值；但与申报来源成分的偏离仍须核对，以维持许可保护。 环境合规部建议立即对入库文件与实物库存进行核对。 场地安保观察 现场安保指挥部在过去一个季度提交了两份事件摘要，记录了以下情况： Sector 7 废物储存场毗邻的周界围栏受到扰动。 存在试图接触桶体的迹象，包括撬痕与被移位的封存单元。 化学储存区附近出现未登记人员。 安保评估认为存在试图取走物料的可能；动机尚不明确。目前尚无已确认的危险物料外流记录。 周界反复受到干扰，一旦发生独立审计，将增加责任风险。 监管风险评估 以下情况叠加： 未标识的污染物偏差 不完整的移动记录 未受控的周界出入 可能招致市政监管机构或外部审计人员的审查。 鉴于 Sector 7 化学品处理作业的敏感性，建议领导层将本事项作为预防性风险缓释处理，而非被动应对式合规。 建议措施 对 Sector 7 过去 90 天的废物入库文件进行全面审计。 将污染物档案与原始来源清单进行核对。 审查非工作时段出入记录与摄像头在线率报告。 确认处置承包商遵守监管链文件要求。 考虑在核对完成前暂停酌情处置。 环境合规部进一步建议，在库存偏差解决之前，将上述发现的讨论范围限制在四级及以上密级人员。 归档人： 工业监管与环境系统部 [数字扫描签名 – 已隐去] MO CHEMICALS 以受控流程保障运营完整性"},{"id":228,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Sector 7 场地储存日志（Sector 7 Yard Storage Log）","type":"MARKDOWN","html":"\u003cp\u003e场地储存日志 – SECTOR 7 主管：H.Wells 合规同步：待处理\u003c/p\u003e\r\n\u003cp\u003e批次范围：A7-1154 – A7-1193 物料：工业酸液 储存区：C 场地 / 外围\u003c/p\u003e\r\n\u003cp\u003e检查备注：\u003c/p\u003e\r\n\u003cp\u003e4 个单元 – 化合物残留与入库申报不符 2 个单元 – 轻微密封破损 3 个单元 – 未经数字移动记录即被移位 2 个单元 – 实物盘点时未找到\u003c/p\u003e\r\n\u003cp\u003e安保观察：\u003c/p\u003e\r\n\u003cp\u003e围栏扰动 – 南侧周界 3 个桶上有撬痕 检测到未授权人员出现（30 天内 3 起事件）\u003c/p\u003e\r\n\u003cp\u003e已采取的措施：\u003c/p\u003e\r\n\u003cp\u003e入库日志核对延迟 独立环境取样推迟 处置暂停：临时\u003c/p\u003e\r\n\u003cp\u003e授权：H.Wells\u003c/p\u003e\r\n","text":"场地储存日志 – SECTOR 7 主管：H.Wells 合规同步：待处理 批次范围：A7 1154 – A7 1193 物料：工业酸液 储存区：C 场地 / 外围 检查备注： 4 个单元 – 化合物残留与入库申报不符 2 个单元 – 轻微密封破损 3 个单元 – 未经数字移动记录即被移位 2 个单元 – 实物盘点时未找到 安保观察： 围栏扰动 – 南侧周界 3 个桶上有撬痕 检测到未授权人员出现（30 天内 3 起事件） 已采取的措施： 入库日志核对延迟 独立环境取样推迟 处置暂停：临时 授权：H.Wells"},{"id":229,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"安保服务合同（security_contract.txt）","type":"MARKDOWN","html":"\u003cp\u003e安保服务协议 （摘录）\u003c/p\u003e\r\n\u003cp\u003e承包商：[已隐去 PMC
