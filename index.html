03e比例（SCALE）：1:600（A 视图）｜1:300（B 视图）｜1:50（C 视图）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e细节表（DETAILS）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| 视图 | 长度 | 宽度 | | --- | --- | --- | | A | 18000 mm | 410 mm | | B | 6000 mm | 410 mm | | C | 500 mm | 410 mm |\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e日期（DATE）：2191 年 8 月 21 日，星期六\u003c/li\u003e\r\n\u003cli\u003e设计方（DESIGNED BY）：CORE ARMS\u003c/li\u003e\r\n\u003cli\u003e右下标：COR3\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e各视图旁另有多处尺寸标注（单位 mm，可见者有 18000、6000、500、1130、1540、1600、3180、1125、440、295、330 等）。\u003c/p\u003e\r\n\u003cp\u003e（注：本页配图为 ARTEMIS 项目弹药图纸，画面中未出现任何密码、账号或口令内容。）\u003c/p\u003e\r\n","text":"![](../img/948F2F09C07477AA.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 图纸标题栏 项目（PROJECT）：ARTEMIS 原型（PROTOTYPE）：Ammunition prototype C16（弹药原型 C16） 图纸编号（Blueprint）：771 B 比例（SCALE）：1:600（A 视图）｜1:300（B 视图）｜1:50（C 视图） 细节表（DETAILS） | 视图 | 长度 | 宽度 | | | | | | A | 18000 mm | 410 mm | | B | 6000 mm | 410 mm | | C | 500 mm | 410 mm | 日期（DATE）：2191 年 8 月 21 日，星期六 设计方（DESIGNED BY）：CORE ARMS 右下标：COR3 各视图旁另有多处尺寸标注（单位 mm，可见者有 18000、6000、500、1130、1540、1600、3180、1125、440、295、330 等）。 （注：本页配图为 ARTEMIS 项目弹药图纸，画面中未出现任何密码、账号或口令内容。）"},{"id":110,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"个人日志（Personal Log）","type":"MARKDOWN","html":"\u003cp\u003e个人日志\u003c/p\u003e\r\n\u003cp\u003e2251 年 5 月 17 日\u003c/p\u003e\r\n\u003cp\u003e今天是我作为“History Unfolded”私家调查员的第一天。\u003c/p\u003e\r\n\u003cp\u003e合同已经签了，各项条款也都谈妥了。但我至今仍为这事办得如此顺利而感到震惊。那些人……那位“经办人”——他们甚至没问多少问题。看起来他们认识我已经有相当长一段时间了。还有那个叫奥拉娜的小妞……美得惊人，却也危险。她让我脊背发凉。\u003c/p\u003e\r\n\u003cp\u003e我到底是怎么走到这一步的……这几天我一直在问自己。大概是想追求些新鲜而神秘的东西，有时就会把人带到这种冒险里。\u003c/p\u003e\r\n\u003cp\u003e那份“合同”的主要目标，似乎是揭开一些陈年谜团。但我怀疑，这些东西对我的雇主来说是否还算秘密，因为他们看上去消息极为灵通。几乎对大多数事件都了解得很深。\u003c/p\u003e\r\n\u003cp\u003e也许他们是在寻求另一种看法，也许他们从我的性格与技能里发现了什么有趣之处……老实说，我都不确定自己是否想知道。\u003c/p\u003e\r\n\u003cp\u003e对我来说，这是个展示自己的机会。这种“私家侦探”的活儿让我兴奋。再说，从他们粗略描述的那些事件来看，似乎都是相当大的事。我纳闷自己以前怎么没听说过。\u003c/p\u003e\r\n\u003cp\u003e毕竟，经办人说过“他们认为这一切都有关联”，一个经典得近乎完美的阴谋论。要不是她的神情，我本来不会相信她说的任何话。她看上去不像个疯子，倒像个冷静而专注的人。要我猜，是军人出身，甚至可能更严肃些。\u003c/p\u003e\r\n\u003cp\u003e但总的来说，我完全不知道自己是在为谁干活。那家公司只是个空壳，这一点显而易见，但他们究竟是谁……我真的该在意吗？\u003c/p\u003e\r\n\u003cp\u003e毕竟，那份合同是通过 CORIE 就业中心发来的，所以是官方批准过的。这至少算是点安慰。\u003c/p\u003e\r\n\u003cp\u003e不过我得保持警觉，毕竟这是我第一次和这些人共事，而且老实说，我开始觉得这一切可能只是对我能力的一次测验。\u003c/p\u003e\r\n\u003cp\u003e我把一些想法跟几位“美好旧时光”的老朋友说了，他们都说我多半不该接。好吧，反正也没别的事可做，那为什么不呢。\u003c/p\u003e\r\n\u003cp\u003e唯一真正让我在意的是那份合同——它太含糊，连他们跟我提过的报酬数目都没写进去。这真的很奇怪。但愿这些人在我们谈过的所有条款与条件上都能守信用。不知怎的，我相信他们会。\u003c/p\u003e\r\n\u003cp\u003e也许这终于就是我一直在找的东西，也许那份合同会把我的生活变得更好一些……就这一次也好。\u003c/p\u003e\r\n","text":"个人日志 2251 年 5 月 17 日 今天是我作为“History Unfolded”私家调查员的第一天。 合同已经签了，各项条款也都谈妥了。但我至今仍为这事办得如此顺利而感到震惊。那些人……那位“经办人”——他们甚至没问多少问题。看起来他们认识我已经有相当长一段时间了。还有那个叫奥拉娜的小妞……美得惊人，却也危险。她让我脊背发凉。 我到底是怎么走到这一步的……这几天我一直在问自己。大概是想追求些新鲜而神秘的东西，有时就会把人带到这种冒险里。 那份“合同”的主要目标，似乎是揭开一些陈年谜团。但我怀疑，这些东西对我的雇主来说是否还算秘密，因为他们看上去消息极为灵通。几乎对大多数事件都了解得很深。 也许他们是在寻求另一种看法，也许他们从我的性格与技能里发现了什么有趣之处……老实说，我都不确定自己是否想知道。 对我来说，这是个展示自己的机会。这种“私家侦探”的活儿让我兴奋。再说，从他们粗略描述的那些事件来看，似乎都是相当大的事。我纳闷自己以前怎么没听说过。 毕竟，经办人说过“他们认为这一切都有关联”，一个经典得近乎完美的阴谋论。要不是她的神情，我本来不会相信她说的任何话。她看上去不像个疯子，倒像个冷静而专注的人。要我猜，是军人出身，甚至可能更严肃些。 但总的来说，我完全不知道自己是在为谁干活。那家公司只是个空壳，这一点显而易见，但他们究竟是谁……我真的该在意吗？ 毕竟，那份合同是通过 CORIE 就业中心发来的，所以是官方批准过的。这至少算是点安慰。 不过我得保持警觉，毕竟这是我第一次和这些人共事，而且老实说，我开始觉得这一切可能只是对我能力的一次测验。 我把一些想法跟几位“美好旧时光”的老朋友说了，他们都说我多半不该接。好吧，反正也没别的事可做，那为什么不呢。 唯一真正让我在意的是那份合同——它太含糊，连他们跟我提过的报酬数目都没写进去。这真的很奇怪。但愿这些人在我们谈过的所有条款与条件上都能守信用。不知怎的，我相信他们会。 也许这终于就是我一直在找的东西，也许那份合同会把我的生活变得更好一些……就这一次也好。"},{"id":111,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"朊病毒中和（Prion Neutralization）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/6B4D9A6C08BDFF48.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eASTROCROP\u003c/strong\u003e（徽标：水滴形图案）\u003c/p\u003e\r\n\u003cp\u003e| 项目 | 内容 | | --- | --- | | 标题 | Prion Neutralization（朊病毒中和） | | 提交人（PRESENTED BY） | Biochemical division（生化部）\u0026lt;br\u0026gt;Doctor A. Corvin，personal note 71（个人笔记 71） |\u003c/p\u003e\r\n\u003cblockquote\u003e「我们做过的实验终于有了回报。我们成功阻断了修饰 PrP（modifier PrPs）的那些负面效应。经过多年实验，这一刻终于到来了。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e但可以说，这仅仅是因为我们从 CORE Tech 及其\"高级实验场\"（advanced experimental site）得到的数据。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e我们送去了大约 50 份哺乳动物组织样本，不止这些……但只退回了 5 份，连同数据一起。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e他们声称，他们提供的解决方案能治愈人类历史上所有与蛋白质相关的疾病。我对此持怀疑态度，但也许吧……\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e硬币的另一面意味着，基本上所有哺乳动物的肉都可能被用于餐食。我是说，全部（ALL）。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e我想可以说这是件好事，尤其是对那些遭受饥荒、只能依赖外部供应链的殖民地……但尽管如此，这可能导致严重的伦理问题。而我宁愿完全不参与其中。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e这意味着我将把我的研究上交上级，在那之后……就不关我的事了。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e\u003c/blockquote\u003e\r\n\u003cblockquote\u003e愿主怜悯我们的灵魂。」\u003c/blockquote\u003e\r\n","text":"![](../img/6B4D9A6C08BDFF48.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 ASTROCROP （徽标：水滴形图案） | 项目 | 内容 | | | | | 标题 | Prion Neutralization（朊病毒中和） | | 提交人（PRESENTED BY） | Biochemical division（生化部）\u003cbr Doctor A. Corvin，personal note 71（个人笔记 71） | 「我们做过的实验终于有了回报。我们成功阻断了修饰 PrP（modifier PrPs）的那些负面效应。经过多年实验，这一刻终于到来了。 但可以说，这仅仅是因为我们从 CORE Tech 及其\"高级实验场\"（advanced experimental site）得到的数据。 我们送去了大约 50 份哺乳动物组织样本，不止这些……但只退回了 5 份，连同数据一起。 他们声称，他们提供的解决方案能治愈人类历史上所有与蛋白质相关的疾病。我对此持怀疑态度，但也许吧…… 硬币的另一面意味着，基本上所有哺乳动物的肉都可能被用于餐食。我是说，全部（ALL）。 我想可以说这是件好事，尤其是对那些遭受饥荒、只能依赖外部供应链的殖民地……但尽管如此，这可能导致严重的伦理问题。而我宁愿完全不参与其中。 这意味着我将把我的研究上交上级，在那之后……就不关我的事了。 愿主怜悯我们的灵魂。」"},{"id":112,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"阿耳忒弥斯计划（Project Artemis）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/4D472736E6B1CF5C.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上标志：COR3\u003c/li\u003e\r\n\u003cli\u003e项目（PROJECT）：ARTEMIS\u003c/li\u003e\r\n\u003cli\u003e密级印章：TOP SECRET（绝密）\u003c/li\u003e\r\n\u003cli\u003e说明：Informational brief, eyes only（情报简报，仅限本人阅读）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e阿尔忒弥斯计划（Project Artemis）创立于 2150 年代，目的是控制新近发现的殖民地。它被伪装成一项\"小行星防御\"计划，实际意味着在被殖民行星以及足够大的天体（可殖民的小行星，甚至足够大的空间站）轨道上部署导弹平台。\u003c/p\u003e\r\n\u003cp\u003e部署进程相当缓慢，因为在那种环境下导弹技术效率低下，遇到了许多挫折。 与此同时，NIC 储能技术的进步使 CORE Arms 得以提出研发轨道炮（railguns），既适用于飞船，也适用于轨道平台。\u003c/p\u003e\r\n\u003cp\u003e研发始于 2160 年代末，在 Terra、Luna 和 Mars 上建造了若干研发与试验场（此外还有位于小行星和空间站上的几个较小场站）。\u003c/p\u003e\r\n\u003cp\u003e尽管起初这些场站会共享各自的进程信息，但后来决定关闭此类通信，以防数据泄露。此后所有研究综合设施完全自治。\u003c/p\u003e\r\n\u003cp\u003e所有这些场站的主要目标，是为炮管和弹药寻找最耐久的材料。 使用标准\"地球（terran）\"材料的早期原型似乎不够耐久，原型炮管通常在发射几十发后就出现严重损伤。 所使用的弹药主要由钨合金构成，在大多数使用场景下似乎尚可，但在大气层再入方面有些吃力。\u003c/p\u003e\r\n\u003cp\u003e在运作期间，若干研究中心因实验失败、海盗袭击和恐怖袭击而损失，也有因缺乏成果而被整体关停的。\u003c/p\u003e\r\n\u003cp\u003e有鉴于此，阿尔忒弥斯计划于 2210 年代初被封存，所有数据转入档案。\u003c/p\u003e\r\n\u003cp\u003e后来该计划被认为已经过时，因为 CORE 的范式转向了以经济与技术控制取代直接军事干预。\u003c/p\u003e\r\n\u003cp\u003e最近，由于来自 [已涂黑] 综合设施的信息重新浮出水面（该设施被认为在 2180 年代失踪），该计划被重启。\u003c/p\u003e\r\n\u003cp\u003eLRMD 是阿尔忒弥斯计划的直接后裔，但其目标是为议会（Council）的飞船提供更优越的武器，足以吓退海盗、劫掠跨星系稳定贸易航线。\u003c/p\u003e\r\n","text":"![](../img/4D472736E6B1CF5C.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上标志：COR3 项目（PROJECT）：ARTEMIS 密级印章：TOP SECRET（绝密） 说明：Informational brief, eyes only（情报简报，仅限本人阅读） 正文 阿尔忒弥斯计划（Project Artemis）创立于 2150 年代，目的是控制新近发现的殖民地。它被伪装成一项\"小行星防御\"计划，实际意味着在被殖民行星以及足够大的天体（可殖民的小行星，甚至足够大的空间站）轨道上部署导弹平台。 部署进程相当缓慢，因为在那种环境下导弹技术效率低下，遇到了许多挫折。 与此同时，NIC 储能技术的进步使 CORE Arms 得以提出研发轨道炮（railguns），既适用于飞船，也适用于轨道平台。 研发始于 2160 年代末，在 Terra、Luna 和 Mars 上建造了若干研发与试验场（此外还有位于小行星和空间站上的几个较小场站）。 尽管起初这些场站会共享各自的进程信息，但后来决定关闭此类通信，以防数据泄露。此后所有研究综合设施完全自治。 所有这些场站的主要目标，是为炮管和弹药寻找最耐久的材料。 使用标准\"地球（terran）\"材料的早期原型似乎不够耐久，原型炮管通常在发射几十发后就出现严重损伤。 所使用的弹药主要由钨合金构成，在大多数使用场景下似乎尚可，但在大气层再入方面有些吃力。 在运作期间，若干研究中心因实验失败、海盗袭击和恐怖袭击而损失，也有因缺乏成果而被整体关停的。 有鉴于此，阿尔忒弥斯计划于 2210 年代初被封存，所有数据转入档案。 后来该计划被认为已经过时，因为 CORE 的范式转向了以经济与技术控制取代直接军事干预。 最近，由于来自 [已涂黑] 综合设施的信息重新浮出水面（该设施被认为在 2180 年代失踪），该计划被重启。 LRMD 是阿尔忒弥斯计划的直接后裔，但其目标是为议会（Council）的飞船提供更优越的武器，足以吓退海盗、劫掠跨星系稳定贸易航线。"},{"id":113,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"得墨忒耳计划档案（Project Demeter Archive）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/D367FD2DBE5AA878.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片说明\u003c/h2\u003e\r\n\u003cp\u003e一张黑白俯瞰式地形／扫描影像：左半部是呈环状分布的建筑群、道路与塔状结构，右半部是一道巨大的椭圆形阴影或扫描伪影，画面中没有可读文字。\u003c/p\u003e\r\n","text":"![](../img/D367FD2DBE5AA878.jpg) 图片说明 一张黑白俯瞰式地形／扫描影像：左半部是呈环状分布的建筑群、道路与塔状结构，右半部是一道巨大的椭圆形阴影或扫描伪影，画面中没有可读文字。"},{"id":114,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"无线电通信日志（Radio Communication Log）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/4FE4904B47115AEC.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e图纸标题栏\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e项目（PROJECT）：ARTEMIS（字样上方有污损）\u003c/li\u003e\r\n\u003cli\u003e原型（PROTOTYPE）：DST-15 \"DAISY\"\u003c/li\u003e\r\n\u003cli\u003e图纸编号（Blueprint）：M-VI571\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e细节表（DETAILS）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| 项目 | 数值 | | --- | --- | | 长度（Length） | 2000 mm | | 直径（Diameter） | 410 mm | | 速度（Velocity） | 1500 m/s |\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e比例（SCALE）：1:100\u003c/li\u003e\r\n\u003cli\u003e日期（DATE）：2195 年 8 月 23 日，星期六\u003c/li\u003e\r\n\u003cli\u003e设计方（DESIGNED BY）：CORE Arms\u003c/li\u003e\r\n\u003cli\u003e右下标：COR3\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e各视图旁另有多处尺寸标注（单位 mm，可见者有 2000、790、600、230、335、160、78、530、355、670、240、75、550、85、440、300、175、310、265 等）。\u003c/p\u003e\r\n\u003cp\u003e（注：本页配图为 DST-15 \"DAISY\" 原型图纸，画面中未出现任何无线电通信记录文字。）\u003c/p\u003e\r\n","text":"![](../img/4FE4904B47115AEC.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 图纸标题栏 项目（PROJECT）：ARTEMIS（字样上方有污损） 原型（PROTOTYPE）：DST 15 \"DAISY\" 图纸编号（Blueprint）：M VI571 细节表（DETAILS） | 项目 | 数值 | | | | | 长度（Length） | 2000 mm | | 直径（Diameter） | 410 mm | | 速度（Velocity） | 1500 m/s | 比例（SCALE）：1:100 日期（DATE）：2195 年 8 月 23 日，星期六 设计方（DESIGNED BY）：CORE Arms 右下标：COR3 各视图旁另有多处尺寸标注（单位 mm，可见者有 2000、790、600、230、335、160、78、530、355、670、240、75、550、85、440、300、175、310、265 等）。 （注：本页配图为 DST 15 \"DAISY\" 原型图纸，画面中未出现任何无线电通信记录文字。）"},{"id":115,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"无线电传输（Radio Transmission）","type":"AUDIO","html":"","text":""},{"id":116,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"报告 E（Report E）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/71068A06A96DD1A2.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：USOL 徽记\u003c/li\u003e\r\n\u003cli\u003e标题：REPORT-E（报告 E）\u003c/li\u003e\r\n\u003cli\u003e副标题：PROTECTED WITNESS INTERROGATION TRANSCRIPT（受保护证人审讯记录）\u003c/li\u003e\r\n\u003cli\u003e审讯官（INTERROGATING OFFICER）：[已涂黑]，USOL CDC\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e记录正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e0　Date（日期）\u003c/strong\u003e：FEB 12. 2192（2192 年 2 月 12 日）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e1　Officer（警官）\u003c/strong\u003e：我们知道你当时在场，所以需要你对所发生之事的说法。如果你配合，我们会改善你的生活条件。如果你拒绝……你虽在证人保护之下，但谁知道会发生什么……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e2　[已涂黑]\u003c/strong\u003e：你什么都做不了。我知道我的权利，也知道我签了什么。滚你妈的，混蛋。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e3　Officer\u003c/strong\u003e：哈，我喜欢这态度。不过，我猜你已经知道我们找到了你的妻子、前女友，或者不管她对你来说算什么。我个人不在乎她会怎样，但你他妈搞过的那些人会在乎。所以，说。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e4　[已涂黑]\u003c/strong\u003e：你这个人渣。你和你那一整队混蛋都是。我会找到办法让你付出代价。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e5　Officer\u003c/strong\u003e：当然，伙计，当然。不过那是以后的事。现在你只是在考验我的耐心。而它已经薄得不能再薄了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e6　[已涂黑]\u003c/strong\u003e：好吧……我不知道原计划是什么。是 PCF 那帮混蛋主导的。或者是邪教徒干的，我不知道。我们被告知去那里等某样东西。本来不该有暴力……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e7　Officer\u003c/strong\u003e：别废话了，我们在现场找到了武器。谁带来的？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e8　[已涂黑]\u003c/strong\u003e：不是我们。我和我的人只有横幅。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e9　Officer\u003c/strong\u003e：是啊，插着尖刺的破钢管。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e10　[已涂黑]\u003c/strong\u003e：我们拿了手头有的东西……但说真的，我们被告知不要主动攻击。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e11　Officer\u003c/strong\u003e：那到底他妈是谁先开的枪？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e12　[已涂黑]\u003c/strong\u003e：是你们的人。至少我觉得是。但很奇怪，我觉得枪声来自我们上方某处。我们前面的警察没有开枪，他们试图谈判。不过他们确实带了武器。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e13　Officer\u003c/strong\u003e：带武器？你是说谈判小队带了武器？别他妈胡说八道。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e14　[已涂黑]\u003c/strong\u003e：我发誓，老兄！他们带了手枪。但没人用。而且我觉得那些人在一切疯狂开始之前就被我们的头儿带走了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e15　Officer\u003c/strong\u003e：枪响之后你做了什么？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e16　[已涂黑]\u003c/strong\u003e：撒腿就跑。我不是傻子，我知道事情要往哪儿去。我大部分手下也一样。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e17　Officer\u003c/strong\u003e：那是谁冲进了天梯（Skylift）？你看到是谁下令推进的吗？你听到什么了吗？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e18　[已涂黑]\u003c/strong\u003e：我不想撒谎，我没有。但我们跑的时候看到有人朝 Skylift 走去，他们的眼睛是空的。像他妈的行尸走肉。我觉得他们被下了药或者别的什么。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e19　Officer\u003c/strong\u003e：你这不是在帮我……好好想想！你还记得什么？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e20　[已涂黑]\u003c/strong\u003e：那天我记得的最后一件事，就是我们逃跑的时候，然后我们所有人的头发都竖了起来，我们撞上了环绕该区域的某种力场。然后我们都昏了过去，至少别人是这么告诉我的。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e21　Officer\u003c/strong\u003e：好吧……不能说你有帮上忙，但就这样吧。回你那个小家去，保持联系。需要时会联系你。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e22　[已涂黑]\u003c/strong\u003e：我妻子呢？我需要你保证她会没事。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e23　Officer\u003c/strong\u003e：她认为你死了，就保持这样。如果你表现好，我们会确保没人知道她的事，包括那些找你的人。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e24　[已涂黑]\u003c/strong\u003e：可是……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e25　Officer\u003c/strong\u003e：够了。中士，把他带走。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e26　Note（备注）\u003c/strong\u003e：补充说明：警官 [已涂黑]。这名证人的说法与其他人的说法几乎一字不差，逐字相同。要么他们都在说真话，要么都在撒谎。我们需要对其余嫌疑人进行额外审讯。可能要用更……激烈的手段。\u003c/p\u003e\r\n","text":"![](../img/71068A06A96DD1A2.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：USOL 徽记 标题：REPORT E（报告 E） 副标题：PROTECTED WITNESS INTERROGATION TRANSCRIPT（受保护证人审讯记录） 审讯官（INTERROGATING OFFICER）：[已涂黑]，USOL CDC 记录正文 0 Date（日期） ：FEB 12. 2192（2192 年 2 月 12 日） 1 Officer（警官） ：我们知道你当时在场，所以需要你对所发生之事的说法。如果你配合，我们会改善你的生活条件。如果你拒绝……你虽在证人保护之下，但谁知道会发生什么…… 2 [已涂黑] ：你什么都做不了。我知道我的权利，也知道我签了什么。滚你妈的，混蛋。 3 Officer ：哈，我喜欢这态度。不过，我猜你已经知道我们找到了你的妻子、前女友，或者不管她对你来说算什么。我个人不在乎她会怎样，但你他妈搞过的那些人会在乎。所以，说。 4 [已涂黑] ：你这个人渣。你和你那一整队混蛋都是。我会找到办法让你付出代价。 5 Officer ：当然，伙计，当然。不过那是以后的事。现在你只是在考验我的耐心。而它已经薄得不能再薄了。 6 [已涂黑] ：好吧……我不知道原计划是什么。是 PCF 那帮混蛋主导的。或者是邪教徒干的，我不知道。我们被告知去那里等某样东西。本来不该有暴力…… 7 Officer ：别废话了，我们在现场找到了武器。谁带来的？ 8 [已涂黑] ：不是我们。我和我的人只有横幅。 9 Officer ：是啊，插着尖刺的破钢管。 10 [已涂黑] ：我们拿了手头有的东西……但说真的，我们被告知不要主动攻击。 11 Officer ：那到底他妈是谁先开的枪？ 12 [已涂黑] ：是你们的人。至少我觉得是。但很奇怪，我觉得枪声来自我们上方某处。我们前面的警察没有开枪，他们试图谈判。不过他们确实带了武器。 13 Officer ：带武器？你是说谈判小队带了武器？别他妈胡说八道。 14 [已涂黑] ：我发誓，老兄！他们带了手枪。但没人用。而且我觉得那些人在一切疯狂开始之前就被我们的头儿带走了。 15 Officer ：枪响之后你做了什么？ 16 [已涂黑] ：撒腿就跑。我不是傻子，我知道事情要往哪儿去。我大部分手下也一样。 17 Officer ：那是谁冲进了天梯（Skylift）？你看到是谁下令推进的吗？你听到什么了吗？ 18 [已涂黑] ：我不想撒谎，我没有。但我们跑的时候看到有人朝 Skylift 走去，他们的眼睛是空的。像他妈的行尸走肉。我觉得他们被下了药或者别的什么。 19 Officer ：你这不是在帮我……好好想想！你还记得什么？ 20 [已涂黑] ：那天我记得的最后一件事，就是我们逃跑的时候，然后我们所有人的头发都竖了起来，我们撞上了环绕该区域的某种力场。然后我们都昏了过去，至少别人是这么告诉我的。 21 Officer ：好吧……不能说你有帮上忙，但就这样吧。回你那个小家去，保持联系。需要时会联系你。 22 [已涂黑] ：我妻子呢？我需要你保证她会没事。 23 Officer ：她认为你死了，就保持这样。如果你表现好，我们会确保没人知道她的事，包括那些找你的人。 24 [已涂黑] ：可是…… 25 Officer ：够了。中士，把他带走。 26 Note（备注） ：补充说明：警官 [已涂黑]。这名证人的说法与其他人的说法几乎一字不差，逐字相同。要么他们都在说真话，要么都在撒谎。我们需要对其余嫌疑人进行额外审讯。可能要用更……激烈的手段。"},{"id":117,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"报告 Z（Report Z）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/B879A9F06F5B243F.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：USOL 徽记\u003c/li\u003e\r\n\u003cli\u003e标题：REPORT Z-5815（报告 Z-5815）\u003c/li\u003e\r\n\u003cli\u003e副标题：INTERROGATION TRANSCRIPT（审讯记录）：[已涂黑]（PROTECTED WITNESS, SIGNED IN AS \"ENGINEER\"／受保护证人，以\"工程师\"署名）\u003c/li\u003e\r\n\u003cli\u003e审讯官（INTERROGATING OFFICER）：[已涂黑]，USOL CDC\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e记录正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e0　Date（日期）\u003c/strong\u003e：FEB 14. 2192（2192 年 2 月 14 日）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e1　Officer（警官）\u003c/strong\u003e：晚上好，John。我相信我的同事已经跟你谈过了，所以这不过是走个形式。我们只是要在问其他人之前再核对一些事情。你没问题吧？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e2　[已涂黑]\u003c/strong\u003e：是的，是的，我是。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e3　Officer\u003c/strong\u003e：你看起来紧张。发生什么事了吗？我们的人对你还好吗？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e4　[已涂黑]\u003c/strong\u003e：是的，都还好。我只是大概受了惊吓。那些事……太可怕了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e5　Officer\u003c/strong\u003e：既然你已经记起来了——你对那起事件知道些什么？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e6　[已涂黑]\u003c/strong\u003e：不多。那天我们因为某种电力紧急情况被叫到那片区域。我不知道是哪一个，因为我们没能及时赶到那里。示威已经在进行，挡住了我们的路。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e7　Officer\u003c/strong\u003e：哦，好吧。你有没有尝试联系当局，帮你到达你的工作地点？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e8　[已涂黑]\u003c/strong\u003e：嗯……没有？人太多了，而且我怕丢命。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e9　Officer\u003c/strong\u003e：完全理解！但那你为什么不在那个时刻离开现场？你的多功能工具（multitool）记录显示，在灾难发生的那一刻之前，你的位置完全没有变化。你能解释一下吗？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e10　[已涂黑]\u003c/strong\u003e：我真的不记得了。所有人都那么害怕，那么吵，人们在尖叫，枪声响起……我想我大概是僵住了？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e11　Officer\u003c/strong\u003e：再次，完全可以理解。但传感器显示你在三个小时里一动都没动，就站在一个地方。那怎么可能？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e12　[已涂黑]\u003c/strong\u003e：嗯，你知道，干我这行的，长时间待在原地并不算少见。就像我说的——我不记得了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e13　Officer\u003c/strong\u003e：好吧好吧，别担心。我当然能理解你肯定受了创伤。但我还有一个问题——你那天穿的制服在哪里？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e14　[已涂黑]\u003c/strong\u003e：我不知道。肯定按协议烧掉了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e15　Officer\u003c/strong\u003e：协议？哦，那可真遗憾。你知道那些 GPS 传感器也被织进了你的制服和鞋子里吗？而且其中一些显示，在所谓的冲击初始区域西南方向有移动。我们以为那是故障，但我们想听听你的看法。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e16　[已涂黑]\u003c/strong\u003e：我不知道该说什么。他们发现我处在某种深度恍惚状态，靠近——已涂黑——的地方，我是这么被告知的。肯定是被什么东西影响了。什么都记不起来……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e17　Officer\u003c/strong\u003e：你不知道，也记不起来……好吧 John，你现在可以走了，但请与我们保持联系。你的雇主当然已经收到通知了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e18　[已涂黑]\u003c/strong\u003e：是啊，好吧。谢谢。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e19　Note（备注）\u003c/strong\u003e：备注：[已涂黑] 的装备和衣物在初始电涌区域附近被发现，距指定工作区域超过 2 公里。建议进行进一步的深入审讯。\u003c/p\u003e\r\n","text":"![](../img/B879A9F06F5B243F.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：USOL 徽记 标题：REPORT Z 5815（报告 Z 5815） 副标题：INTERROGATION TRANSCRIPT（审讯记录）：[已涂黑]（PROTECTED WITNESS, SIGNED IN AS \"ENGINEER\"／受保护证人，以\"工程师\"署名） 审讯官（INTERROGATING OFFICER）：[已涂黑]，USOL CDC 记录正文 0 Date（日期） ：FEB 14. 2192（2192 年 2 月 14 日） 1 Officer（警官） ：晚上好，John。我相信我的同事已经跟你谈过了，所以这不过是走个形式。我们只是要在问其他人之前再核对一些事情。你没问题吧？ 2 [已涂黑] ：是的，是的，我是。 3 Officer ：你看起来紧张。发生什么事了吗？我们的人对你还好吗？ 4 [已涂黑] ：是的，都还好。我只是大概受了惊吓。那些事……太可怕了。 5 Officer ：既然你已经记起来了——你对那起事件知道些什么？ 6 [已涂黑] ：不多。那天我们因为某种电力紧急情况被叫到那片区域。我不知道是哪一个，因为我们没能及时赶到那里。示威已经在进行，挡住了我们的路。 7 Officer ：哦，好吧。你有没有尝试联系当局，帮你到达你的工作地点？ 8 [已涂黑] ：嗯……没有？人太多了，而且我怕丢命。 9 Officer ：完全理解！但那你为什么不在那个时刻离开现场？你的多功能工具（multitool）记录显示，在灾难发生的那一刻之前，你的位置完全没有变化。你能解释一下吗？ 10 [已涂黑] ：我真的不记得了。所有人都那么害怕，那么吵，人们在尖叫，枪声响起……我想我大概是僵住了？ 11 Officer ：再次，完全可以理解。但传感器显示你在三个小时里一动都没动，就站在一个地方。那怎么可能？ 12 [已涂黑] ：嗯，你知道，干我这行的，长时间待在原地并不算少见。就像我说的——我不记得了。 13 Officer ：好吧好吧，别担心。我当然能理解你肯定受了创伤。但我还有一个问题——你那天穿的制服在哪里？ 14 [已涂黑] ：我不知道。肯定按协议烧掉了。 15 Officer ：协议？哦，那可真遗憾。你知道那些 GPS 传感器也被织进了你的制服和鞋子里吗？而且其中一些显示，在所谓的冲击初始区域西南方向有移动。我们以为那是故障，但我们想听听你的看法。 16 [已涂黑] ：我不知道该说什么。他们发现我处在某种深度恍惚状态，靠近——已涂黑——的地方，我是这么被告知的。肯定是被什么东西影响了。什么都记不起来…… 17 Officer ：你不知道，也记不起来……好吧 John，你现在可以走了，但请与我们保持联系。你的雇主当然已经收到通知了。 18 [已涂黑] ：是啊，好吧。谢谢。 19 Note（备注） ：备注：[已涂黑] 的装备和衣物在初始电涌区域附近被发现，距指定工作区域超过 2 公里。建议进行进一步的深入审讯。"},{"id":118,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"报告 1（Reports 1）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/08D04A572AF69ACE.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：REPORTS 徽标\u003c/li\u003e\r\n\u003cli\u003e右上：一段条形码状的信号波形图案\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e1) COMPLEX ENDANGERMENT REPORT（综合设施危及报告）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER（综合设施控制员）。08.16.2174　　（右侧日期：08.16.2174）\u003c/li\u003e\r\n\u003cli\u003e收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e鉴于 [已涂黑] 上近期发生的事件，我们认为该综合设施处于\"受威胁\"（endangered）状态。尽管它不太可能在不久后遭到直接攻击（如果真的会的话），我们建议以全面方式撤离资产。\u003c/p\u003e\r\n\u003cp\u003e实验结果太过宝贵，不能通过本地通信枢纽传输，因此应上传至本地数据保险库，然后从该行星物理运出。\u003c/p\u003e\r\n\u003cp\u003e最近的着陆平台位于 [已涂黑]，若决定被拖延，该处可能也不安全。请指示。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e2) EVENTS UPDATE（事态更新）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。02.12.2175　　（右侧日期：02.12.2175）\u003c/li\u003e\r\n\u003cli\u003e收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e地面局势持续恶化。我理解各方对当前局势普遍缺乏关注，但我们的侦察员报告说，当地政府似乎无法控制这场暴动。我们正在加强综合设施防御，并更新无人机程序（原文此处字迹残缺、[无法辨认]），以防它们必须在没有主机监督的情况下运作。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e3) MAJOR INCIDENT（重大事故）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。03.19.2175　　（右侧日期：03.19.2175）\u003c/li\u003e\r\n\u003cli\u003e收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e今天我们发生了一起重大事故。我们最近一批货物中收到的材料似乎不稳定。其中一个样本在发射测试（emitting test）中爆炸了。我们有 5 名队员受伤，其中一人——重伤。Canti 医生认为我们能自行应付，但若非如此——联系当地政府可能是我们唯一的选择。我不能允许自己失去任何一位同事，因为在这种情况下他们是不可替代的。\u003c/p\u003e\r\n\u003cp\u003e我再次坚持，随着局势继续恶化，应着手规划人员和研究成果的撤离。\u003c/p\u003e\r\n\u003cp\u003e（页脚：1/2）\u003c/p\u003e\r\n","text":"![](../img/08D04A572AF69ACE.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：REPORTS 徽标 右上：一段条形码状的信号波形图案 1) COMPLEX ENDANGERMENT REPORT（综合设施危及报告） 发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER（综合设施控制员）。08.16.2174 （右侧日期：08.16.2174） 收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION 鉴于 [已涂黑] 上近期发生的事件，我们认为该综合设施处于\"受威胁\"（endangered）状态。尽管它不太可能在不久后遭到直接攻击（如果真的会的话），我们建议以全面方式撤离资产。 实验结果太过宝贵，不能通过本地通信枢纽传输，因此应上传至本地数据保险库，然后从该行星物理运出。 最近的着陆平台位于 [已涂黑]，若决定被拖延，该处可能也不安全。请指示。 2) EVENTS UPDATE（事态更新） 发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。02.12.2175 （右侧日期：02.12.2175） 收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION 地面局势持续恶化。我理解各方对当前局势普遍缺乏关注，但我们的侦察员报告说，当地政府似乎无法控制这场暴动。我们正在加强综合设施防御，并更新无人机程序（原文此处字迹残缺、[无法辨认]），以防它们必须在没有主机监督的情况下运作。 3) MAJOR INCIDENT（重大事故） 发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。03.19.2175 （右侧日期：03.19.2175） 收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION 今天我们发生了一起重大事故。我们最近一批货物中收到的材料似乎不稳定。其中一个样本在发射测试（emitting test）中爆炸了。我们有 5 名队员受伤，其中一人——重伤。Canti 医生认为我们能自行应付，但若非如此——联系当地政府可能是我们唯一的选择。我不能允许自己失去任何一位同事，因为在这种情况下他们是不可替代的。 我再次坚持，随着局势继续恶化，应着手规划人员和研究成果的撤离。 （页脚：1/2）"},{"id":119,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"报告 2（Reports 2）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/FEE49FB066F1A5C4.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：REPORTS 徽标\u003c/li\u003e\r\n\u003cli\u003e右上：一段条形码状的信号波形图案\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e4) COMMUNICATIONS FAILURE（通信中断）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。\u003c/li\u003e\r\n\u003cli\u003e收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION\u003c/li\u003e\r\n\u003cli\u003e右侧日期：05.20.2176\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003eFAUX，如果你能收到这条消息——我们所在地附近，USOL 部队与 [已涂黑] 之间发生了大量冲突。我们正在保持低调。所有通信设备都已关闭以避免被发现。我们通往主传输枢纽的直连线被切断了——无论是意外还是有意为之。我们没有任何办法去检查或修复它。\u003c/p\u003e\r\n\u003cp\u003e我们来自 [已涂黑] 中心的同事一直在给我们送来辐照材料，但我不认为在接下来的日子里这对我们或他们会有任何好处。他们说他们也与你没有任何通信。似乎什么都不管用。我们已与 [已涂黑] 商定，如果我们无法从你或环 7 的任何代表那里得到任何消息——我们将尝试撤离关键资产和人员。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e5) EVACUATION ORDER（撤离命令）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。\u003c/li\u003e\r\n\u003cli\u003e收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION\u003c/li\u003e\r\n\u003cli\u003e右侧日期：04.12.2177\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e我们已经等得够久了。来自 [已涂黑] 中心的材料大约两个月前就停止送来了。那里也没有任何通信。\u003c/p\u003e\r\n\u003cp\u003e我们别无他法。我手上有 3 艘 VTOL，我打算用它们撤离数据、人员和样本。这不会容易，因为我听说已有数艘穿梭机被 [已涂黑] 击落。希望我们能成功。这项研究……它能改变 CORE 的未来。阿尔忒弥斯计划将被完全恢复。祝我们好运，希望这条消息能送达你。\u003c/p\u003e\r\n\u003cp\u003e（页脚：2/2）\u003c/p\u003e\r\n","text":"![](../img/FEE49FB066F1A5C4.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：REPORTS 徽标 右上：一段条形码状的信号波形图案 4) COMMUNICATIONS FAILURE（通信中断） 发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。 收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION 右侧日期：05.20.2176 FAUX，如果你能收到这条消息——我们所在地附近，USOL 部队与 [已涂黑] 之间发生了大量冲突。我们正在保持低调。所有通信设备都已关闭以避免被发现。我们通往主传输枢纽的直连线被切断了——无论是意外还是有意为之。我们没有任何办法去检查或修复它。 我们来自 [已涂黑] 中心的同事一直在给我们送来辐照材料，但我不认为在接下来的日子里这对我们或他们会有任何好处。他们说他们也与你没有任何通信。似乎什么都不管用。我们已与 [已涂黑] 商定，如果我们无法从你或环 7 的任何代表那里得到任何消息——我们将尝试撤离关键资产和人员。 5) EVACUATION ORDER（撤离命令） 发件（FROM）：SIMON CAIN，RING 5 SAGE，[已涂黑] COMPLEX CONTROLLER。 收件（TO）：RING 7 OVERSEER，FAUX CHAPLIN，[已涂黑] STATION 右侧日期：04.12.2177 我们已经等得够久了。来自 [已涂黑] 中心的材料大约两个月前就停止送来了。那里也没有任何通信。 我们别无他法。我手上有 3 艘 VTOL，我打算用它们撤离数据、人员和样本。这不会容易，因为我听说已有数艘穿梭机被 [已涂黑] 击落。希望我们能成功。这项研究……它能改变 CORE 的未来。阿尔忒弥斯计划将被完全恢复。祝我们好运，希望这条消息能送达你。 （页脚：2/2）"},{"id":120,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"桑德曼父子公司（Sandman \u0026 Sons）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/6B14BF14675E6BED.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉条\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左：DEPARTMENT OF SECURITY（安全部）／Document: \"Sandman and Sons Business Appraisal.\"（文件：\"桑德曼父子业务评估\"）\u003c/li\u003e\r\n\u003cli\u003e右：Form E-1225, Filed Evidence（表格 E-1225，归档证据）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e标题\u003c/strong\u003e：SANDMAN AND SONS BUSINESS APPRAISAL.（桑德曼父子业务评估）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e「我们聚集于此，是为了评估所罗门·桑德曼（Solomon Sandman）留给我们的这家公司的价值——他是一个男人、一位父亲，也是一名殡葬业者（Undertaker）。\u003c/p\u003e\r\n\u003cp\u003e桑德曼先生主要在小行星殖民地经营，凭可靠商人的名声立足，总能搞定事情，即便客户犹豫不决。\u003c/p\u003e\r\n\u003cp\u003e许多人敬重他，少数人爱戴他。\u003c/p\u003e\r\n\u003cp\u003e然而遗憾的是，近些年他的生意开始萎缩，因为一项名为\"无尸处理\"（corpse-less disposal）的新技术被发明出来。发明者要么是个天才，要么是纯粹的邪恶；但无论如何，人们不再收到麻烦的尸体，而是收到珍贵的宝石。\u003c/p\u003e\r\n\u003cp\u003e对桑德曼先生而言，这一变化是致命的。没有客户就没有钱。所以他必须查清此事。\u003c/p\u003e\r\n\u003cp\u003e悲剧的是，他选择的行动是潜入 Astrocrop 的一处设施。不用说，那里戒备森严。\u003c/p\u003e\r\n\u003cp\u003e结果就是桑德曼先生的死讯，官方说法是：在周界围栏上触电身亡。这并不能解释某些失踪的组织，但一笔可观的赔偿金已支付给他的亲属，以了结麻烦。\u003c/p\u003e\r\n\u003cp\u003e那么，让我们从剩余资产、财务义务和潜在收益的清单开始吧……」\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e侧边条码文字\u003c/strong\u003e：FEE-DWC-4929473-8D1E-20B3283258\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e页脚\u003c/strong\u003e：This document has been verified by the Department of Security. All rights reserved.（本文件已由安全部核验。保留所有权利。）／Form E-1225, Filed Evidence\u003c/p\u003e\r\n","text":"![](../img/6B14BF14675E6BED.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉条 左：DEPARTMENT OF SECURITY（安全部）／Document: \"Sandman and Sons Business Appraisal.\"（文件：\"桑德曼父子业务评估\"） 右：Form E 1225, Filed Evidence（表格 E 1225，归档证据） 标题 ：SANDMAN AND SONS BUSINESS APPRAISAL.（桑德曼父子业务评估） 正文 「我们聚集于此，是为了评估所罗门·桑德曼（Solomon Sandman）留给我们的这家公司的价值——他是一个男人、一位父亲，也是一名殡葬业者（Undertaker）。 桑德曼先生主要在小行星殖民地经营，凭可靠商人的名声立足，总能搞定事情，即便客户犹豫不决。 许多人敬重他，少数人爱戴他。 然而遗憾的是，近些年他的生意开始萎缩，因为一项名为\"无尸处理\"（corpse less disposal）的新技术被发明出来。发明者要么是个天才，要么是纯粹的邪恶；但无论如何，人们不再收到麻烦的尸体，而是收到珍贵的宝石。 对桑德曼先生而言，这一变化是致命的。没有客户就没有钱。所以他必须查清此事。 悲剧的是，他选择的行动是潜入 Astrocrop 的一处设施。不用说，那里戒备森严。 结果就是桑德曼先生的死讯，官方说法是：在周界围栏上触电身亡。这并不能解释某些失踪的组织，但一笔可观的赔偿金已支付给他的亲属，以了结麻烦。 那么，让我们从剩余资产、财务义务和潜在收益的清单开始吧……」 侧边条码文字 ：FEE DWC 4929473 8D1E 20B3283258 页脚 ：This document has been verified by the Department of Security. All rights reserved.（本文件已由安全部核验。保留所有权利。）／Form E 1225, Filed Evidence"},{"id":121,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"天梯评估（Sky Lift Assessment）","type":"MARKDOWN","html":"\u003cp\u003e\u003cstrong\u003e“Sky Lift”（天梯）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e今天是“漂移升降段”六周年——那是 Sky Lift 的一部分，已从其行星基座上脱离。科学家仍在监测它的轨道，目前确认它很可能会留在太阳系内。\u003c/p\u003e\r\n\u003cp\u003e尽管该物体本身被认为对任何殖民地或大型空间站都不构成危险，但它的自转仍有些难以预测，这意味着任何位于其路径上的较小空间站或卫星都可能面临严重危险。\u003c/p\u003e\r\n\u003cp\u003e我们有一项新任务交给您。您的雇主希望您看看 Sky Lift 被毁事件。我们不认为那只是一场事故，背后另有隐情。 该事件仅存的痕迹，存放在一个旧的 USOL CDC 档案节点上。 您需要通过终端连接到该节点，提取所有仍可读取的文件。 您的任务是揭开此事，并汇报您的发现。\u003c/p\u003e\r\n\u003cp\u003e就在您从 USOL 节点调取数据期间，我们的团队又复原了一段与 Sky Lift 事件有关的碎片。 它并不存放在 USOL 上——我们是通过另一条渠道找到的，部分是从 CORE 的监督通信中重建出来的。 我已把该文件加入您的工作区。 现在我们需要查明，是否还有与此事件相关、且仍在世的个人。 如果系统里还有人仍在活动，我们必须知道。\u003c/p\u003e\r\n","text":"“Sky Lift”（天梯） 今天是“漂移升降段”六周年——那是 Sky Lift 的一部分，已从其行星基座上脱离。科学家仍在监测它的轨道，目前确认它很可能会留在太阳系内。 尽管该物体本身被认为对任何殖民地或大型空间站都不构成危险，但它的自转仍有些难以预测，这意味着任何位于其路径上的较小空间站或卫星都可能面临严重危险。 我们有一项新任务交给您。您的雇主希望您看看 Sky Lift 被毁事件。我们不认为那只是一场事故，背后另有隐情。 该事件仅存的痕迹，存放在一个旧的 USOL CDC 档案节点上。 您需要通过终端连接到该节点，提取所有仍可读取的文件。 您的任务是揭开此事，并汇报您的发现。 就在您从 USOL 节点调取数据期间，我们的团队又复原了一段与 Sky Lift 事件有关的碎片。 它并不存放在 USOL 上——我们是通过另一条渠道找到的，部分是从 CORE 的监督通信中重建出来的。 我已把该文件加入您的工作区。 现在我们需要查明，是否还有与此事件相关、且仍在世的个人。 如果系统里还有人仍在活动，我们必须知道。"},{"id":122,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"天梯照片（Skylift Photo）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/0CF7A5F0D850DEEB.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片说明\u003c/h2\u003e\r\n\u003cp\u003e一张仰拍照片：画面主体是一艘 CORE 载具／平台的下部结构，机身与起落支柱上可见 CORE 标志与字样，右侧是天梯（Skylift）的巨大斜向塔体结构，整体呈冷蓝色调，没有其他可读文字。\u003c/p\u003e\r\n","text":"![](../img/0CF7A5F0D850DEEB.jpg) 图片说明 一张仰拍照片：画面主体是一艘 CORE 载具／平台的下部结构，机身与起落支柱上可见 CORE 标志与字样，右侧是天梯（Skylift）的巨大斜向塔体结构，整体呈冷蓝色调，没有其他可读文字。"},{"id":123,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"联盟号地质扫描报告——科洛科尔场址（Soyuz Geological Scan Report — Kolokol Site）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/2722729646057593.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：带星徽的印章图案\u003c/li\u003e\r\n\u003cli\u003e抬头：SOYUZ SECTOR GEOLOGIST（联盟扇区地质学家）\u003c/li\u003e\r\n\u003cli\u003e姓名框：ANDREJ MAKAROV\u003c/li\u003e\r\n\u003cli\u003e主题（SUBJECT）：GEOLOGICAL SCAN, GRID（地质扫描，网格）\u003c/li\u003e\r\n\u003cli\u003e日期（DATE）：E [已涂黑]，AUG 2168（2168 年 8 月）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e报告（REPORT）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e我们的船员得以用新的 3D 深部扫描仪从低轨道扫描该区域，其代号为\"Kolokol\"。结果显示有扩张的矿脉，来源不明，延伸至行星更深处的地核。尽管我的同事认为这是某种纯铁，但我不太愿意同意。如果我们的扫描可以被认为正确，材料的密度显示它更接近铀或其他重质金属。\u003c/p\u003e\r\n\u003cp\u003e但即便如此，这也不是问题所在。不知何故，扫描显示这条\"矿脉\"几乎形成一个完美的圆形——或者说非常接近圆形——直径 3 公里。这可以算是个奇迹。 这一事实让我有依据说：我们看到的根本不是矿脉，而是某种干扰我们扫描的畸变场（distortion field）。\u003c/p\u003e\r\n\u003cp\u003e遗憾的是，我们没有办法派一支队伍下去，因为 CORE 部队仍在该区域，限制进入。也许我们情报部门的同事能帮上忙…… 如果不行，那我们就继续扫描，并准备一个无人方案，那样总能保留某种程度的可否认性。\u003c/p\u003e\r\n","text":"![](../img/2722729646057593.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：带星徽的印章图案 抬头：SOYUZ SECTOR GEOLOGIST（联盟扇区地质学家） 姓名框：ANDREJ MAKAROV 主题（SUBJECT）：GEOLOGICAL SCAN, GRID（地质扫描，网格） 日期（DATE）：E [已涂黑]，AUG 2168（2168 年 8 月） 报告（REPORT） 我们的船员得以用新的 3D 深部扫描仪从低轨道扫描该区域，其代号为\"Kolokol\"。结果显示有扩张的矿脉，来源不明，延伸至行星更深处的地核。尽管我的同事认为这是某种纯铁，但我不太愿意同意。如果我们的扫描可以被认为正确，材料的密度显示它更接近铀或其他重质金属。 但即便如此，这也不是问题所在。不知何故，扫描显示这条\"矿脉\"几乎形成一个完美的圆形——或者说非常接近圆形——直径 3 公里。这可以算是个奇迹。 这一事实让我有依据说：我们看到的根本不是矿脉，而是某种干扰我们扫描的畸变场（distortion field）。 遗憾的是，我们没有办法派一支队伍下去，因为 CORE 部队仍在该区域，限制进入。也许我们情报部门的同事能帮上忙…… 如果不行，那我们就继续扫描，并准备一个无人方案，那样总能保留某种程度的可否认性。"},{"id":124,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"SW12 安全报告 2341245（SW12 Security Report 2341245）","type":"MARKDOWN","html":"\u003cp\u003e调查 2341245 因缺乏进一步进展，宣布结案。唯一的证据——一份疑似被禁的宗教文本——已被扣押，并随报告附上。\u003c/p\u003e\r\n\u003cp\u003e“及至第八世代的日子，五十又五把钥匙的长老聚集众人，在悲哀之谷第八次凑成五十二人。主便命他们噤声，说道：让虚空之数永存，因第四印将召来变革之潮。”\u003c/p\u003e\r\n\u003cp\u003e警官 Manuel J.\u003c/p\u003e\r\n","text":"调查 2341245 因缺乏进一步进展，宣布结案。唯一的证据——一份疑似被禁的宗教文本——已被扣押，并随报告附上。 “及至第八世代的日子，五十又五把钥匙的长老聚集众人，在悲哀之谷第八次凑成五十二人。主便命他们噤声，说道：让虚空之数永存，因第四印将召来变革之潮。” 警官 Manuel J."},{"id":125,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"末日之日（The Day of Doom）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/A66743F4B201B9FF.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e（手写笔记，字迹潦草处标注为 [无法辨认]）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e2200　The Day of Doom（末日之日）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e我们仍记得那一天——尽管我们中剩下的人已经不多了。 它始于第一道光。 人民奋起，终于要赶走压迫者。自由之队（Freedom Team）的 CORE，以及那些 USOL 害虫，都近在咫尺。\u003c/p\u003e\r\n\u003cp\u003e\"救赎进军\"（March of Salvation）在老矿坑附近开始。Mathews 兄弟谈到了希望、圣灵与未来。政权正在动摇——他们的静默无人机失灵了，人民醒了。\u003c/p\u003e\r\n\u003cp\u003e进军开始时，成千上万的人涌向天堂之门（Haven Gateway），那是从轨道上喂养 USOL 权力的巨大天梯。我们武装起来，要切断他们的生命线。道路是泥浆、风沙——但没有人回头。在基地，我们遇上了\"警察\"，正是那些偷走我们亲人的人。混乱爆发了。一场暴动。\u003c/p\u003e\r\n\u003cp\u003e压迫者逃进内部，封锁了升降机。\u003c/p\u003e\r\n\u003cp\u003e然后，轰鸣来了。\u003c/p\u003e\r\n\u003cp\u003e闪电穿过塔身：它的一部分折入了太空。空气本身被震碎——尖叫、寂静，然后是黑暗。\u003c/p\u003e\r\n\u003cp\u003e当我醒来时，世界已成灰烬与废墟。Mathews 兄弟躺在我身旁，浑身是血但还活着。我们转向天空。\u003c/p\u003e\r\n\u003cp\u003e战斗胜利了——但代价是我们的血。\u003c/p\u003e\r\n","text":"![](../img/A66743F4B201B9FF.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 （手写笔记，字迹潦草处标注为 [无法辨认]） 2200 The Day of Doom（末日之日） 我们仍记得那一天——尽管我们中剩下的人已经不多了。 它始于第一道光。 人民奋起，终于要赶走压迫者。自由之队（Freedom Team）的 CORE，以及那些 USOL 害虫，都近在咫尺。 \"救赎进军\"（March of Salvation）在老矿坑附近开始。Mathews 兄弟谈到了希望、圣灵与未来。政权正在动摇——他们的静默无人机失灵了，人民醒了。 进军开始时，成千上万的人涌向天堂之门（Haven Gateway），那是从轨道上喂养 USOL 权力的巨大天梯。我们武装起来，要切断他们的生命线。道路是泥浆、风沙——但没有人回头。在基地，我们遇上了\"警察\"，正是那些偷走我们亲人的人。混乱爆发了。一场暴动。 压迫者逃进内部，封锁了升降机。 然后，轰鸣来了。 闪电穿过塔身：它的一部分折入了太空。空气本身被震碎——尖叫、寂静，然后是黑暗。 当我醒来时，世界已成灰烬与废墟。Mathews 兄弟躺在我身旁，浑身是血但还活着。我们转向天空。 战斗胜利了——但代价是我们的血。"},{"id":126,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"特里佩事件纪要（Tripe Incident Summary）","type":"MARKDOWN","html":"\u003cp\u003e战地报告\u003c/p\u003e\r\n\u003cp\u003eTripe 文件夹勾勒出一场污染行动的经过——它远远超出了正常的军事损失范畴。报告残片、《末日之日》那篇文章，以及 USOL 的行动后记录，都描述了这样一条链条：暴露、恐慌、指挥层应对；而一旦开始，卷入其中的人谁也无法完全控制住它。\u003c/p\u003e\r\n\u003cp\u003e工作结论\u003c/p\u003e\r\n\u003cp\u003e这批材料的关键价值不在于某个单一元凶，而在于那个模式：某种实验性的东西进入了真实的作战环境，在人员中扩散，让当局不得不在清污、保密与生存之间权衡。这与整条调查线索相符——危险的试验物质逃出了它本该待着的边界。\u003c/p\u003e\r\n","text":"战地报告 Tripe 文件夹勾勒出一场污染行动的经过——它远远超出了正常的军事损失范畴。报告残片、《末日之日》那篇文章，以及 USOL 的行动后记录，都描述了这样一条链条：暴露、恐慌、指挥层应对；而一旦开始，卷入其中的人谁也无法完全控制住它。 工作结论 这批材料的关键价值不在于某个单一元凶，而在于那个模式：某种实验性的东西进入了真实的作战环境，在人员中扩散，让当局不得不在清污、保密与生存之间权衡。这与整条调查线索相符——危险的试验物质逃出了它本该待着的边界。"},{"id":127,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"USOL 行动后报告（USOL AAR Report）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/08A40FA37F915147.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左：USOL 徽记\u003c/li\u003e\r\n\u003cli\u003e标题：AAR (AFTER ACTION REPORT)（行动后报告）\u003c/li\u003e\r\n\u003cli\u003e副标题：CPT. MARTIN SKYPOVSKI, USOL CDC（上尉 Martin Skypovski，USOL CDC）\u003c/li\u003e\r\n\u003cli\u003e日期行：[已涂黑] 2191\u003c/li\u003e\r\n\u003cli\u003e两侧条码文字：左 01090 832132；右 C0000239\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e我们的安全部队受命在本地邪教组织举行的和平示威期间防止过激行为。 该示威与一个地方节日挂钩——\"首批殖民者日\"（DAY OF THE FIRST COLONISTS）。\u003c/p\u003e\r\n\u003cp\u003e本地邪教与\"秘密社团\"一向利用这一天在地方政府与平民之间挑动纷争，因此我们装备齐全，以防任何不必要的暴力。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e我方部队由 4 个战术小队组成：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e\"WEASEL\"（黄鼠狼）小队，SGT. FUSSBENDER\u003c/li\u003e\r\n\u003cli\u003e\"FULCRUM\"（支点）小队，SGT. SOUTHLAND——谈判小组，通常负责与主要煽动者对话\u003c/li\u003e\r\n\u003cli\u003e\"OCULUS\"（眼）小队，SGT. KENWOOD——由训练有素的行动人员组成的队伍，负责清除最暴力的目标\u003c/li\u003e\r\n\u003cli\u003e\"CERBERUS\"（刻耳柏洛斯）小队，SGT. KEEN——监视与侦察小队，负责整体监控局势\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e我们驻扎在 Skylift 入口附近，作为主要也是唯一的防线。\u003c/p\u003e\r\n\u003cp\u003e由于 Precentor Mc Mitney 的命令，我们不被允许携带枪械，因为游行本应是和平的。然而，我们完全清楚那些人会做出什么，几乎我们每个人身上都配了私人枪械。\u003c/p\u003e\r\n\u003cp\u003e那天，事态开始迅速升级。\u003c/p\u003e\r\n\u003cp\u003e到正午时分，所谓\"游行\"的主体已经抵达 Space Lift 的地基。人群非常激动，受到本地祭司与基本破坏本能的煽动。 知道这一点后，Sgt. Fussbender 试图找一位\"负责人\"谈一谈、缓和局势。遗憾的是没有成功，因为主要煽动者都待在离游行主体更远的地方，所以根本无从接触到他们。因此，谈判小组被召回，但 10 名行动人员中只有 5 人返回。其余人员的下落因后来发生的事件而不明。\u003c/p\u003e\r\n\u003cp\u003e由于人群被认为不理会劝告，一个 Fulcrum 小队被调来抓捕煽动者。他们部分成功地抓获了其中一名最响亮的煽动者。遗憾的是，这变成了一笔交易：一名行动人员也被人群\"扣留\"了。他无法混入人群这一点被视为耻辱，但并不危及生命。\u003c/p\u003e\r\n\u003cp\u003e然而，这名行动人员被抓一事成了更激进做法的导火索；当抗议者抵达主入口时，Cerberus 小队被启动。几分钟之内，\"游行\"就变成了狂暴人群与 USOL CDC 精英反暴乱部队之间的暴力对抗。那些家伙是在为我们争取时间。\u003c/p\u003e\r\n\u003cp\u003e我们在撤退请求中呼叫了支援，但没有回应——所有通信都被特别法令干扰，以防止信息扩散。显然，暴乱者已经预料到了这一点。任何正式行动都可能是灾难性的。一小队训练有素、积极性高的行动人员。我们的一队人马不得不撤入 Sky Lift 建筑，随后登上码头，把内部通道封锁在他们身后。然而，抗议者们并不高兴没能分到\"一杯羹\"，于是高喊着\"鲜肉\"决定跟着我们上到顶部。\u003c/p\u003e\r\n\u003cp\u003e等他们到达码头区域时，我们的穿梭机已经准备好并等候着。所有剩余的队员都已安全撤离了设施。\u003c/p\u003e\r\n\u003cp\u003e在登上穿梭机时，Sgt. Keen 报告说，他截获了一个信号，看起来像是被严重干扰、或完全加密的通信尝试；但他无法破译正确的协议。\u003c/p\u003e\r\n\u003cp\u003e就在飞船从太空码头解缆时，一道巨大的 EMP 波（或类似的东西）贯穿了整个空间站。\u003c/p\u003e\r\n\u003cp\u003e我们看到一艘正在离去的飞船失去全部动力，在码头附近失控旋转。几分钟后，那艘飞船撞上了码头本身。爆炸引发了连锁反应，炸掉了空间站的一大块，大概杀死了里面的所有人。大约 20 分钟后，在我们的人员得以恢复供电之后，我们收到命令：撤出该行星范围，与前来接应的 USOL 第 6 支援舰队会合。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e总伤亡名单（TOTAL CASUALTIES LIST）：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e8 名行动人员失踪（OPERATIVES MIA）\u003c/li\u003e\r\n\u003cli\u003e2 名行动人员确认阵亡（OPERATIVES CONFIRMED KIA）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e行动状态（OPERATION STATUS）：失败（FAILED）\u003c/strong\u003e\u003c/p\u003e\r\n","text":"![](../img/08A40FA37F915147.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左：USOL 徽记 标题：AAR (AFTER ACTION REPORT)（行动后报告） 副标题：CPT. MARTIN SKYPOVSKI, USOL CDC（上尉 Martin Skypovski，USOL CDC） 日期行：[已涂黑] 2191 两侧条码文字：左 01090 832132；右 C0000239 正文 我们的安全部队受命在本地邪教组织举行的和平示威期间防止过激行为。 该示威与一个地方节日挂钩——\"首批殖民者日\"（DAY OF THE FIRST COLONISTS）。 本地邪教与\"秘密社团\"一向利用这一天在地方政府与平民之间挑动纷争，因此我们装备齐全，以防任何不必要的暴力。 我方部队由 4 个战术小队组成： \"WEASEL\"（黄鼠狼）小队，SGT. FUSSBENDER \"FULCRUM\"（支点）小队，SGT. SOUTHLAND——谈判小组，通常负责与主要煽动者对话 \"OCULUS\"（眼）小队，SGT. KENWOOD——由训练有素的行动人员组成的队伍，负责清除最暴力的目标 \"CERBERUS\"（刻耳柏洛斯）小队，SGT. KEEN——监视与侦察小队，负责整体监控局势 我们驻扎在 Skylift 入口附近，作为主要也是唯一的防线。 由于 Precentor Mc Mitney 的命令，我们不被允许携带枪械，因为游行本应是和平的。然而，我们完全清楚那些人会做出什么，几乎我们每个人身上都配了私人枪械。 那天，事态开始迅速升级。 到正午时分，所谓\"游行\"的主体已经抵达 Space Lift 的地基。人群非常激动，受到本地祭司与基本破坏本能的煽动。 知道这一点后，Sgt. Fussbender 试图找一位\"负责人\"谈一谈、缓和局势。遗憾的是没有成功，因为主要煽动者都待在离游行主体更远的地方，所以根本无从接触到他们。因此，谈判小组被召回，但 10 名行动人员中只有 5 人返回。其余人员的下落因后来发生的事件而不明。 由于人群被认为不理会劝告，一个 Fulcrum 小队被调来抓捕煽动者。他们部分成功地抓获了其中一名最响亮的煽动者。遗憾的是，这变成了一笔交易：一名行动人员也被人群\"扣留\"了。他无法混入人群这一点被视为耻辱，但并不危及生命。 然而，这名行动人员被抓一事成了更激进做法的导火索；当抗议者抵达主入口时，Cerberus 小队被启动。几分钟之内，\"游行\"就变成了狂暴人群与 USOL CDC 精英反暴乱部队之间的暴力对抗。那些家伙是在为我们争取时间。 我们在撤退请求中呼叫了支援，但没有回应——所有通信都被特别法令干扰，以防止信息扩散。显然，暴乱者已经预料到了这一点。任何正式行动都可能是灾难性的。一小队训练有素、积极性高的行动人员。我们的一队人马不得不撤入 Sky Lift 建筑，随后登上码头，把内部通道封锁在他们身后。然而，抗议者们并不高兴没能分到\"一杯羹\"，于是高喊着\"鲜肉\"决定跟着我们上到顶部。 等他们到达码头区域时，我们的穿梭机已经准备好并等候着。所有剩余的队员都已安全撤离了设施。 在登上穿梭机时，Sgt. Keen 报告说，他截获了一个信号，看起来像是被严重干扰、或完全加密的通信尝试；但他无法破译正确的协议。 就在飞船从太空码头解缆时，一道巨大的 EMP 波（或类似的东西）贯穿了整个空间站。 我们看到一艘正在离去的飞船失去全部动力，在码头附近失控旋转。几分钟后，那艘飞船撞上了码头本身。爆炸引发了连锁反应，炸掉了空间站的一大块，大概杀死了里面的所有人。大约 20 分钟后，在我们的人员得以恢复供电之后，我们收到命令：撤出该行星范围，与前来接应的 USOL 第 6 支援舰队会合。 总伤亡名单（TOTAL CASUALTIES LIST）： 8 名行动人员失踪（OPERATIVES MIA） 2 名行动人员确认阵亡（OPERATIVES CONFIRMED KIA） 行动状态（OPERATION STATUS）：失败（FAILED）"},{"id":128,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"USOL 审讯报告——贝克中士事件（USOL Interrogation Report — Sgt. Beck Incident）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/85A93C106F293611.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e标题\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e顶部：USOL 徽记\u003c/li\u003e\r\n\u003cli\u003eTHE INTERROGATION（审讯）\u003c/li\u003e\r\n\u003cli\u003e小字：that took place on [已涂黑] 05.12.2201, at the local USOL security outpost（发生于 [已涂黑] 05.12.2201，地点为当地 USOL 安全哨所）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e记录正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky（Blevsky 少校）\u003c/strong\u003e：我再问一次，你的小队到底出了什么事，中士？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck（Beck 中士）\u003c/strong\u003e：我向上帝发誓，长官，我真的不知道！我们当时在执行常规巡逻，一切都和往常一样！然后，突然，我们全都听到一阵刺耳的响声。我们都僵住了一两秒。那声音听起来像是一根金属管被某种巨大的力量撕开。然后，Alex 就不见了。他当时就站在我身后大约 5 米的地方，但没人看见那是怎么发生的。他就那么消失了！\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：你们找过他吗？是谁下令分开搜索的？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck\u003c/strong\u003e：我想是少尉。是他的声音，我确定！但我们没看到他，只看到一个身影走进了灌木丛。从背后看有点奇怪，但因为当时我们都很紧张，没人当回事。于是我们散开，开始搜索该区域。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：过了多久你才意识到你们和其他人全部失去了联系？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck\u003c/strong\u003e：我不确定，长官。感觉只过了 5 到 10 分钟，但当我看向多功能工具上的计时器时，它显示已经过去了 3 个小时。但我发誓太阳根本没有移动！光线完全一样！\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：集中精神，中士！你听到了什么？当时有任何无线电联络吗？你感觉如何？你做了什么？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck\u003c/strong\u003e：一切都很安静，长官。事实上，我可以发誓我一生中从未如此平静过。我感觉……有目的。周围的一切都在慢动作中。我感受到了宇宙，我感觉自己知道世上的一切。那是一种非常愉悦、却又令人震撼的感觉。所以我什么也没做，只是在那里站了一会儿；但等它过去，我就继续向南搜索。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：你是怎么从那里出来的？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck\u003c/strong\u003e：嗯，我推断我们一直是在往北走，所以我决定往回走。我找过我的队友，但一直尽量保持安静。我有个感觉，有什么人或者什么东西在盯着我。 那段时间我一直在走，浓雾覆盖了整个区域，所以我什么也看不见，直到我突然绊倒在单轨铁路的基座（monorail foundation）上。之后我往东走，被我们的巡逻队找到了。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：你还记得什么？你记得事件的确切坐标吗？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSgt. Beck\u003c/strong\u003e：不，长官。我试过回忆，但失败了。就好像有什么东西在阻止我记起来……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：好吧，中士。你可以走了。\u003c/p\u003e\r\n\u003cp\u003e\u003cem\u003eSgt. Beck 走出了审讯室。\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：和其他所有人一样。记忆缺失与定向障碍。医疗检查告诉我们什么，少尉？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eLt. Kovalsky（Kovalsky 少尉）\u003c/strong\u003e：如你所知，我们发现了 3 具高度腐烂的尸体，2 名士兵处于僵滞状态，另有 3 人有轻伤和定向障碍。报告显示他们原本是一个 10 人小队，最初是这样。我们的扫描显示尸体上有残留辐射，所有金属表面也有一些\"怪异\"读数。我无法解释。所有士兵——无论生死——的大脑都受到了某种影响。但最重要的是……这个小队自 2175 年起就被列为失踪（MIA）。我的建议是继续对所有士兵使用不同类型的先进技术做进一步研究。这条信息对我们目前正在调查的事情可能至关重要……\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eMajor Blevsky\u003c/strong\u003e：冷血混蛋，一如既往，Kovalsky 先生。很好，继续。愿上帝怜悯我们的灵魂。\u003c/p\u003e\r\n","text":"![](../img/85A93C106F293611.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 标题 顶部：USOL 徽记 THE INTERROGATION（审讯） 小字：that took place on [已涂黑] 05.12.2201, at the local USOL security outpost（发生于 [已涂黑] 05.12.2201，地点为当地 USOL 安全哨所） 记录正文 Major Blevsky（Blevsky 少校） ：我再问一次，你的小队到底出了什么事，中士？ Sgt. Beck（Beck 中士） ：我向上帝发誓，长官，我真的不知道！我们当时在执行常规巡逻，一切都和往常一样！然后，突然，我们全都听到一阵刺耳的响声。我们都僵住了一两秒。那声音听起来像是一根金属管被某种巨大的力量撕开。然后，Alex 就不见了。他当时就站在我身后大约 5 米的地方，但没人看见那是怎么发生的。他就那么消失了！ Major Blevsky ：你们找过他吗？是谁下令分开搜索的？ Sgt. Beck ：我想是少尉。是他的声音，我确定！但我们没看到他，只看到一个身影走进了灌木丛。从背后看有点奇怪，但因为当时我们都很紧张，没人当回事。于是我们散开，开始搜索该区域。 Major Blevsky ：过了多久你才意识到你们和其他人全部失去了联系？ Sgt. Beck ：我不确定，长官。感觉只过了 5 到 10 分钟，但当我看向多功能工具上的计时器时，它显示已经过去了 3 个小时。但我发誓太阳根本没有移动！光线完全一样！ Major Blevsky ：集中精神，中士！你听到了什么？当时有任何无线电联络吗？你感觉如何？你做了什么？ Sgt. Beck ：一切都很安静，长官。事实上，我可以发誓我一生中从未如此平静过。我感觉……有目的。周围的一切都在慢动作中。我感受到了宇宙，我感觉自己知道世上的一切。那是一种非常愉悦、却又令人震撼的感觉。所以我什么也没做，只是在那里站了一会儿；但等它过去，我就继续向南搜索。 Major Blevsky ：你是怎么从那里出来的？ Sgt. Beck ：嗯，我推断我们一直是在往北走，所以我决定往回走。我找过我的队友，但一直尽量保持安静。我有个感觉，有什么人或者什么东西在盯着我。 那段时间我一直在走，浓雾覆盖了整个区域，所以我什么也看不见，直到我突然绊倒在单轨铁路的基座（monorail foundation）上。之后我往东走，被我们的巡逻队找到了。 Major Blevsky ：你还记得什么？你记得事件的确切坐标吗？ Sgt. Beck ：不，长官。我试过回忆，但失败了。就好像有什么东西在阻止我记起来…… Major Blevsky ：好吧，中士。你可以走了。 Sgt. Beck 走出了审讯室。 Major Blevsky ：和其他所有人一样。记忆缺失与定向障碍。医疗检查告诉我们什么，少尉？ Lt. Kovalsky（Kovalsky 少尉） ：如你所知，我们发现了 3 具高度腐烂的尸体，2 名士兵处于僵滞状态，另有 3 人有轻伤和定向障碍。报告显示他们原本是一个 10 人小队，最初是这样。我们的扫描显示尸体上有残留辐射，所有金属表面也有一些\"怪异\"读数。我无法解释。所有士兵——无论生死——的大脑都受到了某种影响。但最重要的是……这个小队自 2175 年起就被列为失踪（MIA）。我的建议是继续对所有士兵使用不同类型的先进技术做进一步研究。这条信息对我们目前正在调查的事情可能至关重要…… Major Blevsky ：冷血混蛋，一如既往，Kovalsky 先生。很好，继续。愿上帝怜悯我们的灵魂。"},{"id":129,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"金库货运清单——银色 192 列车（Vault Cargo Manifest — Silver 192 Train）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/96CC77482E51D12A.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e标题区\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eTHE VAULT（金库）\u003c/li\u003e\r\n\u003cli\u003eCargo manifest（货物清单）\u003c/li\u003e\r\n\u003cli\u003eTrain \"Silver 192\"（列车\"银色 192\"）\u003c/li\u003e\r\n\u003cli\u003e标题下方有一处 [已涂黑] 的横向涂黑区域\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e清单\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| 编号 | 项目 | 数量 | | --- | --- | --- | | a) | PROSIM automated combines（PROSIM 自动联合收割机） | 5 units（5 台） | | b) | Seeds, type [已涂黑]（种子，型号 [已涂黑]） | 12 tons（12 吨） | | c) | Fertilizer（肥料） | 40 tons（40 吨） | | d) | disassembled CMM drones（拆解的 CMM 无人机） | 37 units（37 台） | | e) | communication equipment（通信设备） | 10 crates（10 箱） | | f) | chemicals（化学品） | 5 barrels（5 桶），旁注：possible leak detected（检测到可能泄漏） | | g) | Heavy machinery（重型机械） | 10 units（10 台） |\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e手写批注（标注：autor unknown／作者不明）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e「那些该死的无人机……它们已经离线，本应被拆解，但为什么我总觉得有人在监视我？我得小心处理这些家伙。」\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e左下角钢印编号\u003c/strong\u003e：B 9219\u003c/p\u003e\r\n","text":"![](../img/96CC77482E51D12A.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 标题区 THE VAULT（金库） Cargo manifest（货物清单） Train \"Silver 192\"（列车\"银色 192\"） 标题下方有一处 [已涂黑] 的横向涂黑区域 清单 | 编号 | 项目 | 数量 | | | | | | a) | PROSIM automated combines（PROSIM 自动联合收割机） | 5 units（5 台） | | b) | Seeds, type [已涂黑]（种子，型号 [已涂黑]） | 12 tons（12 吨） | | c) | Fertilizer（肥料） | 40 tons（40 吨） | | d) | disassembled CMM drones（拆解的 CMM 无人机） | 37 units（37 台） | | e) | communication equipment（通信设备） | 10 crates（10 箱） | | f) | chemicals（化学品） | 5 barrels（5 桶），旁注：possible leak detected（检测到可能泄漏） | | g) | Heavy machinery（重型机械） | 10 units（10 台） | 手写批注（标注：autor unknown／作者不明） 「那些该死的无人机……它们已经离线，本应被拆解，但为什么我总觉得有人在监视我？我得小心处理这些家伙。」 左下角钢印编号 ：B 9219"},{"id":130,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"怪案（Weird Case）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/0679737586435306.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉条\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左：DEPARTMENT OF SECURITY（安全部）／Document: \"Weird Case\"（文件：\"怪案\"）\u003c/li\u003e\r\n\u003cli\u003e右：Form I-928C, Filed Evidence（表格 I-928C，归档证据）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e标题\u003c/strong\u003e：WEIRD CASE（怪案）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e副标题\u003c/strong\u003e：[已涂黑] 2182, INTERCEPTED MEETING TRANSCRIPT（2182 年，截获的会面记录）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e记录正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e15:52　Brother Malkob（Malkob 兄弟）\u003c/strong\u003e：孩子，你下定决心了吗？你是否愿意并且准备好走上第一探索者（First Explorers）之路？\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e15:53　Recruit（招募对象）\u003c/strong\u003e：是的，父亲。我的意志是坚定的。我会做一切必要之事，成为你们中的一员。我会为我们的行星和我们的信仰而战。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e15:55　Brother Malkob\u003c/strong\u003e：那就随我走到圣田去，那里赐予我们所有人救赎。圣食与圣水在那里等着你，等你准备好，我们就开始仪式。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e（下方调查报告）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e一具尸体在看起来像某种化学实验室的地方附近被发现。内脏被部分摘除，或者看起来被变成了某种糊状物。\u003c/p\u003e\r\n\u003cp\u003e尸体看起来很新鲜，但一个多月来没有任何失踪人口的报告；然而它符合一名想加入 [已涂黑] 教派的年轻人的描述。\u003c/p\u003e\r\n\u003cp\u003e我们怀疑此人被用于测试某种效果不太好的生物化合物。奉当地和平机构（Peace facility）之命，无论如何我们都要进行搜查。有结果我会随时汇报。\u003c/p\u003e\r\n\u003cp\u003eUSOL CDC（Colony development corps／殖民地开发军团） Lt. Frank Sullivan（Frank Sullivan 少尉）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e侧边条码文字\u003c/strong\u003e：FEE-DWC-03059-0A5E-09E8C0C8C3F04\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e页脚\u003c/strong\u003e：This document has been verified by the Department of Security. All rights reserved.（本文件已由安全部核验。保留所有权利。）／Form I-928C, Filed Evidence\u003c/p\u003e\r\n","text":"![](../img/0679737586435306.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉条 左：DEPARTMENT OF SECURITY（安全部）／Document: \"Weird Case\"（文件：\"怪案\"） 右：Form I 928C, Filed Evidence（表格 I 928C，归档证据） 标题 ：WEIRD CASE（怪案） 副标题 ：[已涂黑] 2182, INTERCEPTED MEETING TRANSCRIPT（2182 年，截获的会面记录） 记录正文 15:52 Brother Malkob（Malkob 兄弟） ：孩子，你下定决心了吗？你是否愿意并且准备好走上第一探索者（First Explorers）之路？ 15:53 Recruit（招募对象） ：是的，父亲。我的意志是坚定的。我会做一切必要之事，成为你们中的一员。我会为我们的行星和我们的信仰而战。 15:55 Brother Malkob ：那就随我走到圣田去，那里赐予我们所有人救赎。圣食与圣水在那里等着你，等你准备好，我们就开始仪式。 （下方调查报告） 一具尸体在看起来像某种化学实验室的地方附近被发现。内脏被部分摘除，或者看起来被变成了某种糊状物。 尸体看起来很新鲜，但一个多月来没有任何失踪人口的报告；然而它符合一名想加入 [已涂黑] 教派的年轻人的描述。 我们怀疑此人被用于测试某种效果不太好的生物化合物。奉当地和平机构（Peace facility）之命，无论如何我们都要进行搜查。有结果我会随时汇报。 USOL CDC（Colony development corps／殖民地开发军团） Lt. Frank Sullivan（Frank Sullivan 少尉） 侧边条码文字 ：FEE DWC 03059 0A5E 09E8C0C8C3F04 页脚 ：This document has been verified by the Department of Security. All rights reserved.（本文件已由安全部核验。保留所有权利。）／Form I 928C, Filed Evidence"},{"id":131,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"证人陈述（Witness Statement）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/1BB2FEDC370ABFD7.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片说明\u003c/h2\u003e\r\n\u003cp\u003e一张俯拍照片：一个圆形的金属舱盖／检修口，表面铸有 USOL 的星形徽记与几行磨损的小字，边缘带有把手与铰链，画面布满扫描线噪点。\u003c/p\u003e\r\n","text":"![](../img/1BB2FEDC370ABFD7.jpg) 图片说明 一张俯拍照片：一个圆形的金属舱盖／检修口，表面铸有 USOL 的星形徽记与几行磨损的小字，边缘带有把手与铰链，画面布满扫描线噪点。"},{"id":132,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"Zulu-12 星区（Zulu-12 Sector）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/348C07C70B108E4B.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e页眉\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上：ASTROCROP 徽标（水滴形图案）与字样\u003c/li\u003e\r\n\u003cli\u003e标题框：Zulu 12 Sector Status（Zulu 12 扇区状况）\u003c/li\u003e\r\n\u003cli\u003eUPDATE 2085（2085 年更新）\u003c/li\u003e\r\n\u003cli\u003e提交人（PRESENTED BY）：Caretaker Silvia Shepherd，5th reclamation regiment. Redacted copy.（管理员 Silvia Shepherd，第 5 复垦团。删节本）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e……我们在植物基因组改造方面的最新进展给了我们希望：我们正在培育的一种新树种，将足够耐用以承受 Zulu 扇区的严酷条件。\u003c/p\u003e\r\n\u003cp\u003e不幸的是，到目前为止我们所有的实验都因极端的土壤污染而失败。\u003c/p\u003e\r\n\u003cp\u003e第 5 复垦团建议，Zulu 12 扇区应清除所有造成污染的设备和机械。我们理解该区域的某些生产对当地混凝土厂和轻机械厂的供应链至关重要，但我们想指出，增加一片新的、快速生长的森林，将使约 300 平方公里的领土变得宜居。 我们坚持认为，为我们不断增长的人口创造新的栖息地，从长远来看，比耗尽所有仍陷在泥里的稀缺资源要\"划算\"得多。\u003c/p\u003e\r\n\u003cp\u003e另外，我们想建议考察 13 号和 15 号扇区，作为新植物的可能试验地点。我们的初步扫描表明，那里的化学污染水平应该更低，不过由于附近核电站的坍塌，辐射水平仍然极高。\u003c/p\u003e\r\n\u003cp\u003e鉴于以上所有情况，我们想开始向 12、13 和 15 号扇区派出侦察队，进一步调查实际情况。此外，我们认为应让 Sustenance 特权方（Sustenance prerogative）知晓该区域某处可能存在一个 CORE Tech 综合设施。\u003c/p\u003e\r\n\u003cp\u003e与此同时，我们的生物技术团队声称，他们几乎准备好展示一种新版本的植物，它将具备抗辐射能力（当然，到某种程度），并且不会把辐射储存在自身内。预计在两个标准 Terran 月后可以测试。 我要说的就这些。\u003c/p\u003e\r\n\u003cp\u003e赞美母亲（Praised be the Mother）。\u003c/p\u003e\r\n","text":"![](../img/348C07C70B108E4B.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 页眉 左上：ASTROCROP 徽标（水滴形图案）与字样 标题框：Zulu 12 Sector Status（Zulu 12 扇区状况） UPDATE 2085（2085 年更新） 提交人（PRESENTED BY）：Caretaker Silvia Shepherd，5th reclamation regiment. Redacted copy.（管理员 Silvia Shepherd，第 5 复垦团。删节本） 正文 ……我们在植物基因组改造方面的最新进展给了我们希望：我们正在培育的一种新树种，将足够耐用以承受 Zulu 扇区的严酷条件。 不幸的是，到目前为止我们所有的实验都因极端的土壤污染而失败。 第 5 复垦团建议，Zulu 12 扇区应清除所有造成污染的设备和机械。我们理解该区域的某些生产对当地混凝土厂和轻机械厂的供应链至关重要，但我们想指出，增加一片新的、快速生长的森林，将使约 300 平方公里的领土变得宜居。 我们坚持认为，为我们不断增长的人口创造新的栖息地，从长远来看，比耗尽所有仍陷在泥里的稀缺资源要\"划算\"得多。 另外，我们想建议考察 13 号和 15 号扇区，作为新植物的可能试验地点。我们的初步扫描表明，那里的化学污染水平应该更低，不过由于附近核电站的坍塌，辐射水平仍然极高。 鉴于以上所有情况，我们想开始向 12、13 和 15 号扇区派出侦察队，进一步调查实际情况。此外，我们认为应让 Sustenance 特权方（Sustenance prerogative）知晓该区域某处可能存在一个 CORE Tech 综合设施。 与此同时，我们的生物技术团队声称，他们几乎准备好展示一种新版本的植物，它将具备抗辐射能力（当然，到某种程度），并且不会把辐射储存在自身内。预计在两个标准 Terran 月后可以测试。 我要说的就这些。 赞美母亲（Praised be the Mother）。"},{"id":133,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"5CRYPt0L (3)","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/BD1F73BDCF0A353F.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e[无法辨认]\u003c/p\u003e\r\n\u003cp\u003e配图是一屏黑底、覆有彩色噪点与横向扫描线的文本界面，其上排布着多段左右对齐的文本块。这些字符是一套自造的虚构符号字体（由尖角、圆圈、短横与点组合而成），既不是拉丁字母、西里尔字母，也不是任何可对照的现行文字，因此无法逐字转写、无法辨读词句；只能看出它是一段分段排列的连续文本，其中含带引号的片段以及问号、感叹号等标点。\u003c/p\u003e\r\n","text":"![](../img/BD1F73BDCF0A353F.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 [无法辨认] 配图是一屏黑底、覆有彩色噪点与横向扫描线的文本界面，其上排布着多段左右对齐的文本块。这些字符是一套自造的虚构符号字体（由尖角、圆圈、短横与点组合而成），既不是拉丁字母、西里尔字母，也不是任何可对照的现行文字，因此无法逐字转写、无法辨读词句；只能看出它是一段分段排列的连续文本，其中含带引号的片段以及问号、感叹号等标点。"},{"id":134,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"5CRYPt0L 可执行存根（5CRYPt0L Executable Stub）","type":"MARKDOWN","html":"\u003cp\u003e[解密工具]\u003c/p\u003e\r\n\u003cp\u003e版本：3.0 状态：就绪 目标：时间线碎片\u003c/p\u003e\r\n\u003cp\u003e正在执行解密序列……\u003c/p\u003e\r\n\u003cp\u003e[警告] CORIE 安全系统检测到恶意特征 [警报] 启动自动隔离 [已删除] 文件已从系统中移除\u003c/p\u003e\r\n","text":"[解密工具] 版本：3.0 状态：就绪 目标：时间线碎片 正在执行解密序列…… [警告] CORIE 安全系统检测到恶意特征 [警报] 启动自动隔离 [已删除] 文件已从系统中移除"},{"id":135,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"访问违规报告（access_viola 3cp\u003e经理： 放松。 我不会告诉你手下那帮小子。\u003c/p\u003e\r\n\u003cp\u003e那会毁了你的一切。 你的形象。 那种恐惧。 那份敬畏。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 你不明白。\u003c/p\u003e\r\n\u003cp\u003e经理： 我完全明白。\u003c/p\u003e\r\n\u003cp\u003e所以这才贵。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 她跟别人不一样。\u003c/p\u003e\r\n\u003cp\u003e经理： 你们都这么说。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 不。 她会听。\u003c/p\u003e\r\n\u003cp\u003e经理： 当心。 你开始动心了。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我已经动心了。\u003c/p\u003e\r\n\u003cp\u003e经理： 那就听我的。\u003c/p\u003e\r\n\u003cp\u003e如果你要她平安， 就别掺和我们的事。\u003c/p\u003e\r\n\u003cp\u003e别问。 别打听路线。 别好奇。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 那批货呢？\u003c/p\u003e\r\n\u003cp\u003e经理： 处理好了。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 谁处理？\u003c/p\u003e\r\n\u003cp\u003e经理： 专业人士。\u003c/p\u003e\r\n\u003cp\u003e你不需要知道更多。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我的人在问问题。\u003c/p\u003e\r\n\u003cp\u003e经理： 让他们问。\u003c/p\u003e\r\n\u003cp\u003e他们都是蠢货。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 他们到底是我的人。\u003c/p\u003e\r\n\u003cp\u003e经理： 不会太久了。\u003c/p\u003e\r\n\u003cp\u003e别担心。 她不会再接客了。\u003c/p\u003e\r\n\u003cp\u003e出了这事之后，不会。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 你发誓？\u003c/p\u003e\r\n\u003cp\u003e经理： 我从不发誓。\u003c/p\u003e\r\n","text":"[私人对话] Antonovich： 我要她离开。 我知道这听起来像什么。 我不在乎。 她不该再待在那儿了。 经理： 你知道这行是怎么运作的。 她不是财产。 Antonovich： 我付钱。 比任何人都多。 只管告诉我数字。 经理： 我知道。 我知道你为什么要问。 Antonovich： 别说。 经理： 放松。 我不会告诉你手下那帮小子。 那会毁了你的一切。 你的形象。 那种恐惧。 那份敬畏。 Antonovich： 你不明白。 经理： 我完全明白。 所以这才贵。 Antonovich： 她跟别人不一样。 经理： 你们都这么说。 Antonovich： 不。 她会听。 经理： 当心。 你开始动心了。 Antonovich： 我已经动心了。 经理： 那就听我的。 如果你要她平安， 就别掺和我们的事。 别问。 别打听路线。 别好奇。 Antonovich： 那批货呢？ 经理： 处理好了。 Antonovich： 谁处理？ 经理： 专业人士。 你不需要知道更多。 Antonovich： 我的人在问问题。 经理： 让他们问。 他们都是蠢货。 Antonovich： 他们到底是我的人。 经理： 不会太久了。 别担心。 她不会再接客了。 出了这事之后，不会。 Antonovich： 你发誓？ 经理： 我从不发誓。"},{"id":138,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Bezdelniki 情报报告（Bezdelniki Intel Report）","type":"MARKDOWN","html":"\u003cp\u003e邮件：情报报告，PALIMPEST。\u003c/p\u003e\r\n\u003cp\u003e发件人：Serhio\u003c/p\u003e\r\n\u003cp\u003e收件人：-已隐去-\u003c/p\u003e\r\n\u003cp\u003e老大！那帮 Vokrt 蠢货又砸了一家店。这周第二家了。整个街区都火了，恨不得要他们的血，可看样子有人在给他们供枪！ 而且不止如此，看起来那个“某人”还把枪卖给别的相关方。 这下面很快就要彻底乱套了！ 我的人找到了一台改装过的等离子切割器，老大，能射到三十米远！这简直疯了！呃，我是说，它开完一枪当然会炸……但你懂我意思！你能不能帮帮我们？\u003c/p\u003e\r\n\u003cp\u003e另外，我们跟过他们的头儿——那个叫“Antouan”的家伙。他他妈的瘆人得很，所有人都怕他，但我们听说，连他自己的手下都说他最近变了，迷上了什么东西，而且变得更暴戾，还有他一直往那个“Velluto”场子跑，你懂的，有姑娘的那种……\u003c/p\u003e\r\n\u003cp\u003e你知道那地方是谁的吧？大伙觉得它跟最近那起劫案有点关系。像是里面有人跟那家伙通了气。不然他还能从哪儿及时拿到地点和时间的消息？\u003c/p\u003e\r\n\u003cp\u003e我们自作主张去找了那个老熟人帮忙，他查到了他们内部站点的地址，“backroom.local”，但是加密的，我们弄不到密码。得找个有本事的人来，你懂的……\u003c/p\u003e\r\n\u003cp\u003e还有一件事，老大。恕我直言，我们觉得 Voktr 那帮人不是做主的人。他们蠢。不可能全靠自己干出这些事。\u003c/p\u003e\r\n","text":"邮件：情报报告，PALIMPEST。 发件人：Serhio 收件人： 已隐去 老大！那帮 Vokrt 蠢货又砸了一家店。这周第二家了。整个街区都火了，恨不得要他们的血，可看样子有人在给他们供枪！ 而且不止如此，看起来那个“某人”还把枪卖给别的相关方。 这下面很快就要彻底乱套了！ 我的人找到了一台改装过的等离子切割器，老大，能射到三十米远！这简直疯了！呃，我是说，它开完一枪当然会炸……但你懂我意思！你能不能帮帮我们？ 另外，我们跟过他们的头儿——那个叫“Antouan”的家伙。他他妈的瘆人得很，所有人都怕他，但我们听说，连他自己的手下都说他最近变了，迷上了什么东西，而且变得更暴戾，还有他一直往那个“Velluto”场子跑，你懂的，有姑娘的那种…… 你知道那地方是谁的吧？大伙觉得它跟最近那起劫案有点关系。像是里面有人跟那家伙通了气。不然他还能从哪儿及时拿到地点和时间的消息？ 我们自作主张去找了那个老熟人帮忙，他查到了他们内部站点的地址，“backroom.local”，但是加密的，我们弄不到密码。得找个有本事的人来，你懂的…… 还有一件事，老大。恕我直言，我们觉得 Voktr 那帮人不是做主的人。他们蠢。不可能全靠自己干出这些事。"},{"id":139,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"无聊的破烂（boring_shit/）","type":"MARKDOWN","html":"\u003cp\u003eboring_shit/ ├── music ├── old_photos └── dont_open\u003c/p\u003e\r\n\u003cp\u003emusic：文件已损坏 old_photos：文件已损坏 dont_open：文件已损坏\u003c/p\u003e\r\n","text":"boring shit/ ├── music ├── old photos └── dont open music：文件已损坏 old photos：文件已损坏 dont open：文件已损坏"},{"id":140,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"货舱维修报告 2 —— 文本（Cargo Hold Repair Report 2 — Text）","type":"MARKDOWN","html":"\u003cp\u003e关于货舱作业报告的补充：\u003c/p\u003e\r\n\u003cp\u003e清理完货舱里的集装箱堆之后，船员对 Fetcher 2 AMR 物流机器人（Fetcher_242 单机）启动了诊断，以评估损伤情况，同时尝试恢复其功能。\u003c/p\u003e\r\n\u003cp\u003e诊断显示所受损伤如下：\u003c/p\u003e\r\n\u003cp\u003e机械臂——轻微损伤，对功能影响极小\u003c/p\u003e\r\n\u003cp\u003e驱动舱——几何结构受损，但功能得以保留。使用时电池消耗可能增加。使用中有驱动过载的风险。建议更换。\u003c/p\u003e\r\n\u003cp\u003e机体损伤：电池组区域有一处约 3 厘米深的凹陷（依据该设备的图纸判断）。电池受损的可能性很高。在飞船船体上无法拆解机器人机体。\u003c/p\u003e\r\n\u003cp\u003e带着这种损伤，机器人无法执行其功能，并报出错误 P0A80。\u003c/p\u003e\r\n\u003cp\u003e技术员 Charlie 为修复机器人耗费了相当长的时间，但没有成功。这次失败可能不仅源于情况的复杂，也源于 Charlie 自身的“复杂”。\u003c/p\u003e\r\n\u003cp\u003e机器人维修评估：\u003c/p\u003e\r\n\u003cp\u003e最好的情况——把机器人送到服务中心维护，更换电芯或整块电池\u003c/p\u003e\r\n\u003cp\u003e最坏的情况——采购一台新机器人。\u003c/p\u003e\r\n","text":"关于货舱作业报告的补充： 清理完货舱里的集装箱堆之后，船员对 Fetcher 2 AMR 物流机器人（Fetcher 242 单机）启动了诊断，以评估损伤情况，同时尝试恢复其功能。 诊断显示所受损伤如下： 机械臂——轻微损伤，对功能影响极小 驱动舱——几何结构受损，但功能得以保留。使用时电池消耗可能增加。使用中有驱动过载的风险。建议更换。 机体损伤：电池组区域有一处约 3 厘米深的凹陷（依据该设备的图纸判断）。电池受损的可能性很高。在飞船船体上无法拆解机器人机体。 带着这种损伤，机器人无法执行其功能，并报出错误 P0A80。 技术员 Charlie 为修复机器人耗费了相当长的时间，但没有成功。这次失败可能不仅源于情况的复杂，也源于 Charlie 自身的“复杂”。 机器人维修评估： 最好的情况——把机器人送到服务中心维护，更换电芯或整块电池 最坏的情况——采购一台新机器人。"},{"id":141,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"货舱维修报告 2（Cargo Hold Repair Report 2）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/7765561BB63488CB.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片说明\u003c/h2\u003e\r\n\u003cp\u003e纯黑背景的深空星空照，画面中散布着大量大小不一的白色星点，没有任何飞船、结构物、人物或文字。\u003c/p\u003e\r\n","text":"![](../img/7765561BB63488CB.png) 图片说明 纯黑背景的深空星空照，画面中散布着大量大小不一的白色星点，没有任何飞船、结构物、人物或文字。"},{"id":142,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"现金估算（cash_approx.txt）","type":"MARKDOWN","html":"\u003cp\u003e现金（估算）\u003c/p\u003e\r\n\u003cp\u003e昨天还行 今天少些\u003c/p\u003e\r\n\u003cp\u003e店里跑了一趟，有点进项 不多，但还行\u003c/p\u003e\r\n\u003cp\u003e弹药现在更贵了 枪还行\u003c/p\u003e\r\n\u003cp\u003eanton 说钱要来 也许快了\u003c/p\u003e\r\n\u003cp\u003e聚会花得太多 又一次\u003c/p\u003e\r\n\u003cp\u003e得别再乱花了 不然最后啥也不剩\u003c/p\u003e\r\n\u003cp\u003e晚点再查一遍\u003c/p\u003e\r\n","text":"现金（估算） 昨天还行 今天少些 店里跑了一趟，有点进项 不多，但还行 弹药现在更贵了 枪还行 anton 说钱要来 也许快了 聚会花得太多 又一次 得别再乱花了 不然最后啥也不剩 晚点再查一遍"},{"id":143,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"陪侍登记册（companion_registry.txt）","type":"MARKDOWN","ht 土壤样本\u003c/p\u003e\r\n\u003cp\u003e— 从碎片散布区采集的微量颗粒物\u003c/p\u003e\r\n\u003cp\u003e— 从回收遗骸与设备残片采集的拭子样本\u003c/p\u003e\r\n\u003cp\u003e方法：\u003c/p\u003e\r\n\u003cp\u003e— 气相色谱—质谱联用（GC-MS）\u003c/p\u003e\r\n\u003cp\u003e— 傅里叶变换红外光谱（FTIR）\u003c/p\u003e\r\n\u003cp\u003e— 离子色谱（IC）\u003c/p\u003e\r\n\u003cp\u003e— 扫描电子显微镜—能量色散 X 射线谱（SEM-EDS）\u003c/p\u003e\r\n\u003cp\u003e— 差示扫描量热法（DSC）\u003c/p\u003e\r\n\u003cp\u003e结论：\u003c/p\u003e\r\n\u003cp\u003e爆炸物分类\u003c/p\u003e\r\n\u003cp\u003e分析确认存在一种高能炸药化合物。\u003c/p\u003e\r\n\u003cp\u003e该炸药与任何已商业登记的\u003c/p\u003e\r\n\u003cp\u003e民用、采矿或工业炸药配方均不吻合。\u003c/p\u003e\r\n\u003cp\u003e在议会爆炸物参考数据库（CERD）中未找到直接匹配项。\u003c/p\u003e\r\n\u003cp\u003e化学成分（检出的组分）\u003c/p\u003e\r\n\u003cp\u003e主要含能化合物：\u003c/p\u003e\r\n\u003cp\u003e— 环三亚甲基三硝胺（RDX）：微量至中等检出\u003c/p\u003e\r\n\u003cp\u003e— 季戊四醇四硝酸酯（PETN）：微量检出\u003c/p\u003e\r\n\u003cp\u003e次要化合物：\u003c/p\u003e\r\n\u003cp\u003e— 稳定化硝酸酯\u003c/p\u003e\r\n\u003cp\u003e— 聚合物粘结含能基体（类 PBX 结构）\u003c/p\u003e\r\n\u003cp\u003e添加剂与改性剂：\u003c/p\u003e\r\n\u003cp\u003e— 钝感剂（确切配方未能确定）\u003c/p\u003e\r\n\u003cp\u003e— 增塑剂，与受控的爆轰成形工艺相符\u003c/p\u003e\r\n\u003cp\u003e— 微颗粒氧化铝残留（氧化副产物）\u003c/p\u003e\r\n\u003cp\u003e显著缺失项：\u003c/p\u003e\r\n\u003cp\u003e— 硝酸铵（AN）\u003c/p\u003e\r\n\u003cp\u003e— 燃料油残留（FO）\u003c/p\u003e\r\n\u003cp\u003e— 氯酸盐或高氯酸盐\u003c/p\u003e\r\n\u003cp\u003e— 黑火药成分\u003c/p\u003e\r\n\u003cp\u003e制造特征\u003c/p\u003e\r\n\u003cp\u003e所检出的化合物表现出： — 均质的分子分布\u003c/p\u003e\r\n\u003cp\u003e— 无杂质聚集\u003c/p\u003e\r\n\u003cp\u003e— 受控的晶粒形貌\u003c/p\u003e\r\n\u003cp\u003e这些特征与简易爆炸装置（IED）不符。\u003c/p\u003e\r\n\u003cp\u003e该配方表明：\u003c/p\u003e\r\n\u003cp\u003e— 实验室条件下的受控合成\u003c/p\u003e\r\n\u003cp\u003e— 具备前体纯化能力\u003c/p\u003e\r\n\u003cp\u003e— 掌握爆速优化知识\u003c/p\u003e\r\n\u003cp\u003e爆轰特性\u003c/p\u003e\r\n\u003cp\u003e估算爆速：\u003c/p\u003e\r\n\u003cp\u003e— 介于 7,200 至 7,800 米/秒之间（计算值）\u003c/p\u003e\r\n\u003cp\u003e爆炸模式分析表明：\u003c/p\u003e\r\n\u003cp\u003e— 能量定向释放\u003c/p\u003e\r\n\u003cp\u003e— 二次破片有限\u003c/p\u003e\r\n\u003cp\u003e— 超出预期半径的残留物散布极少\u003c/p\u003e\r\n\u003cp\u003e这表明： — 装药位置精确\u003c/p\u003e\r\n\u003cp\u003e— 爆轰几何经过预先计算\u003c/p\u003e\r\n\u003cp\u003e起爆系统\u003c/p\u003e\r\n\u003cp\u003e未回收完整的雷管部件。\u003c/p\u003e\r\n\u003cp\u003e但残留物分布形态表明：\u003c/p\u003e\r\n\u003cp\u003e— 多级起爆序列\u003c/p\u003e\r\n\u003cp\u003e— 使用了高可靠性首发装药\u003c/p\u003e\r\n\u003cp\u003e无法确认或排除电子起爆。\u003c/p\u003e\r\n\u003cp\u003e环境相互作用\u003c/p\u003e\r\n\u003cp\u003e土壤硝化程度与以下情形相符：\u003c/p\u003e\r\n\u003cp\u003e— 短时高温暴露\u003c/p\u003e\r\n\u003cp\u003e— 无持续燃烧\u003c/p\u003e\r\n\u003cp\u003e未检测到爆后火灾的证据。\u003c/p\u003e\r\n\u003cp\u003e对比分析\u003c/p\u003e\r\n\u003cp\u003e该爆炸物成分与以下各项均不匹配：\u003c/p\u003e\r\n\u003cp\u003e— 已知的恐怖袭击特征\u003c/p\u003e\r\n\u003cp\u003e— 近期卡特尔相关的爆炸事件\u003c/p\u003e\r\n\u003cp\u003e— 常见私营军事公司的制式弹药\u003c/p\u003e\r\n\u003cp\u003e仅凭化学特征无法作出直接归属判断。\u003c/p\u003e\r\n\u003cp\u003e结论：\u003c/p\u003e\r\n\u003cp\u003e9912-47-L 号事件中所使用的爆炸材料\u003c/p\u003e\r\n\u003cp\u003e为专业制造的高能炸药。\u003c/p\u003e\r\n\u003cp\u003e该装置与以下情形不符：\u003c/p\u003e\r\n\u003cp\u003e— 临时拼装构造\u003c/p\u003e\r\n\u003cp\u003e— 机会型犯罪活动\u003c/p\u003e\r\n\u003cp\u003e其来源、制造者与运送方式\u003c/p\u003e\r\n\u003cp\u003e无法依据现有证据确定。\u003c/p\u003e\r\n\u003cp\u003e报告编制者：\u003c/p\u003e\r\n\u003cp\u003e法证化学处\u003c/p\u003e\r\n\u003cp\u003e报告结束。\u003c/p\u003e\r\n","text":"爆炸物法证材料报告 案件编号：9912 47 L 实验室编号：CFX 8841 委托单位：外环运输巡逻队 收样日期：[已隐去] 完成日期：[已隐去] 送检材料： — 金属碎片残留（车辆结构） — 起爆中心及外围土壤样本 — 从碎片散布区采集的微量颗粒物 — 从回收遗骸与设备残片采集的拭子样本 方法： — 气相色谱—质谱联用（GC MS） — 傅里叶变换红外光谱（FTIR） — 离子色谱（IC） — 扫描电子显微镜—能量色散 X 射线谱（SEM EDS） — 差示扫描量热法（DSC） 结论： 爆炸物分类 分析确认存在一种高能炸药化合物。 该炸药与任何已商业登记的 民用、采矿或工业炸药配方均不吻合。 在议会爆炸物参考数据库（CERD）中未找到直接匹配项。 化学成分（检出的组分） 主要含能化合物： — 环三亚甲基三硝胺（RDX）：微量至中等检出 — 季戊四醇四硝酸酯（PETN）：微量检出 次要化合物： — 稳定化硝酸酯 — 聚合物粘结含能基体（类 PBX 结构） 添加剂与改性剂： — 钝感剂（确切配方未能确定） — 增塑剂，与受控的爆轰成形工艺相符 — 微颗粒氧化铝残留（氧化副产物） 显著缺失项： — 硝酸铵（AN） — 燃料油残留（FO） — 氯酸盐或高氯酸盐 — 黑火药成分 制造特征 所检出的化合物表现出： — 均质的分子分布 — 无杂质聚集 — 受控的晶粒形貌 这些特征与简易爆炸装置（IED）不符。 该配方表明： — 实验室条件下的受控合成 — 具备前体纯化能力 — 掌握爆速优化知识 爆轰特性 估算爆速： — 介于 7,200 至 7,800 米/秒之间（计算值） 爆炸模式分析表明： — 能量定向释放 — 二次破片有限 — 超出预期半径的残留物散布极少 这表明： — 装药位置精确 — 爆轰几何经过预先计算 起爆系统 未回收完整的雷管部件。 但残留物分布形态表明： — 多级起爆序列 — 使用了高可靠性首发装药 无法确认或排除电子起爆。 环境相互作用 土壤硝化程度与以下情形相符： — 短时高温暴露 — 无持续燃烧 未检测到爆后火灾的证据。 对比分析 该爆炸物成分与以下各项均不匹配： — 已知的恐怖袭击特征 — 近期卡特尔相关的爆炸事件 — 常见私营军事公司的制式弹药 仅凭化学特征无法作出直接归属判断。 结论： 9912 47 L 号事件中所使用的爆炸材料 为专业制造的高能炸药。 该装置与以下情形不符： — 临时拼装构造 — 机会型犯罪活动 其来源、制造者与运送方式 无法依据现有证据确定。 报告编制者： 法证化学处 报告结束。"},{"id":149,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"幽灵站点档案（Ghost Sites Archive）","type":"MARKDOWN","html":"\u003cp\u003e外围巡逻日志\u003c/p\u003e\r\n\u003cp\u003e一份巡逻日志起初只是关于工程化鳄鱼守卫生物的例行闲聊，最后却以通讯骤然中断收场。一支 Omega 突击队消灭了守卫，随后在遭遇同样的生物后归于沉默。结尾的一段对话确认了真正的反转：该站点把机械鳄鱼当作外围资产，而另有他人赶到，来打劫残局。\u003c/p\u003e\r\n\u003cp\u003e进行中的行动\u003c/p\u003e\r\n\u003cp\u003e即将展开的行动\u003c/p\u003e\r\n","text":"外围巡逻日志 一份巡逻日志起初只是关于工程化鳄鱼守卫生物的例行闲聊，最后却以通讯骤然中断收场。一支 Omega 突击队消灭了守卫，随后在遭遇同样的生物后归于沉默。结尾的一段对话确认了真正的反转：该站点把机械鳄鱼当作外围资产，而另有他人赶到，来打劫残局。 进行中的行动 即将展开的行动"},{"id":150,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"幽灵站点行动档案（Ghost Sites Operations Archive）","type":"MARKDOWN","html":"\u003cp\u003ePRIVATE CLUB 行动档案\u003c/p\u003e\r\n\u003cp\u003e进行中的行动\u003c/p\u003e\r\n\u003cp\u003e1. 香蕉爆响（Banana Boom） 状态：进行中 客户：Steinway Agriculture 任务：夺取种植园站点并审问人员。若基因改造的说法得到证实，则控制该站点并移交。 地点：18-56b 号农业站 战术：Blue 连、Golden 连、Spiderling 网络技术小组。\u003c/p\u003e\r\n\u003cp\u003e2. 红色赌局（Red Gambit） 状态：进行中／最高机密 客户：Shanxue Industry 任务：在木星环 ST60 站点实施假旗客服行动。 目标：伪装成 USOL 作战人员，突入站点，制造混乱，引发政治反应，同时将总体人员损失控制在约定阈值以下。 战术：Ember 连、The Bull 小队、Terminus 小队、Crazy Rabbit 穿梭机。\u003c/p\u003e\r\n\u003cp\u003e即将展开的行动\u003c/p\u003e\r\n\u003cp\u003e1. 兔子暴动（Bunny Riot）——深空邮轮在船员崩溃后的救援行动。 2. F-150.2 车队——常规月面车队护送，从生产场区到发射台。 3. 终端清扫（Terminal Sweep）——清除若干幽灵站点及其所有关联方。 4. 渡鸦之爪（Raven Claw）——获取并运输一艘新型破障级穿梭机。 5. 试炼（The Trials）——在 Omega-15 号监狱小行星上的招募行动。 6. 上瘾粉丝（Addictive Fans）——为一名 VIP 客户实施的认知战与人群控制。 7. 女王（The Queen）——为 Evangelina 加冕金星贸易航线海盗女王提供安保。\u003c/p\u003e\r\n","text":"PRIVATE CLUB 行动档案 进行中的行动 1. 香蕉爆响（Banana Boom） 状态：进行中 客户：Steinway Agriculture 任务：夺取种植园站点并审问人员。若基因改造的说法得到证实，则控制该站点并移交。 地点
