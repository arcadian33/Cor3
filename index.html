商。 他们就是负责建造的。就是这么直接。 你在任何地方见到的、凡属 SOYUZ 设计的建筑 —— 很可能就是他们建的。"},{"id":75,"cat":"公司／势力","dir":"02_Factions","title":"USOL","type":"FRACTION_LOGO","html":"\u003cp\u003e\u003cimg src=\"codex/img/66B006BC0AB1E85F.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003cp\u003e太阳系的主要派系之一。\u003c/p\u003e\r\n\u003cp\u003e他们以（一切事物上的）自由为原则，在行事方式中全面拥抱“适者生存”的态度。内部竞争是他们的驱动力，而共同的外部敌人（SOYUZ 与 Terra Mater）又让他们团结在一起；他们主要依靠空间站与小行星基地，而不是殖民地。他们的计划是把太阳系利用到极限，而不去考虑遥远的未来 —— 而他们非常擅长把这一理念落到实处。\u003c/p\u003e\r\n","text":"![](../img/66B006BC0AB1E85F.png) 太阳系的主要派系之一。 他们以（一切事物上的）自由为原则，在行事方式中全面拥抱“适者生存”的态度。内部竞争是他们的驱动力，而共同的外部敌人（SOYUZ 与 Terra Mater）又让他们团结在一起；他们主要依靠空间站与小行星基地，而不是殖民地。他们的计划是把太阳系利用到极限，而不去考虑遥远的未来 —— 而他们非常擅长把这一理念落到实处。"},{"id":76,"cat":"公司／势力","dir":"02_Factions","title":"维博特（Viibot）","type":"FRACTION_LOGO","html":"\u003cp\u003e\u003cimg src=\"codex/img/233C30ADCEF7943E.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003cp\u003eViibot Automation（维博特自动化）是一家专精于一切无人机相关业务（以空中为主，但不限于此）的公司。他们采用由 CORE Tech 提供的 DTJC 技术，打造顶级的无人机与仿生人解决方案。\u003c/p\u003e\r\n","text":"![](../img/233C30ADCEF7943E.png) Viibot Automation（维博特自动化）是一家专精于一切无人机相关业务（以空中为主，但不限于此）的公司。他们采用由 CORE Tech 提供的 DTJC 技术，打造顶级的无人机与仿生人解决方案。"},{"id":77,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"阿耳忒弥斯事件纪要（Artemis Incident Summary）","type":"MARKDOWN","html":"\u003cp\u003e武器计划\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e武器实验（轨道炮，矿工前哨站）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eCORE Arms 已对一套新研制的“LRMD”（long range matter disintegrator，远程物质瓦解器）进行了实弹试验。发言人 Thomas Albertson 如是说：“在经历了一连串不幸的挫折之后，我们终于准备好向理事会海军呈上一套全新的武器系统。它在未来舰船设计中的意义，足以震慑任何妄图劫掠的海盗或罪犯。CORE Arms 依旧坚持：只为那些为人类而战的人提供最好的方案。”\u003c/p\u003e\r\n\u003cp\u003e尽管这种说法最多只能算含混，但有传言称，各大势力都已排起队来，想赶在“预定”买家之前拿到这件新武器。\u003c/p\u003e\r\n\u003cp\u003e我们的调查人员得以揭出一些信息：这些所谓的“LRMD”，其实是 \u003cstrong\u003e“Project Artemis”\u003c/strong\u003e 的延续——该计划在约 \u003cstrong\u003e四十年前\u003c/strong\u003e 声名狼藉地失败了，导致多个试验场遭到灾难性破坏。有关那几年事件的大部分信息至今仍对公众保密；但随着该计划再度浮出水面，我们将尽力为您跟进。敬请关注！\u003c/p\u003e\r\n\u003cp\u003e失效模式\u003c/p\u003e\r\n\u003cp\u003e把这些记录合在一起看，指向的是灾难性的场址损毁、监督的缺失，以及一种刻意的努力——即便此前已经出过灾难，也要把这项技术保下来。Artemis 被埋葬，并不是因为它做不到，而是因为它危险、在政治上不便，又仍然足够值钱，以至于总有人想把它重新翻出来。\u003c/p\u003e\r\n","text":"武器计划 武器实验（轨道炮，矿工前哨站） CORE Arms 已对一套新研制的“LRMD”（long range matter disintegrator，远程物质瓦解器）进行了实弹试验。发言人 Thomas Albertson 如是说：“在经历了一连串不幸的挫折之后，我们终于准备好向理事会海军呈上一套全新的武器系统。它在未来舰船设计中的意义，足以震慑任何妄图劫掠的海盗或罪犯。CORE Arms 依旧坚持：只为那些为人类而战的人提供最好的方案。” 尽管这种说法最多只能算含混，但有传言称，各大势力都已排起队来，想赶在“预定”买家之前拿到这件新武器。 我们的调查人员得以揭出一些信息：这些所谓的“LRMD”，其实是 “Project Artemis” 的延续——该计划在约 四十年前 声名狼藉地失败了，导致多个试验场遭到灾难性破坏。有关那几年事件的大部分信息至今仍对公众保密；但随着该计划再度浮出水面，我们将尽力为您跟进。敬请关注！ 失效模式 把这些记录合在一起看，指向的是灾难性的场址损毁、监督的缺失，以及一种刻意的努力——即便此前已经出过灾难，也要把这项技术保下来。Artemis 被埋葬，并不是因为它做不到，而是因为它危险、在政治上不便，又仍然足够值钱，以至于总有人想把它重新翻出来。"},{"id":78,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"生物农场修订记录——代际农场会议（Biofarm Revision Transcript — Generational Farm Meeting）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/E33C01B0C54CAB58.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e生物农场修订（BIOFARM REVISION）\u003c/strong\u003e 会议记录　12.45.16　　　　　　　　2183 年 2 月 15 日\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e代际农场（GENERATIONAL FARM）\u003c/strong\u003e（标题下方另有一行被涂黑）\u003c/p\u003e\r\n\u003cp\u003e出席人员（ATTENDING）：\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eALIO CORVIN —— Astrocrop 行星经理\u003c/li\u003e\r\n\u003cli\u003eSILVIA SHEPHERD —— Astrocrop 行星经理\u003c/li\u003e\r\n\u003cli\u003eFARHAD SORREI —— 农场首席植物学家兼工程师\u003c/li\u003e\r\n\u003cli\u003e［已涂黑］—— CORE 生物技术代表\u003c/li\u003e\r\n\u003cli\u003eSAMANTHA ［姓氏已涂黑］—— CORE Tech 科学主管，Zvezdochka 实验室综合体\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e录音记录（RECORDING TRANSCRIPT）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eALIO CORVIN：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e就像我刚才说的，我们的农场今年就能全面投产。过去经历的那些小挫折对我们影响不大，只是些小麻烦。我们的人员都受过训练、准备就绪，只要尊敬的 CORE 代表能保证安保升级，我们很快就能开始生产。\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e［发言者姓名被涂黑］：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e你也清楚，提供安保不是我们 CORE 生物技术的职权。我们手上有无人单位可用，但考虑到该地区不断变化的局势，把它们从我们的目标转移到你们那里并不明智。哪怕这件事真有那么重要。\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eSILVIA：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e那 CMU 呢？你们派在那一带巡逻的安保部队？能匀出一两个小队吗？有他们的装备，任何找上门的威胁都能被压下去。\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e［发言者姓名被涂黑］：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e\u003cem\u003e叹气\u003c/em\u003e　那些人不是我们的人。我们也指挥不了他们。命令是从上面来的。如果他们认定必须这么做——那我们就接受这个决定。要我表态的话——看起来他们认为磁力中心比这个项目更重要。\u003c/blockquote\u003e\r\n\u003cblockquote\u003e不过总之，我们是来听你们关于植物进展的报告的。有什么可汇报的吗？\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eFARHAD：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e是的，先生。我们已经收到了你们送来的样本。多亏 Samantha 小姐，我们才能自己把它们种下并培育起来。结果很有希望。我们估计这株植物不仅能养活 Mariner City，还能养活半个星球。甚至更多。但让我困惑的是……我从没见过那样的细胞结构。它被改动过吗？\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eSAMANTHA：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e那个信息是机密。我们有过协议：你们测试我们的植物，不要问问题；作为交换，新的生物技术研究成果会提供给你们的政府——在地球上。我们就按这个来。我们已经完全履行了我们这边的义务，而你们已经在享受好处了。这里的拖延……至少可以说是不能令人满意的。\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eALIO：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e我们会解决的……需要的话我们会雇用本地人。反正我们总得找人来试吃那些食物……要是我们的人能更安心一点就好了……\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e［发言者姓名被涂黑］：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e够了。我已经听腻了你的抱怨。你的顾虑会被上报给 CADL。他们会处理。但你们自己把嘴闭紧。我们不想要议会（Council）的任何注意。这事已经够复杂了。\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eSAMANTHA：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cblockquote\u003e我们会和你保持联系。按计划推进。那些该死的植物要么救我们所有人，要么毁掉人类。别把这事搞砸了。\u003c/blockquote\u003e\r\n\u003cp\u003e（注：图片下缘部分字迹被污渍与阴影覆盖，上述内容按可辨部分转录；被涂黑处原文即为黑色涂抹。）\u003c/p\u003e\r\n","text":"![](../img/E33C01B0C54CAB58.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 生物农场修订（BIOFARM REVISION） 会议记录 12.45.16 2183 年 2 月 15 日 代际农场（GENERATIONAL FARM） （标题下方另有一行被涂黑） 出席人员（ATTENDING）： ALIO CORVIN —— Astrocrop 行星经理 SILVIA SHEPHERD —— Astrocrop 行星经理 FARHAD SORREI —— 农场首席植物学家兼工程师 ［已涂黑］—— CORE 生物技术代表 SAMANTHA ［姓氏已涂黑］—— CORE Tech 科学主管，Zvezdochka 实验室综合体 录音记录（RECORDING TRANSCRIPT） ALIO CORVIN： 就像我刚才说的，我们的农场今年就能全面投产。过去经历的那些小挫折对我们影响不大，只是些小麻烦。我们的人员都受过训练、准备就绪，只要尊敬的 CORE 代表能保证安保升级，我们很快就能开始生产。 ［发言者姓名被涂黑］： 你也清楚，提供安保不是我们 CORE 生物技术的职权。我们手上有无人单位可用，但考虑到该地区不断变化的局势，把它们从我们的目标转移到你们那里并不明智。哪怕这件事真有那么重要。 SILVIA： 那 CMU 呢？你们派在那一带巡逻的安保部队？能匀出一两个小队吗？有他们的装备，任何找上门的威胁都能被压下去。 ［发言者姓名被涂黑］： 叹气 那些人不是我们的人。我们也指挥不了他们。命令是从上面来的。如果他们认定必须这么做——那我们就接受这个决定。要我表态的话——看起来他们认为磁力中心比这个项目更重要。 不过总之，我们是来听你们关于植物进展的报告的。有什么可汇报的吗？ FARHAD： 是的，先生。我们已经收到了你们送来的样本。多亏 Samantha 小姐，我们才能自己把它们种下并培育起来。结果很有希望。我们估计这株植物不仅能养活 Mariner City，还能养活半个星球。甚至更多。但让我困惑的是……我从没见过那样的细胞结构。它被改动过吗？ SAMANTHA： 那个信息是机密。我们有过协议：你们测试我们的植物，不要问问题；作为交换，新的生物技术研究成果会提供给你们的政府——在地球上。我们就按这个来。我们已经完全履行了我们这边的义务，而你们已经在享受好处了。这里的拖延……至少可以说是不能令人满意的。 ALIO： 我们会解决的……需要的话我们会雇用本地人。反正我们总得找人来试吃那些食物……要是我们的人能更安心一点就好了…… ［发言者姓名被涂黑］： 够了。我已经听腻了你的抱怨。你的顾虑会被上报给 CADL。他们会处理。但你们自己把嘴闭紧。我们不想要议会（Council）的任何注意。这事已经够复杂了。 SAMANTHA： 我们会和你保持联系。按计划推进。那些该死的植物要么救我们所有人，要么毁掉人类。别把这事搞砸了。 （注：图片下缘部分字迹被污渍与阴影覆盖，上述内容按可辨部分转录；被涂黑处原文即为黑色涂抹。）"},{"id":79,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"生物技术实验 1702——样本尸检报告（Biotech Experiment 1702 — Specimen Autopsy Report）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/BAA0CDDBB06F08F6.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eCORE\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e实验 1702，L/A（Experiment 1702, L/A）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eCORE BioTech. 标本尸检（Specimen Autopsy） 2240 年 7 月 地点：［涂黑，无法辨认］\u003c/p\u003e\r\n\u003cp\u003e| BIOTECH | | --- | | // | | 2240 年 7 月 | | // |\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e高级研究员 Konrad Malloy\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e对一具在 ［已涂黑］ 发现的样本进行了尸检，该处距中心约 500 米。对样本的初步目视检查显示，它曾是一只类似猴子的动物，不知怎么被送到了这颗星球上，并死于自然原因，因为看不到任何明显的外部损伤。\u003c/p\u003e\r\n\u003cp\u003e然而，在进行 X 光、m 成像（m-mapping）全身扫描与完整基因扫描之后，结果显示\"他\"是一名成年人类男性，年龄约 50 岁。内脏已经移位，且有些杂乱。肌肉系统全部扭曲并大幅增生，脑组织只有正常大小的 20%。\u003c/p\u003e\r\n\u003cp\u003e尸体发出的辐射在神经接合处出现尖峰，所有可能受共振影响的设备在距尸体 1 米半径内都发出轻微的\"嗡鸣\"声。\u003c/p\u003e\r\n\u003cp\u003eMalloy 医生请求主设施提供更多资源与设备，以便进一步研究此事。他的初步结论是：该样本是最早的殖民者之一，很久以前不知怎么被困在该区域，受到当地不同的辐射散发物与生物条件的影响。他建议将该案定为\"7-8 级\"状态，从而限制对所有文件的访问。\u003c/p\u003e\r\n","text":"![](../img/BAA0CDDBB06F08F6.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 CORE 实验 1702，L/A（Experiment 1702, L/A） CORE BioTech. 标本尸检（Specimen Autopsy） 2240 年 7 月 地点：［涂黑，无法辨认］ | BIOTECH | | | | // | | 2240 年 7 月 | | // | 高级研究员 Konrad Malloy 对一具在 ［已涂黑］ 发现的样本进行了尸检，该处距中心约 500 米。对样本的初步目视检查显示，它曾是一只类似猴子的动物，不知怎么被送到了这颗星球上，并死于自然原因，因为看不到任何明显的外部损伤。 然而，在进行 X 光、m 成像（m mapping）全身扫描与完整基因扫描之后，结果显示\"他\"是一名成年人类男性，年龄约 50 岁。内脏已经移位，且有些杂乱。肌肉系统全部扭曲并大幅增生，脑组织只有正常大小的 20%。 尸体发出的辐射在神经接合处出现尖峰，所有可能受共振影响的设备在距尸体 1 米半径内都发出轻微的\"嗡鸣\"声。 Malloy 医生请求主设施提供更多资源与设备，以便进一步研究此事。他的初步结论是：该样本是最早的殖民者之一，很久以前不知怎么被困在该区域，受到当地不同的辐射散发物与生物条件的影响。他建议将该案定为\"7 8 级\"状态，从而限制对所有文件的访问。"},{"id":80,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"黑匣子（Black Box）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/FF420873D2834F1C.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e图签（左上）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003ePROJECT（项目）：ARTEMIS\u003c/li\u003e\r\n\u003cli\u003ePROTOTYPE（原型）：DSI-15 \"DAISY\"\u003c/li\u003e\r\n\u003cli\u003eBlueprint（蓝图编号）：S-1745\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e图签（右下）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| 项目 | 内容 | | --- | --- | | DETAILS（参数） | Length（长度）：8000 mm\u00 u003cli\u003eA 图：1:600\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e图签（右下）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| DETAILS（参数） | 长度 / 宽度 | | --- | --- | | A | 13000 mm long　410 mm wide | | B | 6000 mm long　410 mm wide | | C | 500 mm long　410 mm wide |\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eDATE（日期）：［被色带遮盖，无法辨认］\u003c/li\u003e\r\n\u003cli\u003eDESIGNED BY（设计）：CORE ARMS\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e说明\u003c/strong\u003e：画面被多条横向色带切割，A/B/C 三组视图（含弹体侧视与端面）大多残缺；上表仅收录能清楚读出的字符。\u003c/p\u003e\r\n","text":"![](../img/A9B7B5C233751158.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 图签（左上） PROJECT（项目）：［仅\"ARTEMIS\"字样隐约可辨，其余被干扰覆盖］ PROTOTYPE（原型）：…prototype C45（弹药原型 C45） Blueprint（蓝图编号）：S ［编号后半被干扰，无法辨认］ 比例 A 图：1:600 图签（右下） | DETAILS（参数） | 长度 / 宽度 | | | | | A | 13000 mm long 410 mm wide | | B | 6000 mm long 410 mm wide | | C | 500 mm long 410 mm wide | DATE（日期）：［被色带遮盖，无法辨认］ DESIGNED BY（设计）：CORE ARMS 说明 ：画面被多条横向色带切割，A/B/C 三组视图（含弹体侧视与端面）大多残缺；上表仅收录能清楚读出的字符。"},{"id":93,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"货运清单（Cargo Manifest）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/E57CADFD96EB43B1.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eASTROCROP\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e项目\"德墨忒尔\"（Project \"Dementer\"）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e提交人： Astrocrop Biotech. Dr. Allo Covin， 07.07.2182，致投资者的信\u003c/p\u003e\r\n\u003cp\u003e项目\"Demeter\"是我们 Astrocrop 引以为傲的成果。我们所创造的物质，是在 Core Tech 的帮助下，基于我们旨在恢复地球（Earth，或如他们如今的叫法——Terra）的研究。\u003c/p\u003e\r\n\u003cp\u003e我们希望这种物质的发明，能为所有曾被认为过于危险的地球化改造（terraforming）项目打开大门。\u003c/p\u003e\r\n\u003cp\u003e今天，我们准备自豪地向各位展示\"Demeter\"项目的成果之一——一种\u003cstrong\u003e合成油菜素内酯类生物刺激素，第 4 版\u003c/strong\u003e，或者我们称之为——\u003cstrong\u003eSBS4\u003c/strong\u003e。\u003c/p\u003e\r\n\u003cp\u003e这种物质是一种生物活性化合物，旨在提高植物的生长速度。施用过该化合物的作物显示出至少 84% 的生长速率提升。\u003c/p\u003e\r\n\u003cp\u003eSBS4 被认为是非侵入性的，可安全用于任何类型的作物，这一点已由大量研究证实。\u003c/p\u003e\r\n\u003cp\u003e我们的生化部门渴望开始下一阶段的测试——在活体动物身上。我们认为，用含有我们化合物的饲料喂养动物，同样会提高它们的生长速度，或延长其寿命。\u003c/p\u003e\r\n\u003cp\u003e尽管这些假设尚待实践验证，但我们预计这项技术的潜在益处也可能包括提高人类的预期寿命。不用说，此类实验目前尚未计划，只有在经过数年的充分预测试并获得主管部门批准后才可能进行。\u003c/p\u003e\r\n\u003cp\u003e与此同时，我们正在开发一种维生素溶液，其中会含有一定剂量的 SBS4，用于动物测试，并尽快提供给太阳系各地的合作伙伴。\u003c/p\u003e\r\n\u003cp\u003e欢迎填写\"配送优先级（distribution priority）\"表格，以排在首批发货的队列中！\u003c/p\u003e\r\n","text":"![](../img/E57CADFD96EB43B1.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 ASTROCROP 项目\"德墨忒尔\"（Project \"Dementer\"） 提交人： Astrocrop Biotech. Dr. Allo Covin， 07.07.2182，致投资者的信 项目\"Demeter\"是我们 Astrocrop 引以为傲的成果。我们所创造的物质，是在 Core Tech 的帮助下，基于我们旨在恢复地球（Earth，或如他们如今的叫法——Terra）的研究。 我们希望这种物质的发明，能为所有曾被认为过于危险的地球化改造（terraforming）项目打开大门。 今天，我们准备自豪地向各位展示\"Demeter\"项目的成果之一——一种 合成油菜素内酯类生物刺激素，第 4 版 ，或者我们称之为—— SBS4 。 这种物质是一种生物活性化合物，旨在提高植物的生长速度。施用过该化合物的作物显示出至少 84% 的生长速率提升。 SBS4 被认为是非侵入性的，可安全用于任何类型的作物，这一点已由大量研究证实。 我们的生化部门渴望开始下一阶段的测试——在活体动物身上。我们认为，用含有我们化合物的饲料喂养动物，同样会提高它们的生长速度，或延长其寿命。 尽管这些假设尚待实践验证，但我们预计这项技术的潜在益处也可能包括提高人类的预期寿命。不用说，此类实验目前尚未计划，只有在经过数年的充分预测试并获得主管部门批准后才可能进行。 与此同时，我们正在开发一种维生素溶液，其中会含有一定剂量的 SBS4，用于动物测试，并尽快提供给太阳系各地的合作伙伴。 欢迎填写\"配送优先级（distribution priority）\"表格，以排在首批发货的队列中！"},{"id":94,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"综合体状态（Complex Status）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/339C70F23AC25F71.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e（画面为终端屏幕上的四段自动状态报告；前哨站名称均被白色涂抹遮盖。）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eOutpost［名称已涂黑］——状态变更　　02.17.2178\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e自动消息 传输：活动 状态：失败 接收方：不可达\u003c/p\u003e\r\n\u003cp\u003eR\u0027N\u0027D 综合体 MO 2 正在发送状态变更 \u0026gt; 休眠模式。 自动防御已启动。人员已转移至安全掩体。 按补给量估算的人员 原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e（纸张严重污损、撕裂，多处字迹缺失或被墨迹覆盖。）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eViBOT\u003c/strong\u003e 评估 CT1702 药物［无法辨认］测试 首席调查员：SIMON WEBB\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e首席调查员：\u003c/strong\u003e 我们收到了一批新的［无法辨认］，就是 CORE Tech 送来的那些，将用于\"无人双足单位（unmanned bipedal units）\"。我们的任务是在［无法辨认］模型上测试它们，然后再进行［无法辨认］。 ［无法辨认］正在生产中。\u003c/p\u003e\r\n\u003cp\u003e虽然我没有理由保持谨慎，但［无法辨认］这些［无法辨认］看起来有些不同，而且［无法辨认］。我们将不得不对它们进行大量测试，［无法辨认］。［无法辨认］那会禁止［无法辨认］使用［无法辨认］。［无法辨认］容器那……易燃的［无法辨认］，从 SOYUZ 测试场送来。那算不算个错误？\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e测试 1：［无法辨认］率——结果：［无法辨认］，过度退化\u003c/li\u003e\r\n\u003cli\u003e测试 2：角度［无法辨认］应力测试——结果：［无法辨认］\u003c/li\u003e\r\n\u003cli\u003e测试 3：电兼容性——结果显示整个系统运行严重退化。原因不明。\u003c/li\u003e\r\n\u003cli\u003e测试 4：环境［无法辨认］耐受性——测试显示对［无法辨认］的耐受性延长\u003c/li\u003e\r\n\u003cli\u003e测试 5：磁［无法辨认］特性——结果不一致。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e这些测试的结果可以用\"［无法辨认］\"来形容。我知道这不是［无法辨认］说法。但我从没见过那样的材料。从它的颜色，到它与其他\"常规\"系统的相互作用。我们完全无法确定这些耦合（couplings）的磁性特性——我们的设备显示出不可能的结果，就像那是来自［无法辨认］星的材料。\u003c/p\u003e\r\n\u003cp\u003e接下来的问题是兼容性。BOT 的\"健康\"系统无法正确判定这些耦合的状态，因此\"严重损坏\"状态会亮起，把整个系统关停。此外，我们的技术员说，即使做了绝缘，它也会对电网产生影响。\u003c/p\u003e\r\n\u003cp\u003e在所有情况中［无法辨认］这些耦合都［无法辨认］……我不是专家，但这是某种［无法辨认］。我会联系上级［无法辨认］。同时我们所有人员都被要求对此保持沉默。我们不想要什么国际\"事件\"，也不想要 SOYUZ 部队［无法辨认］。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSIMON WEBB\u003c/strong\u003e （手写签名）\u003c/p\u003e\r\n","text":"![](../img/5C9BB5C8D12C517B.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 （纸张严重污损、撕裂，多处字迹缺失或被墨迹覆盖。） ViBOT 评估 CT1702 药物［无法辨认］测试 首席调查员：SIMON WEBB 首席调查员： 我们收到了一批新的［无法辨认］，就是 CORE Tech 送来的那些，将用于\"无人双足单位（unmanned bipedal units）\"。我们的任务是在［无法辨认］模型上测试它们，然后再进行［无法辨认］。 ［无法辨认］正在生产中。 虽然我没有理由保持谨慎，但［无法辨认］这些［无法辨认］看起来有些不同，而且［无法辨认］。我们将不得不对它们进行大量测试，［无法辨认］。［无法辨认］那会禁止［无法辨认］使用［无法辨认］。［无法辨认］容器那……易燃的［无法辨认］，从 SOYUZ 测试场送来。那算不算个错误？ 测试 1：［无法辨认］率——结果：［无法辨认］，过度退化 测试 2：角度［无法辨认］应力测试——结果：［无法辨认］ 测试 3：电兼容性——结果显示整个系统运行严重退化。原因不明。 测试 4：环境［无法辨认］耐受性——测试显示对［无法辨认］的耐受性延长 测试 5：磁［无法辨认］特性——结果不一致。 这些测试的结果可以用\"［无法辨认］\"来形容。我知道这不是［无法辨认］说法。但我从没见过那样的材料。从它的颜色，到它与其他\"常规\"系统的相互作用。我们完全无法确定这些耦合（couplings）的磁性特性——我们的设备显示出不可能的结果，就像那是来自［无法辨认］星的材料。 接下来的问题是兼容性。BOT 的\"健康\"系统无法正确判定这些耦合的状态，因此\"严重损坏\"状态会亮起，把整个系统关停。此外，我们的技术员说，即使做了绝缘，它也会对电网产生影响。 在所有情况中［无法辨认］这些耦合都［无法辨认］……我不是专家，但这是某种［无法辨认］。我会联系上级［无法辨认］。同时我们所有人员都被要求对此保持沉默。我们不想要什么国际\"事件\"，也不想要 SOYUZ 部队［无法辨认］。 SIMON WEBB （手写签名）"},{"id":97,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"与奥拉娜的对话（Dialogue with Aurana）","type":"MARKDOWN","html":"\u003cp\u003e奥拉娜 1\u003c/p\u003e\r\n\u003cp\u003e您好。我叫 Aurana Strogova，在合同有效期内，我将担任您的经办人。首先，请您重温合同中写明的条款与条件——我们认为，您严格照办至关重要。您的任务是揭开一些让我们……颇感兴趣的秘密。我们手上有几份文件，是我们的情报部门设法获取的。其中大多是扫描件和照片。这些文件状况并不理想，但请相信我，为了拿到它们费了很大力气。每份文件都含有一些信息，或许对您的调查有用，或许无用。但它们都为我们所关注的那些事件提供了某种背景。\u003c/p\u003e\r\n\u003cp\u003e我们相信，眼下正在发生的事情——您也许在新闻里听说过——与这些文件存在某种关联。您在这次调查中的主要目标，就是揭开这种关联。我完全理解这项任务“含糊”得可以，但请把它当作对您能力的一次考验，也当作对我们行事隐秘的一种致意。\u003c/p\u003e\r\n\u003cp\u003e作为回报，我们会为您提供几件也许趁手的工具，但您也可以随意使用任何公开来源情报。\u003c/p\u003e\r\n\u003cblockquote\u003e明白。有情况随时通知我。\u003c/blockquote\u003e\r\n\u003cp\u003e奥拉娜 2\u003c/p\u003e\r\n\u003cp\u003e此外，请注意：您需要 FREEL ID 才能访问我们将提供给您的绝大部分信息。\u003c/p\u003e\r\n\u003cblockquote\u003e好。继续。\u003c/blockquote\u003e\r\n\u003cp\u003e奥拉娜 3\u003c/p\u003e\r\n\u003cp\u003e最后，干得不错，把信息全都弄到手了。您通过了考验。有人也许会说这考验并不轻松……我倒不这么认为，但我的委托人很满意您的进展。\u003c/p\u003e\r\n\u003cp\u003e关键在于——我们怀疑，过去那些实验与事件正在影响我们当下的现实。影响到什么程度？我们不知道。这要靠您去查明。\u003c/p\u003e\r\n\u003cp\u003e我的委托人相信您能应付这项任务。但要小心。有些人为了您手上这些信息可以杀人。您走得越深，事情就越艰难、越危险。失败不在选项之内。\u003c/p\u003e\r\n\u003cp\u003e现在，我们正在设法获取有关此事的更多信息，一拿到我就会与您分享。唯一的问题是——这是随机的。我们不知道会从消息源那里得到什么、何时得到。所以请做好应对一切的准备。\u003c/p\u003e\r\n\u003cp\u003e最后一件事。我的委托人认为，所有这些文件所描述的并非单一地点，而可能有好几处。所以，如果您发现了什么——也试着把它挖出来。不会有坏处，还可能为主线提供额外的视角。\u003c/p\u003e\r\n\u003cblockquote\u003e记住——从远处看，有备与贪婪长得一模一样。两者一旦停止思考，都会要人的命。保持警觉。\u003c/blockquote\u003e\r\n","text":"奥拉娜 1 您好。我叫 Aurana Strogova，在合同有效期内，我将担任您的经办人。首先，请您重温合同中写明的条款与条件——我们认为，您严格照办至关重要。您的任务是揭开一些让我们……颇感兴趣的秘密。我们手上有几份文件，是我们的情报部门设法获取的。其中大多是扫描件和照片。这些文件状况并不理想，但请相信我，为了拿到它们费了很大力气。每份文件都含有一些信息，或许对您的调查有用，或许无用。但它们都为我们所关注的那些事件提供了某种背景。 我们相信，眼下正在发生的事情——您也许在新闻里听说过——与这些文件存在某种关联。您在这次调查中的主要目标，就是揭开这种关联。我完全理解这项任务“含糊”得可以，但请把它当作对您能力的一次考验，也当作对我们行事隐秘的一种致意。 作为回报，我们会为您提供几件也许趁手的工具，但您也可以随意使用任何公开来源情报。 明白。有情况随时通知我。 奥拉娜 2 此外，请注意：您需要 FREEL ID 才能访问我们将提供给您的绝大部分信息。 好。继续。 奥拉娜 3 最后，干得不错，把信息全都弄到手了。您通过了考验。有人也许会说这考验并不轻松……我倒不这么认为，但我的委托人很满意您的进展。 关键在于——我们怀疑，过去那些实验与事件正在影响我们当下的现实。影响到什么程度？我们不知道。这要靠您去查明。 我的委托人相信您能应付这项任务。但要小心。有些人为了您手上这些信息可以杀人。您走得越深，事情就越艰难、越危险。失败不在选项之内。 现在，我们正在设法获取有关此事的更多信息，一拿到我就会与您分享。唯一的问题是——这是随机的。我们不知道会从消息源那里得到什么、何时得到。所以请做好应对一切的准备。 最后一件事。我的委托人认为，所有这些文件所描述的并非单一地点，而可能有好几处。所以，如果您发现了什么——也试着把它挖出来。不会有坏处，还可能为主线提供额外的视角。 记住——从远处看，有备与贪婪长得一模一样。两者一旦停止思考，都会要人的命。保持警觉。"},{"id":98,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"飞行报告（Flight Report）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/DF4C8926660576D6.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文（图上一处地名标注为法文），专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e画面右下角标注：\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eLE FERME DES GÉNÉRATIONS（世代农场）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e说明\u003c/strong\u003e：画面为俯视的农场／基地影像（可见成排的温室/田块、聚居建筑群、起降区与圆形中枢建筑），除该地名标注外，图中无可读文字。\u003c/p\u003e\r\n","text":"![](../img/DF4C8926660576D6.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文（图上一处地名标注为法文），专有名词保留原文拼写 画面右下角标注： LE FERME DES GÉNÉRATIONS（世代农场） 说明 ：画面为俯视的农场／基地影像（可见成排的温室/田块、聚居建筑群、起降区与圆形中枢建筑），除该地名标注外，图中无可读文字。"},{"id":99,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"来自朋友（Fromafriend）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/27965CD5752CDC8B.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片说明\u003c/h2\u003e\r\n\u003cp\u003e（从飞船圆形舷窗望出去，行星表面布满火光与升腾的烟柱，轨道上漂浮着残骸与飞行器；舷窗玻璃上映出一只手握着纸张的倒影。图中无可读文字。）\u003c/p\u003e\r\n","text":"![](../img/27965CD5752CDC8B.jpg) 图片说明 （从飞船圆形舷窗望出去，行星表面布满火光与升腾的烟柱，轨道上漂浮着残骸与飞行器；舷窗玻璃上映出一只手握着纸张的倒影。图中无可读文字。）"},{"id":100,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"调查笔记（Investigation Notes）","type":"MARKDOWN","html":"\u003cp\u003e下一步\u003c/p\u003e\r\n\u003cp\u003e看到 Aurana 的消息了。她今天格外客气。不是平常那种一冷到底的态度。也许我其实干得还行。\u003c/p\u003e\r\n\u003cp\u003e我觉得自己离某个东西真的很近了。最大的难题是弄清我掌握线索的所有物件的地点。它们可能在任何地方，但不知怎的，我总觉得它们都在同一处。也许翻一翻各种档案站点，会有助于把这些东西对照起来……\u003c/p\u003e\r\n\u003cp\u003e总结一下：\u003c/p\u003e\r\n\u003cp\u003e首先，是那批走私的联轴器，被运到了一颗随机行星上的秘密综合体。这给我的信息不多，但既然它是意外到的那里，就意味着值得试着找出运输所用船只的名字。至少这能让我找到它的飞行路径记录，我就能从那儿往下查。\u003c/p\u003e\r\n\u003cp\u003e接下来，是某种乱七八糟的化合物，有人决定把它加进食物里，在人身上做试验。看来它扩散得够广，足以在整个太阳系里制造“事故”。或者说，至少曾经如此。 那玩意儿似乎是由 CDEA 散发的，又或者是一些冒充他们的暴徒。也许是一次假旗行动？这条线索或许值得查，但那会危险得要命……\u003c/p\u003e\r\n\u003cp\u003e另一个选择，是设法找到某份文件里提到的那位老“兄弟”……他叫什么来着？我得提醒一下自己。前提是他还活着，而且我能找到他。\u003c/p\u003e\r\n\u003cp\u003e再往后，是关于正在进行的 LRMD 的事。跟轨道炮和“Project Artemis”有关。这勾起了一些回忆。我以前肯定听过这个名字。但我需要有人跟我聊聊这个。那个家伙，一个推销员……也许可以找他碰碰运气。我怀疑他知道的不多，但他可能会漏出些细节。\u003c/p\u003e\r\n\u003cp\u003e最后，是一座 Sky Lift。光是在殖民地和更大的小行星上建成的，我就能数出至少三座，但结合上下文看——它很可能位于某颗行星上。问题是——哪一颗。也许得重新翻一遍我手头关于那座的资料。至少文件里多次提到 PCF，但也提到了某个 Cult。PCF，如果我没记错，是些自由战士。或者，也不妨去查查文件里提到的那些 USOL 军官。不知道他们是否还活着，但他们的档案，只要能公开，或许能告诉我些什么。\u003c/p\u003e\r\n\u003cp\u003e要做的事很多，我还是赶紧开始吧。\u003c/p\u003e\r\n\u003cp\u003e新线索确认\u003c/p\u003e\r\n\u003cp\u003e这儿有点意思。那个 REPNODE 是 REPENT 的部署设施之一。它们通常归 CEDRT 所有，而我只知道一个活跃的紧急区域——火星。也就是说，那是它轨道上的站点。还有那座设施……是导弹发射井，还是别的什么？ 我得继续查下去，不过眼下我已经拿到了想要的东西。得去查其他线索了，先从那位“兄弟”开始。\u003c/p\u003e\r\n\u003cp\u003eSeamus J. Malkob，他的账户显示为活跃状态。不过已经 95 岁了……他头上还挂着悬赏，怎么还活得下去？\u003c/p\u003e\r\n\u003cp\u003e我得试着用加密软件联系他。也许这样能让他觉得足够安全，愿意回话。\u003c/p\u003e\r\n\u003cp\u003e非常不对劲\u003c/p\u003e\r\n\u003cp\u003e我靠，这些家伙疯了。我知道 Terran 人在很多方面都很“特别”，但这……如果我没弄错，他们决定在人类身上测试一件真正的生物武器。毫无疑问，他们把它当成了什么神奇血清之类的东西。他妈的混蛋。\u003c/p\u003e\r\n\u003cp\u003e唯一的问题是那东西在哪里生产，以及哪些产品可能受到影响。\u003c/p\u003e\r\n\u003cp\u003e我得去查新闻频道，也许有人写过类似的事。\u003c/p\u003e\r\n\u003cp\u003e又是火星\u003c/p\u003e\r\n\u003cp\u003e又一条线索，而且又是火星。那地方把秘密守得很紧。我得继续查，还有几件事我仍能追下去。\u003c/p\u003e\r\n","text":"下一步 看到 Aurana 的消息了。她今天格外客气。不是平常那种一冷到底的态度。也许我其实干得还行。 我觉得自己离某个东西真的很近了。最大的难题是弄清我掌握线索的所有物件的地点。它们可能在任何地方，但不知怎的，我总觉得它们都在同一处。也许翻一翻各种档案站点，会有助于把这些东西对照起来…… 总结一下： 首先，是那批走私的联轴器，被运到了一颗随机行星上的秘密综合体。这给我的信息不多，但既然它是意外到的那里，就意味着值得试着找出运输所用船只的名字。至少这能让我找到它的飞行路径记录，我就能从那儿往下查。 接下来，是某种乱七八糟的化合物，有人决定把它加进食物里，在人身上做试验。看来它扩散得够广，足以在整个太阳系里制造“事故”。或者说，至少曾经如此。 那玩意儿似乎是由 CDEA 散发的，又或者是一些冒充他们的暴徒。也许是一次假旗行动？这条线索或许值得查，但那会危险得要命…… 另一个选择，是设法找到某份文件里提到的那位老“兄弟”……他叫什么来着？我得提醒一下自己。前提是他还活着，而且我能找到他。 再往后，是关于正在进行的 LRMD 的事。跟轨道炮和“Project Artemis”有关。这勾起了一些回忆。我以前肯定听过这个名字。但我需要有人跟我聊聊这个。那个家伙，一个推销员……也许可以找他碰碰运气。我怀疑他知道的不多，但他可能会漏出些细节。 最后，是一座 Sky Lift。光是在殖民地和更大的小行星上建成的，我就能数出至少三座，但结合上下文看——它很可能位于某颗行星上。问题是——哪一颗。也许得重新翻一遍我手头关于那座的资料。至少文件里多次提到 PCF，但也提到了某个 Cult。PCF，如果我没记错，是些自由战士。或者，也不妨去查查文件里提到的那些 USOL 军官。不知道他们是否还活着，但他们的档案，只要能公开，或许能告诉我些什么。 要做的事很多，我还是赶紧开始吧。 新线索确认 这儿有点意思。那个 REPNODE 是 REPENT 的部署设施之一。它们通常归 CEDRT 所有，而我只知道一个活跃的紧急区域——火星。也就是说，那是它轨道上的站点。还有那座设施……是导弹发射井，还是别的什么？ 我得继续查下去，不过眼下我已经拿到了想要的东西。得去查其他线索了，先从那位“兄弟”开始。 Seamus J. Malkob，他的账户显示为活跃状态。不过已经 95 岁了……他头上还挂着悬赏，怎么还活得下去？ 我得试着用加密软件联系他。也许这样能让他觉得足够安全，愿意回话。 非常不对劲 我靠，这些家伙疯了。我知道 Terran 人在很多方面都很“特别”，但这……如果我没弄错，他们决定在人类身上测试一件真正的生物武器。毫无疑问，他们把它当成了什么神奇血清之类的东西。他妈的混蛋。 唯一的问题是那东西在哪里生产，以及哪些产品可能受到影响。 我得去查新闻频道，也许有人写过类似的事。 又是火星 又一条线索，而且又是火星。那地方把秘密守得很紧。我得继续查，还有几件事我仍能追下去。"},{"id":101,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"IWT 用例（IWT Use Case）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/FAC964147837A670.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eCORE　IWT\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eIWT 用例（IWT USE CASE）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e| | | | --- | --- | | 实验结果 - 195.2\u0026lt;br\u0026gt;2172 年 8 月\u0026lt;br\u0026gt;作者：［涂黑］ Foul，\u0026lt;br\u0026gt;Ring 5\u0026lt;br\u0026gt;Core Tech | Magnus Vervortessen\u0026lt;br\u0026gt;Core Tech\u0026lt;br\u0026gt;发明者，Ring 4 |\u003c/p\u003e\r\n\u003cp\u003e最近的实地测试表明，IWT 技术可用于先进的态势感知系统。与 NIC 电芯结合后，任何 IWT 发射器都能充当微型雷达，绘制出精确到具体人物细节的图像。这项技术具有巨大的军事潜力。\u003c/p\u003e\r\n\u003cp\u003e从技术上说，任何特定波长的无线电波都可以用同样的方式使用，但 IWT 技术会对其放大，提高信号距离与清晰度。\u003c/p\u003e\r\n\u003cp\u003e基本上，这意味着装备了特定发射器与接收器的 CORE 操作员，可以用 IWT 技术操纵附近所有设备，发出能绘制障碍物 3D 地图的无线电波，并把波折射回监听设备。这一切只会有轻微延迟，几乎实时完成。\u003c/p\u003e\r\n\u003cp\u003e这意味着敌对势力将无处藏身，只有硬屏蔽的建筑或载具能提供保护。\u003c/p\u003e\r\n\u003cp\u003e我们的 Core Arms 技术人员正在研究如何把这些知识应用到便携式多功能工具原型中。与此同时，我们 Core Tech 的同志们正试图为这个问题找出防御方案，因为他们认为，其他主要阵营中迟早会有人得出类似方案。目前我们建议尽可能保密这些信息，并降低所有使用 IWT 的设备的潜在发射功率，对外则宣称是制造缺陷或\"晶体退化\"。至少目前，我们得把这件事压住。\u003c/p\u003e\r\n","text":"![](../img/FAC964147837A670.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 CORE IWT IWT 用例（IWT USE CASE） | | | | | | | 实验结果 195.2\u003cbr 2172 年 8 月\u003cbr 作者：［涂黑］ Foul，\u003cbr Ring 5\u003cbr Core Tech | Magnus Vervortessen\u003cbr Core Tech\u003cbr 发明者，Ring 4 | 最近的实地测试表明，IWT 技术可用于先进的态势感知系统。与 NIC 电芯结合后，任何 IWT 发射器都能充当微型雷达，绘制出精确到具体人物细节的图像。这项技术具有巨大的军事潜力。 从技术上说，任何特定波长的无线电波都可以用同样的方式使用，但 IWT 技术会对其放大，提高信号距离与清晰度。 基本上，这意味着装备了特定发射器与接收器的 CORE 操作员，可以用 IWT 技术操纵附近所有设备，发出能绘制障碍物 3D 地图的无线电波，并把波折射回监听设备。这一切只会有轻微延迟，几乎实时完成。 这意味着敌对势力将无处藏身，只有硬屏蔽的建筑或载具能提供保护。 我们的 Core Arms 技术人员正在研究如何把这些知识应用到便携式多功能工具原型中。与此同时，我们 Core Tech 的同志们正试图为这个问题找出防御方案，因为他们认为，其他主要阵营中迟早会有人得出类似方案。目前我们建议尽可能保密这些信息，并降低所有使用 IWT 的设备的潜在发射功率，对外则宣称是制造缺陷或\"晶体退化\"。至少目前，我们得把这件事压住。"},{"id":102,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"奥拉娜·斯特罗戈娃经办人协议——合同本地副本（Local Contract Copy — Handler Agreement (Aurana Strogova)）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/3440772B4B41FAAA.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e合同本地副本（LOCAL COPY OF A CONTRACT）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e由 USER ［已涂黑］ 与\"经办人\"（Handler）Aurana Strogova（代表第三方）签署\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e执行者（Executor）的任务是：调查是否有机会找到与 2170 年至今在 ［已删节］ 进行的实验相关的文件。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e执行者可以自由使用任何必要手段以推进任务，包括但不限于雇用额外帮手。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e执行者在任何时候都不得尝试联系雇主（Hirer），只应通过经办人保持联系。违反此条将导致合同立即终止，并可能造成严重的人身伤害。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e在可能的情况下，执行者应尽量避免使用 CORIE 系统。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e任务的成功或失败将由雇主根据结果判定。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e执行者将按月以硬通货（hard currency）形式获得报酬。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n","text":"![](../img/3440772B4B41FAAA.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 合同本地副本（LOCAL COPY OF A CONTRACT） 由 USER ［已涂黑］ 与\"经办人\"（Handler）Aurana Strogova（代表第三方）签署 执行者（Executor）的任务是：调查是否有机会找到与 2170 年至今在 ［已删节］ 进行的实验相关的文件。 执行者可以自由使用任何必要手段以推进任务，包括但不限于雇用额外帮手。 执行者在任何时候都不得尝试联系雇主（Hirer），只应通过经办人保持联系。违反此条将导致合同立即终止，并可能造成严重的人身伤害。 在可能的情况下，执行者应尽量避免使用 CORIE 系统。 任务的成功或失败将由雇主根据结果判定。 执行者将按月以硬通货（hard currency）形式获得报酬。"},{"id":103,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"磁性异常报告——Core Tech 实地研究（Magnetism Anomaly Report — Core Tech Field Study）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/846CF56B0E922075.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eCORE\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e磁性（Magnetism）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e实验结果 – 195.2 2172 年 8 月 作者：［涂黑］ Foul， Ring 5［涂黑］， Core Tech\u003c/p\u003e\r\n\u003cp\u003e| BIOTECH | | --- | | // | | 2240 年 7 月 | | // |\u003c/p\u003e\r\n\u003cp\u003e（右上另有一组三个交叠圆圈，圈内标注 1702）\u003c/p\u003e\r\n\u003cp\u003e从目标地点采集的所有样本，都已用现有全部设备检测过。 光谱仪显示所有样本中都含有大量伽马射线。 与此同时，却没有任何辐射迹象。\u003c/p\u003e\r\n\u003cp\u003e这与之前从另一地点采集的样本所做的全部测试相矛盾——那个地点位于目标位置以南仅 300 米处。\u003c/p\u003e\r\n\u003cp\u003e这一现象没有科学解释。Ring 7 的兄弟们提到过某种\"origin site（起源点）\"，我对此一无所知；除此之外，他们没有分享任何有用信息。\u003c/p\u003e\r\n\u003cp\u003e我们团队将继续勘探目标区域，并比对附近其他地点的结果。我们希望至少能找到某些相似之处。\u003c/p\u003e\r\n\u003cp\u003e我也会请求其他 Ring 的协助，以及来自 Magnetic center 的专职能量场专家团队，因为这件事让我们非常不安。\u003c/p\u003e\r\n","text":"![](../img/846CF56B0E922075.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 CORE 磁性（Magnetism） 实验结果 – 195.2 2172 年 8 月 作者：［涂黑］ Foul， Ring 5［涂黑］， Core Tech | BIOTECH | | | | // | | 2240 年 7 月 | | // | （右上另有一组三个交叠圆圈，圈内标注 1702） 从目标地点采集的所有样本，都已用现有全部设备检测过。 光谱仪显示所有样本中都含有大量伽马射线。 与此同时，却没有任何辐射迹象。 这与之前从另一地点采集的样本所做的全部测试相矛盾——那个地点位于目标位置以南仅 300 米处。 这一现象没有科学解释。Ring 7 的兄弟们提到过某种\"origin site（起源点）\"，我对此一无所知；除此之外，他们没有分享任何有用信息。 我们团队将继续勘探目标区域，并比对附近其他地点的结果。我们希望至少能找到某些相似之处。 我也会请求其他 Ring 的协助，以及来自 Magnetic center 的专职能量场专家团队，因为这件事让我们非常不安。"},{"id":104,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"火星线索汇总（Mars Lead Summary）","type":"MARKDOWN","html":"\u003cp\u003e到第一份调查资料包结束时，多条彼此独立的线索都指向火星。REPNODE 站点、代际农场、Gobbler 武器场址，以及 Sky Lift 的材料，全都围绕着同一片活动范围运转。这种模式已不再是巧合：无论是什么把旧日实验、军事失败与工业异常串联在一起，它似乎一次又一次地触及火星的基础设施。\u003c/p\u003e\r\n","text":"到第一份调查资料包结束时，多条彼此独立的线索都指向火星。REPNODE 站点、代际农场、Gobbler 武器场址，以及 Sky Lift 的材料，全都围绕着同一片活动范围运转。这种模式已不再是巧合：无论是什么把旧日实验、军事失败与工业异常串联在一起，它似乎一次又一次地触及火星的基础设施。"},{"id":105,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"摩尔斯电码传输（Morse Code Transmission）","type":"AUDIO","html":"","text":""},{"id":106,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"新闻照片（News Photo）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/E8BA1E3146A073B2.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e（画面为一个圆柱形金属罐/容器，罐身贴有标签。）\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e正面标签\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eSBS4\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e侧面竖排文字\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eSBS4 BIOSTIMULANT（SBS4 生物刺激素）\u003c/li\u003e\r\n\u003cli\u003eProduct of MARTIAN GENERAL FARM（火星通用农场出品）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e警示贴纸\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003eWARNING（警告）\u003c/li\u003e\r\n\u003cli\u003e贴纸内小字［无法辨认］\u003c/li\u003e\r\n\u003cli\u003e右下角数字：5\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e底部\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e条形码，号码：38014060217\u003c/li\u003e\r\n\u003c/ul\u003e\r\n","text":"![](../img/E8BA1E3146A073B2.png) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 （画面为一个圆柱形金属罐/容器，罐身贴有标签。） 正面标签 SBS4 侧面竖排文字 SBS4 BIOSTIMULANT（SBS4 生物刺激素） Product of MARTIAN GENERAL FARM（火星通用农场出品） 警示贴纸 WARNING（警告） 贴纸内小字［无法辨认］ 右下角数字：5 底部 条形码，号码：38014060217"},{"id":107,"cat":"第 1 条：合同","dir":"03_Entry1_The_Contract","title":"特里佩行动（Operation Tripe）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/46D8B70B6E7BB76B.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eCORE　OPERATION \"TRIPE\"（特里佩行动）\u003c/strong\u003e \u003cem\u003eTOP SECRET（绝密）\u003c/em\u003e（印章框）\u003c/p\u003e\r\n\u003cp\u003e右上角圆形印章：CORE OPERATION TRIPE，环形编号［无法辨认］\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003ch3\u003e通信记录（Communication log transcript, ［已涂黑］ 2191. ISC comm intercept, log 7691.）\u003c/h3\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e他们正在撤离。整颗星球，他们都在放弃它。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e你还指望他们什么？贪婪和无能，这就是他们的本性。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e我不在乎他们，你知道的。我得考虑我们的资产和研究。那个区域里我们还有很多物体尚未撤离。我们必须确保那些东西以及里面内容的安全。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e你担心得太多了。步骤早已采取。我们的 CUU 几天前就已部署。他们正在接管我们所有的主要综合体。其余的会被封锁。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e那剩下的人员呢？我们还有人在下面。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e非必要人员。能带出来我们就会带出来。但如果不行……那就是知识的代价。算法（The Algorithm）预测了这一点并批准了。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e我们从什么时候开始这样盲目信任那台机器了？\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e从监督者（Overseers）发话那天起。我们不能质疑他们的意志。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e你，Farwin Duct，是个伪君子，你自己也是监督者。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e这就是我的方式，我并不为此骄傲。但我会尽我所能让我们更接近终极的理解，不论代价或牺牲。\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003eCOMMUNICATION LOG END.（通信记录结束）\u003c/strong\u003e\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003ch3\u003eCMU 单位 \"Delta 12\"，Galahad Johnston，Ring 1，Conjurer。个人日志，52。\u003c/h3\u003e\r\n\u003cp\u003e这次部署对我而言是极大的荣誉。我们来这里是为了保护在那个地点获得的知识。所有那些综合体和数据金库都是神圣的。我们必须确保它们保持原样、不被动摇。\u003c/p\u003e\r\n\u003cp\u003e在我写下这些的时候，我们的队伍正在抵达所有我们能及时抵达的综合体。我们只有几天，甚至更少的时间，去确保一切，以免那些［已涂黑］畜生因为恐惧而把它撕成碎片。至于那些 USOL 懦夫……他们为这种失败所受的惩罚无疑会非常严厉。但那会晚些到来。\u003c/p\u003e\r\n\u003cp\u003e我个人的任务是确保我们神圣的能量传输通道被正确关闭，否则整颗星球可能被它巨大的能量摧毁。\u003c/p\u003e\r\n\u003cp\u003e我们正踏上前往伟大天拱（Sky Arch）的旅程，去关闭次级终端；而 CMU \"Omega 56\" 与我们技术部门的同志，将在［无法辨认］中心的初级终端上作业。\u003c/p\u003e\r\n\u003cp\u003e愿神圣的知识在我们的任务中帮助我们，愿算法指引我们。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eLOG END.（日志结束）\u003c/strong\u003e\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003ch3\u003eEMCOM 传输 3718。ISC 通信截获解码。第 13 节，危机小组。\u003c/h3\u003e\r\n\u003cp\u003e— 抵达 ［已涂黑］ 中心。设施看起来大体完好，但有入侵痕迹。现场没有人员。自动防御系统部分失效。\u003c/p\u003e\r\n\u003cp\u003e— 确认突破外围边界，检测到 5 个进入点。敌方身份不明。 发现尸体、无标识装备。未发现设计图。人类？ID 识别失败。继续前进。\u003c/p\u003e\r\n\u003cp\u003e— 内围边界看起来完好。发现突破尝试地点，更多尸体。自动系统击退了入侵者。进入主综合体。\u003c/p\u003e\r\n\u003cp\u003e— 主综合体已确保安全，未检测到突破。自动防御处于休眠模式，尝试重启。重启时间——30 分钟。前往控制室。\u003c/p\u003e\r\n\u003cp\u003e— 已抵达控制室，工程团队开始对姊妹设施进行远程关机。\u003c/p\u003e\r\n\u003cp\u003e— T\\\u003cem\u003e\\\u003c/em\u003ey 疯了！AI 失控了！\\* 立即关闭所有系统！封住门！\u003c/p\u003e\r\n\u003cp\u003e— 反应堆正在升功率！把它改接到次级动力桥！\u003c/p\u003e\r\n\u003cp\u003e— 我们能停下它吗？不？改接生效了吗？立即撤离！\u003c/p\u003e\r\n\u003cp\u003e— 它在发出关机脉冲。所有人抓稳。\u003c/p\u003e\r\n\u003cp\u003e— \\\u003cem\
