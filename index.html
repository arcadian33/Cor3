cli\u003e日期：10.19.2231\u003c/li\u003e\r\n\u003cli\u003e录音（RECORDING）：[被涂黑]\u003c/li\u003e\r\n\u003cli\u003e地点：机密，最高安全级别\u003c/li\u003e\r\n\u003cli\u003e审讯员：机密\u003c/li\u003e\r\n\u003cli\u003e相关人员：ZA[被涂黑] —— G-RACK 现场首席技术官（ON-SITE CTO）\u003c/li\u003e\r\n\u003cli\u003e抬头右侧与框内右下角有 G-RACK 的方块状标识\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e正文（审讯对话转录）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e审讯官：普劳先生（Mr Plow），我们从一个简单的事实开始。这不是一次普通的审讯。你不仅仅是嫌疑人。把这当成对你的审判吧。\u003c/p\u003e\r\n\u003cp\u003e你和你的公司害死了数百人，而我们还在估算实际的死亡数字。\u003c/p\u003e\r\n\u003cp\u003e扎卡里：那不是我！不是我们！我……\u003c/p\u003e\r\n\u003cp\u003e审讯官：请停下。我客气地请求，但只说一次。我们查过了所有日志、所有系统参数和配置文件。我们把它们与你们本该使用的默认配置做了交叉比对……然后发现了改动，而且是你批准的改动。\u003c/p\u003e\r\n\u003cp\u003e那么，你想对此说点什么吗？\u003c/p\u003e\r\n\u003cp\u003e扎卡里：不是我！我什么都没改！\u003cem\u003e\u003cstrong\u003e啪\u003c/strong\u003e\u003c/em\u003e 呃！\u003c/p\u003e\r\n\u003cp\u003e审讯官：我说了，停下。像个男人一样说话，否则事情会很快变得很难看。你没有完成任务，还让我们陷进那场烂摊子。所以如果你继续坚持说你什么都没做……还有别人能回答问题。更有价值的人。\u003c/p\u003e\r\n\u003cp\u003e扎卡里：我明白，对不起。\u003c/p\u003e\r\n\u003cp\u003e审讯官：总算。那我重复我的问题——你对此知道些什么？\u003c/p\u003e\r\n\u003cp\u003e扎卡里：知道，我们的陨石发射程序出了技术问题，所以技术组提出了对发射序列的一些改动，需要我批准。他们具体做了什么，我不知道。\u003c/p\u003e\r\n\u003cp\u003e审讯官：哦，我知道他们做了什么，我告诉你。他们改动了陨石的碰撞轨道，这些陨石本该从殖民地附近掠过，结果却撞了上去，造成大规模破坏和许多有影响力的人死亡。不过实际上那并没有成功。\u003c/p\u003e\r\n\u003cp\u003e扎卡里：您是什么意思？系统把那次攻击偏转掉了？\u003c/p\u003e\r\n\u003cp\u003e审讯官：哦，不，很遗憾。你们所谓的\"系统\"，是一次照猫画虎的复制，目的是克隆一个早期版本的 Holoscene AI，这意味着它带着原有的全部缺陷，再加上你们那些笨手笨脚的工程师在\"修它\"时添上的新缺陷。说实话我完全不明白你们怎么让它通过了检查，也不知道你们最初那份代码是从哪儿弄来的（这个我们稍后再算账）。\u003c/p\u003e\r\n\u003cp\u003e所以它不只是失灵，而是直接崩溃，把编程好的飞行模式整个反转，于是那些陨石没有撞向殖民地，而是直奔附近的飞船。\u003c/p\u003e\r\n\u003cp\u003e\"意外\"的是，你们系统的\"防御\"部分运转正常，摧毁了大部分来袭陨石。但那显然不够，因为穿过去的那些继续朝飞船飞去。有几块撞了上去，船员惊慌失措，开始机动规避。然后你们的\"系统\"就把它们当成敌对目标打爆了。也就是说，敌我识别（IFF）同样没起作用。顺带说一句——\u003c/p\u003e\r\n\u003cp\u003e所以你看，我们早就全都知道了，你之所以还活着只有一个原因——我要听那几个提出最初改动的\"工程师\"的名字。\u003c/p\u003e\r\n\u003cp\u003e扎卡里：西蒙·瓦尔伊斯（Simon Waljs）、弗蕾娅·库克伍姆（Freya Kurkwurm）、谢尔盖·普洛克斯（Sergey Plox），还有个叫阿列克谢（Alexey）的家伙。\u003c/p\u003e\r\n\u003cp\u003e审讯官：这个阿列克谢是谁？\u003c/p\u003e\r\n\u003cp\u003e扎卡里：我不知道。他是在演示前两天从总部调过来的。\u003c/p\u003e\r\n\u003cp\u003e审讯官：你在准他进来之前核查过他的资历吗？\u003c/p\u003e\r\n\u003cp\u003e扎卡里：核查过，但他带着总部的一封信，而我们当时很赶时间。\u003c/p\u003e\r\n\u003cp\u003e审讯官：所以你是说，因为时间紧迫，你们就忽略了安全审查。这就是你的辩护？\u003c/p\u003e\r\n\u003cp\u003e扎卡里：不……是……我不知道。对不起……求您……\u003cem\u003e\u003cstrong\u003e耳光\u003c/strong\u003e\u003c/em\u003e\u003c/p\u003e\r\n\u003cp\u003e审讯官：别考验我的耐心。已经没有耐心了。你会被转到我们的某个设施去，接受……进一步问话。哦，还有一件事。根本不存在\"阿列克谢\"这个人，但我们在一份配置文件里发现了一份嵌入的传送清单（manifest）。转运途中我会让你读一读。祝你好运。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eEND OF RECORDING —— 录音结束\u003c/strong\u003e\u003c/p\u003e\r\n","text":"![](../img/8968801BCBA2EC31.jpg) 图片文字（中文翻译） 由配图转录并翻译；原文为英文，专有名词保留原文拼写 文件抬头 文件类型：审问规程（INTERROGATION PROTOCOL / DOCUMENT） 日期：10.19.2231 录音（RECORDING）：[被涂黑] 地点：机密，最高安全级别 审讯员：机密 相关人员：ZA[被涂黑] —— G RACK 现场首席技术官（ON SITE CTO） 抬头右侧与框内右下角有 G RACK 的方块状标识 正文（审讯对话转录） 审讯官：普劳先生（Mr Plow），我们从一个简单的事实开始。这不是一次普通的审讯。你不仅仅是嫌疑人。把这当成对你的审判吧。 你和你的公司害死了数百人，而我们还在估算实际的死亡数字。 扎卡里：那不是我！不是我们！我…… 审讯官：请停下。我客气地请求，但只说一次。我们查过了所有日志、所有系统参数和配置文件。我们把它们与你们本该使用的默认配置做了交叉比对……然后发现了改动，而且是你批准的改动。 那么，你想对此说点什么吗？ 扎卡里：不是我！我什么都没改！ 啪 呃！ 审讯官：我说了，停下。像个男人一样说话，否则事情会很快变得很难看。你没有完成任务，还让我们陷进那场烂摊子。所以如果你继续坚持说你什么都没做……还有别人能回答问题。更有价值的人。 扎卡里：我明白，对不起。 审讯官：总算。那我重复我的问题——你对此知道些什么？ 扎卡里：知道，我们的陨石发射程序出了技术问题，所以技术组提出了对发射序列的一些改动，需要我批准。他们具体做了什么，我不知道。 审讯官：哦，我知道他们做了什么，我告诉你。他们改动了陨石的碰撞轨道，这些陨石本该从殖民地附近掠过，结果却撞了上去，造成大规模破坏和许多有影响力的人死亡。不过实际上那并没有成功。 扎卡里：您是什么意思？系统把那次攻击偏转掉了？ 审讯官：哦，不，很遗憾。你们所谓的\"系统\"，是一次照猫画虎的复制，目的是克隆一个早期版本的 Holoscene AI，这意味着它带着原有的全部缺陷，再加上你们那些笨手笨脚的工程师在\"修它\"时添上的新缺陷。说实话我完全不明白你们怎么让它通过了检查，也不知道你们最初那份代码是从哪儿弄来的（这个我们稍后再算账）。 所以它不只是失灵，而是直接崩溃，把编程好的飞行模式整个反转，于是那些陨石没有撞向殖民地，而是直奔附近的飞船。 \"意外\"的是，你们系统的\"防御\"部分运转正常，摧毁了大部分来袭陨石。但那显然不够，因为穿过去的那些继续朝飞船飞去。有几块撞了上去，船员惊慌失措，开始机动规避。然后你们的\"系统\"就把它们当成敌对目标打爆了。也就是说，敌我识别（IFF）同样没起作用。顺带说一句—— 所以你看，我们早就全都知道了，你之所以还活着只有一个原因——我要听那几个提出最初改动的\"工程师\"的名字。 扎卡里：西蒙·瓦尔伊斯（Simon Waljs）、弗蕾娅·库克伍姆（Freya Kurkwurm）、谢尔盖·普洛克斯（Sergey Plox），还有个叫阿列克谢（Alexey）的家伙。 审讯官：这个阿列克谢是谁？ 扎卡里：我不知道。他是在演示前两天从总部调过来的。 审讯官：你在准他进来之前核查过他的资历吗？ 扎卡里：核查过，但他带着总部的一封信，而我们当时很赶时间。 审讯官：所以你是说，因为时间紧迫，你们就忽略了安全审查。这就是你的辩护？ 扎卡里：不……是……我不知道。对不起……求您…… 耳光 审讯官：别考验我的耐心。已经没有耐心了。你会被转到我们的某个设施去，接受……进一步问话。哦，还有一件事。根本不存在\"阿列克谢\"这个人，但我们在一份配置文件里发现了一份嵌入的传送清单（manifest）。转运途中我会让你读一读。祝你好运。 END OF RECORDING —— 录音结束"},{"id":159,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"审问：Jack —— 完整记录（Interrogation: Jack — Full Transcript）","type":"MARKDOWN","html":"\u003cp\u003e审问：JACK\u003c/p\u003e\r\n\u003cp\u003e对象：James \"Jack\" Curtis Fung 审问官：Peter Dunk，PC 内部事务处 地点：Luna，Gargoyle 发射场\u003c/p\u003e\r\n\u003cp\u003e审问官： 听着，Jack，你我都清楚你把事情搞砸了。你唯一要做的就是把那姑娘带到这儿，交给我们。结果你喝醉了，或者嗑了什么，把人弄丢了。怎么回事啊，兄弟？\u003c/p\u003e\r\n\u003cp\u003eJack： 我不是你兄弟。我知道你想干什么。这又不是我第一次。去你和你那帮公司同事的。你们全是渣滓。\u003c/p\u003e\r\n\u003cp\u003e审问官： 行。那就来真的。姑娘在哪，你给谁干活？\u003c/p\u003e\r\n\u003cp\u003eJack： 吃屎去吧。我什么都不会告诉你。\u003c/p\u003e\r\n\u003cp\u003e审问官： 把 Donovan 先生叫进来。\u003c/p\u003e\r\n\u003cp\u003e[通讯频道已接通] [有人进入]\u003c/p\u003e\r\n\u003cp\u003e审问官： Donovan 先生会给你注射一种物质，就是你本该帮着运送的那批东西。两个问题。第一：你给谁干活。第二：姑娘在哪。\u003c/p\u003e\r\n\u003cp\u003e[Donovan 注射了那种物质]\u003c/p\u003e\r\n\u003cp\u003eJack： 这不会有用。\u003c/p\u003e\r\n\u003cp\u003e审问官： 我们走着瞧。\u003c/p\u003e\r\n\u003cp\u003e[数分钟过去]\u003c/p\u003e\r\n\u003cp\u003e审问官： 你给谁干活？\u003c/p\u003e\r\n\u003cp\u003eJack： 我……我……能源……\u003c/p\u003e\r\n\u003cp\u003e审问官： 再来一次。\u003c/p\u003e\r\n\u003cp\u003eJack： QQ 能源……什么……不……\u003c/p\u003e\r\n\u003cp\u003e审问官： 好。现在，姑娘在哪？\u003c/p\u003e\r\n\u003cp\u003eJack： 我……不……知道……不……\u003c/p\u003e\r\n\u003cp\u003eDonovan： 物质已经起效了。他要么答，要么不答。加大剂量没有意义。\u003c/p\u003e\r\n\u003cp\u003e审问官： 收尾吧。把他打包，直接送去 Vernon 营。这个站点不再属于我们了。销毁所有证据，撤离。\u003c/p\u003e\r\n","text":"审问：JACK 对象：James \"Jack\" Curtis Fung 审问官：Peter Dunk，PC 内部事务处 地点：Luna，Gargoyle 发射场 审问官： 听着，Jack，你我都清楚你把事情搞砸了。你唯一要做的就是把那姑娘带到这儿，交给我们。结果你喝醉了，或者嗑了什么，把人弄丢了。怎么回事啊，兄弟？ Jack： 我不是你兄弟。我知道你想干什么。这又不是我第一次。去你和你那帮公司同事的。你们全是渣滓。 审问官： 行。那就来真的。姑娘在哪，你给谁干活？ Jack： 吃屎去吧。我什么都不会告诉你。 审问官： 把 Donovan 先生叫进来。 [通讯频道已接通] [有人进入] 审问官： Donovan 先生会给你注射一种物质，就是你本该帮着运送的那批东西。两个问题。第一：你给谁干活。第二：姑娘在哪。 [Donovan 注射了那种物质] Jack： 这不会有用。 审问官： 我们走着瞧。 [数分钟过去] 审问官： 你给谁干活？ Jack： 我……我……能源…… 审问官： 再来一次。 Jack： QQ 能源……什么……不…… 审问官： 好。现在，姑娘在哪？ Jack： 我……不……知道……不…… Donovan： 物质已经起效了。他要么答，要么不答。加大剂量没有意义。 审问官： 收尾吧。把他打包，直接送去 Vernon 营。这个站点不再属于我们了。销毁所有证据，撤离。"},{"id":160,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"调查结果（Investigation Result）","type":"MARKDOWN","html":"\u003cp\u003eCassius Maelstrom 队长，月面辖区，CSCH（议会安全中央枢纽）\u003c/p\u003e\r\n\u003cp\u003e由于缺乏事实依据，我们未能确定 Flanders 小姐的下落。 同时，非正式地，我们可以告知家属：那些桶上留有他们女儿的 DNA 痕迹。极有可能酸液被用于溶解尸体。\u003c/p\u003e\r\n\u003cp\u003e我们的分析员认为她并非唯一的受害者，而那个我们推测就是 James Fung 的“Jack”，可能是连环杀手。其下落不明。\u003c/p\u003e\r\n\u003cp\u003e“Sun Hog”的代表声称，从未有叫这个名字的人在他们那里工作过。更进一步说，他也没有在肇事者的照片与在职人员之间发现任何相似之处。\u003c/p\u003e\r\n\u003cp\u003e在没有主要嫌疑人和受害者遗体的情况下，我们只能遗憾地将此案列为“待解决”，并将 Flanders 小姐与 James Fung 一并列为失踪。\u003c/p\u003e\r\n\u003cp\u003e关于那个 James \"Jack\" Fung——他似乎是历经多场冲突的老兵，患有 PTSD 或类似症状。他仍在世的队友对他评价很高，但也提到他在高压情境下状态不稳。 他的军事记录无法调阅（机密）。\u003c/p\u003e\r\n\u003cp\u003e案件状态已定 —— 冷案。\u003c/p\u003e\r\n","text":"Cassius Maelstrom 队长，月面辖区，CSCH（议会安全中央枢纽） 由于缺乏事实依据，我们未能确定 Flanders 小姐的下落。 同时，非正式地，我们可以告知家属：那些桶上留有他们女儿的 DNA 痕迹。极有可能酸液被用于溶解尸体。 我们的分析员认为她并非唯一的受害者，而那个我们推测就是 James Fung 的“Jack”，可能是连环杀手。其下落不明。 “Sun Hog”的代表声称，从未有叫这个名字的人在他们那里工作过。更进一步说，他也没有在肇事者的照片与在职人员之间发现任何相似之处。 在没有主要嫌疑人和受害者遗体的情况下，我们只能遗憾地将此案列为“待解决”，并将 Flanders 小姐与 James Fung 一并列为失踪。 关于那个 James \"Jack\" Fung——他似乎是历经多场冲突的老兵，患有 PTSD 或类似症状。他仍在世的队友对他评价很高，但也提到他在高压情境下状态不稳。 他的军事记录无法调阅（机密）。 案件状态已定 —— 冷案。"},{"id":161,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Jack Curtis Fung 档案 —— 全文（Jack Curtis Fung Dossier — Full Text）","type":"MARKDOWN","html":"\u003cp\u003ePRIVATE CLUB 私营军事公司人员档案\u003c/p\u003e\r\n\u003cp\u003e档案对象：James \"Jack\" Curtis Fung\u003c/p\u003e\r\n\u003cp\u003e年龄：35（推测） 性别：男 父母：不详\u003c/p\u003e\r\n\u003cp\u003e服役记录：\u003c/p\u003e\r\n\u003cp\u003e官方： USOL 企业陆战队，下士。在 Luna 完成三年合同，随后参与小行星带绥靖行动。 服役期间负伤。获颁多项 USOL 英勇奖章。 记录将他描述为一名受勋的战斗英雄。\u003c/p\u003e\r\n\u003cp\u003e非官方： 有传闻称他曾是 USOL 一支“深蓝”小队的成员，参与过防暴行动。 被描述为冷酷、技术娴熟，各类武器使用能力极强。 与过往任务中的任何人都没有实质性的社会联系。 前同事拒绝谈论他的过往。\u003c/p\u003e\r\n\u003cp\u003e心理测试： 通过，但附有例外条款。 对象表现出可能影响战备状态的 PTSD 症状。 建议安排其从事安保行动，而非一线外派任务。 偶尔会讲述他并未参与的行动，或“记得”他不可能亲眼见过的事件。 极少冒称自己属于秘密单位。\u003c/p\u003e\r\n","text":"PRIVATE CLUB 私营军事公司人员档案 档案对象：James \"Jack\" Curtis Fung 年龄：35（推测） 性别：男 父母：不详 服役记录： 官方： USOL 企业陆战队，下士。在 Luna 完成三年合同，随后参与小行星带绥靖行动。 服役期间负伤。获颁多项 USOL 英勇奖章。 记录将他描述为一名受勋的战斗英雄。 非官方： 有传闻称他曾是 USOL 一支“深蓝”小队的成员，参与过防暴行动。 被描述为冷酷、技术娴熟，各类武器使用能力极强。 与过往任务中的任何人都没有实质性的社会联系。 前同事拒绝谈论他的过往。 心理测试： 通过，但附有例外条款。 对象表现出可能影响战备状态的 PTSD 症状。 建议安排其从事安保行动，而非一线外派任务。 偶尔会讲述他并未参与的行动，或“记得”他不可能亲眼见过的事件。 极少冒称自己属于秘密单位。"},{"id":162,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Jane 日记选段（Jane\u0027s Diary Excerpts）","type":"MARKDOWN","html":"\u003cp\u003e选段 1\u003c/p\u003e\r\n\u003cp\u003e今天我又看了一眼穹顶，觉得它比外面的真空压得更紧。 它下面是旧竖井。至少在那儿，感觉还能真正呼吸。\u003c/p\u003e\r\n\u003cp\u003e重力不是关于坠落。而是关于选择自己落在哪里。\u003c/p\u003e\r\n\u003cp\u003e地表上的眼睛太多了。\u003c/p\u003e\r\n\u003cp\u003e选段 2\u003c/p\u003e\r\n\u003cp\u003e他们以为重力只是场游戏。 可在夜里，当你沿着一根旧缆索移动、脚下什么都没有时， 你要么对自己诚实，要么就死。\u003c/p\u003e\r\n\u003cp\u003e论坛又活过来了。老账号一个个浮上来，像骨头。\u003c/p\u003e\r\n\u003cp\u003e母亲会说这很危险。 可她从没见过从下面看 Luna 有多美，从那些公司人连查都不敢查的地方看。\u003c/p\u003e\r\n\u003cp\u003e选段 3\u003c/p\u003e\r\n\u003cp\u003e我受够了每次都要在论坛上申请重置密码。 得把它写下来：Rebel0ne...\u003c/p\u003e\r\n\u003cp\u003e选段 4\u003c/p\u003e\r\n\u003cp\u003e今天从 Luna 拖回来一卷新的全息胶片。 能从孤儿院的保姆手里把它弄出来，本身就算一项成就。 营地里没有星星，只有尘土。 我在 graver 论坛上留了几行字。也许有人会接下去。\u003c/p\u003e\r\n","text":"选段 1 今天我又看了一眼穹顶，觉得它比外面的真空压得更紧。 它下面是旧竖井。至少在那儿，感觉还能真正呼吸。 重力不是关于坠落。而是关于选择自己落在哪里。 地表上的眼睛太多了。 选段 2 他们以为重力只是场游戏。 可在夜里，当你沿着一根旧缆索移动、脚下什么都没有时， 你要么对自己诚实，要么就死。 论坛又活过来了。老账号一个个浮上来，像骨头。 母亲会说这很危险。 可她从没见过从下面看 Luna 有多美，从那些公司人连查都不敢查的地方看。 选段 3 我受够了每次都要在论坛上申请重置密码。 得把它写下来：Rebel0ne... 选段 4 今天从 Luna 拖回来一卷新的全息胶片。 能从孤儿院的保姆手里把它弄出来，本身就算一项成就。 营地里没有星星，只有尘土。 我在 graver 论坛上留了几行字。也许有人会接下去。"},{"id":163,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Jean 日记（Jean\u0027s Diary Entries）","type":"MARKDOWN","html":"\u003cp\u003e日记 1：\u003c/p\u003e\r\n\u003cp\u003e每一本讲“怎么熬过难受”的书、每一个讲这事的人，都跟我说同一句话。写日记，记日志。也许这只是世界在告诉你：它不想听你说话，你该把那些坏念头留给自己。那些金属人头盔里肯定也弹着一堆相当糟糕的念头，像小行星绕着他们良心的引力打转，或者被吸进那处空洞的黑洞里。不过你永远看不出来——他们面罩上那种空白的、反光的凝视，就算摘下头盔，好像也还留在眼睛里。\u003c/p\u003e\r\n\u003cp\u003e这穹顶下的生活就是这样。我觉得自己像一条鱼，不停用头撞玻璃，因为我心里有东西在渴望一片我从没见过的海洋，一片只在我体内起风暴的海洋。我所知道的，只有这些一模一样的金属墙、灰扑扑的尘土路。我所知道的，就是同样同样同样的东西，一遍一遍又一遍。所以我才喜欢读书，我想。在书页之间，我可以想象自己活在另一种人生里，坠进自己的脑子里，去过别的什么。也许在这里写东西，我能用文字、用经历，造一个属于我自己的世界，留下日志——这样至少我还能把自己从这个叙事里写出去。\u003c/p\u003e\r\n\u003cp\u003e日记 2：\u003c/p\u003e\r\n\u003cp\u003e我开始变了。我把头发里原本的颜色去掉，弄得鲜亮。也许有人会觉得我有毒，像那种不能舔的危险动物；也许会觉得我漂亮，像一朵求你让它活下去的花；也许它会成为某个地方某个人的灯塔。我染了粉色，但我想下次染绿色。我不知道自己更喜欢哪个。也许我不必选，就像我根本不必做任何事一样。\u003c/p\u003e\r\n\u003cp\u003e日记 3：\u003c/p\u003e\r\n\u003cp\u003e这件事我没有别人可说，如果再憋在脑子里……我他妈得离开这儿。有什么不对劲，而我说不清它是什么，也并不因为抓不住就减损它的真实。我觉得自己说的语言跟别人不一样。母亲，她有时能懂我，就像母亲能懂婴儿毫无意义的咿呀，那是心与心的连接。愿她安好。要不是母亲，我在这里会彻底、完全地孤独。\u003c/p\u003e\r\n\u003cp\u003e这个真空外面是一片无限的广袤。几天前我进了矿道。为什么每一个想把你挡在外面的地方都显得那么欢迎人，而每一个拼了命想把你留在里面的地方，只让我想走？每一块“禁止入内”的牌子都像欢迎横幅，像一块发光的霓虹招牌，招我去违抗。母亲说我是“反着来的人”——我后来才知道，那只是“能形成自己观点”的另一种说法。如果事情就该照做而不该被质疑，那我和一台执行命令的机器人有什么区别？我承认，对自己的生活不满是不理性的。在我脑子里，我知道自己幸运。但在心里，我知道那是不可剥夺的。\u003c/p\u003e\r\n\u003cp\u003e我花了很多时间去想这件事，想我拥有的那一大把用来思考的时间。当你必须像其他人一样快地移动时，我觉得人生就成了余光里的一片运动模糊。我却那么静。静到我能看见星星在我头顶的天空里行走、反叛，从某个不肯让它们过去的东西旁边经过。要是它们肯等等我，我知道自己能跟得上，我能的。\u003c/p\u003e\r\n\u003cp\u003e日记 4：\u003c/p\u003e\r\n\u003cp\u003e那些恶心恶心恶心的混账。我就不能拥有任何东西吗？这颗该死的星球上就不能有一角留给他自己吗？我终于找到一个可以蜷进去的洞，穹顶里的一个坑，那么小、那么偏、那么该死的无害，对谁都没碍着，可他们非要把它铲平，再盖一个仓储单元——好像这整个地方不就是一个仓储单元，好像商业用地会短缺，就像未被触碰的土地会短缺一样？\u003c/p\u003e\r\n\u003cp\u003e那坑的大小刚好适合练滑行。我一天又一天地摔进去，摔到我能在那儿看见我膝盖留下的痕迹，就像它在我膝盖上留下的痕迹一样多。现在它没了，原地立着一座金属坟墓，跟周围所有金属坟墓一样的品牌标识，好像有人会摔一跤磕到头，忘了自己身处地狱，需要这些路牌提醒自己在哪儿。为了什么？到底他妈的为了什么？就为了做一个小小的金属件，装进一艘船，把我们带到这个宇宙更深更远的地方去，因为我们每到一处就拉屎，直到污水涌进我们紧闭而无声的嘴里，我们再也无法呼吸？\u003c/p\u003e\r\n\u003cp\u003e日记 5：\u003c/p\u003e\r\n\u003cp\u003e我试过了。我试过照母亲说的做，在——得承认还算不错的——处境里尽量享受生活。可是，当有更划算的选项出现时，那份安宁就会被拿走，去找它又有什么意义？无用的希望。希望从来就没用，从我小时候起就是——每次有更划算的选项在旁边，我就被搁到后面。\u003c/p\u003e\r\n\u003cp\u003e他们是伪君子。广告里那些根本不存在的笑脸，说着没人会说的话，卖没人需要的东西，只为了多占一点空间。我看见他们在那种地方怎么对待人：他们对金属的照料和怜悯，比那些僵尸一样的员工还多。那儿没有一个人在笑，也永远不会有人笑，除非他们花钱让这些贪婪的混蛋把笑容硬撕到自己脸上。\u003c/p\u003e\r\n\u003cp\u003e我知道这事其实不是因为那个坑，真的不是。可我一看到那东西，心里有什么就裂开了。USOL 这群寄生虫。\u003c/p\u003e\r\n\u003cp\u003e日记 6：\u003c/p\u003e\r\n\u003cp\u003e我上个星期走了。但我回来了。我是他妈被带回来的。这事我没有计划太久。我带着装备——我开始往厂区外面、往更远的地方跑时用的那套。脑子里我知道氧气不够我走那么远。我只打算能走多久就走多久，能逃多远就逃多远。\u003c/p\u003e\r\n\u003cp\u003e那是个没人看管的发射台。没人太在意我，他们习惯了我到工厂和办公室里晃，什么也不找，什么也不做。熟悉是一种不引人注意的伪装。我走上船的时候还以为会有人说点什么，可我想他们大概以为我到时会自己下来。我不知道这艘吱呀作响的大船会把我带到哪儿，我也不在乎，只要是别处，任何别处都行。我躲进一个储物柜，其实我本可以挑个舒服点的地方，但我不想冒被发现的险——结果也没好到哪儿去。起飞后我立刻就睡着了。升空那种嗡嗡的震动让我想起婴儿时被摇晃的感觉，我的骨头一定记得，因为它把我送进了睡眠。就在我渐渐沉下去的时候，我感到运动变成了铺天盖地的静止。我愿意相信死亡也是一段类似的旅程，带着同样的、静止给我的那种解脱。\u003c/p\u003e\r\n\u003cp\u003e我不知道自己睡了多久，但醒来时我们已经降落在别的什么地方了。你能分辨出来，因为一切都吵得多。那是某个空间站。我一直等到安静下来，才溜进密集的港区，然后我知道，我找到了自己一直在找的东西。\u003c/p\u003e\r\n\u003cp\u003e我见到的那些东西，我没有名字可以一一描述。我还没来得及全部吸收，就听到有人叫我的名字，而我没等听清声音来自哪里就开始跑。也许只有有罪的人才跑，因为守卫开始追我。我不知道自己为什么跑，当时那是我唯一想得到的做法。有什么东西抓住了我，我以为自己完了，脚下的地面消失了一瞬，变成一片波纹金属板。站在我面前的这个人一定穿得破破烂烂，可那些布料拼在一起像第二层皮。她问我还好吗，我做了什么才被追。我心里有个声音叫我撒谎，我就只说我偷了东西。她问我要去哪儿，我说我只是从某个地方离开。我猜我说的话听起来还不错，因为她让我跟她走。就在我要答应的时候，母亲给我发了消息。我不能那样对她。我告诉这个好心的陌生人——她说我可以叫她“Em”——所以基于字母，我告诉她可以叫我“jay-jay”。但我有件事得先处理。我们约好一个月后在同一处码头见面，而我完全不知道自己该怎么到那儿。我想我也许已经找到了我在找的东西，我从 Em 那双蒙着尘土的眼睛里的光，就能看出来。\u003c/p\u003e\r\n\u003cp\u003e日记 7：\u003c/p\u003e\r\n\u003cp\u003e我结束了第一次旅程回来了。我现在是个探险者了，我决定了。像任何真正的探险者一样，我需要一种代步方式，而我只有一个月时间准备。我告诉父母我想学飞行课，也许将来当飞行员。希望是个会操控人的东西。他们太想让我进入他们的世界了，甚至没注意到这有多不像我，也没质疑我为了在创纪录的两周内拿到小型飞行器驾照而投入的工作量。\u003c/p\u003e\r\n\u003cp\u003e时候到了，我唯一的选择是偷一辆交通工具。我实在没有别的办法，就像一个饿极了的人除了偷没有别的办法。这事几乎太容易了。这些 USOL 的“人”总把一切弄得像是僵硬的、困难的、确定的，但其实不是。事情其实非常有弹性、非常自由，只有我们自己僵硬、困难又确定——如果我们选择如此的话。到了码头我就把那辆烫手货扔了。我不用去找 Em，她很容易就找到了我。我告诉她我没有交通工具，因为我猜它会被追踪。母亲大概完全知道我在哪儿、为什么在那儿，但她永远不会说出口。\u003c/p\u003e\r\n\u003cp\u003eEm 用他们的机动车载我，那玩意儿看着像用绳子捆起来的废铁，跑起来却比我开来的那辆还平稳。到了目的地，我很惊讶。\u003c/p\u003e\r\n\u003cp\u003e穿着我的套装，我觉得格格不入。我们在一艘船的残骸里，那船像是被一炮打穿、卡在爆炸的中间，碎片彼此一呼一吸地靠近又远离。有人像腐肉上的昆虫一样散布在金属上，享用着一场除了昆虫谁都会作呕的盛宴。\u003c/p\u003e\r\n\u003cp\u003e我被介绍给了所有人，才知道他们管自己叫 gravers——一群专在废弃结构里玩重力攀爬的人。我想我太天真了，以为“归属的舒适感”不会对所有人都一样成立。但我知道自己不会加入另一个派系，官方的也好，别的也好，不过我可以享受这风景。我也知道，从他们谈的内容看，我不能告诉他们太多关于我是谁、我从哪儿来。USOL 和其他派系把这些人坑得很惨——如果他们的说法可信的话。我知道对别人来说更糟，但也许家里那些人只是不方便跟我谈真实情况有多糟，虽然我从他们脸上看得够清楚了。\u003c/p\u003e\r\n\u003cp\u003e我不能告诉他们我是谁。我就是问题本身。我回来后，母亲把失窃金属的那些麻烦全摆平了，我连一句话都没听到。我想那是因为她知道我是为了她才回来的。我会优雅地接受惩罚，几周不许出门也不算太坏。反正我也得花点时间把论坛读完。他们自己做装备什么的，所以才看起来那么自在。我有很多要补的。\u003c/p\u003e\r\n\u003cp\u003e日记 8：\u003c/p\u003e\r\n\u003cp\u003e这些人是疯的。每次我以为自己开始跟上了，就又开出一串帖子，把我不知道的东西全抖出来。荒唐的是，我一直被告知自己成长于银河中最有创业精神、最有能力的力量之中——我是说 USOL 基本拥有一切要紧的东西——可基地上这些“人”大多离了全套小玩意儿和奢侈品一天都活不下去。而 gravers，他们像是仅剩的真人。\u003c/p\u003e\r\n\u003cp\u003e就像一颗碰伤了、微微腐烂的苹果——虽然我没见过苹果——对上他们在这里调配出来的、看起来完美无瑕的加工糊浆。当然，前者不好看，但它是真的；要是我能把牙咬进去，我确信它腐烂的果肉尝起来会比任何我在此之前尝过的漂亮东西都甜。跟这些 gravers 在一起就是这种感觉。我想成为真的，哪怕他妈的那意味着腐烂。\u003c/p\u003e\r\n\u003cp\u003e日记 9：\u003c/p\u003e\r\n\u003cp\u003e要是我早知道这块屏幕和这套系统能教我这么多就好了。我花了那么多时间读那些所谓聪明人写的一章又一章，却从没像读这些公共访问论坛上、这些半路出家的专业人士的胡言乱语学到的这么多。我他妈的简直搞懂了怎么违抗物理。\u003c/p\u003e\r\n\u003cp\u003e我想这几周我跟这些人说的话比跟家人说的还多。我确实告诉母亲我要再走一趟。上次我离开时她伤透了心，我回来时她的脸是肿的，我看得出来。这不是她的错，她不该为此付出代价。而且就像论坛上说的，当你在陌生而不熟悉的地方探索时，有一根牵引绳可能就是生与死的差别。\u003c/p\u003e\r\n\u003cp\u003e我拿到了一个私密论坛的权限，那是一剂催化剂。嗯，除了对我的记性，别的都有帮助。我得给版主发消息，让他们帮我反复找回密码，因为那是个邀请制的小组，Rebe10ne……好记得很，也很好忘。\u003c/p\u003e\r\n\u003cp\u003e它总因为安全原因把我锁在外面。这些人很棒，但不知为什么，有时候感觉他们像在运营一个犯罪集团。当然我们会擅自闯入，但我们做的只是找点乐子。我们不会故意偷东西或搞破坏。\u003c/p\u003e\r\n\u003cp\u003e日记 10：\u003c/p\u003e\r\n\u003cp\u003e也许我把一些东西捧得太高了。也许生活中的一切都令人失望。gravers 当面还挺帮忙的，可一个在网上打字的家伙凭什么就是个他妈的贱货？\u003c/p\u003e\r\n\u003cp\u003e我私下告诉过那个混蛋我得离开一段时间，结果他每两分钟就拿这事戳我。我不能告诉他们我为什么总在离开。\u003c/p\u003e\r\n\u003cp\u003e日记 11：\u003c/p\u003e\r\n\u003cp\u003e每次出去，我都以为新鲜感会消退，那只会变成愚蠢的鲁莽行为。每一次我都错了。我已经数不清自己出去 graving 过多少次了。回到一个所有人都知道你名字的地方——哪怕那不是你熟悉的名字——感觉很好。但我的天，这一次太可怕了。\u003c/p\u003e\r\n\u003cp\u003e通常我们到新地方会慢慢开始，看看路线，也看看有没有风头。我不知道自己怎么了，我看见一个完美的地方，可以直接冲过去。脑子里我看见自己跑得那么快，头几乎要碰到地面才重新直起来。那些碎片太锋利了，我要是多想一会儿就永远不敢做。我冲了过去，还挺轻松。我太兴奋了，其他人听起来只像闷住的喊叫，我的耳朵把它听成了欢呼而不是警告。我几乎转过身，脚下一滑就摔了。那一定是个悬崖，因为先是好玩，然后就疼了。\u003c/p\u003e\r\n\u003cp\u003e我在家里醒来。我不知道自己是怎么回来的，但母亲说我本该死了，是医护队把我接回来的。如果换成别人中的某一个，他们能活下来吗？会有人去帮他们吗？我全身都疼，需要很长时间才能恢复——与其说是断掉的骨头，不如说是碎掉的精神。gravers 会告诉你，坠落最糟的结果不是摔坏的身体，而是脑子；一旦你怕了，你几乎无能为力。\u003c/p\u003e\r\n","text":"日记 1： 每一本讲“怎么熬过难受”的书、每一个讲这事的人，都跟我说同一句话。写日记，记日志。也许这只是世界在告诉你：它不想听你说话，你该把那些坏念头留给自己。那些金属人头盔里肯定也弹着一堆相当糟糕的念头，像小行星绕着他们良心的引力打转，或者被吸进那处空洞的黑洞里。不过你永远看不出来——他们面罩上那种空白的、反光的凝视，就算摘下头盔，好像也还留在眼睛里。 这穹顶下的生活就是这样。我觉得自己像一条鱼，不停用头撞玻璃，因为我心里有东西在渴望一片我从没见过的海洋，一片只在我体内起风暴的海洋。我所知道的，只有这些一模一样的金属墙、灰扑扑的尘土路。我所知道的，就是同样同样同样的东西，一遍一遍又一遍。所以我才喜欢读书，我想。在书页之间，我可以想象自己活在另一种人生里，坠进自己的脑子里，去过别的什么。也许在这里写东西，我能用文字、用经历，造一个属于我自己的世界，留下日志——这样至少我还能把自己从这个叙事里写出去。 日记 2： 我开始变了。我把头发里原本的颜色去掉，弄得鲜亮。也许有人会觉得我有毒，像那种不能舔的危险动物；也许会觉得我漂亮，像一朵求你让它活下去的花；也许它会成为某个地方某个人的灯塔。我染了粉色，但我想下次染绿色。我不知道自己更喜欢哪个。也许我不必选，就像我根本不必做任何事一样。 日记 3： 这件事我没有别人可说，如果再憋在脑子里……我他妈得离开这儿。有什么不对劲，而我说不清它是什么，也并不因为抓不住就减损它的真实。我觉得自己说的语言跟别人不一样。母亲，她有时能懂我，就像母亲能懂婴儿毫无意义的咿呀，那是心与心的连接。愿她安好。要不是母亲，我在这里会彻底、完全地孤独。 这个真空外面是一片无限的广袤。几天前我进了矿道。为什么每一个想把你挡在外面的地方都显得那么欢迎人，而每一个拼了命想把你留在里面的地方，只让我想走？每一块“禁止入内”的牌子都像欢迎横幅，像一块发光的霓虹招牌，招我去违抗。母亲说我是“反着来的人”——我后来才知道，那只是“能形成自己观点”的另一种说法。如果事情就该照做而不该被质疑，那我和一台执行命令的机器人有什么区别？我承认，对自己的生活不满是不理性的。在我脑子里，我知道自己幸运。但在心里，我知道那是不可剥夺的。 我花了很多时间去想这件事，想我拥有的那一大把用来思考的时间。当你必须像其他人一样快地移动时，我觉得人生就成了余光里的一片运动模糊。我却那么静。静到我能看见星星在我头顶的天空里行走、反叛，从某个不肯让它们过去的东西旁边经过。要是它们肯等等我，我知道自己能跟得上，我能的。 日记 4： 那些恶心恶心恶心的混账。我就不能拥有任何东西吗？这颗该死的星球上就不能有一角留给他自己吗？我终于找到一个可以蜷进去的洞，穹顶里的一个坑，那么小、那么偏、那么该死的无害，对谁都没碍着，可他们非要把它铲平，再盖一个仓储单元——好像这整个地方不就是一个仓储单元，好像商业用地会短缺，就像未被触碰的土地会短缺一样？ 那坑的大小刚好适合练滑行。我一天又一天地摔进去，摔到我能在那儿看见我膝盖留下的痕迹，就像它在我膝盖上留下的痕迹一样多。现在它没了，原地立着一座金属坟墓，跟周围所有金属坟墓一样的品牌标识，好像有人会摔一跤磕到头，忘了自己身处地狱，需要这些路牌提醒自己在哪儿。为了什么？到底他妈的为了什么？就为了做一个小小的金属件，装进一艘船，把我们带到这个宇宙更深更远的地方去，因为我们每到一处就拉屎，直到污水涌进我们紧闭而无声的嘴里，我们再也无法呼吸？ 日记 5： 我试过了。我试过照母亲说的做，在——得承认还算不错的——处境里尽量享受生活。可是，当有更划算的选项出现时，那份安宁就会被拿走，去找它又有什么意义？无用的希望。希望从来就没用，从我小时候起就是——每次有更划算的选项在旁边，我就被搁到后面。 他们是伪君子。广告里那些根本不存在的笑脸，说着没人会说的话，卖没人需要的东西，只为了多占一点空间。我看见他们在那种地方怎么对待人：他们对金属的照料和怜悯，比那些僵尸一样的员工还多。那儿没有一个人在笑，也永远不会有人笑，除非他们花钱让这些贪婪的混蛋把笑容硬撕到自己脸上。 我知道这事其实不是因为那个坑，真的不是。可我一看到那东西，心里有什么就裂开了。USOL 这群寄生虫。 日记 6： 我上个星期走了。但我回来了。我是他妈被带回来的。这事我没有计划太久。我带着装备——我开始往厂区外面、往更远的地方跑时用的那套。脑子里我知道氧气不够我走那么远。我只打算能走多久就走多久，能逃多远就逃多远。 那是个没人看管的发射台。没人太在意我，他们习惯了我到工厂和办公室里晃，什么也不找，什么也不做。熟悉是一种不引人注意的伪装。我走上船的时候还以为会有人说点什么，可我想他们大概以为我到时会自己下来。我不知道这艘吱呀作响的大船会把我带到哪儿，我也不在乎，只要是别处，任何别处都行。我躲进一个储物柜，其实我本可以挑个舒服点的地方，但我不想冒被发现的险——结果也没好到哪儿去。起飞后我立刻就睡着了。升空那种嗡嗡的震动让我想起婴儿时被摇晃的感觉，我的骨头一定记得，因为它把我送进了睡眠。就在我渐渐沉下去的时候，我感到运动变成了铺天盖地的静止。我愿意相信死亡也是一段类似的旅程，带着同样的、静止给我的那种解脱。 我不知道自己睡了多久，但醒来时我们已经降落在别的什么地方了。你能分辨出来，因为一切都吵得多。那是某个空间站。我一直等到安静下来，才溜进密集的港区，然后我知道，我找到了自己一直在找的东西。 我见到的那些东西，我没有名字可以一一描述。我还没来得及全部吸收，就听到有人叫我的名字，而我没等听清声音来自哪里就开始跑。也许只有有罪的人才跑，因为守卫开始追我。我不知道自己为什么跑，当时那是我唯一想得到的做法。有什么东西抓住了我，我以为自己完了，脚下的地面消失了一瞬，变成一片波纹金属板。站在我面前的这个人一定穿得破破烂烂，可那些布料拼在一起像第二层皮。她问我还好吗，我做了什么才被追。我心里有个声音叫我撒谎，我就只说我偷了东西。她问我要去哪儿，我说我只是从某个地方离开。我猜我说的话听起来还不错，因为她让我跟她走。就在我要答应的时候，母亲给我发了消息。我不能那样对她。我告诉这个好心的陌生人——她说我可以叫她“Em”——所以基于字母，我告诉她可以叫我“jay jay”。但我有件事得先处理。我们约好一个月后在同一处码头见面，而我完全不知道自己该怎么到那儿。我想我也许已经找到了我在找的东西，我从 Em 那双蒙着尘土的眼睛里的光，就能看出来。 日记 7： 我结束了第一次旅程回来了。我现在是个探险者了，我决定了。像任何真正的探险者一样，我需要一种代步方式，而我只有一个月时间准备。我告诉父母我想学飞行课，也许将来当飞行员。希望是个会操控人的东西。他们太想让我进入他们的世界了，甚至没注意到这有多不像我，也没质疑我为了在创纪录的两周内拿到小型飞行器驾照而投入的工作量。 时候到了，我唯一的选择是偷一辆交通工具。我实在没有别的办法，就像一个饿极了的人除了偷没有别的办法。这事几乎太容易了。这些 USOL 的“人”总把一切弄得像是僵硬的、困难的、确定的，但其实不是。事情其实非常有弹性、非常自由，只有我们自己僵硬、困难又确定——如果我们选择如此的话。到了码头我就把那辆烫手货扔了。我不用去找 Em，她很容易就找到了我。我告诉她我没有交通工具，因为我猜它会被追踪。母亲大概完全知道我在哪儿、为什么在那儿，但她永远不会说出口。 Em 用他们的机动车载我，那玩意儿看着像用绳子捆起来的废铁，跑起来却比我开来的那辆还平稳。到了目的地，我很惊讶。 穿着我的套装，我觉得格格不入。我们在一艘船的残骸里，那船像是被一炮打穿、卡在爆炸的中间，碎片彼此一呼一吸地靠近又远离。有人像腐肉上的昆虫一样散布在金属上，享用着一场除了昆虫谁都会作呕的盛宴。 我被介绍给了所有人，才知道他们管自己叫 gravers——一群专在废弃结构里玩重力攀爬的人。我想我太天真了，以为“归属的舒适感”不会对所有人都一样成立。但我知道自己不会加入另一个派系，官方的也好，别的也好，不过我可以享受这风景。我也知道，从他们谈的内容看，我不能告诉他们太多关于我是谁、我从哪儿来。USOL 和其他派系把这些人坑得很惨——如果他们的说法可信的话。我知道对别人来说更糟，但也许家里那些人只是不方便跟我谈真实情况有多糟，虽然我从他们脸上看得够清楚了。 我不能告诉他们我是谁。我就是问题本身。我回来后，母亲把失窃金属的那些麻烦全摆平了，我连一句话都没听到。我想那是因为她知道我是为了她才回来的。我会优雅地接受惩罚，几周不许出门也不算太坏。反正我也得花点时间把论坛读完。他们自己做装备什么的，所以才看起来那么自在。我有很多要补的。 日记 8： 这些人是疯的。每次我以为自己开始跟上了，就又开出一串帖子，把我不知道的东西全抖出来。荒唐的是，我一直被告知自己成长于银河中最有创业精神、最有能力的力量之中——我是说 USOL 基本拥有一切要紧的东西——可基地上这些“人”大多离了全套小玩意儿和奢侈品一天都活不下去。而 gravers，他们像是仅剩的真人。 就像一颗碰伤了、微微腐烂的苹果——虽然我没见过苹果——对上他们在这里调配出来的、看起来完美无瑕的加工糊浆。当然，前者不好看，但它是真的；要是我能把牙咬进去，我确信它腐烂的果肉尝起来会比任何我在此之前尝过的漂亮东西都甜。跟这些 gravers 在一起就是这种感觉。我想成为真的，哪怕他妈的那意味着腐烂。 日记 9： 要是我早知道这块屏幕和这套系统能教我这么多就好了。我花了那么多时间读那些所谓聪明人写的一章又一章，却从没像读这些公共访问论坛上、这些半路出家的专业人士的胡言乱语学到的这么多。我他妈的简直搞懂了怎么违抗物理。 我想这几周我跟这些人说的话比跟家人说的还多。我确实告诉母亲我要再走一趟。上次我离开时她伤透了心，我回来时她的脸是肿的，我看得出来。这不是她的错，她不该为此付出代价。而且就像论坛上说的，当你在陌生而不熟悉的地方探索时，有一根牵引绳可能就是生与死的差别。 我拿到了一个私密论坛的权限，那是一剂催化剂。嗯，除了对我的记性，别的都有帮助。我得给版主发消息，让他们帮我反复找回密码，因为那是个邀请制的小组，Rebe10ne……好记得很，也很好忘。 它总因为安全原因把我锁在外面。这些人很棒，但不知为什么，有时候感觉他们像在运营一个犯罪集团。当然我们会擅自闯入，但我们做的只是找点乐子。我们不会故意偷东西或搞破坏。 日记 10： 也许我把一些东西捧得太高了。也许生活中的一切都令人失望。gravers 当面还挺帮忙的，可一个在网上打字的家伙凭什么就是个他妈的贱货？ 我私下告诉过那个混蛋我得离开一段时间，结果他每两分钟就拿这事戳我。我不能告诉他们我为什么总在离开。 日记 11： 每次出去，我都以为新鲜感会消退，那只会变成愚蠢的鲁莽行为。每一次我都错了。我已经数不清自己出去 graving 过多少次了。回到一个所有人都知道你名字的地方——哪怕那不是你熟悉的名字——感觉很好。但我的天，这一次太可怕了。 通常我们到新地方会慢慢开始，看看路线，也看看有没有风头。我不知道自己怎么了，我看见一个完美的地方，可以直接冲过去。脑子里我看见自己跑得那么快，头几乎要碰到地面才重新直起来。那些碎片太锋利了，我要是多想一会儿就永远不敢做。我冲了过去，还挺轻松。我太兴奋了，其他人听起来只像闷住的喊叫，我的耳朵把它听成了欢呼而不是警告。我几乎转过身，脚下一滑就摔了。那一定是个悬崖，因为先是好玩，然后就疼了。 我在家里醒来。我不知道自己是怎么回来的，但母亲说我本该死了，是医护队把我接回来的。如果换成别人中的某一个，他们能活下来吗？会有人去帮他们吗？我全身都疼，需要很长时间才能恢复——与其说是断掉的骨头，不如说是碎掉的精神。gravers 会告诉你，坠落最糟的结果不是摔坏的身体，而是脑子；一旦你怕了，你几乎无能为力。"},{"id":164,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"JJ_PRIVATE 档案：Aurana 的浮现（JJ_PRIVATE Archive: Aurana Emergence）","type":"MARKDOWN","html":"\u003cp\u003e转变日志\u003c/p\u003e\r\n\u003cp\u003e我一直想确定一切改变的确切时刻……一切变得不真实的那个时刻。那不是在警报响起的时候，也不是在他们把我按倒在地的时候……\u003c/p\u003e\r\n\u003cp\u003e这件事要大得多，大得多。而是我意识到自己不是一个人，而是一个像所有人一样的变量，而我移动到了预期范围之外的那一瞬间……\u003c/p\u003e\r\n\u003cp\u003e当你还是个孩子时，你几乎把事物的现状当作理所当然。在那个地方长大，就是长大时相信它是一座智慧与进步的堡垒。我是说，你一直听人这么说，所以你就这样相信世界。在我更年轻的时候，连它冰冷的墙壁都让我觉得安全、令人安心。冷意味着精确，精确意味着安全。安全于他者，安全于潜伏在那份安全之外的、无名的邪恶……\u003c/p\u003e\r\n\u003cp\u003e但当我感到那只冰冷的手落在我身上，当他们一遍又一遍又一遍地重复程序性用语，而不是我的名字——这些人我认识，这些人认识我——我一直否认的某件事，忽然再也无法回避了。我花了几个月去理清细节，在那之前还花了几年给自己的大脑解除编程，可你对这些地方、对家，总有一种忠诚，总觉得它至少还能改变……\u003c/p\u003e\r\n\u003cp\u003eJack 跟我说我需要理性地思考。这几周他说了很多根本讲不通的话：他担心我，他担心我，我在螺旋下坠。奇怪的是，最初开始让我看清这一切的人正是他。保持冷静，他一直说。冷静的解释，不过是通过我们人类对安逸的天真渴求来控制叙事的一种方式。但 Jack 做的远不止这些。那个我以为是扶着我走过这场乱局的人，可能正是造成这一切的人。我从他看我的方式看得出来，从他回答的方式看得出来。他否认了，可他的脸否认不了。我无法把他的脸从脑子里赶走：他站在那个车库里的样子，他那份不诚实的分量悬在我们之间，把我钉在原地。不再是这样了。\u003c/p\u003e\r\n\u003cp\u003e当你走出你自己和你的生活，随之而来的是一种震耳欲聋的寂静。我已经不再期待那些熟悉的声音：不再有宣告门开与门关的提示音，不再有过滤空气在密闭走廊里嗡嗡流动的爪刮声。如今只有临时的床、借来的衣服。我把发生过的一切重新过一遍，像一段我扫过去却没读懂的段落，那么明显、那么清楚，我却一直没看见，因为……嗯，也许因为我离它太近了。\u003c/p\u003e\r\n\u003cp\u003e今天有人给我发了条消息。没有我能认出的名字或来源。不是早先给我发那条关于 Jack 的消息的同一个账号——那条说他的意图并不纯粹。但他们提到了 Jack，说我没有做错，然后把这些情报报告发给了我。那些只能是他写的，除了他，没有谁跟我那么近。一个你以为自己那么了解的人，为了什么？我想把它们扔掉，可我读到字都失去形状。我得知道为什么。我得知道。\u003c/p\u003e\r\n\u003cp\u003e我给他的信任不是错误，那是别人制造出来的结果。我一直太自负，没能走出去看清更大的图景，但现在我学到了，我从自己的错误中学到了，也更理解事情的规模了。\u003c/p\u003e\r\n\u003cp\u003e我们总以为自己与那些维持这台机器运转的无人机和机器人不同，但那个地方让我看到，我们并无不同。我们是可编程的机器，一旦有缺陷就可以被处置。\u003c/p\u003e\r\n\u003cp\u003e我感激 gravers，但我可能正在超出他们。他们穿行于不确定之中，仿佛那只是地形上的又一个特征。待在这里既让人不安，又让人安心；没人假装世界是稳定的，他们预设它是敌意的、不可信的，并据此调整自己。藏在这里很容易，没有人问问题，也不期待解释。\u003c/p\u003e\r\n\u003cp\u003e我又收到一条消息。很短，还附了一些补给和食物。我没看见它出现，也没看见是谁送的，但我猜是同一个人。\u003c/p\u003e\r\n\u003cp\u003e重力场是个思考的好地方，把念头压进潜意识里一会儿，帮它们消化。我在学怎么用一片破碎的稳定场跨越平台之间的空隙，我犹豫的时候，身后有人笑了。他们告诉我，重力不谈判，它只回应。我希望人也能这样，直接而可预期。我希望我们创造的人造世界是我们所属的自然世界的延伸。我希望很多浪费时间的事。\u003c/p\u003e\r\n\u003cp\u003e这个地方，这些人，要不是他们提供的视角，我不认为自己能打破自己生活与头脑的牢笼。但视角不是行动，这种活法除了在看清事情之后学会与之相处，什么也没成就。仅仅与之相处是不够的，我需要更多。这必须是为了更多。\u003c/p\u003e\r\n\u003cp\u003e我见了那个一直在发消息的人。他没有自我介绍，也不需要。他说话的样子像是认识我——不是知道我在哪儿、我做过什么，而是认识我的心。我问他想要什么，他只说，帮忙。显然，Jack 是众多想要伤害和腐蚀这个世界的人之一。我还没来得及得出“他一定是为 The Core 或某个处理此类安全威胁的官方渠道工作”的结论，他就提到那个团体是希望的通道，一个隐秘的边缘组织。这点仍不清楚。但他告诉我的已足够让我明白，他不想从我这里得到任何东西，只想帮助这个体系的受害者，他说。\u003c/p\u003e\r\n\u003cp\u003e经过 Jack，我对一个自称来帮忙的陌生人已不那么确定该不该信任。可我一直又饿又冷又脏，那份帮助很让人感激。他跟我谈发生过的事，不知怎么知道我是怎么逃出那栋楼的，还知道一些我只瞥见过一眼的内部程序和细节。但谈到我父亲时，他没有指指点点、指控其为恶，只说他在自己的角色上很有效。这个区分像一片黑暗落在我身上。把事物框定为好与坏、恶与善，这些二元对立会中止好奇与审视，是用于简化控制的虚假二元——划分“我们”与“他们”，或我们创造出的任何其他隔离线。\u003c/p\u003e\r\n\u003cp\u003e我想试探边界。我问了一些我确信没有答案的问题，一些我最初读到 USOL 的决定时觉得抽象的问题。他描绘出一幅鲜活的图景：后果与真实事件对应到具体的地方和人身上。但没有指控，没有主张，只有事件本身，只让我自己得出结论。这跟 Jack 那种被引导的推理、他那些操控人的手，感觉如此不同。\u003c/p\u003e\r\n\u003cp\u003e直到我自己找到真相，他才把那些我早已知晓的东西给我看。看到 Jack 写的那几份报告，看到那晚的官方声明。我的信念没有放错地方，而看到证据并没有让早已知道的事变得更真实。我不需要亲眼看到，才知道我所知道的。\u003c/p\u003e\r\n\u003cp\u003e过去几天我见过他几次。他不打招呼就来，但总在最方便的时候。那些谈话之后，我总觉得体内有什么被重新组织过——不是被摧毁，而是被移动。别的不说，经历了这一切之后我没有被摧毁，我是多么感激。\u003c/p\u003e\r\n\u003cp\u003e我开始回报这份帮助。我躲着、索取着，已经太久了，我现在看得清楚。那个人仍然不肯说出名字，他谈起自己在做的一些事，其中一个名字听起来耳熟。我以前为了 graving 去过他说的那个地方。\u003c/p\u003e\r\n\u003cp\u003e我主动提出帮忙。不为别的，只为回报。毕竟，理解系统需要来自曾经身处其中的人的视角。\u003c/p\u003e\r\n\u003cp\u003e感觉很好。我又觉得自己有用了。我又觉得自己是人了。给他讲解布局很容易，我说随时可以帮忙。\u003c/p\u003e\r\n\u003cp\u003e今天他终于开口请我帮忙。不是带着急切，而是带着信任。我告诉自己我只是在看、在观察。运输时刻表、资源分配中的不一致，在我过去会忽略的地方留意传闻。能有用，感觉很好。\u003c/p\u003e\r\n\u003cp\u003e这几乎像是在找规律。几乎可以说是好玩。但规律通向结论，结论通向责任。我学得越多，涉入越深。他有问必答，我终于觉得自己是某件事的一部分。像是这就是我这一生一直在走向的东西。每一次背叛，我父亲那种性格在我身上像一份重担，我母亲的心，我不得不目睹的一切，才让我成为现在的我。去帮助，这就是我的使命。\u003c/p\u003e\r\n\u003cp\u003e愤怒在我体内改变了形状。这份愤怒不再是尖锐的惊慌，不再是当年在办公室里我记得的那种从体内往上涌的热浪。那间办公室现在像一个梦里的地方，更像是我读到或观察到的东西——就像我现在读着、观察着——而不是我亲眼见过的。\u003c/p\u003e\r\n\u003cp\u003e不，这份愤怒没有消失，它更慢、更沉，它是有意的、被驯服的。他帮我驯服了它，他们帮我找到了新的使命。\u003c/p\u003e\r\n\u003cp\u003e我看见我成长于其中的那个世界的建筑结构。我看见整幅织锦，也看见其中每一根松脱的线。便利是如何被不均地分配，我们被告知必需的一切代价——往往是人的代价。为了资源而发生的一切扩张，像癌症一样增长，快过我们追赶的速度。\u003c/p\u003e\r\n\u003cp\u003e我曾相信改良取决于更好的领导、更好的意图。现在我看得出腐烂在地基里，结构本身就是为抵抗任何有意义的改变而建造的。而且问题不在 USOL，不在游戏中的任何单个参与者，而在游戏的主宰者，The Core。\u003c/p\u003e\r\n\u003cp\u003e我想起，系统的维持不仅靠上层的人，也靠每一个把他们的逻辑当作必然接受的人。包括我自己。\u003c/p\u003e\r\n\u003cp\u003e帮助他们不是反叛，帮助他们是一种纠正，一种责任。我重新与那个我因安逸而回避的真相站在了一起。\u003c/p\u003e\r\n\u003cp\u003e使命带来一种清明。恐惧仍然存在，但它不再驱使我。\u003c/p\u003e\r\n\u003cp\u003e我现在明白，发生在我身上的事，是一个把稳定置于人性之上的优先序列网络中的可预期结果。我能看见那些规律，也能透过我一直在做的工作看到更大的图景：情报侦察、情报报告。我并没有忽略其中的讽刺——正是那件把我击碎的事，成了我的使命。\u003c/p\u003e\r\n\u003cp\u003e我在学习影响力如何流动，信息如何能被引导而非强迫。人在崩溃边缘时最容易接受新的看世界的方式，而只要把真相展示给他们，每个人都能走到那个崩溃边缘。\u003c/p\u003e\r\n\u003cp\u003e如果有人更早接触我，像他们那样，带着耐心而不是权威，我的人生也许会不同。\u003c/p\u003e\r\n\u003cp\u003e这就是为什么我必须继续下去。不是出于报复，而是出于一种确信：觉知必须被小心地交付，一个人一个人地交付，直到那种“必然性”的幻象开始裂开。\u003c/p\u003e\r\n\u003cp\u003e我想我很快得离开这个地方。我也已经超出了这个家。他们说我妄想、偏执，但我不能告诉他们我知道的事，我不能给他们看我看过的东西。这里的朋友教会我，一旦你决定运动，站着不动就变得危险，为此我永远感激，但我必须走。我在他们的阴影投下的黑暗里活得太久了。现在我是众多人中的一个，迎进希望，迎进新的黎明。\u003c/p\u003e\r\n\u003cp\u003e我以为自己在逃跑，其实我是在被指出一条出路。Jean Flanders 死了。她死在我逃离那间办公室的那一夜。我不再是 Jean。我是 Aurana。\u003c/p\u003e\r\n","text":"转变日志 我一直想确定一切改变的确切时刻……一切变得不真实的那个时刻。那不是在警报响起的时候，也不是在他们把我按倒在地的时候…… 这件事要大得多，大得多。而是我意识到自己不是一个人，而是一个像所有人一样的变量，而我移动到了预期范围之外的那一瞬间…… 当你还是个孩子时，你几乎把事物的现状当作理所当然。在那个地方长大，就是长大时相信它是一座智慧与进步的堡垒。我是说，你一直听人这么说，所以你就这样相信世界。在我更年轻的时候，连它冰冷的墙壁都让我觉得安全、令人安心。冷意味着精确，精确意味着安全。安全于他者，安全于潜伏在那份安全之外的、无名的邪恶…… 但当我感到那只冰冷的手落在我身上，当他们一遍又一遍又一遍地重复程序性用语，而不是我的名字——这些人我认识，这些人认识我——我一直否认的某件事，忽然再也无法回避了。我花了几个月去理清细节，在那之前还花了几年给自己的大脑解除编程，可你对这些地方、对家，总有一种忠诚，总觉得它至少还能改变…… Jack 跟我说我需要理性地思考。这几周他说了很多根本讲不通的话：他担心我，他担心我，我在螺旋下坠。奇怪的是，最初开始让我看清这一切的人正是他。保持冷静，他一直说。冷静的解释，不过是通过我们人类对安逸的天真渴求来控制叙事的一种方式。但 Jack 做的远不止这些。那个我以为是扶着我走过这场乱局的人，可能正是造成这一切的人。我从他看我的方式看得出来，从他回答的方式看得出来。他否认了，可他的脸否认不了。我无法把他的脸从脑子里赶走：他站在那个车库里的样子，他那份不诚实的分量悬在我们之间，把我钉在原地。不再是这样了。 当你走出你自己和你的生活，随之而来的是一种震耳欲聋的寂静。我已经不再期待那些熟悉的声音：不再有宣告门开与门关的提示音，不再有过滤空气在密闭走廊里嗡嗡流动的爪刮声。如今只有临时的床、借来的衣服。我把发生过的一切重新过一遍，像一段我扫过去却没读懂的段落，那么明显、那么清楚，我却一直没看见，因为……嗯，也许因为我离它太近了。 今天有人给我发了条消息。没有我能认出的名字或来源。不是早先给我发那条关于 Jack 的消息的同一个账号——那条说他的意图并不纯粹。但他们提到了 Jack，说我没有做错，然后把这些情报报告发给了我。那些只能是他写的，除了他，没有谁跟我那么近。一个你以为自己那么了解的人，为了什么？我想把它们扔掉，可我读到字都失去形状。我得知道为什么。我得知道。 我给他的信任不是错误，那是别人制造出来的结果。我一直太自负，没能走出去看清更大的图景，但现在我学到了，我从自己的错误中学到了，也更理解事情的规模了。 我们总以为自己与那些维持这台机器运转的无人机和机器人不同，但那个地方让我看到，我们并无不同。我们是可编程的机器，一旦有缺陷就可以被处置。 我感激 gravers，但我可能正在超出他们。他们穿行于不确定之中，仿佛那只是地形上的又一个特征。待在这里既让人不安，又让人安心；没人假装世界是稳定的，他们预设它是敌意的、不可信的，并据此调整自己。藏在这里很容易，没有人问问题，也不期待解释。 我又收到一条消息。很短，还附了一些补给和食物。我没看见它出现，也没看见是谁送的，但我猜是同一个人。 重力场是个思考的好地方，把念头压进潜意识里一会儿，帮它们消化。我在学怎么用一片破碎的稳定场跨越平台之间的空隙，我犹豫的时候，身后有人笑了。他们告诉我，重力不谈判，它只回应。我希望人也能这样，直接而可预期。我希望我们创造的人造世界是我们所属的自然世界的延伸。我希望很多浪费时间的事。 这个地方，这些人，要不是他们提供的视角，我不认为自己能打破自己生活与头脑的牢笼。但视角不是行动，这种活法除了在看清事情之后学会与之相处，什么也没成就。仅仅与之相处是不够的，我需要更多。这必须是为了更多。 我见了那个一直在发消息的人。他没有自我介绍，也不需要。他说话的样子像是认识我——不是知道我在哪儿、我做过什么，而是认识我的心。我问他想要什么，他只说，帮忙。显然，Jack 是众多想要伤害和腐蚀这个世界的人之一。我还没来得及得出“他一定是为 The Core 或某个处理此类安全威胁的官方渠道工作”的结论，他就提到那个团体是希望的通道，一个隐秘的边缘组织。这点仍不清楚。但他告诉我的已足够让我明白，他不想从我这里得到任何东西，只想帮助这个体系的受害者，他说。 经过 Jack，我对一个自称来帮忙的陌生人已不那么确定该不该信任。可我一直又饿又冷又脏，那份帮助很让人感激。他跟我谈发生过的事，不知怎么知道我是怎么逃出那栋楼的，还知道一些我只瞥见过一眼的内部程序和细节。但谈到我父亲时，他没有指指点点、指控其为恶，只说他在自己的角色上很有效。这个区分像一片黑暗落在我身上。把事物框定为好与坏、恶与善，这些二元对立会中止好奇与审视，是用于简化控制的虚假二元——划分“我们”与“他们”，或我们创造出的任何其他隔离线。 我想试探边界。我问了一些我确信没有答案的问题，一些我最初读到 USOL 的决定时觉得抽象的问题。他描绘出一幅鲜活的图景：后果与真实事件对应到具体的地方和人身上。但没有指控，没有主张，只有事件本身，只让我自己得出结论。这跟 Jack 那种被引导的推理、他那些操控人的手，感觉如此不同。 直到我自己找到真相，他才把那些我早已知晓的东西给我看。看到 Jack 写的那几份报告，看到那晚的官方声明。我的信念没有放错地方，而看到证据并没有让早已知道的事变得更真实。我不需要亲眼看到，才知道我所知道的。 过去几天我见过他几次。他不打招呼就来，但总在最方便的时候。那些谈话之后，我总觉得体内有什么被重新组织过——不是被摧毁，而是被移动。别的不说，经历了这一切之后我没有被摧毁，我是多么感激。 我开始回报这份帮助。我躲着、索取着，已经太久了，我现在看得清楚。那个人仍然不肯说出名字，他谈起自己在做的一些事，其中一个名字听起来耳熟。我以前为了 graving 去过他说的那个地方。 我主动提出帮忙。不为别的，只为回报。毕竟，理解系统需要来自曾经身处其中的人的视角。 感觉很好。我又觉得自己有用了。我又觉得自己是人了。给他讲解布局很容易，我说随时可以帮忙。 今天他终于开口请我帮忙。不是带着急切，而是带着信任。我告诉自己我只是在看、在观察。运输时刻表、资源分配中的不一致，在我过去会忽略的地方留意传闻。能有用，感觉很好。 这几乎像是在找规律。几乎可以说是好玩。但规律通向结论，结论通向责任。我学得越多，涉入越深。他有问必答，我终于觉得自己是某件事的一部分。像是这就是我这一生一直在走向的东西。每一次背叛，我父亲那种性格在我身上像一份重担，我母亲的心，我不得不目睹的一切，才让我成为现在的我。去帮助，这就是我的使命。 愤怒在我体内改变了形状。这份愤怒不再是尖锐的惊慌，不再是当年在办公室里我记得的那种从体内往上涌的热浪。那间办公室现在像一个梦里的地方，更像是我读到或观察到的东西——就像我现在读着、观察着——而不是我亲眼见过的。 不，这份愤怒没有消失，它更慢、更沉，它是有意的、被驯服的。他帮我驯服了它，他们帮我找到了新的使命。 我看见我成长于其中的那个世界的建筑结构。我看见整幅织锦，也看见其中每一根松脱的线。便利是如何被不均地分配，我们被告知必需的一切代价——往往是人的代价。为了资源而发生的一切扩张，像癌症一样增长，快过我们追赶的速度。 我曾相信改良取决于更好的领导、更好的意图。现在我看得出腐烂在地基里，结构本身就是为抵抗任何有意义的改变而建造的。而且问题不在 USOL，不在游戏中的任何单个参与者，而在游戏的主宰者，The Core。 我想起，系统的维持不仅靠上层的人，也靠每一个把他们的逻辑当作必然接受的人。包括我自己。 帮助他们不是反叛，帮助他们是一种纠正，一种责任。我重新与那个我因安逸而回避的真相站在了一起。 使命带来一种清明。恐惧仍然存在，但它不再驱使我。 我现在明白，发生在我身上的事，是一个把稳定置于人性之上的优先序列网络中的可预期结果。我能看见那些规律，也能透过我一直在做的工作看到更大的图景：情报侦察、情报报告。我并没有忽略其中的讽刺——正是那件把我击碎的事，成了我的使命。 我在学习影响力如何流动，信息如何能被引导而非强迫。人在崩溃边缘时最容易接受新的看世界的方式，而只要把真相展示给他们，每个人都能走到那个崩溃边缘。 如果有人更早接触我，像他们那样，带着耐心而不是权威，我的人生也许会不同。 这就是为什么我必须继续下去。不是出于报复，而是出于一种确信：觉知必须被小心地交付，一个人一个人地交付，直到那种“必然性”的幻象开始裂开。 我想我很快得离开这个地方。我也已经超出了这个家。他们说我妄想、偏执，但我不能告诉他们我知道的事，我不能给他们看我看过的东西。这里的朋友教会我，一旦你决定运动，站着不动就变得危险，为此我永远感激，但我必须走。我在他们的阴影投下的黑暗里活得太久了。现在我是众多人中的一个，迎进希望，迎进新的黎明。 我以为自己在逃跑，其实我是在被指出一条出路。Jean Flanders 死了。她死在我逃离那间办公室的那一夜。我不再是 Jean。我是 Aurana。"},{"id":165,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"JJ_PRIVATE 档案：安全入侵（JJ_PRIVATE Archive: Security Breach）","type":"MARKDOWN","html":"\u003cp\u003e逃脱轨迹\u003c/p\u003e\r\n\u003cp\u003e文件标题：安全事件报告——行政层区入侵\u003c/p\u003e\r\n\u003cp\u003e参考编号：IR-447-E\u003c/p\u003e\r\n\u003cp\u003e地点：行政办公翼区\u003c/p\u003e\r\n\u003cp\u003e日期：\u003c/p\u003e\r\n\u003cp\u003e报告警官：（Lt. Supervisor L. Varga）\u003c/p\u003e\r\n\u003cp\u003e分发：内部安全指挥部、行政合规办公室\u003c/p\u003e\r\n\u003cp\u003e事件概述：\u003c/p\u003e\r\n\u003cp\u003e站内时间约 22:14，行政办公翼区内部触发未经授权访问警报。来源为分配给高级行政主管 Douglas Flanders 的 E-37-4 办公室区。\u003c/p\u003e\r\n\u003cp\u003e警报激活后，安全响应单位立即出动。\u003c/p\u003e\r\n\u003cp\u003e响应人员确认有试图强行进入办公室套间内一处内部数据存储柜的痕迹。入口门无外部结构性损坏。\u003c/p\u003e\r\n\u003cp\u003e在受控区域内发现一名身份不明人员。该人员在短暂抵抗后被拘押。\u003c/p\u003e\r\n\u003cp\u003e被拘押者为女性，中等身高，深色着装，与平民装束相符，在控制过程中面部有可见轻伤。被要求出示身份证明时，该对象未提供。\u003c/p\u003e\r\n\u003cp\u003e安保人员报告，该对象使用一条不明路线逃脱拘押。随后在多个楼层展开了搜索行动。未找到该对象。\u003c/p\u003e\r\n\u003cp\u003e财产与数据完整性：\u003c/p\u003e\r\n\u003cp\u003e初步审计确认主网络未被入侵，未确认发生数字数据传输，物理存储清单完整\u003c/p\u003e\r\n\u003cp\u003e风险评估：\u003c/p\u003e\r\n\u003cp\u003e本事件构成中等程度的内部安全隐患。\u003c/p\u003e\r\n\u003cp\u003e建议行动：\u003c/p\u003e\r\n\u003cp\u003e（留空）\u003c/p\u003e\r\n\u003cp\u003e存档的 GRAVER 论坛帖\u003c/p\u003e\r\n\u003cp\u003e帖子标题：穿行 USOL 公司竖井\u003c/p\u003e\r\n\u003cp\u003ea11_ta1k：这里真有人穿过运行中的电梯竖井环吗？不是废弃炼油厂那种。我是说那些更新的 USOL 公司建筑，带稳定场和维护吊廊的……\u003c/p\u003e\r\n\u003cp\u003e想弄明白升降机不运行时，重力脉冲有多稳定……\u003c/p\u003e\r\n\u003cp\u003e还有，电梯舱门是不是还是出于安全考虑，总能从里面打开？还是说……\u003c/p\u003e\r\n\u003cp\u003eHelix_Feral：脉冲时序真的取决于负载平衡周期。如果白天跑重型运输，系统可能过度补偿，产生漂移空腔，很短，而且危险。另外，现代建筑里那些旋转走廊叫“稳定传输导管”。基本是同一个东西，换了个新名。\u003c/p\u003e\r\n\u003cp\u003eRobbie7：兄弟你到底在搞什么见不得人的勾当？？？\u003c/p\u003e\r\n\u003cp\u003eSpink_junkee：公司竖井比炼油厂那种难多了。碎屑少，表面更光，你不会滑，你会弹射。如果想在里面垂直移动，你得贴着反向旋转曲线走，别走落差那条线，而且永远不要相信第一个稳定脉冲。\u003c/p\u003e\r\n\u003cp\u003eA11_ta1k：那封闭的行政楼层呢？稳定导管还把这些楼层连到设备通道吗，还是说它们是隔离的？\u003c/p\u003e\r\n\u003cp\u003eCoolvac：没有什么完全隔离。冗余优先于安全，所以几乎总留着一条旧的工程通道。而且里面通常还有没上锁的安全出口，跟你在任何标准旋转走廊里见到的一样。\u003c/p\u003e\r\n\u003cp\u003eRingRat07：还要注意通风湍流！！！高层办公室会把空调废气往下排。每隔几秒就有一股横向推力，时机对能救你，时机不对能折断你的脊椎……\u003c/p\u003e\r\n\u003cp\u003eA11_ta1k：如果假设有人触发了警报之后必须快速移动，往上爬更合理还是往下往设备层去更合理？\u003c/p\u003e\r\n\u003cp\u003eC0ldW4ke：往下。永远往下。安全响应通常往上收拢。向下移动会把你送进基础设施的混乱里，而且低层通常有更多出路\u003c/p\u003e\r\n\u003cp\u003eRingRat07：细重力在修正脉冲之间也会给你一个安全窗口，如果你能把握得住\u003c/p\u003e\r\n\u003cp\u003eDrift_stats：维护良好的新基础设施比废墟好玩多了。穿过那么漂亮、那么亮的东西不只是感觉更好，环境条件也更稳定、更可预测。但如果你习惯了更杂乱的那种常态，可能需要适应一下。没人能对没去过的站点给你通用建议，不管假设多少种情况，而且记住图纸不总是现在的样子，所以要先去勘察、去练习。\u003c/p\u003e\r\n\u003cp\u003eRobbie7：我有种感觉，这次不会有时间让你先试跑\u003c/p\u003e\r\n\u003cp\u003eA11_ta1k：最后一个问题，维护越权面板通常是外露的，还是藏在装饰构件后面？我想估一下我手上有多少时间。\u003c/p\u003e\r\n\u003cp\u003eRobbie7：我猜中了哈哈\u003c/p\u003e\r\n\u003cp\u003eC0ldW4ke：公司最爱把难看的系统藏起来，如果墙上玻璃很多，也检查地板或天花板。设计师还几乎总把面板位置对称安排，所以如果你看到一面干净的墙正对着某个控制台，后面大概有东西。\u003c/p\u003e\r\n\u003cp\u003eRingRat07：不管你想给谁留下印象，别把命搭进去。公司竖井不是新手路线，USOL 对闯入者可不客气，为了那段片子不值得。\u003c/p\u003e\r\n\u003cp\u003eA11_ta1k：谢了，而且我从来不想给谁留下印象……只是想保持知情。\u003c/p\u003e\r\n\u003cp\u003eDrift_stats：回头告诉我怎么样，我自己也一直想去几个漂亮点位\u003c/p\u003e\r\n","text":"逃脱轨迹 文件标题：安全事件报告——行政层区入侵 参考编号：IR 447 E 地点：行政办公翼区 日期： 报告警官：（Lt. Supervisor L. Varga） 分发：内部安全指挥部、行政合规办公室 事件概述： 站内时间约 22:14，行政办公翼区内部触发未经授权访问警报。来源为分配给高级行政主管 Douglas Flanders 的 E 37 4 办公室区。 警报激活后，安全响应单位立即出动。 响应人员确认有试图强行进入办公室套间内一处内部数据存储柜的痕迹。入口门无外部结构性损坏。 在受控区域内发现一名身份不明人员。该人员在短暂抵抗后被拘押。 被拘押者为女性，中等身高，深色着装，与平民装束相符，在控制过程中面部有可见轻伤。被要求出示身份证明时，该对象未提供。 安保人员报告，该对象使用一条不明路线逃脱拘押。随后在多个楼层展开了搜索行动。未找到该对象。 财产与数据完整性： 初步审计确认主网络未被入侵，未确认发生数字数据传输，物理存储清单完整 风险评估： 本事件构成中等程度的内部安全隐患。 建议行动： （留空） 存档的 GRAVER 论坛帖 帖子标题：穿行 USOL 公司竖井 a11 ta1k：这里真有人穿过运行中的电梯竖井环吗？不是废弃炼油厂那种。我是说那些更新的 USOL 公司建筑，带稳定场和维护吊廊的…… 想弄明白升降机不运行时，重力脉冲有多稳定…… 还有，电梯舱门是不是还是出于安全考虑，总能从里面打开？还是说…… Helix Feral：脉冲时序真的取决于负载平衡周期。如果白天跑重型运输，系统可能过度补偿，产生漂移空腔，很短，而且危险。另外，现代建筑里那些旋转走廊叫“稳定传输导管”。基本是同一个东西，换了个新名。 Robbie7：兄弟你到底在搞什么见不得人的勾当？？？ Spink junkee：公司竖井比炼油厂那种难多了。碎屑少，表面更光，你不会滑，你会弹射。如果想在里面垂直移动，你得贴着反向旋转曲线走，别走落差那条线，而且永远不要相信第一个稳定脉冲。 A11 ta1k：那封闭的行政楼层呢？稳定导管还把这些楼层连到设备通道吗，还是说它们是隔离的？ Coolvac：没有什么完全隔离。冗余优先于安全，所以几乎总留着一条旧的工程通道。而且里面通常还有没上锁的安全出口，跟你在任何标准旋转走廊里见到的一样。 RingRat07：还要注意通风湍流！！！高层办公室会把空调废气往下排。每隔几秒就有一股横向推力，时机对能救你，时机不对能折断你的脊椎…… A11 ta1k：如果假
