未对任何人有过牵挂。 我当过安保操作员，当过某座采矿站的低级技术员，在月球上当过卡车司机，然后又当过某家公司的执法者，当过某艘地球贸易航线货船的副船长，如此等等。 有一次我还被卷进一个棘手的局面，不得不去给猫群当牧人。那真是件怪事。 但所有这些人生经验都没能让我准备好去当一名私人侦探。然而，在我整理好简历、开始以私家调查员的身份找活干之后，三天内就收到了那份工作邀约。\u003c/p\u003e\r\n\u003cp\u003e这看起来可能可疑，也可能纯属巧合，取决于我想有多偏执。\u003c/p\u003e\r\n\u003cp\u003e另一个问题是我总有种少了什么东西的感觉。一件物品、一个人、一段记忆……我不知道是什么。而就我能回想起来的，这一直是个问题。 但自从我开始做那些调查，情况变得更糟了。\u003c/p\u003e\r\n\u003cp\u003e我试过跟远程医疗助理谈，甚至花钱做了脑部扫描，但结果显示没有异常，除了一处我毫无记忆的旧脑震荡痕迹。\u003c/p\u003e\r\n\u003cp\u003e那会是所有问题的根源吗？也许吧。但我一直很依赖的直觉告诉我，事情没那么简单。我不记得自己过去的大段经历，这不是可以随手丢开的事。\u003c/p\u003e\r\n\u003cp\u003e可为什么这突然让我如此不安……也许是太空。思考的时间太多，而我已经尽量回避这件事很久了……\u003c/p\u003e\r\n\u003cp\u003e条目 2\u003c/p\u003e\r\n\u003cp\u003e这台读取器看起来像 CORE 配发的标准型号。外壳上有一些标记……型号似乎是“MR-7 Media Reader 78x”。它很可能是我时不时遇到的某款 CCS 数据读取器，但它们的软件通常不一样，所以说明书会很有用。看来该去查一下了。\u003c/p\u003e\r\n\u003cp\u003e条目 3\u003c/p\u003e\r\n\u003cp\u003e看看我们这儿有什么。看起来是某个视频文件的碎片。但它不完整，所以我估计打开每一部分都要额外费点功夫。而且似乎数量还不少…… 我最好的猜测是，这可能是某种给 CCS 殖民者看的教育视频，或者某种历史资料。但你永远说不准——也可能是一部限制级家庭录像，毕竟我见过那么多古怪的破事，对吧。\u003c/p\u003e\r\n\u003cp\u003e总之，要把它们全部解锁肯定得花些时间，虽然那大概会挺有意思，但我想我得找点别的事做，同时在这艘船上保持低调。\u003c/p\u003e\r\n","text":"条目 1 今天，我的旅程开始了。这趟航班应该会把我直接送到火星的 REPNode，从那里我将继续我的调查。 我答应接下这件事的原因很简单——好奇。我感觉自己正卷进某件大事里，这让我不安，但同时也让我兴奋。 我过去做过的那些调查让我产生了一个想法：所有那些事件在某种程度上是相互关联的。也许不是直接关联，也许只是巧合，但仍然彼此相连，就好像有个极其有权势的人在牵动所有线头，让星辰各就其位。 我的雇主——“History Unfolded”——似乎有些不安。虽然我确信他们已经在空间站、甚至在这颗行星上建立了存在，但他们的“工具”似乎并不适合进一步的调查。 不知为何，我感觉他们感兴趣的是我本人，不管原因是什么。 这当然让我受宠若惊，但也引出了疑问：这种兴趣究竟从何而来。就我记忆所及，我这一辈子都是个“滚石”。从未在一个地方久留，从未对任何人有过牵挂。 我当过安保操作员，当过某座采矿站的低级技术员，在月球上当过卡车司机，然后又当过某家公司的执法者，当过某艘地球贸易航线货船的副船长，如此等等。 有一次我还被卷进一个棘手的局面，不得不去给猫群当牧人。那真是件怪事。 但所有这些人生经验都没能让我准备好去当一名私人侦探。然而，在我整理好简历、开始以私家调查员的身份找活干之后，三天内就收到了那份工作邀约。 这看起来可能可疑，也可能纯属巧合，取决于我想有多偏执。 另一个问题是我总有种少了什么东西的感觉。一件物品、一个人、一段记忆……我不知道是什么。而就我能回想起来的，这一直是个问题。 但自从我开始做那些调查，情况变得更糟了。 我试过跟远程医疗助理谈，甚至花钱做了脑部扫描，但结果显示没有异常，除了一处我毫无记忆的旧脑震荡痕迹。 那会是所有问题的根源吗？也许吧。但我一直很依赖的直觉告诉我，事情没那么简单。我不记得自己过去的大段经历，这不是可以随手丢开的事。 可为什么这突然让我如此不安……也许是太空。思考的时间太多，而我已经尽量回避这件事很久了…… 条目 2 这台读取器看起来像 CORE 配发的标准型号。外壳上有一些标记……型号似乎是“MR 7 Media Reader 78x”。它很可能是我时不时遇到的某款 CCS 数据读取器，但它们的软件通常不一样，所以说明书会很有用。看来该去查一下了。 条目 3 看看我们这儿有什么。看起来是某个视频文件的碎片。但它不完整，所以我估计打开每一部分都要额外费点功夫。而且似乎数量还不少…… 我最好的猜测是，这可能是某种给 CCS 殖民者看的教育视频，或者某种历史资料。但你永远说不准——也可能是一部限制级家庭录像，毕竟我见过那么多古怪的破事，对吧。 总之，要把它们全部解锁肯定得花些时间，虽然那大概会挺有意思，但我想我得找点别的事做，同时在这艘船上保持低调。"},{"id":236,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"未知供应团体分析（unknown_group_analysis.txt）","type":"MARKDOWN","html":"\u003cp\u003e未知供应团体分析\u003c/p\u003e\r\n\u003cp\u003e临时代号：PALIMPSEST 分类：未核实 状态：观察中\u003c/p\u003e\r\n\u003cp\u003e背景： 该团体出现时没有明确的来源。 无已知的公司架构。 无注册的前台机构。 无可预测的行为模式。\u003c/p\u003e\r\n\u003cp\u003e公众认知： 常被描述为“怪胎”“书呆子”或“哲学家”。 进行长时间的讨论。 通讯方式异常。\u003c/p\u003e\r\n\u003cp\u003e行动备注： 尽管外表如此，该团体表现出 出人意料的物流精确度。\u003c/p\u003e\r\n\u003cp\u003e供应完全按约定交付。 无偏差。 无延误。 未尝试议价。\u003c/p\u003e\r\n\u003cp\u003e这与其外在表现相矛盾。\u003c/p\u003e\r\n\u003cp\u003e事件： 一名内部线人被识别并清除。 手法干净。 没有发出任何讯息。 沉默本身就是讯息。\u003c/p\u003e\r\n\u003cp\u003e截获： 在一次例行流量分析中截获了一条讯息。 该讯息以未知的语言结构书写。\u003c/p\u003e\r\n\u003cp\u003e分析： — 不是已知的密码。 — 不是已知的加密标准。 — 模式密度与简单的混淆处理不符。\u003c/p\u003e\r\n\u003cp\u003e结论： 该语言似乎是内部语言。 其设计目的不是被解读， 而是为了排斥外人。\u003c/p\u003e\r\n\u003cp\u003e我们不知道他们是谁。 我们不知道他们从何而来。\u003c/p\u003e\r\n\u003cp\u003e仅此一点就使他们危险。\u003c/p\u003e\r\n","text":"未知供应团体分析 临时代号：PALIMPSEST 分类：未核实 状态：观察中 背景： 该团体出现时没有明确的来源。 无已知的公司架构。 无注册的前台机构。 无可预测的行为模式。 公众认知： 常被描述为“怪胎”“书呆子”或“哲学家”。 进行长时间的讨论。 通讯方式异常。 行动备注： 尽管外表如此，该团体表现出 出人意料的物流精确度。 供应完全按约定交付。 无偏差。 无延误。 未尝试议价。 这与其外在表现相矛盾。 事件： 一名内部线人被识别并清除。 手法干净。 没有发出任何讯息。 沉默本身就是讯息。 截获： 在一次例行流量分析中截获了一条讯息。 该讯息以未知的语言结构书写。 分析： — 不是已知的密码。 — 不是已知的加密标准。 — 模式密度与简单的混淆处理不符。 结论： 该语言似乎是内部语言。 其设计目的不是被解读， 而是为了排斥外人。 我们不知道他们是谁。 我们不知道他们从何而来。 仅此一点就使他们危险。"},{"id":237,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"Velluto 聊天记录（Velluto Chat Transcript）","type":"MARKDOWN","html":"\u003cp\u003eAntonovich： 我不想让她再待在那儿了。\u003c/p\u003e\r\n\u003cp\u003e管理层： 陪伴者并非所有物。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我知道。 我不是那个意思。\u003c/p\u003e\r\n\u003cp\u003e管理层： 那就解释清楚。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 她不该待在那儿。\u003c/p\u003e\r\n\u003cp\u003e管理层： 你的理由已记录在案。 你的语气没有必要。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 你不明白。\u003c/p\u003e\r\n\u003cp\u003e管理层： 我们非常明白。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 我会补偿。 全额。\u003c/p\u003e\r\n\u003cp\u003e管理层： 这不是钱的问题。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 那是什么问题？\u003c/p\u003e\r\n\u003cp\u003e管理层： 控制。 可预测性。 沉默。\u003c/p\u003e\r\n\u003cp\u003eAntonovich： 这些我都能提供。\u003c/p\u003e\r\n\u003cp\u003e管理层： 你已经在提供了。 只是你自己没意识到。\u003c/p\u003e\r\n","text":"Antonovich： 我不想让她再待在那儿了。 管理层： 陪伴者并非所有物。 Antonovich： 我知道。 我不是那个意思。 管理层： 那就解释清楚。 Antonovich： 她不该待在那儿。 管理层： 你的理由已记录在案。 你的语气没有必要。 Antonovich： 你不明白。 管理层： 我们非常明白。 Antonovich： 我会补偿。 全额。 管理层： 这不是钱的问题。 Antonovich： 那是什么问题？ 管理层： 控制。 可预测性。 沉默。 Antonovich： 这些我都能提供。 管理层： 你已经在提供了。 只是你自己没意识到。"},{"id":238,"cat":"第 2 条：旅程","dir":"04_Entry2_The_Journey","title":"velluto 内部事件记录（velluto_incident_internal.txt）","type":"MARKDOWN","html":"\u003cp\u003e事件日志 velluto 服务器\u003c/p\u003e\r\n\u003cp\u003e写这个是为了让谁都别忘了\u003c/p\u003e\r\n\u003cp\u003e这儿有几个天才决定 不付钱就搞到 velluto 系统的访问权 是个好主意\u003c/p\u003e\r\n\u003cp\u003e计划很简单 找到管理员 吓唬他 拿到密码 下单 不花钱\u003c/p\u003e\r\n\u003cp\u003e实际发生的事：\u003c/p\u003e\r\n\u003cp\u003e他们找到了管理员 甚至不算难 那家伙上夜班 一个人\u003c/p\u003e\r\n\u003cp\u003e他们打了他 不算太狠 但够了\u003c/p\u003e\r\n\u003cp\u003e他给了他们访问权限\u003c/p\u003e\r\n\u003cp\u003e他们试着登录 差点就成功了\u003c/p\u003e\r\n\u003cp\u003e然后管理员去找了他的上司 上司去找了 anton\u003c/p\u003e\r\n\u003cp\u003eanton 亲自来了\u003c/p\u003e\r\n\u003cp\u003e没人说他当时说了什么 但没人忘记当时有多安静\u003c/p\u003e\r\n\u003cp\u003e管理员拿到了钱 比我们为任何事付给任何人的都多\u003c/p\u003e\r\n\u003cp\u003evelluto 的道歉被接受了 事件了结\u003c/p\u003e\r\n\u003cp\u003e然后 anton 跟我们谈了\u003c/p\u003e\r\n\u003cp\u003e现在的规矩：\u003c/p\u003e\r\n\u003cp\u003e谁都不许碰 velluto 的系统\u003c/p\u003e\r\n\u003cp\u003e谁都不许那样吓唬 velluto 的人\u003c/p\u003e\r\n\u003cp\u003e谁都不许自以为比实际更聪明\u003c/p\u003e\r\n\u003cp\u003e惩罚：\u003c/p\u003e\r\n\u003cp\u003e所有参与者都要付 钱 时间 血\u003c/p\u003e\r\n\u003cp\u003e他们打扫 他们搬运 他们闭嘴\u003c/p\u003e\r\n\u003cp\u003e3 个月\u003c/p\u003e\r\n\u003cp\u003eanton 说： 我们是罪犯 不是白痴\u003c/p\u003e\r\n\u003cp\u003e如果这种事再发生一次 就不会再有谈话了\u003c/p\u003e\r\n","text":"事件日志 velluto 服务器 写这个是为了让谁都别忘了 这儿有几个天才决定 不付钱就搞到 velluto 系统的访问权 是个好主意 计划很简单 找到管理员 吓唬他 拿到密码 下单 不花钱 实际发生的事： 他们找到了管理员 甚至不算难 那家伙上夜班 一个人 他们打了他 不算太狠 但够了 他给了他们访问权限 他们试着登录 差点就成功了 然后管理员去找了他的上司 上司去找了 anton anton 亲自来了 没人说他当时说了什么 但没人忘记当时有多安静 管理员拿到了钱 比我们为任何事付给任何人的都多 velluto 的道歉被接受了 事件了结 然后 anton 跟我们谈了 现在的规矩： 谁都不许碰 velluto 的系统 谁都不许那样吓唬 velluto 的人 谁都不许自以为比实际更聪明 惩罚： 所有参与者都要付 钱 时间 血 他们打扫 他们搬运 他们闭嘴 3 个月 anton 说： 我们是罪犯 不是白痴 如果这种事再发生一次 就不会再有谈话了"},{"id":239,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"背景故事（Backstory）","type":"MARKDOWN","html":"\u003cp\u003e火星……我花了不少时间才来到这里。也费了不小的力气。我从没问过自己这一切是否真的值得。像我这样没有明确目标的人，和这些人牵扯得这么深，大概是个非常糟糕的选择。但与此同时……我已经当了好一阵子滚石了，所以不管怎么说，这也算是一口新鲜空气。\u003c/p\u003e\r\n\u003cp\u003e就在几个月前，我还有点被困在我那间“旧”铺位里。我干各种杂活已经好一阵子了，凭我接过的那些活儿……嗯，说实话，能列出来的名单已经越来越短了。\u003c/p\u003e\r\n\u003cp\u003e私家侦探——这主意听着超酷，尤其对我这种人来说，人生经验丰富。去认识新朋友！揭开秘密！拿到报酬！梦想中的工作。但我并不抱太大期望，因为干这行的人得有人脉，而我并没有。只有我那段前雇佣兵的经历，以及在警队里待过的一些经验，给了我一点希望。\u003c/p\u003e\r\n\u003cp\u003e不过就像有人对我说的——不试试怎么知道！\u003c/p\u003e\r\n\u003cp\u003e所以，当我从 History Unfolded 那帮人手里接到工作邀约时……这么说吧，我又惊又兴奋。\u003c/p\u003e\r\n\u003cp\u003e他们发给我的合同真的很古怪，老实说，还自相矛盾。可我又有什么资格去质疑呢？毕竟，他们还给我派了一位非常漂亮的上线，名叫“Aurana Strogova”。\u003c/p\u003e\r\n\u003cp\u003e说实话——她一开始对我非常冷淡。不只是“职业化”的那种冷，我甚至感觉到某种敌意。\u003c/p\u003e\r\n\u003cp\u003e但这没造成多大影响。任务开始一个接一个地来了。\u003c/p\u003e\r\n\u003cp\u003e我的工作是挖出一些埋得足够深的旧秘密，深到“普通人”根本找不到。但显然，这对我来说不算太难。唯一的问题是，每次我挖出点什么，都感觉 Aurana 早就知道了。\u003c/p\u003e\r\n\u003cp\u003e这是在测试我的本事吗？这个念头不止一次地找上我。但我还是继续干下去，因为这对我来说是“世上最好的工作”。\u003c/p\u003e\r\n\u003cp\u003e最初的成果相当吓人——生化试验、作物实验、失控的机器人、武器测试失败……妈的，连失踪的 CORE 船员都在里面。所有这些事件看起来都相当随机，直到我开始看出其中的规律。\u003c/p\u003e\r\n\u003cp\u003e有某个人、或者某种东西，正为了不明的目的在编排所有这些事件。每一桩“谜案”都牵涉到某个要人：Usol、Soyuz、Terra Mater……甚至 CORE 本身！天啊，赌注一下子变得极高。\u003c/p\u003e\r\n\u003cp\u003e但我没有退出。到这一步已经很明显，被考验的不是我的能力，而是我的品性。我必须向雇主证明自己，也必须弄清他们究竟是谁。\u003c/p\u003e\r\n\u003cp\u003e于是我更加拼命地工作。真的把自己整个投了进去。不只是因为不得不做，而是因为这些故事本身就让人兴奋。谁能想到呢……\u003c/p\u003e\r\n\u003cp\u003e每一个故事都回答了更多问题，却也引出了更多问题。\u003c/p\u003e\r\n\u003cp\u003e那些“耦合体”（The Couplings）——是外星造物，还是被人动过手脚？和我谈过的那个人没说出多少东西，看起来是条死胡同，但他给了我一些有用的信息，让我明白那似乎是一次失败的“Razvedka”（侦察）行动的一部分。又或者，是有人想让它看起来像那样？\u003c/p\u003e\r\n\u003cp\u003e之后是 Astrocrop。妈的，那帮人。他们绝对是和魔鬼做了交易，否则我想不出谁能干出那种疯事。\u003c/p\u003e\r\n\u003cp\u003e找解药？呵，更像是试验更多、更离奇的异域手段，用来清洗一颗行星或某个小行星殖民地的人口。再把这套东西和宗教、意识形态混在一起，事情就更糟了。我纳闷为什么没人阻止他们，而 CORE 到底对这一切知道多少……\u003c/p\u003e\r\n\u003cp\u003e接下来是“Project Artemis”（阿尔忒弥斯计划）。又是 CORE，在研制大规模毁灭性武器，当然是为了和平与繁荣。我找到了他们的研发综合体，但那地方进不去。\u003c/p\u003e\r\n\u003cp\u003e再加上一段音频日志，清楚显示他们在运输途中丢了一件“装置”……更有理由兴奋了。\u003c/p\u003e\r\n\u003cp\u003e最后是那场著名的“Sky Lift”（天梯）。好几种说法、大量文件、证人供词……依然没有定论。我从里面唯一得到的确定是：那既不是单纯的事故，也不是什么“巧合”或别的什么。所有的迹象都表明它是被策划的。至于是谁策划的——那才是个好问题。\u003c/p\u003e\r\n\u003cp\u003e但所有这些努力都没有白费。\u003c/p\u003e\r\n\u003cp\u003e首先——我现在知道了地点——火星。一切都与那里有关。载着那些耦合体经过的 REPNODE-M7 空间站，“世代农场”（Generational Farm）——一个大型 Astrocrop 农业综合体，“Gobbler”前哨——一处 CORE 武器试验场，最后还有天梯本身。所有这些要么就在那颗行星上，要么以某种方式与它相连。\u003c/p\u003e\r\n\u003cp\u003e还有，那些在太空中来回弹跳的古怪无线电传输，似乎也源自这里，尽管当时我没时间去深究。\u003c/p\u003e\r\n\u003cp\u003e但最重要的是，在我把这一切报告给 Aurana 之后，我感觉到……她身上传来的暖意。就好像她很高兴地确认，她没有看错我。\u003c/p\u003e\r\n\u003cp\u003e当然，他们对那些东西全都知情，而我的工作似乎除了测试我的能力之外，基本上就是让我熟悉这个故事。但我不介意。这对接下来要发生的事大概是必要的——他们决定让我搭船前往那个 REPNODE 空间站继续调查。看来我的雇主缺一个可以信任、不会退缩的人。而那个人就是我。到那时我已经下定决心，无论如何都要把这一切查个水落石出。\u003c/p\u003e\r\n\u003cp\u003e唯一剩下的谜团是——我究竟在为谁工作。我没有直接问，指望他们会主动告诉我，但他们一直没说，直到我登上了那艘船……\u003c/p\u003e\r\n\u003cp\u003e我原本希望这段航程平安无事，因为很明显，合同的延续会耗费同样多（如果不是更多）的力气，但我想我的雇主另有安排。\u003c/p\u003e\r\n\u003cp\u003e一桩“失踪人口”案落到了我手里。一个完全陌生的人，名叫 Vladimir Semakin，他在 CORIE 就业中心看到了我“找活儿干的私家侦探”页面，于是联系我，请我帮他找一个叫 Jean 的姑娘——她在一连串颇具威胁性的情况下失踪了。\u003c/p\u003e\r\n\u003cp\u003e要是我当时知道就好了……\u003c/p\u003e\r\n\u003cp\u003e那桩案子把我引向了几个新的团体，我和他们多少混熟了：Gravers、PALIMPEST，还有其他几个我现在能称之为朋友的家伙（也许没那么好）。\u003c/p\u003e\r\n\u003cp\u003e而那个姑娘，Jean Flanders，恰好是 Exar-Solis 首席技术官的女儿。一个叛逆的孩子，知道得太多，正面临被人当作棋子的危险。\u003c/p\u003e\r\n\u003cp\u003e那个“某人”恰好就是 James “Jack” Curtis Fung 先生。一个真正的幽灵，找到他费了我很大的力气，而在我找到之后……这么说吧，我欠了某个人一份人情，而没人愿意欠那个人的人情。\u003c/p\u003e\r\n\u003cp\u003e他是个威胁，一个非常危险的人，但尽管我不愿承认——他也可能成为非常有用的资产。唯一的问题是，到这一步，我成了他的资产，而我不知道他会向我要求什么。\u003c/p\u003e\r\n\u003cp\u003e但是，正是他帮我查清了 Jean 的真相——她逃了出去，为自己挣得了一种新生活，一种有目标的生活。她成了另一个人。她成了 Aurana。\u003c/p\u003e\r\n\u003cp\u003e而就在那时我全明白了——我的雇主，我真正的雇主，Osiris 公司，找的是不仅有能力、意志坚定，而且与他们志同道合的人。\u003c/p\u003e\r\n\u003cp\u003e我以前从没多想过这件事，但发现真相，无论代价如何，让我感到快乐。这份工作给了我人生的目标，就像它给了 Aurana 一样。当然，Vladimir 也是，因为他显然也是他们中的一员。实际上他是个招募人，任务就是对我给出一个第三方的评价。\u003c/p\u003e\r\n\u003cp\u003e所以，我们到了。马上就要降落在 REPNODE-M7，以一名伪装成 CEDRT 工程师的身份继续我的旅程。我觉得现在我真的准备好了。我有我的团队，我有我的本事和人脉。剩下的只是完成任务所需的合适工具。所以，我就从那里开始。\u003c/p\u003e\r\n","text":"火星……我花了不少时间才来到这里。也费了不小的力气。我从没问过自己这一切是否真的值得。像我这样没有明确目标的人，和这些人牵扯得这么深，大概是个非常糟糕的选择。但与此同时……我已经当了好一阵子滚石了，所以不管怎么说，这也算是一口新鲜空气。 就在几个月前，我还有点被困在我那间“旧”铺位里。我干各种杂活已经好一阵子了，凭我接过的那些活儿……嗯，说实话，能列出来的名单已经越来越短了。 私家侦探——这主意听着超酷，尤其对我这种人来说，人生经验丰富。去认识新朋友！揭开秘密！拿到报酬！梦想中的工作。但我并不抱太大期望，因为干这行的人得有人脉，而我并没有。只有我那段前雇佣兵的经历，以及在警队里待过的一些经验，给了我一点希望。 不过就像有人对我说的——不试试怎么知道！ 所以，当我从 History Unfolded 那帮人手里接到工作邀约时……这么说吧，我又惊又兴奋。 他们发给我的合同真的很古怪，老实说，还自相矛盾。可我又有什么资格去质疑呢？毕竟，他们还给我派了一位非常漂亮的上线，名叫“Aurana Strogova”。 说实话——她一开始对我非常冷淡。不只是“职业化”的那种冷，我甚至感觉到某种敌意。 但这没造成多大影响。任务开始一个接一个地来了。 我的工作是挖出一些埋得足够深的旧秘密，深到“普通人”根本找不到。但显然，这对我来说不算太难。唯一的问题是，每次我挖出点什么，都感觉 Aurana 早就知道了。 这是在测试我的本事吗？这个念头不止一次地找上我。但我还是继续干下去，因为这对我来说是“世上最好的工作”。 最初的成果相当吓人——生化试验、作物实验、失控的机器人、武器测试失败……妈的，连失踪的 CORE 船员都在里面。所有这些事件看起来都相当随机，直到我开始看出其中的规律。 有某个人、或者某种东西，正为了不明的目的在编排所有这些事件。每一桩“谜案”都牵涉到某个要人：Usol、Soyuz、Terra Mater……甚至 CORE 本身！天啊，赌注一下子变得极高。 但我没有退出。到这一步已经很明显，被考验的不是我的能力，而是我的品性。我必须向雇主证明自己，也必须弄清他们究竟是谁。 于是我更加拼命地工作。真的把自己整个投了进去。不只是因为不得不做，而是因为这些故事本身就让人兴奋。谁能想到呢…… 每一个故事都回答了更多问题，却也引出了更多问题。 那些“耦合体”（The Couplings）——是外星造物，还是被人动过手脚？和我谈过的那个人没说出多少东西，看起来是条死胡同，但他给了我一些有用的信息，让我明白那似乎是一次失败的“Razvedka”（侦察）行动的一部分。又或者，是有人想让它看起来像那样？ 之后是 Astrocrop。妈的，那帮人。他们绝对是和魔鬼做了交易，否则我想不出谁能干出那种疯事。 找解药？呵，更像是试验更多、更离奇的异域手段，用来清洗一颗行星或某个小行星殖民地的人口。再把这套东西和宗教、意识形态混在一起，事情就更糟了。我纳闷为什么没人阻止他们，而 CORE 到底对这一切知道多少…… 接下来是“Project Artemis”（阿尔忒弥斯计划）。又是 CORE，在研制大规模毁灭性武器，当然是为了和平与繁荣。我找到了他们的研发综合体，但那地方进不去。 再加上一段音频日志，清楚显示他们在运输途中丢了一件“装置”……更有理由兴奋了。 最后是那场著名的“Sky Lift”（天梯）。好几种说法、大量文件、证人供词……依然没有定论。我从里面唯一得到的确定是：那既不是单纯的事故，也不是什么“巧合”或别的什么。所有的迹象都表明它是被策划的。至于是谁策划的——那才是个好问题。 但所有这些努力都没有白费。 首先——我现在知道了地点——火星。一切都与那里有关。载着那些耦合体经过的 REPNODE M7 空间站，“世代农场”（Generational Farm）——一个大型 Astrocrop 农业综合体，“Gobbler”前哨——一处 CORE 武器试验场，最后还有天梯本身。所有这些要么就在那颗行星上，要么以某种方式与它相连。 还有，那些在太空中来回弹跳的古怪无线电传输，似乎也源自这里，尽管当时我没时间去深究。 但最重要的是，在我把这一切报告给 Aurana 之后，我感觉到……她身上传来的暖意。就好像她很高兴地确认，她没有看错我。 当然，他们对那些东西全都知情，而我的工作似乎除了测试我的能力之外，基本上就是让我熟悉这个故事。但我不介意。这对接下来要发生的事大概是必要的——他们决定让我搭船前往那个 REPNODE 空间站继续调查。看来我的雇主缺一个可以信任、不会退缩的人。而那个人就是我。到那时我已经下定决心，无论如何都要把这一切查个水落石出。 唯一剩下的谜团是——我究竟在为谁工作。我没有直接问，指望他们会主动告诉我，但他们一直没说，直到我登上了那艘船…… 我原本希望这段航程平安无事，因为很明显，合同的延续会耗费同样多（如果不是更多）的力气，但我想我的雇主另有安排。 一桩“失踪人口”案落到了我手里。一个完全陌生的人，名叫 Vladimir Semakin，他在 CORIE 就业中心看到了我“找活儿干的私家侦探”页面，于是联系我，请我帮他找一个叫 Jean 的姑娘——她在一连串颇具威胁性的情况下失踪了。 要是我当时知道就好了…… 那桩案子把我引向了几个新的团体，我和他们多少混熟了：Gravers、PALIMPEST，还有其他几个我现在能称之为朋友的家伙（也许没那么好）。 而那个姑娘，Jean Flanders，恰好是 Exar Solis 首席技术官的女儿。一个叛逆的孩子，知道得太多，正面临被人当作棋子的危险。 那个“某人”恰好就是 James “Jack” Curtis Fung 先生。一个真正的幽灵，找到他费了我很大的力气，而在我找到之后……这么说吧，我欠了某个人一份人情，而没人愿意欠那个人的人情。 他是个威胁，一个非常危险的人，但尽管我不愿承认——他也可能成为非常有用的资产。唯一的问题是，到这一步，我成了他的资产，而我不知道他会向我要求什么。 但是，正是他帮我查清了 Jean 的真相——她逃了出去，为自己挣得了一种新生活，一种有目标的生活。她成了另一个人。她成了 Aurana。 而就在那时我全明白了——我的雇主，我真正的雇主，Osiris 公司，找的是不仅有能力、意志坚定，而且与他们志同道合的人。 我以前从没多想过这件事，但发现真相，无论代价如何，让我感到快乐。这份工作给了我人生的目标，就像它给了 Aurana 一样。当然，Vladimir 也是，因为他显然也是他们中的一员。实际上他是个招募人，任务就是对我给出一个第三方的评价。 所以，我们到了。马上就要降落在 REPNODE M7，以一名伪装成 CEDRT 工程师的身份继续我的旅程。我觉得现在我真的准备好了。我有我的团队，我有我的本事和人脉。剩下的只是完成任务所需的合适工具。所以，我就从那里开始。"},{"id":240,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"CEDRT 主机（CEDRT Mainframe）","type":"MARKDOWN","html":"\u003cp\u003e这一台看起来被人入侵过。系统勉强支撑着，错误一大堆，硬盘似乎也出了问题。看起来有人试图把这里的数据抹掉。\u003c/p\u003e\r\n\u003cp\u003e我得试着恢复最新的备份（REINSTATE THE LATEST BACKUP），看看能不能在这里找到些有用的东西。也许是些连接日志。\u003c/p\u003e\r\n","text":"这一台看起来被人入侵过。系统勉强支撑着，错误一大堆，硬盘似乎也出了问题。看起来有人试图把这里的数据抹掉。 我得试着恢复最新的备份（REINSTATE THE LATEST BACKUP），看看能不能在这里找到些有用的东西。也许是些连接日志。"},{"id":241,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"组件板 tx-71review（Tong）（Component board tx 3cstrong\u003e全名：\u003c/strong\u003e Christopher Selm Tong\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e一名 Ring 2（第二环）工程师，曾在太阳系内多座 CEDRT 空间站工作。他的亲属都为 CORE 效力，其中多数在金星与月球（Luna）的 CCS 军团服役。\u003c/p\u003e\r\n\u003cp\u003eChristopher（Chris）性格刚强，受同事与下属敬重。他全凭自身努力、未借助任何不正当手段，晋升至 Overseer（监督官）之职。\u003c/p\u003e\r\n\u003cp\u003e他目前驻守 REPNODE-M7 并非偶然——他主动申请调往该站，理由是某种“对火星悲剧的私人亲近感”。这听起来或许可疑，但 CIS（Core Intelligence Service，核心情报局）似乎并未发现任何能表明他另有图谋的迹象。至少这是我们所能获取到的信息。\u003c/p\u003e\r\n\u003cp\u003eChris 是技术型人才，爱好众多，其中包括无人机制作，这占用了他大部分的私人时间。\u003c/p\u003e\r\n\u003cp\u003e记录中没有直系亲属，没有妻子或孩子，也没有任何关于伴侣的信息。这家伙把自己的事捂得很紧。\u003c/p\u003e\r\n\u003cp\u003e同事们说他偶尔会和他们打扑克，但多数时候都保持着职业化的距离。有几次有人看到 Chris 玩虚拟游戏（至少是戴着 VR 头显），但没有更多细节可查。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e总结：\u003c/strong\u003e 严格、专业、似乎受过良好教育（需补充信息）、单身。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e情报建议：\u003c/strong\u003e 以职业礼节或共同爱好为基础进行接触。\u003c/p\u003e\r\n","text":"档案 全名： Christopher Selm Tong 一名 Ring 2（第二环）工程师，曾在太阳系内多座 CEDRT 空间站工作。他的亲属都为 CORE 效力，其中多数在金星与月球（Luna）的 CCS 军团服役。 Christopher（Chris）性格刚强，受同事与下属敬重。他全凭自身努力、未借助任何不正当手段，晋升至 Overseer（监督官）之职。 他目前驻守 REPNODE M7 并非偶然——他主动申请调往该站，理由是某种“对火星悲剧的私人亲近感”。这听起来或许可疑，但 CIS（Core Intelligence Service，核心情报局）似乎并未发现任何能表明他另有图谋的迹象。至少这是我们所能获取到的信息。 Chris 是技术型人才，爱好众多，其中包括无人机制作，这占用了他大部分的私人时间。 记录中没有直系亲属，没有妻子或孩子，也没有任何关于伴侣的信息。这家伙把自己的事捂得很紧。 同事们说他偶尔会和他们打扑克，但多数时候都保持着职业化的距离。有几次有人看到 Chris 玩虚拟游戏（至少是戴着 VR 头显），但没有更多细节可查。 总结： 严格、专业、似乎受过良好教育（需补充信息）、单身。 情报建议： 以职业礼节或共同爱好为基础进行接触。"},{"id":243,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"C.S.Tong 档案（Dossier C.S.Tong）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/737934030AE165D0.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003eSUBJECT PROFILE: C.S. TONG（对象档案：C.S. TONG）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e// 全名：Christopher Selm Tong // 职务：AN-RING 2 工程师（AN-RING 2 Engineer） // ir":"05_Entry3_The_Way","title":"邮件：发件人：Chris Tong（Email: From: Chris Tong）","type":"MARKDOWN","html":"\u003cp\u003e发件人：Chris Tong 收件人：Pamela Flow\u003c/p\u003e\r\n\u003cp\u003e主题：快结束了。\u003c/p\u003e\r\n\u003cp\u003ePamela，听我说。我知道我们有过分歧，而且我是在一个糟糕的时刻离开的，但就像我答应过你的——快结束了。等我把无人机交给他们，我就自由了。\u003c/p\u003e\r\n\u003cp\u003e这意味着我们终于能团聚了，不用再害怕。请等着我，原谅我做过的所有事。你知道没有别的办法。我必须去火星，我必须找到我父母最终安息的地方。我希望你能跟我一起去，因为你和我一样需要这个了结。\u003c/p\u003e\r\n\u003cp\u003e不能让任何人知道我们的事，所以如果你决定来，就用那个名字，别用真名。我会设法给你弄到一份 CEDRT 员工的证件，现在这似乎是最容易搞到的一种。\u003c/p\u003e\r\n\u003cp\u003e我们都需要了结，而这是我们唯一的机会。记住，我爱你，妹妹，哪怕我们再也不能见面。\u003c/p\u003e\r\n\u003cp\u003e此致，Chris。\u003c/p\u003e\r\n","text":"发件人：Chris Tong 收件人：Pamela Flow 主题：快结束了。 Pamela，听我说。我知道我们有过分歧，而且我是在一个糟糕的时刻离开的，但就像我答应过你的——快结束了。等我把无人机交给他们，我就自由了。 这意味着我们终于能团聚了，不用再害怕。请等着我，原谅我做过的所有事。你知道没有别的办法。我必须去火星，我必须找到我父母最终安息的地方。我希望你能跟我一起去，因为你和我一样需要这个了结。 不能让任何人知道我们的事，所以如果你决定来，就用那个名字，别用真名。我会设法给你弄到一份 CEDRT 员工的证件，现在这似乎是最容易搞到的一种。 我们都需要了结，而这是我们唯一的机会。记住，我爱你，妹妹，哪怕我们再也不能见面。 此致，Chris。"},{"id":246,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"论坛截图（Forum screenshot）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/323147791FD734B4.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e\u003cstrong\u003e浏览器窗口（标题栏／地址栏）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e窗口标题：\u003ccode\u003e…er System\u003c/code\u003e（左端被窗口边缘裁切，[无法辨认] 完整词）\u003c/li\u003e\r\n\u003cli\u003e地址栏：\u003ccode\u003eProtected\u003c/code\u003e 🔒 \u003ccode\u003ehttps://techf0r.corie/topics/drones/KRVA_BB\u003c/code\u003e（加锁标记：受保护连接）\u003c/li\u003e\r\n\u003cli\u003e顶部导航：\u003ccode\u003eTECHF0R\u003c/code\u003e｜\u003ccode\u003eTopics\u003c/code\u003e｜\u003ccode\u003eVote\u003c/code\u003e｜\u003ccode\u003eNews\u003c/code\u003e｜\u003ccode\u003eAbout Us\u003c/code\u003e｜按钮 \u003ccode\u003eUpload\u003c/code\u003e\u003c/li\u003e\r\n\u003cli\u003e面包屑：\u003ccode\u0 003c/p\u003e\r\n\u003chr\u003e\r\n\u003ch2\u003e概述\u003c/h2\u003e\r\n\u003cp\u003e本档案包含 BB 系列自主式无人机的设计规格。这些机体拟用于限制区域内的监视与数据采集任务。\u003c/p\u003e\r\n\u003ch2\u003e技术规格\u003c/h2\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e框架：碳复合合金\u003c/li\u003e\r\n\u003cli\u003e推进方式：四旋翼电力驱动\u003c/li\u003e\r\n\u003cli\u003e航程：50 公里作业半径\u003c/li\u003e\r\n\u003cli\u003e续航：8 小时\u003c/li\u003e\r\n\u003cli\u003e载荷：2 公斤传感器组件\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003ch2\u003e备注\u003c/h2\u003e\r\n\u003cp\u003e如需更多项目文档与蓝图，请访问安全档案库：\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e\u003ca href=\"https://krva-data.secure.net/archive/bb-project\" target=\"_blank\" rel=\"noopener\"\u003ehttps://krva-data.secure.net/archive/bb-project\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003chr\u003e\r\n\u003cp\u003e\u003cem\u003e本文档为 CEDRT 工程部财产。\u003c/em\u003e\u003c/p\u003e\r\n","text":"KRVA BB 项目文件 密级： INTERNAL（内部） 作者： C. Tong 最后修改： [已隐去] 概述 本档案包含 BB 系列自主式无人机的设计规格。这些机体拟用于限制区域内的监视与数据采集任务。 技术规格 框架：碳复合合金 推进方式：四旋翼电力驱动 航程：50 公里作业半径 续航：8 小时 载荷：2 公斤传感器组件 备注 如需更多项目文档与蓝图，请访问安全档案库： [https://krva data.secure.net/archive/bb project](https://krva data.secure.net/archive/bb project) 本文档为 CEDRT 工程部财产。"},{"id":250,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"KRVA_BB.eb52x","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/8DC73484A5527BDC.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003ch2\u003e图片文字（中文翻译）\u003c/h2\u003e\r\n\u003cblockquote\u003e由配图转录并翻译；原文为英文，专有名词保留原文拼写\u003c/blockquote\u003e\r\n\u003cp\u003e这是一张黑底白线的无人机三视图工程图（网格纸背景），图上文字如下。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e图头与图名\u003c/strong\u003e\u003c/p\u003e\r\n\u003cul\u003e\r\n\u003cli\u003e左上方框：\u003ccode\u003ePROTOTYPE:\u003c/code\u003e → \u003ccode\u003eKRVA_BB\u003c/code\u003e（原型机：KRVA_BB）\u003c/li\u003e\r\n\u003cli\u003e图名：\u003ccode\u003eDRONE \"KRVA_BB\" MARK 3\u003c/code\u003e（无人机“KRVA_BB”，MARK 3）\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003cp\u003e\u003cstrong\u003e视图标注\u003c/strong\u003e\u003c/p\u003e\r\n\u003 ）","type":"MARKDOWN","html":"\u003cp\u003e真奇怪。“一次泄露”。有人黑进了空间站的通讯系统去联系火星？我不觉得一处地方有那么多官员只是巧合。这可能是非常重大的事。而 Chris 对此没有真正的情报，至少可以说令人担忧。连他的安全级别都不足以获取那些信息。我得就这件事联系 Aurana，也许她或者她的朋友知道些什么。\u003c/p\u003e\r\n\u003cp\u003e搞什么……第一次见到所有人都是这种反应。要么他们知道些我不知道的事，要么就是真的出了什么很糟的事。看来是时候去查查那台该死的控制台了。\u003c/p\u003e\r\n\u003cp\u003e好了，确实有些文件被泄露了。但看起来很奇怪，因为那些用词可以指向任何东西。这是非常宽泛的搜索。最好的办法是跑一次加密的全网扫描，但这种活动很快就会被发现。毕竟他们现在似乎什么都在监控。\u003c/p\u003e\r\n\u003cp\u003e那么次优的选择就是逐个访问所有可用的服务器和工作站，碰碰运气。\u003c/p\u003e\r\n\u003cp\u003e搞什么？那听起来要么是 PCF，要么就是 Cult（教团）本身。也就是说，这是一段越过了封锁的传输，而这又意味着干扰器至少在一小段时间里离线了。要么那帮人算准了重新校准的确切时机，要么他们黑进了干扰器。这两种可能对 CEDRT 领导层来说都够可怕的。难怪他们叫来了 CIS。但为什么不通知 Chris？他受到怀疑了吗？我不如再找找更多线索。也许还有更多信息漏了出来。\u003c/p\u003e\r\n","text":"真奇怪。“一次泄露”。有人黑进了空间站的通讯系统去联系火星？我不觉得一处地方有那么多官员只是巧合。这可能是非常重大的事。而 Chris 对此没有真正的情报，至少可以说令人担忧。连他的安全级别都不足以获取那些信息。我得就这件事联系 Aurana，也许她或者她的朋友知道些什么。 搞什么……第一次见到所有人都是这种反应。要么他们知道些我不知道的事，要么就是真的出了什么很糟的事。看来是时候去查查那台该死的控制台了。 好了，确实有些文件被泄露了。但看起来很奇怪，因为那些用词可以指向任何东西。这是非常宽泛的搜索。最好的办法是跑一次加密的全网扫描，但这种活动很快就会被发现。毕竟他们现在似乎什么都在监控。 那么次优的选择就是逐个访问所有可用的服务器和工作站，碰碰运气。 搞什么？那听起来要么是 PCF，要么就是 Cult（教团）本身。也就是说，这是一段越过了封锁的传输，而这又意味着干扰器至少在一小段时间里离线了。要么那帮人算准了重新校准的确切时机，要么他们黑进了干扰器。这两种可能对 CEDRT 领导层来说都够可怕的。难怪他们叫来了 CIS。但为什么不通知 Chris？他受到怀疑了吗？我不如再找找更多线索。也许还有更多信息漏了出来。"},{"id":254,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"可疑 IP（Suspicious IP）","type":"MARKDOWN","html":"\u003cp\u003e嗯……这个 IP 看起来很可疑。首先，它不属于本站的本地网络 855.529.4.22。我敢打赌这是某种代理——我得试试追踪它的来源。\u003c/p\u003e\r\n","text":"嗯……这个 IP 看起来很可疑。首先，它不属于本站的本地网络 855.529.4.22。我敢打赌这是某种代理——我得试试追踪它的来源。"},{"id":255,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"未知文件（Unknown File）","type":"MARKDOWN","html":"\u003cp\u003e好吧，看来文件就在这儿，但我从没见过这样的扩展名。它需要专用程序才能打开，而我没有。我得去找 Aurana，请她帮忙。\u003c/p\u003e\r\n","text":"好吧，看来文件就在这儿，但我从没见过这样的扩展名。它需要专用程序才能打开，而我没有。我得去找 Aurana，请她帮忙。"},{"id":256,"cat":"第 3 条：路","dir":"05_Entry3_The_Way","title":"值得一查（Worth Checking）","type":"MARKDOWN","html":"\u003cp\u003e任务完成了，而我又是一个人了。不过，我觉得还是值得回那个服务器看看——也许我能在那儿找到些相关的东西。\u003c/p\u003e\r\n","text":"任务完成了，而我又是一个人了。不过，我觉得还是值得回那个服务器看看——也许我能在那儿找到些相关的东西。"},{"id":257,"cat":"新闻简报","dir":"06_News","title":"新闻简报 #1（News Bulletin #1）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/743AD9340E02EFF1.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eSOYUZ 的秘密\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e一艘名为 \u003cstrong\u003e“Solaris”\u003c/strong\u003e 的货运货船在金星附近的深空第 31 区被发现。\u003c/p\u003e\r\n\u003cp\u003e该货船多年前失踪，据称当时正在运送一批来自某座小行星武器工厂的武器。当局表示，这批货物的起运地点已从导航日志中被抹去。\u003c/p\u003e\r\n\u003cp\u003e残存的导航图显示，该船曾在某个时点途经 \u003cstrong\u003eDeimos\u003c/strong\u003e（火卫二）附近 —— 这颗火星卫星属于由“永久议会”（Perpetual Council）强制执行的“禁飞”区域。\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003eCouncil Security\u003c/strong\u003e（议会安全部）的代表 Kamal Sindu 警官评论称，船上未发现任何船员（或其遗骸）。由于调查仍在进行，目前尚未提供更多信息。\u003c/p\u003e\r\n","text":"![](../img/743AD9340E02EFF1.jpg) SOYUZ 的秘密 一艘名为 “Solaris” 的货运货船在金星附近的深空第 31 区被发现。 该货船多年前失踪，据称当时正在运送一批来自某座小行星武器工厂的武器。当局表示，这批货物的起运地点已从导航日志中被抹去。 残存的导航图显示，该船曾在某个时点途经 Deimos （火卫二）附近 —— 这颗火星卫星属于由“永久议会”（Perpetual Council）强制执行的“禁飞”区域。 Council Security （议会安全部）的代表 Kamal Sindu 警官评论称，船上未发现任何船员（或其遗骸）。由于调查仍在进行，目前尚未提供更多信息。"},{"id":258,"cat":"新闻简报","dir":"06_News","title":"新闻简报 #2（News Bulletin #2）","type":"MARKDOWN","html":"\u003cp\u003e\u003cstrong\u003e武器实验（轨道炮、矿工前哨站）\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003eCORE Arms 对新近研发的“LRMD”（远程物质分解器）进行了一次实弹武器测试。发言人 Thomas Albertson 有如下表态：“在经历了一连串不幸的挫折之后，我们终于准备好向议会海军展示一套全新的武器系统。它在未来舰船设计中的应用，足以震慑任何动过劫掠念头的海盗或罪犯。CORE Arms 依然坚持为那些为人类而战的人提供最好的解决方案。”\u003c/p\u003e\r\n\u003cp\u003e虽然这样的说法往最好处说也只能算是含糊，但有传闻称，各大派系已经在排队抢购这款新武器，甚至赶在“预定”买家之前。\u003c/p\u003e\r\n\u003cp\u003e我们的调查人员得以挖出这样的信息：这些所谓的“LRMD”是 \u003cstrong\u003e“Project Artemis”\u003c/strong\u003e（阿尔忒弥斯计划）的延续产物 —— 该计划在约 \u003cstrong\u003e四十年前\u003c/strong\u003e 惨败，导致多个试验场遭到灾难性破坏。关于那些年事件的大部分信息至今仍对公众保密，但随着该计划重新浮出水面，我们会尽力为您跟进。敬请关注！\u003c/p\u003e\r\n","text":"武器实验（轨道炮、矿工前哨站） CORE Arms 对新近研发的“LRMD”（远程物质分解器）进行了一次实弹武器测试。发言人 Thomas Albertson 有如下表态：“在经历了一连串不幸的挫折之后，我们终于准备好向议会海军展示一套全新的武器系统。它在未来舰船设计中的应用，足以震慑任何动过劫掠念头的海盗或罪犯。CORE Arms 依然坚持为那些为人类而战的人提供最好的解决方案。” 虽然这样的说法往最好处说也只能算是含糊，但有传闻称，各大派系已经在排队抢购这款新武器，甚至赶在“预定”买家之前。 我们的调查人员得以挖出这样的信息：这些所谓的“LRMD”是 “Project Artemis” （阿尔忒弥斯计划）的延续产物 —— 该计划在约 四十年前 惨败，导致多个试验场遭到灾难性破坏。关于那些年事件的大部分信息至今仍对公众保密，但随着该计划重新浮出水面，我们会尽力为您跟进。敬请关注！"},{"id":259,"cat":"新闻简报","dir":"06_News","title":"新闻简报 #3（News Bulletin #3）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/360566F3EDD707D3.jpg\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e世代农场，Astrocrop\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e“Smuglianka”农业站举办了一场农耕节。该站位于金星附近，是那片星域最受欢迎的旅游景点之一。\u003c/p\u003e\r\n\u003cp\u003e虽然官方上该站属于 SOYUZ，但许多农业公司都在站上设有办公室，为人类空间站与殖民地的作物研究提供支持。\u003c/p\u003e\r\n\u003cp\u003e其中一位科学家 German Titov 就此事有如下说法：\u003c/p\u003e\r\n\u003cp\u003e“我们从整个太阳系接收种子材料。我们的实验是一流的，在已知宇宙中再也找不到第二个拥有如此先进研究设施的地方，尤其是自从那次事件之后……总之，能与同事们在这里工作，我非常自豪，也想感谢来自 SOYUZ 的同志们和来自 Astrocrop 的朋友们，是他们为我们提供了最好的生物材料。我们保证让太空旅行者的生活变得更好！”\u003c/p\u003e\r\n","text":"![](../img/360566F3EDD707D3.jpg) 世代农场，Astrocrop “Smuglianka”农业站举办了一场农耕节。该站位于金星附近，是那片星域最受欢迎的旅游景点之一。 虽然官方上该站属于 SOYUZ，但许多农业公司都在站上设有办公室，为人类空间站与殖民地的作物研究提供支持。 其中一位科学家 German Titov 就此事有如下说法： “我们从整个太阳系接收种子材料。我们的实验是一流的，在已知宇宙中再也找不到第二个拥有如此先进研究设施的地方，尤其是自从那次事件之后……总之，能与同事们在这里工作，我非常自豪，也想感谢来自 SOYUZ 的同志们和来自 Astrocrop 的朋友们，是他们为我们提供了最好的生物材料。我们保证让太空旅行者的生活变得更好！”"},{"id":260,"cat":"新闻简报","dir":"06_News","title":"新闻简报 #4（News Bulletin #4）","type":"MARKDOWN","html":"\u003cp\u003e\u003cstrong\u003e“那些声音”、火星教派、无线电传输\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e数艘途经海王星轨道附近的船只报告称，船上的高频无线电天线记录到了奇怪的传输信号。尽管这些录音大多似乎已损坏和／或经过加密，但可以确定其中确实有某种声音在试图向外联络。这些信号的来源仍然不明。\u003c/p\u003e\r\n\u003cp\u003e其中一位船长 \u003cstrong\u003eKumar Abdul\u003c/strong\u003e 对我们的新闻团队谈到了这件事：“我们像往常一样从海王星附近经过，突然我们的录音设备自己启动了，开始录下一段信号。太奇怪了，我们不知道它是怎么来的。非常奇怪。一大谜团！”\u003c/p\u003e\r\n\u003cp\u003e尽管尚无任何官方机构对此情况作出评论，我们的技术专家 Sean Bong 提醒我们，这类设备被认为已经过时，不过是略微先进一些的无线电接收机，过去用于接收求救联络。他还指出，这段信号很可能是从海王星大气层中\u003cstrong\u003e折射\u003c/strong\u003e而来的，而它的源头确实是个谜。\u003c/p\u003e\r\n\u003cp\u003eSean 还表示，考虑到关于这些信号的报告具有周期性，它们很可能源自某个较大的“天体”——该天体周期性地运行到合适的位置，从而进入海王星贸易航道的范围内。\u003c/p\u003e\r\n","text":"“那些声音”、火星教派、无线电传输 数艘途经海王星轨道附近的船只报告称，船上的高频无线电天线记录到了奇怪的传输信号。尽管这些录音大多似乎已损坏和／或经过加密，但可以确定其中确实有某种声音在试图向外联络。这些信号的来源仍然不明。 其中一位船长 Kumar Abdul 对我们的新闻团队谈到了这件事：“我们像往常一样从海王星附近经过，突然我们的录音设备自己启动了，开始录下一段信号。太奇怪了，我们不知道它是怎么来的。非常奇怪。一大谜团！” 尽管尚无任何官方机构对此情况作出评论，我们的技术专家 Sean Bong 提醒我们，这类设备被认为已经过时，不过是略微先进一些的无线电接收机，过去用于接收求救联络。他还指出，这段信号很可能是从海王星大气层中 折射 而来的，而它的源头确实是个谜。 Sean 还表示，考虑到关于这些信号的报告具有周期性，它们很可能源自某个较大的“天体”——该天体周期性地运行到合适的位置，从而进入海王星贸易航道的范围内。"},{"id":261,"cat":"新闻简报","dir":"06_News","title":"新闻简报 #5（News Bulletin #5）","type":"IMAGE","html":"\u003cp\u003e\u003cimg src=\"codex/img/D63E27FA2FFD196D.png\" alt=\"\" loading=\"lazy\"\u003e\u003c/p\u003e\r\n\u003cp\u003e\u003cstrong\u003e“天梯”\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e今天是“漂浮升降舱”脱离六周年 —— 它是天梯（Sky Lift）的一部分，已从其行星基座上脱落。科学家仍在持续监测它的轨道，现已确认它很可能会留在太阳系内。\u003c/p\u003e\r\n\u003cp\u003e尽管该物体本身被认定对任何殖民地或大型空间站都不构成危险，但它的自转仍有些难以预测，这意味着其运行路径上的任何较小空间站或卫星都可能面临严重危险。\u003c/p\u003e\r\n","text":"![](../img/D63E27FA2FFD196D.png) “天梯” 今天是“漂浮升降舱”脱离六周年 —— 它是天梯（Sky Lift）的一部分，已从其行星基座上脱落。科学家仍在持续监测它的轨道，现已确认它很可能会留在太阳系内。 尽管该物体本身被认定对任何殖民地或大型空间站都不构成危险，但它的自转仍有些难以预测，这意味着其运行路径上的任何较小空间站或卫星都可能面临严重危险。"}]</script>
<script>
const ENTRIES = JSON.parse(document.getElementById('data').textContent);
const listEl = document.getElementById('list');
const contentEl = document.getElementById('content');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
let current = null, allMode = false;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderList(q){
  q = (q||'').trim().toLowerCase();
  const filtered = q ? ENTRIES.filter(e => (e.title+' '+e.text).toLowerCase().includes(q)) : ENTRIES;
  listEl.innerHTML = '';
  let lastCat = null;
  filtered.forEach(e => {
    if (e.cat !== lastCat){
      const d = document.createElement('div');
      d.className = 'cat';
      d.innerHTML = '<span>'+esc(e.cat)+'</span><span>'+filtered.filter(x=>x.cat===e.cat).length+'</span>';
      listEl.appendChild(d);
      lastCat = e.cat;
    }
    const a = document.createElement('a');
    a.className = 'item' + (current===e.id?' on':'');
    a.textContent = e.title;
    a.onclick = () => { select(e.id); document.getElementById('side').classList.remove('show'); };
    a.dataset.id = e.id;
    listEl.appendChild(a);
  });
  countEl.textContent = filtered.length + ' / ' + ENTRIES.length + ' 条';
}

function card(e){
  return '<div class="card" id="e'+e.id+'"><h1 class="entry">'+esc(e.title)+'</h1>'
    + '<div class="meta">'+esc(e.cat)+' · '+esc(e.type||'—')+'</div>'
    + e.html + '</div>';
}

function select(id){
  allMode = false;
  document.getElementById('btnAll').classList.remove('on');
  current = id;
  const e = ENTRIES.find(x=>x.id===id);
  contentEl.innerHTML = e ? card(e) : '<div class="empty">未找到</div>';
  document.querySelectorAll('.item').forEach(a=>a.classList.toggle('on', +a.dataset.id===id));
  document.getElementById('main').scrollTop = 0;
}

function showAll(){
  allMode = true;
  document.getElementById('btnAll').classList.add('on');
  current = null;
  contentEl.innerHTML = ENTRIES.map(card).join('<hr>');
  document.querySelectorAll('.item').forEach(a=>a.classList.remove('on'));
}

searchEl.addEventListener('input', e => renderList(e.target.value));
document.getElementById('btnAll').onclick = () => { allMode ? select(ENTRIES[0].id) : showAll(); };
document.getElementById('btnToggle').onclick = () => document.getElementById('side').classList.toggle('show');

contentEl.addEventListener('click', ev => {
  if (ev.target.tagName === 'IMG'){
    document.getElementById('zoom').src = ev.target.src;
    document.getElementById('overlay').style.display = 'flex';
  }
});
document.getElementById('overlay').onclick = () => { document.getElementById('overlay').style.display='none'; };

renderList('');
const firstWithContent = ENTRIES.find(e=>e.html && e.html.trim()) || ENTRIES[0];
select(firstWithContent.id);
</script>
</body>
</html>
